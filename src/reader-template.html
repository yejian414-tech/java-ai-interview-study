<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Java + AI Agent · 学习阅读页</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%232167d8'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='25' fill='white'%3E学%3C/text%3E%3C/svg%3E">
<style>__STUDY_STYLES__</style>
</head>
<body>
<a class="skip-link" href="#reading-title">跳到阅读区</a>
<header class="app-header">
  <div class="brand"><button class="icon-button mobile-only" id="menu-open" aria-label="打开学习目录" type="button">☰</button><span class="brand-mark" aria-hidden="true">学</span><span>Java + AI Agent<small>面试学习手册</small></span></div>
  <div class="global-search"><label class="sr-only" for="search">搜索全库题目</label><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索知识点、题目或题号，如 Q165" autocomplete="off"><button id="search-clear" class="icon-button" aria-label="清空搜索" type="button" hidden>×</button><kbd>Ctrl K</kbd></div>
  <details class="settings" id="settings"><summary>设置与资料</summary><div class="settings-panel"><label for="font-size">正文字号</label><select id="font-size"><option value="16">标准</option><option value="18">较大</option><option value="20">大字</option></select><button type="button" id="export-progress">导出学习记录</button><button type="button" id="import-progress">导入学习记录</button><input type="file" id="import-file" accept=".json,application/json" hidden><hr><a href="学习思维导图.mm" download>完整思维导图</a><a href="分类索引.md">分类索引</a><a href="学习Agent开发方案.md">Agent 开发方案</a></div></details>
</header>
<div class="app-shell">
  <aside class="sidebar" aria-label="学习目录"><div id="desktop-nav"></div><div class="sidebar-foot"><span class="offline-dot" aria-hidden="true"></span><span id="storage-label">本地学习 · 记录保存在本浏览器</span><button type="button" class="text-button" id="backup-hint">备份学习记录</button></div></aside>
  <main class="workspace">
    <div class="workspace-top"><div class="breadcrumb"><button id="history-back" class="back-button" type="button" disabled>← 返回</button><span id="breadcrumb-text"></span></div><button id="resume" class="text-button" type="button" hidden></button></div>
    <section class="context-header" aria-label="当前学习范围"><div><h1 id="heading">首轮学习</h1><p id="context"></p></div><div id="context-controls"></div></section>
    <div class="mobile-switch mobile-only" aria-label="切换题目列表与正文"><button type="button" id="show-list" aria-pressed="true">题目列表</button><button type="button" id="show-reader" aria-pressed="false">正在阅读</button></div>
    <div class="reading-workspace" id="reading-workspace" data-mobile="list">
      <section class="question-pane" aria-label="题目列表"><div class="list-toolbar"><span id="result-count" role="status" aria-live="polite"></span><label class="sr-only" for="status-filter">筛选学习状态</label><select id="status-filter"><option value="all">全部状态</option><option value="new">未标记</option><option value="review">待复习</option><option value="understood">已理解</option></select></div><div id="question-list" class="question-list"></div><div class="pagination" id="pagination"></div></section>
      <article class="reading-pane" id="reading-pane" aria-labelledby="reading-title"><div id="reader-content"></div></article>
    </div>
    <p class="source-note">原文保留题号与 PDF 页码；版本校订单独显示。“已理解”为自评记录，可随时调整。</p>
  </main>
</div>
<dialog id="mobile-menu" class="mobile-menu"><div class="dialog-header"><strong>学习目录</strong><button class="icon-button" id="menu-close" type="button" aria-label="关闭学习目录">×</button></div><div id="mobile-nav"></div></dialog>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<noscript>此阅读页需要启用 JavaScript。也可以打开同目录下的“分类阅读版.md”。</noscript>
<script id="study-data" type="application/json">__STUDY_DATA__</script>
<script>__STUDY_SCRIPT__</script>
</body>
</html>
