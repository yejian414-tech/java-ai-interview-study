时先实例化放入三级缓存，填充属性\n发现需要 B；去创建 B，B 实例化后填属性又需要 A，此时从三级缓存拿 A 的 ObjectFactory\n得到 A 的早期引用（若需 AOP 则返回早期代理）放入二级缓存、并清三级，把 A 的早期引用\n注入 B；B 完成初始化进入一级缓存；回到 A 继续填充，拿到完整 B，A 也初始化完成移入一\n级缓存。三级缓存的关键价值在于\"提前暴露引用\"，使 B 能先拿到 A 的引用完成自身，从而\n打破相互等待。注意该机制只对单例、setter/字段注入有效。（来源：Java 面试题_面经_八\n股文.pdf.txt，约第 47 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q338", "number": 338, "title": "三级缓存中每一级分别缓存什么对象？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 149, "page_end": 150, "answer_original": "Spring 三级缓存各司其职。第三级 singletonFactories（ObjectFactory 工厂缓存）：key 为\nBean 名，value 是能生成该 Bean 早期引用的 ObjectFactory，存放于 Bean 刚实例化、属性\n未填充时，目的是在需要时能\"按需\"产出早期对象（含 AOP 代理），避免无循环依赖时也提\n前创建代理。第二级 earlySingletonObjects（早期单例缓存）：放已经通过工厂取出的早期\n引用（可能是原始对象或代理），用于循环依赖时直接复用，避免重复调用工厂。第一级\nsingletonObjects（单例池）：放完全初始化、属性填充且生命周期回调完成的最终 Bean，\n是应用真正使用的对象。获取 Bean 时按一→二→三顺序查找：先用成品、没有再取早期、再\n没有才触发工厂创建。这样的分层设计既解决了循环依赖，又尽量延迟代理创建、保证单例唯\n一性，是 Spring 容器设计的精妙之处。（来源：Java 面试题_面经_八股文.pdf.txt，约第 47\n页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q339", "number": 339, "title": "为什么构造器注入无法解决循环依赖？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 150, "page_end": 150, "answer_original": "因为构造器注入要求在\"实例化\"那一刻就必须把依赖作为参数传入，而循环依赖的双方都尚未\n实例化完成，无法互相作为构造参数，于是 Spring 在创建 A 时就要构造 B、构造 B 又要构造\nA，形成无法打破的死锁，直接抛出 BeanCurrentlyInCreationException。三级缓存之所以\n能解决循环依赖，前提是 Bean 能\"先实例化（得到一个引用）、后填充属性\"——setter/字段\n注入正是这种时机分离的模型，使 A 可以先以半成品引用暴露给 B。而构造器注入把\"实例化\"\n与\"依赖满足\"绑定在一起，没有半成品可言，三级缓存无从介入。因此 Spring 官方明确：构\n造器循环依赖无法被容器解决，必须在代码层面消除（改造成通过 setter/字段注入，或引入\n@Lazy 延迟初始化，或重构让一方不依赖另一方）。这也是推荐\"必填依赖用构造器、但需警\n惕循环\"的原因。（来源：Java 面试题_面经_八股文.pdf.txt，约第 47 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q340", "number": 340, "title": "哪些情况下的循环依赖 Spring 无法解决？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 150, "page_end": 151, "answer_original": "Spring 仅能解决\"单例作用域 + setter/字段注入\"的循环依赖，以下情况无法解决：①构造器\n注入循环依赖——实例化即需对方，死锁报错，容器无能为力。②prototype（多例）作用域\n循环依赖——Spring 不缓存 prototype Bean、每次都新建，无法提前暴露引用，直接抛\nBeanCurrentlyInCreationException。③涉及@Async/@Transactional 等需要生成代理、\n且代理时机晚于早期引用暴露的场景，可能让对方拿到未被代理的早期对象，导致事务/异步\n增强失效，这类需结合@Lazy 或调整设计规避。④用@Lazy 延迟注入可打破多数循环依赖，\n但本质是把\"立即依赖\"改为\"用到才创建\"，仍不能使构造器循环依赖生效。总结：单例\n+setter/字段注入的循环依赖由三级缓存自动化解；构造器注入、prototype 作用域，以及部\n分代理时机冲突的循环依赖必须靠重构代码或@Lazy 解决，这也是面试中检验对三级缓存边\n界认知深浅的关键。", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q341", "number": 341, "title": "什么是 Spring 事务传播机制？有哪些传播行为？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "spring-tx", "topic": "事务传播与失效场景", "learning_priority": "核心", "page_start": 151, "page_end": 151, "answer_original": "Spring 事务传播机制（Propagation）定义了\"一个事务方法被另一个事务方法调用时，事务\n如何传播\"的规则，即外层事务与内层事务之间的边界与取舍关系，由\nAbstractPlatformTransactionManager 在开启内层事务前按配置决策。Spring 在\nTransactionDefinition 中定义了 7 种传播行为：REQUIRED（默认，有则加入、无则新\n建）、SUPPORTS（有则加入、无则以非事务执行）、MANDATORY（必须已有事务，否则\n抛异常）、REQUIRES_NEW（挂起外层、始终新建自己的事务）、NOT_SUPPORTED（挂\n起外层、以非事务执行）、NEVER（必须无事务，否则抛异常）、NESTED（在嵌套事务/保\n存点中执行，可随外层回滚到保存点）。它是 Spring 相比原生 JDBC 更细粒度的事务控制能\n力，也是复杂业务编排中保证数据一致性的核心手段，面试中常以\"REQUIRED 与\nREQUIRES_NEW 区别\"深入追问。（来源：Java 面试题_面经_八股文.pdf.txt，约第 47 页、\n第 69 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q342", "number": 342, "title": "REQUIRED 和 REQUIRES_NEW 传播行为的区别是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "spring-tx", "topic": "事务传播与失效场景", "learning_priority": "核心", "page_start": 151, "page_end": 151, "answer_original": "REQUIRED 是 Spring 默认传播行为：若当前已存在事务，内层方法直接加入外层事务、共用\n同一事务与数据库连接，任一层抛异常都会使整体回滚；若不存在事务则新建一个。\nREQUIRES_NEW 则截然不同：执行内层方法前，Spring 先挂起外层事务（释放其连接并记\n录状态），内层始终新建一个完全独立的事务，其提交/回滚都与外层无关——外层后续即使\n异常回滚也不影响已提交的 REQUIRES_NEW 内层，反之内层失败被捕获时也不会强制外层\n回滚（除非异常继续抛给外层）。适用场景上：REQUIRED 用于\"同生共死\"的强一致业务（如\n订单与订单项）；REQUIRES_NEW 用于\"无论外层成败都要落库\"的日志、审计、独立记账操\n作。理解两者是排查\"为什么内层异常没让外层回滚\"以及设计可靠补偿逻辑的基础。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 47 页、第 69 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q343", "number": 343, "title": "NESTED、SUPPORTS、NOT_SUPPORTED、MANDATORY、NEVER 分别是什么 含义？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "spring-tx", "topic": "事务传播与失效场景", "learning_priority": "核心", "page_start": 151, "page_end": 152, "answer_original": "七种传播行为中除 REQUIRED/REQUIRES_NEW 外，其余语义各异。NESTED：在嵌套事务\n中执行，底层依赖 JDBC 保存点（Savepoint），内层回滚只回滚到保存点、不影响外层其余\n逻辑，外层回滚则内层一起回滚，适合\"部分失败可单独撤销\"的场景（需数据库支持保存\n点）。SUPPORTS：当前有事务就加入、没有就以非事务方式运行，常用于只读查询。\nNOT_SUPPORTED：挂起当前事务、以非事务方式执行，用于不需要事务且不想被外层事务\n拖慢的代码（如批量统计）。MANDATORY：必须在已有事务中运行，否则抛\nIllegalTransactionStateException，强制调用方已开启事务。NEVER：必须在非事务环境运\n行，若存在事务则抛异常，与 MANDATORY 相反。精确掌握这七种行为，才能在微服务与复\n杂业务编排中正确划定事务边界，是高级 Java 岗位的常考进阶点。（来源：Java 面试题_面\n经_八股文.pdf.txt，约第 47 页、第 69 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q344", "number": 344, "title": "@Transactional 注解在什么场景下会失效？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "spring-tx", "topic": "事务传播与失效场景", "learning_priority": "核心", "page_start": 152, "page_end": 152, "answer_original": "@Transactional 失效是高频故障，常见原因有：①方法非 public——Spring AOP 基于代理\n只能拦截 public 方法，private/protected 上的注解不生效。②同类自调用——事务靠代理\n对象触发，类内部 this.method()绕过代理导致注解失效（见下题）。③异常被 catch 吞掉且\n未重新抛出——默认仅对 RuntimeException/Error 回滚，且 catch 后不抛出就不会触发回\n滚。④抛出异常类型不在 rollbackFor 范围——如抛受检异常但未配\n@Transactional(rollbackFor=Exception.class)，事务不会回滚。⑤数据库引擎不支持事务\n（如 MySQL MyISAM）。⑥方法被 final/static 修饰——CGLIB 无法代理 final 方法、代理\n失效。⑦事务管理器未启用或数据源未被 Spring 托管（自己 new 的 DataSource）。⑧类本\n身不是 Spring Bean。排查时应按\"是否代理、是否 public、是否自调用、异常是否真正抛出\"\n逐项核对，定位最有效。（来源：Java 面试题_面经_八股文.pdf.txt，约第 47 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q345", "number": 345, "title": "如何确保@Transactional 事务在同类方法调用中也能生效？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "spring-tx", "topic": "事务传播与失效场景", "learning_priority": "核心", "page_start": 152, "page_end": 153, "answer_original": "同类内方法直接调用（this.b()）会绕过 Spring 代理，使被调方法的@Transactional 失效。\n解决思路有几条：①注入自身代理——在类中通过@Autowired 注入自己的 Bean（或借助\nApplicationContext 获取代理），用代理对象调用，使事务拦截链正常生效；也可开\nexposeProxy 后用 AopContext.currentProxy()获取。②拆分到不同 Bean——把被调方法移\n到另一个@Service，由 Spring 注入后跨 Bean 调用，自然走代理，是最推荐的清爽做法。③\n改用 AspectJ 模式——将事务切面改为编译期/类加载期织入（LTW），不再依赖运行期代\n理，自调用也能增强，需在 pom 引入 aspectjweaver 并配置\n@EnableTransactionManagement(mode=ASPECTJ)。④编程式事务——用\nTransactionTemplate 手动控制，完全不依赖代理，最可靠但代码侵入。实际项目优先\"拆\nBean\"或\"注入代理\"，理解根因（代理机制）才能彻底规避\"加了注解却不回滚\"的坑。（来\n源：Java 面试题_面经_八股文.pdf.txt，约第 47 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q346", "number": 346, "title": "MySQL 常见的存储引擎有哪些？各有什么特点？", "group_id": "data", "group": "数据库与缓存", "topic_id": "engines", "topic": "存储引擎与场景", "learning_priority": "进阶", "page_start": 153, "page_end": 153, "answer_original": "MySQL 常见存储引擎主要有 MyISAM、InnoDB、Memory、Archive、Federated 等。\nMyISAM 是早期默认引擎，读取速度快、不占用大量内存与存储，但不支持事务、行级锁和\n外键，写操作会锁整表。InnoDB 支持事务、行级锁、外键、崩溃恢复（bin-log）与自增\n列，适合高并发写入与一致性要求高的场景。Memory 将数据存于内存、访问极快，默认\nHash 索引，但服务关闭数据丢失。Archive 适合日志归档压缩存储。选择引擎需结合事务、\n锁粒度、恢复能力与读写特征综合判断。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-\n215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q347", "number": 347, "title": "InnoDB 和 MyISAM 的核心区别是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "engines", "topic": "存储引擎与场景", "learning_priority": "进阶", "page_start": 153, "page_end": 153, "answer_original": "两者核心区别体现在四个方面：第一，事务支持，InnoDB 支持 ACID 事务，MyISAM 不支\n持；第二，锁粒度，InnoDB 支持行级锁，MyISAM 仅支持表级锁，写操作会锁定整张表导致\n并发写性能差；第三，外键，只有 InnoDB 支持外键约束；第四，索引与数据存储，InnoDB\n底层为 B+树且叶子节点存完整行数据（聚簇），MyISAM 索引与数据分离。此外 InnoDB 可\n通过 bin-log 从灾难恢复，MyISAM 无此能力。实际选型中，凡涉及交易、订单等强一致场\n景应优先 InnoDB。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q348", "number": 348, "title": "InnoDB 存储引擎适用于哪些场景？", "group_id": "data", "group": "数据库与缓存", "topic_id": "engines", "topic": "存储引擎与场景", "learning_priority": "进阶", "page_start": 153, "page_end": 153, "answer_original": "InnoDB 适合以下场景：一是经常更新的表，能很好处理多重并发更新请求，行级锁降低锁冲\n突；二是需要事务保证的业务，如交易、支付、库存扣减；三是需要从灾难中恢复的系统，可\n通过 bin-log 日志重放恢复数据；四是需要外键约束维护关联完整性的场景；五是使用自增列\n主键的表。总体原则是：高并发写、强一致、需恢复能力的核心业务表应默认使用 InnoDB，\n它也是 MySQL 5.5 之后默认的存储引擎。（来源：JAVA 面试知识点总结.pdf.txt，约第 214\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q349", "number": 349, "title": "为什么 MyISAM 不适合做写多读少的业务？", "group_id": "data", "group": "数据库与缓存", "topic_id": "engines", "topic": "存储引擎与场景", "learning_priority": "进阶", "page_start": 153, "page_end": 154, "answer_original": "MyISAM 不支持事务与行级锁，在执行 INSERT、UPDATE 等写操作时需锁定整张表，这意\n味着同一时刻只能有一个写线程操作该表，其他写操作必须排队等待，并发写入性能急剧下\n降。同时它不支持外键与崩溃恢复，一旦异常宕机容易丢数据或损坏表。虽然 MyISAM 顺序\n读取速度快、占用资源少，适合只读或读多写极少的分析类报表，但在写多场景下锁表会导致\n大量请求阻塞，因此互联网高并发写业务应避免使用 MyISAM。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q350", "number": 350, "title": "Memory 存储引擎的特点和适用场景是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "engines", "topic": "存储引擎与场景", "learning_priority": "进阶", "page_start": 154, "page_end": 154, "answer_original": "Memory 引擎又称 HEAP，使用内存中的内容创建表，每个表仅对应一个磁盘文件，访问速\n度极快，因为数据驻留内存。它默认使用 Hash 索引，也支持 B 树索引。Hash 索引等值比较\n极快但不支持范围查询，B 树索引可用于部分查询、通配及\u003c、>、>=等范围比较。缺点是服\n务重启或关闭后内存中的数据全部丢失，因此只适合存放临时、可重建、非持久化的数据，如\n会话缓存、中间计算结果。生产环境切勿用于持久化业务数据。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q351", "number": 351, "title": "TokuDB 的 Fractal Tree 结构有什么优势？适合什么场景？", "group_id": "data", "group": "数据库与缓存", "topic_id": "engines", "topic": "存储引擎与场景", "learning_priority": "进阶", "page_start": 154, "page_end": 154, "answer_original": "TokuDB 底层采用 Fractal Tree，结构与 B+树类似，但每个 child 指针除指向子节点外还带\n一个 Message Buffer（FIFO 队列）缓存更新操作。一次插入只需落到某节点的 Message\nBuffer 即可立即返回，无需搜索到叶子节点，缓存更新在查询或后台异步合并应用。因此\nTokuDB 在线添加索引不影响读写，写入性能极快，事务实现上有优势。它适合访问频率不\n高、历史数据归档类场景，能以高压缩比存储冷数据，但不适合高频点查的热数据。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 215 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q352", "number": 352, "title": "什么是数据库索引？为什么要建索引？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 154, "page_end": 154, "answer_original": "索引（Index）是帮助 MySQL 高效获取数据的数据结构，相当于书的目录。没有索引时查询\n需全表扫描，数据量大时性能极差；建立索引后可通过数据结构快速定位目标行，大幅减少扫\n描行数。常见查询算法包括顺序查找、二分查找、二叉排序树、哈希散列、分块查找、平衡多\n路搜索树 B 树等，MySQL 主要采用 B+树。索引能显著提升读性能，但会以额外的存储空间\n与写开销为代价，因为每次增删改都需同步维护索引结构。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 215-216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q353", "number": 353, "title": "为什么 MySQL 索引默认使用 B+树而不是 B 树或哈希？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 154, "page_end": 155, "answer_original": "B+树相比 B 树的优势在于：非叶子节点只存键值不存数据，单页能容纳更多键，树更矮胖，\n磁盘 IO 次数更少；叶子节点用链表顺序相连，非常利于范围查询与全表扫描。哈希索引虽等\n值查询 O(1)，但不支持范围、排序、模糊前缀查询，且存在哈希冲突。相比红黑树等二叉结\n构，B+树是多路平衡树，高度更低、更适合磁盘按页（如 16K）读取。因此 B+树在等值、范\n围、排序、模糊等综合查询场景下表现最优，成为 MySQL InnoDB 的默认索引结构。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q354", "number": 354, "title": "请说明 InnoDB 的 B+树物理存储结构。", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 155, "page_end": 155, "answer_original": "InnoDB 底层存储结构为 B+树，树的每个节点对应 InnoDB 的一个 page（页），页大小固定\n一般设为 16KB。在非叶子节点中只保存键值（索引列值）和指向下层页的指针，不存放完整\n行数据；而叶子节点则包含完整的行数据（聚簇索引时）。这样设计使单个页能存放更多索引\n项，降低树高度、减少磁盘 IO。由于叶子节点通过双向链表串联，范围扫描时只需顺着链表\n读取即可，避免回表与随机 IO，这是 InnoDB 高效查询的物理基础。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 214 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q355", "number": 355, "title": "什么是聚簇索引和非聚簇（二级）索引？区别是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 155, "page_end": 155, "answer_original": "在 InnoDB 中，聚簇索引的叶子节点直接存放完整行数据，数据和索引是一体的，通常主键就\n是聚簇索引；非聚簇索引（二级索引）的叶子节点存放的是主键值而非整行数据，通过主键值\n再回表查询完整数据。区别在于：聚簇索引查询主键极快且无需回表，但插入依赖主键顺序，\n主键过大会使二级索引膨胀；二级索引需二次查找（回表）但更灵活。MyISAM 无论主键还\n是普通索引叶子都存数据行地址，索引与数据文件分离，属于非聚簇结构。理解二者差异有助\n于设计主键与联合索引。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q356", "number": 356, "title": "为什么建议使用自增整型作为 InnoDB 主键？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 155, "page_end": 155, "answer_original": "因为 InnoDB 聚簇索引按主键顺序组织数据，自增整型主键能保证新插入的行总是追加到 B+\n树最右的叶子页，避免页分裂与数据重排，写入性能最好。若使用无序的 UUID 或随机字符串\n作主键，新记录可能被插入到树中间，引发频繁页分裂、碎片增多、聚簇索引膨胀，并导致二\n级索引体积变大（二级索引叶子存主键值）。此外整型比较比字符串快、占用空间小。因此高\n写入表应优先使用自增 BIGINT 主键。（来源：JAVA 面试知识点总结.pdf.txt，约第 214\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q357", "number": 357, "title": "建立索引时有哪些常见原则？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 155, "page_end": 156, "answer_original": "常见索引原则包括：一、选择唯一性索引，唯一值能更快定位记录；二、为经常排序、分组和\n联合操作的字段建索引；三、为常作为查询条件的字段建索引；四、限制索引数量，索引越多\n更新表越慢；五、尽量使用数据量少的索引，值越长查询越慢；六、尽量使用前缀来索引以缩\n短长度；七、删除不再使用或很少使用的索引；八、最左前缀匹配原则；九、选择区分度高的\n列；十、索引列不能参与计算（带函数查询不走索引）；十一、尽量扩展已有索引而非新建。\n综合权衡读写性能。（来源：JAVA 面试知识点总结.pdf.txt，约第 216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q358", "number": 358, "title": "什么是索引的最左前缀匹配原则？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 156, "page_end": 156, "answer_original": "最左前缀匹配原则是指联合索引（如(a,b,c)）会从索引的最左列开始向右依次匹配，只有使用\n了最左列，后续列才能发挥作用。例如对(a,b,c)建索引，查询条件含 a、含 a 和 b、含 a 和 b\n和 c 都能用到索引；但若只查 b 或只查 c、或跳过 a 直接查 b 和 c，则无法有效利用该联合索\n引。范围查询（如 a>1 and b=2）会使 b 及之后的列失效。因此设计联合索引时，应将区分\n度高、最常用于过滤的列放在左侧，并尽量让查询条件与索引列顺序一致以提高命中率。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q359", "number": 359, "title": "联合索引(a,b,c)下，哪些查询能命中索引？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 156, "page_end": 156, "answer_original": "对于联合索引(a,b,c)，能命中索引的查询包括：仅用 a（如 where a=1）、用 a 和 b（where\na=1 and b=2）、用 a 和 b 和 c（where a=1 and b=2 and c=3），以及 a 上的范围\n（where a>1）但此时 b、c 失效。无法命中或只能部分命中的情况：只用 b（where\nb=2）、只用 c（where c=3）、跳过 a 用 b 和 c，都不满足最左前缀；出现 a 的等值后 b 用\n范围（where a=1 and b>2）则 c 失效。此外，若对 b 或 c 使用范围或函数，同样会阻断其\n后列的使用；索引能否命中既取决于建索引的列顺序，也取决于查询条件书写顺序，实践中应\n结合 EXPLAIN 的 key_len 确认实际用到几列索引。遵循最左前缀、等值优先、范围靠后的顺\n序设计查询与索引，才能最大化索引利用率。（来源：JAVA 面试知识点总结.pdf.txt，约第\n216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q360", "number": 360, "title": "哪些情况下会导致 MySQL 索引失效？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 156, "page_end": 156, "answer_original": "常见索引失效场景有：一、对索引列使用函数或参与计算，如 where\nYEAR(create_time)=2024，因为“索引列不能参与计算，保持列干净”，带函数查询不走索\n引；二、隐式类型转换，如字符串列用数字比较触发转换；三、使用不等于（!=、\u003c>）、\nnot in、not like 导致全表扫描；四、like 以通配符开头（like '%abc'）无法走前缀索引；\n五、联合索引未遵循最左前缀；六、or 连接中部分列无索引；七、优化器评估全表扫描更快\n时放弃索引。排查应结合 explain 观察 type 与 key 字段。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q361", "number": 361, "title": "为什么说“索引列不能参与计算，要保持列干净”？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 156, "page_end": 157, "answer_original": "因为 MySQL 在构建索引时是对列原始值排序存储的，若查询时对索引列套用函数或运算（如\nsubstring(name,1,3)、amount*1>100、date_col+0），优化器无法直接利用原有有序索引\n结构定位，必须逐行计算后再比较，导致索引失效、退化为全表扫描。保持“列干净”指把计\n算放到等号右侧的常量上，例如把 where create_time+0>...改为 where create_time>...，\n或预先冗余计算列并为其建索引。这是 SQL 优化中极易被忽视却影响巨大的细节。同理，隐\n式类型转换也会被视作对列的计算而失效，应保证查询值与列类型严格一致，避免数据库在比\n较时自动做类型转换导致索引不可用。（来源：JAVA 面试知识点总结.pdf.txt，约第 216\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q362", "number": 362, "title": "为什么使用 like '%关键字'开头的模糊查询会失效？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 157, "page_end": 157, "answer_original": "索引是按列值从左到右有序排列的，前缀模糊（like 'abc%'）仍可借助最左前缀在 B+树中定\n位起始位置并顺序扫描，能走范围索引；但通配符前置（like '%abc'、like '%abc%'）时，由\n于不知道前缀是什么，无法利用有序性定位起点，只能全表逐行匹配，导致索引失效。解决方\n案包括：业务上避免后缀模糊需求、改用全文索引（FULLTEXT）做关键词检索、或借助\nElasticsearch 等专门搜索引擎承接模糊查询，而把精确前缀检索留给 MySQL 索引。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q363", "number": 363, "title": "为什么索引并不是越多越好，要限制索引数量？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 157, "page_end": 157, "answer_original": "索引本质是空间换时间。索引越多，占用存储空间越大；更重要的是每次 INSERT、\nUPDATE、DELETE 不仅要修改数据，还要同步维护所有相关索引结构（B+树分裂、合并、重\n排），索引越多写操作越慢、锁竞争越激烈。此外过多索引会让优化器在选择执行计划时计算\n成本上升，甚至出现选错计划的情况。因此应只为核心查询路径建必要索引，定期删除不再使\n用或重复冗余的索引，并尽量通过扩展联合索引覆盖多查询，而非为每个列单独建索引。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q364", "number": 364, "title": "为什么尽量选择区分度高的列建索引？区分度怎么衡量？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 157, "page_end": 157, "answer_original": "区分度指列中不同值的比例，区分度越高（接近 1）说明通过该列能过滤掉越多无关行，索引\n选择性越好、查询越快。区分度公式为：count(distinct column)/count(*)，值越接近 1 越适\n合建索引，例如用户手机号区分度接近 1，而性别只有两三个值区分度极低，建索引意义不\n大。低区分度列即使建索引，优化器也可能因过滤效果差而放弃使用，直接全表扫描。因此应\n在高频过滤条件中优先选择高区分度列作为索引或联合索引的前导列。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q365", "number": 365, "title": "什么是数据库三范式？各自含义是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "schema", "topic": "关系建模与范式", "learning_priority": "进阶", "page_start": 158, "page_end": 158, "answer_original": "三范式是最小化冗余的表结构设计规范。第一范式（1NF）要求每列都是不可再分的最小原子\n单元，不能有重复组或多值属性。第二范式（2NF）在满足 1NF 基础上，非主键列不能对主\n键存在部分依赖，即每个表只描述一件事情。第三范式（3NF）在满足 2NF 基础上，列不能\n存在对非主键列的传递依赖，例如订单表中顾客姓名不应依赖顾客编号再依赖订单编号，而应\n拆分到顾客表。遵循范式可减少冗余与更新异常，但过度范式化会增加 join，实际可适度反范\n式优化读性能。（来源：JAVA 面试知识点总结.pdf.txt，约第 216-217 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q366", "number": 366, "title": "第一范式（1NF）的具体要求是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "schema", "topic": "关系建模与范式", "learning_priority": "进阶", "page_start": 158, "page_end": 158, "answer_original": "第一范式要求数据库表的每一列都是不可再分的最小数据单元（原子性），即一个字段不能包\n含多个值或复合型数据。例如“地址”列若同时存“省/市/区/详细地址”，就违反 1NF，应\n拆分为独立的省、市、区、街道列；再如表中有“联系电话 1、联系电话 2”这种重复列也应\n改为多行或单独的联系方式表。满足 1NF 是关系型数据库建模的基础，只有先保证原子性，\n后续 2NF、3NF 的消除依赖才有意义，否则查询、统计、索引都会变得困难。（来源：JAVA\n面试知识点总结.pdf.txt，约第 216-217 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q367", "number": 367, "title": "什么是数据库事务？事务的 ACID 属性包含哪些？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 158, "page_end": 158, "answer_original": "事务（TRANSACTION）是作为单个逻辑工作单元执行的一系列操作，这些操作作为一个整\n体一起向系统提交，要么都执行、要么都不执行，是不可分割的工作逻辑单元。事务必须具备\n四个属性，简称 ACID：原子性（Atomicity）保证操作不可分；一致性（Consistency）保证\n完成时数据处于一致状态；隔离性（Isolation）保证并发事务彼此独立；持久性\n（Durability）保证提交后修改被永久保持。ACID 是数据库可靠处理业务的核心保障，尤其\n在金融、交易场景中不可或缺。（来源：JAVA 面试知识点总结.pdf.txt，约第 217-218 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q372", "Q373", "Q374", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q368", "number": 368, "title": "请解释事务的原子性（Atomicity）及其实现。", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 158, "page_end": 158, "answer_original": "原子性指事务是一个完整的操作，其各步操作是不可分的（原子的），要么全部执行成功，要\n么因失败而全部不执行，不存在只做一半的中间状态。实现原子性主要依赖 undo log（回滚\n日志）：事务执行过程中每步修改都会记录反向操作到 undo log，一旦事务失败或显式回\n滚，引擎按 undo log 逆序恢复数据到事务开始前状态。此外，InnoDB 通过锁保证未提交数\n据不被其他事务可见。原子性确保用户无需关心部分失败带来的数据不一致，是“要么全成要\n么全败”的基石。（来源：JAVA 面试知识点总结.pdf.txt，约第 217-218 页、5886 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q369", "number": 369, "title": "事务的一致性（Consistency）如何保证？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 158, "page_end": 159, "answer_original": "一致性指当事务完成时，数据必须处于一致状态，即满足所有预定义的约束（主键唯一、外\n键、检查约束、业务规则等）。一致性不是由单一机制独立实现的，而是原子性、隔离性、持\n久性共同作用的结果：原子性保证操作不半途而废，隔离性保证并发互不干扰，持久性保证提\n交后不丢失，三者合力使数据库从一个一致状态转移到另一个一致状态。应用层也需配合，例\n如转账必须在同一事务内完成扣款与入账，否则仅靠数据库约束难以覆盖复杂业务规则。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 217-218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q370", "number": 370, "title": "事务的隔离性（Isolation）是什么意思？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 159, "page_end": 159, "answer_original": "隔离性指对数据进行修改的所有并发事务是彼此隔离的，表明事务必须是独立的，不应以任何\n方式依赖或影响其他并发事务。也就是说，一个事务在执行过程中看到的数据，不应被其他未\n提交或并发事务干扰。数据库通过锁机制（行锁、表锁、间隙锁）与多版本并发控制\n（MVCC）来实现不同强度的隔离。隔离性强度越高，并发冲突越小但吞吐量可能下降，因此\n需要在一致性与性能之间按业务容忍度选择合适的隔离级别。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q371", "number": 371, "title": "事务的持久性（Durability）如何实现？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 159, "page_end": 159, "answer_original": "持久性指事务完成后，它对数据库的修改被永久保持，即使后续发生宕机也不会丢失。实现依\n赖事务日志（redo log）与 WAL（Write-Ahead Logging）机制：数据修改先写入内存缓\n冲，同时顺序追加到 redo log，只有 redo log 落盘后才向客户端返回提交成功；崩溃重启时\n通过 redo log 重放未刷盘的数据，保证已提交事务不丢失。相比随机写数据页，顺序写日志\n性能高且可靠。bin-log 也用于主从复制与点位恢复，二者配合构成 InnoDB 的持久化与可恢\n复能力。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页、218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q372", "number": 372, "title": "MySQL 支持哪些事务隔离级别？默认是哪个？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 159, "page_end": 159, "answer_original": "SQL 标准定义四种隔离级别：读未提交（Read Uncommitted）、读已提交（Read\nCommitted）、可重复读（Repeatable Read）、串行化（Serializable）。读未提交最低，\n可能脏读；读已提交避免脏读但存在不可重复读；可重复读避免脏读与不可重复读；串行化最\n高，完全隔离但并发最差。MySQL InnoDB 默认隔离级别是可重复读（Repeatable\nRead），它通过 MVCC 与间隙锁在默认级别下也能规避大部分幻读。Oracle 默认是读已提\n交。选择时应平衡一致性与并发性能。设置方式可通过事务级 SET TRANSACTION 或全局\ntransaction_isolation 参数调整，不同级别直接影响应用的并发异常表现，需结合业务对数据\n一致性的真实容忍度来确定。（来源：JAVA 面试知识点总结.pdf.txt，约第 218 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q367", "Q373", "Q374", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q373", "number": 373, "title": "什么是脏读、不可重复读和幻读？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 160, "page_end": 160, "answer_original": "脏读指一个事务读到了另一个事务尚未提交的数据，若后者回滚则读到的是脏数据。不可重复\n读指同一事务内多次读取同一行，因其他事务提交了修改而得到不同结果，侧重行内数据被更\n新。幻读指同一事务内按相同条件多次查询，因其他事务插入或删除符合条件的新行，导致结\n果集行数变化，侧重新增/删除带来的“行数幻觉”。三者严重程度递增，分别对应隔离级别\n需解决的问题。InnoDB 在可重复读下借助 MVCC 快照读与间隙锁基本消除幻读。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 218 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q367", "Q372", "Q374", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q374", "number": 374, "title": "不同隔离级别分别能解决哪些并发问题？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 160, "page_end": 160, "answer_original": "读未提交（RU）什么都不解决，会出现脏读、不可重复读、幻读。读已提交（RC）解决脏\n读，但仍存在不可重复读与幻读。可重复读（RR）解决脏读与不可重复读；在标准 SQL 中\nRR 不保证防幻读，但 MySQL InnoDB 通过 MVCC 快照读加间隙锁（Next-Key Lock）在\nRR 下也能防止幻读。串行化（Serializable）通过强制事务串行执行，彻底解决脏读、不可重\n复读、幻读，但并发性能最低。实际生产中多用 RC 或 RR，在一致性与吞吐间取舍。串行化\n级别下读也会加共享锁，几乎退化为单线程执行，仅在强一致且低并发场景使用，因此并不常\n见。（来源：JAVA 面试知识点总结.pdf.txt，约第 218 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q367", "Q372", "Q373", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q375", "number": 375, "title": "不可重复读和幻读的本质区别是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 160, "page_end": 160, "answer_original": "二者都表现为同一事务内多次查询结果不一致，但作用对象不同。不可重复读侧重“已存在的\n某行数据被其他事务修改并提交”，导致再次读同一主键行得到不同列值，通常通过行锁或\nMVCC 快照即可解决。幻读侧重“符合查询条件的结果集行数发生变化”，是其他事务插入/\n删除了满足条件的全新行，使同一条件读到更多或更少行，需用间隙锁（Gap Lock）或表锁\n阻止区间内插入才能解决。简言之：不可重复读是“改”，幻读是“增删造成的数量变化”。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 218 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q367", "Q372", "Q373", "Q374", "Q376", "Q377", "Q409"]}, {"id": "Q376", "number": 376, "title": "什么是 MVCC 多版本并发控制？它解决什么问题？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 160, "page_end": 160, "answer_original": "MVCC（Multi-Version Concurrency Control）是多版本并发控制，通过为数据保存多个历\n史版本，使读操作不加锁即可读到事务开始时的快照，从而提升并发性能。它主要解决读写冲\n突：读不阻塞写、写不阻塞读，避免了单纯加锁带来的性能损耗。在 InnoDB 中，每行数据隐\n藏事务 ID 与回滚指针，修改时旧版本存入 undo log 形成版本链，事务根据 ReadView 判断\n可见哪个版本，实现“可重复读”快照。MVCC 有效降低了锁竞争，是高并发场景下读多写\n少业务的关键机制。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-218 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q367", "Q372", "Q373", "Q374", "Q375", "Q377", "Q409"]}, {"id": "Q377", "number": 377, "title": "请说明 MVCC 的基本实现原理。", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 161, "page_end": 161, "answer_original": "InnoDB 的 MVCC 实现依赖隐藏列（事务 ID DB_TRX_ID、回滚指针 DB_ROLL_PTR）、\nundo log 版本链与 ReadView。每次更新行时，引擎将旧版本写入 undo log，新行记录本次\n事务 ID 并让回滚指针指向旧版本，形成版本链。事务开启时生成 ReadView（记录当前活跃\n事务集合），读取时沿版本链找到对当前事务可见、且事务 ID 小于自身且不在活跃集合中的\n最新版本，从而看到一致快照。已提交的事务版本可见，未提交或未来事务版本不可见。这就\n是可重复读与读已提交的底层支撑。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-218\n页、5886 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q367", "Q372", "Q373", "Q374", "Q375", "Q376", "Q409"]}, {"id": "Q378", "number": 378, "title": "数据库锁按粒度分为哪几类？各自特点是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 161, "page_end": 161, "answer_original": "数据库锁按粒度主要分为行级锁、表级锁和页级锁。行级锁锁定单行，冲突少、并发高但加锁\n开销大，InnoDB 支持，适用于高并发写。表级锁锁定整张表，实现简单、资源消耗少，但冲\n突多、并发低，MyISAM 与 InnoDB 均支持，分为表共享读锁与表独占写锁。页级锁粒度介\n于行与表之间，一次锁定相邻一组记录，BDB 引擎支持，是速度与冲突的折衷。选择锁粒度\n本质是并发度与开销的权衡：热点单行用行锁，批量全表操作用表锁更高效。（来源：JAVA\n面试知识点总结.pdf.txt，约第 219 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q379", "number": 379, "title": "什么是行级锁？InnoDB 如何使用行级锁？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 161, "page_end": 161, "answer_original": "行级锁是一种排他锁，防止其他事务修改被锁定的这一行，粒度最细、并发度最高。在\nInnoDB 中，执行 INSERT、UPDATE、DELETE 以及 SELECT ... FOR UPDATE 时，会自动对\n涉及行加行级锁；SELECT ... FOR UPDATE 还允许用户一次锁定多条记录进行更新，操作结\n束后通过 COMMIT 或 ROLLBACK 释放锁。行锁依赖索引，若更新未命中索引会升级为表\n锁。行级锁适合高并发 OLTP，但加锁与死锁检测开销相对更大，需合理设计索引与事务边\n界。需要特别注意，行锁只在事务内有效，且仅对命中索引的行的索引项加锁，未走索引的更\n新会锁住全表，因此写操作必须建立在有效索引之上。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 219 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q380", "number": 380, "title": "什么是表级锁？共享读锁和独占写锁有何区别？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 161, "page_end": 162, "answer_original": "表级锁是对当前操作的整张表加锁，实现简单、资源消耗少，被大部分 MySQL 引擎支持，\nMyISAM 和 InnoDB 都支持表级锁定。它分为表共享读锁（共享锁，S 锁）与表独占写锁\n（排他锁，X 锁）：共享读锁允许多个事务并发读同一表，但阻塞写；独占写锁则禁止其他任\n何事务读或写该表。表锁冲突多但管理开销小，适合全表批量操作（如 ALTER、整表统\n计）。在 InnoDB 中表锁通常用于 DDL 或显式 LOCK TABLES，日常行级锁才是主流。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 219 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q381", "number": 381, "title": "行锁、表锁、页锁应如何对比选型？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 162, "page_end": 162, "answer_original": "三者是锁粒度由细到粗的谱系。行锁粒度最细，并发最高、锁冲突最少，但加锁/释放与死锁\n检测开销最大，InnoDB 默认使用，适合高并发点更新。表锁粒度最粗，加锁简单、开销小，\n但任何写都会阻塞全表读写，适合低频全表操作或读多写少且无热点竞争的 MyISAM 场景。\n页锁居中，一次锁一组相邻记录，是对速度与冲突的折衷，BDB 支持。选型原则：高频单行\n并发用行锁，批量维护用表锁，避免在大事务中混合长持有锁以免拖垮整体吞吐。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 219 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q382", "number": 382, "title": "什么是间隙锁（Gap Lock）？它解决什么问题？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 162, "page_end": 162, "answer_original": "间隙锁是 InnoDB 在可重复读隔离级别下，为防止幻读而对索引记录之间的“间隙”加的锁，\n锁定一个范围但不包含记录本身，阻止其他事务在该区间插入新数据。例如 where id\nbetween 10 and 20 加锁时，即使某些 id 不存在，间隙也被锁住，其他事务无法插入 id=15\n的新行，从而防止同一事务再次查询时出现“幻行”。间隙锁常与记录锁组合成 Next-Key\nLock（临键锁）。它的代价是降低并发插入性能，但在强一致场景下是保证可重复读无幻读\n的关键手段。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q383", "number": 383, "title": "什么是乐观锁？如何实现？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 162, "page_end": 162, "answer_original": "乐观锁假设用户读取数据时别人不会去写自己读的数据，因此读时不加锁，只在提交更新时校\n验冲突。常见实现有两种：一是版本号机制，表中加 version 列，更新时 where 条件带上读\n取时的 version，并将 version+1，若影响行数为 0 说明期间被改过需重试；二是时间戳机\n制，读取时带出 timestamp，写回时比较数据库时间戳是否变化，未变才允许保存。乐观锁\n适合读多写少、冲突概率低的场景，能避免锁等待、提升吞吐，但高冲突下重试成本会上升。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 218-219 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q384", "number": 384, "title": "什么是悲观锁？如何实现？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 162, "page_end": 163, "answer_original": "悲观锁持保守态度，认为自己读数据时别人可能正在写，因此在读取数据时先加锁，阻止其他\n事务修改，直到自己事务提交才释放。在 MySQL 中通过 SELECT ... FOR UPDATE 加排他\n锁、SELECT ... LOCK IN SHARE MODE 加共享锁实现，也可借助 UPDATE 本身触发的行\n锁。悲观锁能保证强一致、避免重试，但持有锁期间阻塞他人，容易引发锁等待与死锁，适合\n写冲突频繁、数据强一致且操作短平快的场景，务必配合短事务与合适索引使用。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 218-219 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q385", "number": 385, "title": "乐观锁和悲观锁如何对比选型？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 163, "page_end": 163, "answer_original": "乐观锁读时不加锁，仅在提交时校验版本或时间戳，适合读多写少、冲突概率低、追求高吞吐\n的场景，缺点是冲突时需重试甚至失败；悲观锁读写全程加锁，适合写冲突频繁、不允许重\n试、强一致要求的场景，缺点是降低并发、可能引发死锁与长时间阻塞。从实现看，乐观锁依\n赖应用层 version/timestamp 字段，悲观锁依赖数据库锁机制（for update）。实践中常组\n合使用：核心资产扣减用悲观锁保准确，配置类低频更新用乐观锁降开销。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 218-219 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q386", "number": 386, "title": "什么是死锁？MySQL 中如何避免死锁？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 163, "page_end": 163, "answer_original": "死锁指两个或多个事务互相持有对方需要的锁并循环等待，导致所有事务都无法推进。在\nInnoDB 中常见原因是多个事务以不同顺序更新同一批行（事务 A 锁 1 等 2，事务 B 锁 2 等\n1）。避免措施包括：尽量以固定顺序访问表和行、缩短事务长度减少持锁时间、为更新语句\n建立合适的索引避免锁升级为表锁、降低隔离级别、合理设置锁等待超时与死锁检测。\nInnoDB 默认开启死锁检测自动回滚代价较小的事务。设计时应将大事务拆小，并避免在事务\n中做无关耗时操作。（来源：JAVA 面试知识点总结.pdf.txt，约第 219 页、5805 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q387", "number": 387, "title": "什么是分库分表？为什么需要分库分表？", "group_id": "data", "group": "数据库与缓存", "topic_id": "sharding", "topic": "分库分表", "learning_priority": "进阶", "page_start": 163, "page_end": 163, "answer_original": "分库分表是当单库单表数据量过大、性能瓶颈显现时，将数据按一定规则拆分到多个数据库、\n多张结构相同的表中的水平扩展手段。需要它的原因：单表数据量过千万后，B+树变高、索\n引维护与查询变慢；单库连接数、CPU、IO 存在上限；热点表写竞争剧烈。分库分表能分摊\n存储与流量、提升写入并发与查询性能、便于按业务或用户维度独立扩容。但它也引入分布式\n事务、跨库 join、全局主键、路由维护等复杂度，应在单表优化（索引、SQL）穷尽后再考\n虑，而非过早设计。（来源：JAVA 面试知识点总结.pdf.txt，约第 220 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q388", "number": 388, "title": "垂直切分和水平切分的区别是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "sharding", "topic": "分库分表", "learning_priority": "进阶", "page_start": 163, "page_end": 164, "answer_original": "垂直切分按功能模块、关系密切程度将表划分部署到不同库，例如将定义库 workDB、商品库\npayDB、用户库 userDB、日志库 logDB 分离，解决的是“业务耦合、单库过大、连接争\n用”问题，表结构不同。水平切分按某种规则（如 userID 散列、时间范围）将同一张表的数\n据拆分到多个结构相同的表和库中，解决的是“单表数据量过大”问题。实践中常组合：先按\n业务垂直分库，再对超大表水平分表。水平切分更能线性扩容，但带来跨片查询与分布式事务\n难题。（来源：JAVA 面试知识点总结.pdf.txt，约第 220 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q389", "number": 389, "title": "水平分表常见的分片路由规则有哪些？", "group_id": "data", "group": "数据库与缓存", "topic_id": "sharding", "topic": "分库分表", "learning_priority": "进阶", "page_start": 164, "page_end": 164, "answer_original": "水平分表核心是选择分片键与路由算法。常见规则有：一、范围分片，如按用户 ID 区间或时\n间（按月/年）切分，易扩容但易热点；二、哈希取模，如 userID % N，数据分布均匀但扩容\n需迁移大量数据；三、一致性哈希，减少节点变动时的数据迁移量；四、基因法/雪花 ID，将\n分片信息编码进主键便于路由；五、按地理或租户维度。选择规则要兼顾分布均匀性、避免热\n点、扩容成本与查询是否能落单分片。路由逻辑应尽量让高频查询带上分片键以精准命中单\n表。（来源：JAVA 面试知识点总结.pdf.txt，约第 220 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q390", "number": 390, "title": "分库分表会带来哪些新问题？如何应对？", "group_id": "data", "group": "数据库与缓存", "topic_id": "sharding", "topic": "分库分表", "learning_priority": "进阶", "page_start": 164, "page_end": 164, "answer_original": "分库分表引入的主要难题：一是分布式事务，跨库更新难保 ACID，需引入柔性事务或 TCC、\n消息最终一致；二是跨库 join 与分页，需应用层聚合或采用冗余宽表、全局表；三是全局唯\n一主键，不能依赖单库自增，可用雪花算法、号段模式或 UUID；四是路由与扩容，需中间件\n（如 ShardingSphere）管理分片规则；五是运维复杂度上升，备份、监控、数据迁移成本增\n加。应对原则是先优化单表（索引、SQL、归档冷数据），确有必要再引入中间件分层，避免\n过早过度设计。（来源：JAVA 面试知识点总结.pdf.txt，约第 220 页、222 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q391", "number": 391, "title": "如何进行 SQL 优化？请给出思路。", "group_id": "data", "group": "数据库与缓存", "topic_id": "sql", "topic": "SQL 优化与执行计划", "learning_priority": "核心", "page_start": 164, "page_end": 164, "answer_original": "SQL 优化应分层推进：一、设计层，遵循索引原则建合适索引，选高区分度列，遵循最左前\n缀，避免索引列函数计算；二、SQL 层，只查需要的列、避免 select *，减少不必要的排序分\n组，用 limit 限制返回，改写子查询为 join；三、结构层，合理分库分表、冷热分离、冗余必\n要的反范式列；四、执行层，用 explain 查看执行计划，关注 type、key、rows、Extra，消\n除全表扫描；五、架构层，引入缓存、读写分离。优化要基于实测与 explain，而非凭感觉，\n且要权衡读写整体影响。（来源：JAVA 面试知识点总结.pdf.txt，约第 216 页、5805 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q392", "number": 392, "title": "请说明存储过程的优化思路。", "group_id": "data", "group": "数据库与缓存", "topic_id": "sql", "topic": "SQL 优化与执行计划", "learning_priority": "核心", "page_start": 164, "page_end": 165, "answer_original": "存储过程是预编译的 SQL 语句集，优化思路包括：一、用 SQL 聚合函数（如 avg、sum）替\n代小循环，集合运算比过程运算高效；二、将中间结果存于临时表并为其加索引，加速后续关\n联；三、尽量少用游标，游标是逐行过程运算，对 100 万行需读表 100 万次，而无游标集合\n查询只需少量读取；四、事务越短越好，过长或隔离级别过高会造成并发阻塞甚至死锁；五、\n用 try-catch 处理异常；六、查找语句不要放在循环内。总体上让数据库做它擅长的集合操\n作，避免逐行处理。（来源：JAVA 面试知识点总结.pdf.txt，约第 218 页、5805 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q393", "number": 393, "title": "为什么存储过程中要尽量少用游标？", "group_id": "data", "group": "数据库与缓存", "topic_id": "sql", "topic": "SQL 优化与执行计划", "learning_priority": "核心", "page_start": 165, "page_end": 165, "answer_original": "SQL 是集合语言，对集合运算（批量扫描、join、聚合）具有较高性能，而游标是逐行过程式\n运算。例如对一个 100 万行的数据查询，使用游标需要逐行读表 100 万次，而无游标的方式\n只需少量几次集合读取即可完成，性能差距数量级。游标还会长时间持有锁、占用连接、阻塞\n并发。因此能用集合查询（SELECT/UPDATE/JOIN/聚合）解决的就不要使用游标，必要时将\n中间结果放入带索引的临时表处理。这是数据库过程优化的关键经验。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 5805 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q394", "number": 394, "title": "如何使用 EXPLAIN 分析 SQL 执行计划？", "group_id": "data", "group": "数据库与缓存", "topic_id": "sql", "topic": "SQL 优化与执行计划", "learning_priority": "核心", "page_start": 165, "page_end": 165, "answer_original": "在 SELECT 前加 EXPLAIN 即可查看 MySQL 的执行计划，输出包含关键列：id 表示执行顺\n序；select_type 指查询类型；type 表示访问类型，从好到差分 system、const、eq_ref、\nref、range、index、ALL，应尽量避免 ALL 全表扫描；key 显示实际使用的索引；rows 是估\n计扫描行数；Extra 给出额外信息如 Using index（覆盖索引）、Using where、Using\nfilesort（需优化排序）、Using temporary（需临时表）。通过 EXPLAIN 可定位是否走索\n引、扫描行数、是否排序/临时表，是 SQL 优化必备的诊断工具。在 MySQL 8.0 中可用\nEXPLAIN FORMAT=JSON 或 EXPLAIN ANALYZE 获取更详细的成本与执行耗时，便于深度\n定位性能瓶颈；生产排查应养成先 EXPLAIN 再改 SQL 的习惯，用数据而非猜测驱动优化。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 215-218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q395", "number": 395, "title": "EXPLAIN 中的 type 访问类型有什么含义？", "group_id": "data", "group": "数据库与缓存", "topic_id": "sql", "topic": "SQL 优化与执行计划", "learning_priority": "核心", "page_start": 165, "page_end": 165, "answer_original": "type 表示 MySQL 如何访问表，性能由优到劣大致为：system（系统表单行）、const（主\n键/唯一索引等值，最多一行）、eq_ref（join 中主键关联）、ref（非唯一索引等值）、\nrange（索引范围扫描如 between/in）、index（全索引扫描）、ALL（全表扫描）。理想目\n标是达到 const/ref/range，至少要避免 ALL。若 type 为 ALL 且数据量大，说明缺少有效索\n引或查询无法用索引，应结合 key 与 Extra 分析。type 越靠左，扫描行越少、性能越好，是\n判断 SQL 是否健康的核心指标。当 type 为 index 时虽避免了全表扫描，但仍需遍历整个索引\n树，代价也不小；只有达到 range 及以上才算真正有效利用了索引，优化时应以此为底线目\n标。（来源：JAVA 面试知识点总结.pdf.txt，约第 215-218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q396", "number": 396, "title": "什么是覆盖索引？为什么它能提升性能？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 165, "page_end": 166, "answer_original": "覆盖索引指查询所需的所有列都包含在某一个索引中，执行时只需扫描索引而无需回表取数据\n行。由于 InnoDB 二级索引叶子只存主键，若查询列恰为索引列（如联合索引(a,b)查 a,b），\n引擎在索引 B+树中即可获得全部数据，省去通过主键回表读取整行的随机 IO。覆盖索引能显\n著降低 IO、提升查询速度，尤其适合只取少量列的统计与列表查询。设计联合索引时可特意\n将高频查询的返回列纳入索引尾列，以达成“索引覆盖”。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 214-216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q397", "number": 397, "title": "什么是 redo log？它有什么作用？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 166, "page_end": 166, "answer_original": "redo log（重做日志）是 InnoDB 的持久化日志，记录已提交事务对数据页的物理修改。事务\n提交时采用 WAL 机制：先写 redo log 并落盘，再异步刷数据页。它的核心作用是保证持久\n性（Durability）——即使数据页尚未写入磁盘就发生宕机，重启后也能依据 redo log 把已\n提交的事务重放恢复，避免数据丢失。redo log 是顺序写入、性能高，与随机写数据页形成\n对比。它也与 bin-log 配合，在分布式两阶段提交中作为本地准备阶段写入的日志，是崩溃恢\n复与一致性提交的基石。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页、5886\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q398", "number": 398, "title": "什么是 undo log？它有什么作用？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 166, "page_end": 166, "answer_original": "undo log（回滚日志）记录事务修改前的数据旧版本，主要有两个作用：一是实现事务回\n滚，当事务失败或显式 ROLLBACK 时，按 undo log 逆序执行反向操作将数据恢复到事务前\n状态，从而保证原子性；二是支撑 MVCC，旧版本数据保留在 undo log 中形成版本链，供其\n他事务快照读时访问历史一致视图，实现非锁定读。undo log 随着事务提交、不再被任何快\n照需要时会被 purge 线程清理。它是原子性与多版本并发控制共同依赖的基础设施。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 5886 页、214-218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q399", "number": 399, "title": "redo log 和 undo log 的区别是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 166, "page_end": 166, "answer_original": "二者职责互补：redo log 记录“事务做了什么修改”，用于崩溃后重放已提交数据，保证持\n久性（Durability），是物理日志、顺序写、重做；undo log 记录“修改前是什么样”，用\n于回滚未提交事务与提供 MVCC 历史版本，保证原子性（Atomicity）与一致性读，是逻辑日\n志。从生命周期看，redo 在提交时必落盘以保持久，undo 在事务结束后待无快照引用才清\n理。在分布式两阶段提交的准备阶段，各参与者先在本地写 redo 和 undo 日志但不提交，达\n到“万事俱备”状态，正是二者协同保障事务可逆与可恢复的体现。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 5886 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q400", "number": 400, "title": "MySQL 崩溃恢复大致是如何进行的？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 167, "page_end": 167, "answer_original": "MySQL InnoDB 崩溃恢复依赖 redo log 与 undo log 协同。重启时，首先对 redo log 做前\n滚（roll forward）：重放所有已提交事务的修改，将尚未刷盘的数据页恢复到宕机前已提交\n状态，保证持久性。然后做回滚（roll back）：利用 undo log 将未提交或崩溃时未完成的事\n务逆序撤销，恢复数据到一致起点，保证原子性。整个过程自动完成，无需人工干预。配合\nbin-log 还可做基于时间点的恢复与主从重放。正是 WAL 与双日志机制，使 InnoDB 在异常\n宕机后仍能回到一致且持久的状态。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-215\n页、5886 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q401", "number": 401, "title": "请说明 MySQL 主从复制的原理。", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 167, "page_end": 167, "answer_original": "MySQL 主从复制基于二进制日志（bin-log）。主库将所有数据变更记录到 bin-log，从库启\n动 I/O 线程连接主库，读取 bin-log 并写入本地中继日志（relay-log）；从库的 SQL 线程再\n读取 relay-log，重放其中的 SQL 或行事件，使从库数据与主库保持一致。典型为异步复制：\n主库提交后即返回，不等待从库，性能高但存在延迟与短暂不一致。半同步复制则要求至少一\n个从库接收并落盘 relay-log 后才返回，提升一致性。复制是实现读写分离、负载均衡与备份\n容灾的基础。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q402", "number": 402, "title": "主从复制有什么作用？常见应用场景是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 167, "page_end": 167, "answer_original": "主从复制的核心价值在于：一、读写分离，主库负责写、从库承担读，分摊压力，提升整体吞\n吐；二、高可用与容灾，主库故障时可切换从库，减少停机；三、备份不影响主库，从库可用\n来做冷备、数据校验；四、数据分析隔离，报表类重查询放到从库避免影响线上写。常见架构\n是一主多从、级联复制。但需关注主从延迟，对实时性要求极高的读（如刚写入即读）应走主\n库，避免读到旧数据。复制拓扑需配合监控与自动故障转移工具。（来源：JAVA 面试知识点\n总结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q403", "number": 403, "title": "主从延迟常见原因及优化手段有哪些？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 167, "page_end": 167, "answer_original": "主从延迟指从库数据落后于主库。常见原因：主库写入压力大、bin-log 传输网络慢、从库单\nSQL 线程重放瓶颈、从库硬件或索引不足、大事务导致一次复制大量事件、从库承担过重读\n负载抢占资源。优化手段：使用并行复制（多线程按库/按事务并行重放）、提升从库硬件与\n网络、避免主库大事务而拆小、对热点表优化从库索引、读写分离时把实时读走主库、监控\nSeconds_Behind_Master 及时告警。本质是在“一致性”与“复制吞吐”间找平衡。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q404", "number": 404, "title": "bin-log 有哪几种格式？各有什么特点？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 168, "page_end": 168, "answer_original": "bin-log 有三种格式：STATEMENT（语句模式）记录执行的 SQL 语句，日志量小、但某些函\n数（如 UUID、NOW）在主从可能产生不一致，且需上下文；ROW（行模式）记录每行实际\n变更的前后数据，最准确、主从一致性最好，但日志量大；MIXED（混合模式）默认用\nSTATEMENT，对不确定的语句自动切换为 ROW。现代 MySQL 多推荐使用 ROW 模式以确\n保复制安全，代价是磁盘与网络开销增加。格式选择需权衡一致性、存储成本与性能，通常与\n半同步复制配合保障数据可靠。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-215 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q405", "number": 405, "title": "什么是两阶段提交（2PC）？为什么需要它？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 168, "page_end": 168, "answer_original": "两阶段提交（Two-phase Commit）是分布式系统中，为使跨多个节点的所有事务提交保持\n一致而设计的协议。当一个事务跨越多个数据库节点时，各节点只能知晓自己的操作成败，无\n法知道其他节点，因此需要引入协调者统一掌控。2PC 分为准备阶段与提交阶段：准备阶段协\n调者向各参与者发 Prepare，参与者本地执行事务、写本地 redo/undo 日志但不提交，进入\n“万事俱备”状态；提交阶段协调者根据反馈决定全局 Commit 或 Rollback，参与者执行并\n释放锁。它保证了分布式事务的 ACID 一致性。（来源：JAVA 面试知识点总结.pdf.txt，约第\n220-221 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q406", "number": 406, "title": "两阶段提交存在哪些缺点？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-logs", "topic": "日志、恢复与主从复制", "learning_priority": "核心", "page_start": 168, "page_end": 168, "answer_original": "2PC 主要缺点有：一、同步阻塞问题，执行过程中所有参与节点都是事务阻塞型的，资源长时\n间锁定，吞吐低；二、单点故障，协调者至关重要，一旦故障参与者会一直阻塞下去；三、数\n据不一致（脑裂），在提交阶段协调者发 commit 后发生网络异常或部分参与者未收到，导致\n只有部分节点提交，出现数据不一致；四、二阶段无法解决的问题，若协调者发出 commit 后\n宕机且唯一收到消息的参与者也宕机，新协调者无法确定该事务是否提交，状态不确定。因此\n实践中多辅以超时与补偿机制。（来源：JAVA 面试知识点总结.pdf.txt，约第 221 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q407", "number": 407, "title": "如何排查线上一条慢 SQL？请列出步骤。", "group_id": "data", "group": "数据库与缓存", "topic_id": "sql", "topic": "SQL 优化与执行计划", "learning_priority": "核心", "page_start": 168, "page_end": 169, "answer_original": "排查慢 SQL 的标准步骤：一、开启慢查询日志定位目标 SQL 及其执行耗时；二、用\nEXPLAIN 查看执行计划，重点看 type 是否为 ALL（全表扫描）、key 是否用到预期索引、\nrows 扫描行数、Extra 是否有 Using filesort/Using temporary；三、核对查询条件是否符合\n最左前缀、索引列是否被函数/计算/类型转换破坏；四、检查表数据量、索引区分度与冗余索\n引；五、评估是否需改写 SQL（避免 select *、限制返回、拆分大事务）；六、必要时加索引\n或优化表结构、归档冷数据；七、仍瓶颈则考虑分库分表或读写分离。整个过程以数据为依\n据，循序渐进。（来源：JAVA 面试知识点总结.pdf.txt，约第 215-216 页、220 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q408", "number": 408, "title": "为什么说“尽量删除不再使用或很少使用的索引”？", "group_id": "data", "group": "数据库与缓存", "topic_id": "indexes", "topic": "B+树与索引设计", "learning_priority": "核心", "page_start": 169, "page_end": 169, "answer_original": "索引并非建得越多越好。每个索引都占用存储空间，并在 INSERT/UPDATE/DELETE 时增加\nB+树维护成本——数据写入不仅要改数据页，还要同步更新所有相关索引页，索引越多写越\n慢、锁竞争越激烈。那些因历史需求建立、如今查询已不再命中或命中极低的索引，纯属负\n担，既拖慢写入又浪费内存（Buffer Pool 被无效索引页占用）。因此应定期通过监控（如\nsys.schema_unused_indexes）识别并删除冗余、重复、低效索引，保持索引集精干，在读\n写性能间维持健康平衡。（来源：JAVA 面试知识点总结.pdf.txt，约第 216 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q409", "number": 409, "title": "请说明“读已提交”与“可重复读”在 InnoDB 中的实现差异。", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 169, "page_end": 169, "answer_original": "在 InnoDB 中，两者都基于 MVCC，但 ReadView 生成时机不同。读已提交（RC）每次执行\n快照读都生成新的 ReadView，因此能看到别的事务已提交的最新数据，解决脏读但可能出现\n不可重复读。可重复读（RR）在整个事务第一次快照读时生成 ReadView 并在事务内复用，\n后续读都基于同一快照，因此多次读结果一致，解决不可重复读；同时 RR 下 InnoDB 对当前\n读加间隙锁（Next-Key Lock），阻止区间插入，从而在默认级别下也能防幻读。正因\nMVCC+间隙锁，MySQL 的 RR 比标准 SQL 定义更强。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 214-218 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q332", "Q333", "Q367", "Q372", "Q373", "Q374", "Q375", "Q376", "Q377"]}, {"id": "Q410", "number": 410, "title": "什么是 Next-Key Lock（临键锁）？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-locks", "topic": "数据库锁与死锁", "learning_priority": "核心", "page_start": 169, "page_end": 169, "answer_original": "Next-Key Lock 是 InnoDB 在可重复读级别下使用的锁机制，是“记录锁（Record Lock，锁\n住某行）+间隙锁（Gap Lock，锁住记录前的区间）”的组合，既锁住已存在的索引记录，\n也锁住该记录与前一条记录之间的间隙。它解决了幻读问题：当执行范围查询并加锁时，不仅\n锁定命中的行，还锁定可能插入新行的间隙，使其他事务无法在区间内插入满足查询条件的新\n记录，从而保证同一事务内重复范围查询的结果集稳定。代价是锁定范围更大、并发插入受\n限，需在一致性与性能间权衡。（来源：JAVA 面试知识点总结.pdf.txt，约第 214-218 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q411", "number": 411, "title": "请简述 Redis 是什么，它有哪些核心特点？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 169, "page_end": 170, "answer_original": "Redis 是完全开源免费、遵守 BSD 协议的高性能 key-value 数据库，用 C 语言编写，基于内\n存运行并支持持久化，是当前最热门的 NoSQL 数据库之一，也被称为数据结构服务器。它的\n核心特点有三点：第一，支持数据持久化，可以把内存中的数据保存到磁盘，重启后可再次加\n载使用；第二，不仅支持简单的 key-value，还提供 list、set、zset、hash 等丰富数据结构\n的存储；第三，支持 master-slave 主从备份。其优势还包括性能极高（读 11 万次/秒、写\n8.1 万次/秒）、数据类型丰富、操作原子性以及支持发布订阅、key 过期等特性。这些特性使\n它既能做缓存，也能承担计数器、消息队列等角色。（来源：Redis_快看看这 40 道面试\n题.pdf.txt，约第 3 页；阿里面试.pdf.txt，约第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q412", "number": 412, "title": "Redis 支持哪些数据类型，各自适合什么业务场景？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 170, "page_end": 170, "answer_original": "Redis 支持五种基础数据类型：string（字符串）、hash（哈希）、list（列表）、set（集\n合）、zset（有序集合），中高级场景还会用到 HyperLogLog、Geo、Pub/Sub，以及模块\n如 BloomFilter。在真实业务中：String 适合做常规计数和简单缓存；Hash 适合存储结构化\n对象（如用户信息以 cookieId 为 key，字段存各属性），便于单独操作某个字段；List 可做\n简单消息队列，也可用 lrange 实现高性能分页；Set 是不重复集合，适合全局去重以及交\n集、并集运算（算共同喜好）；Sorted Set 额外有 score 权重，适合排行榜 TOP N、延时任\n务和范围查找。选型时应根据数据结构和访问模式匹配类型，避免把复杂对象塞进一个大\nString。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 3-4 页；阿里面试.pdf.txt，约\n第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q413", "number": 413, "title": "String 类型一个值最大能存多少，常用于哪些功能？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 170, "page_end": 170, "answer_original": "Redis 中单个 String 类型的值最大容量为 512M，这是一个硬上限，设计 key 时需注意不要\n逼近该值。String 是最基础也是使用最频繁的类型，常规用法是 set/get 操作，value 既可以\n是文本字符串，也可以是数字。典型应用场景包括：第一，复杂计数功能的缓存，如文章阅读\n量、点赞数、库存计数；第二，分布式环境下的共享状态存储，如用 incr/decr 做原子自增\nID 或限流计数器；第三，简单的 KV 缓存，把序列化后的对象或页面片段存入。由于其操作\nO(1) 且原子，常用于高并发读写。但 value 过大（如几 MB 的大 JSON）会拖慢网络 IO 和\n序列化，应避免让单个 String 成为大 key。（来源：Redis_快看看这 40 道面试题.pdf.txt，\n约第 4 页；阿里面试.pdf.txt，约第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q414", "number": 414, "title": "Hash 类型适合存放什么数据，举一个实际例子说明？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 170, "page_end": 171, "answer_original": "Hash 适合存放结构化的对象数据，比如一个用户有多个属性（姓名、邮箱、密码、积分\n等）。与其为每个属性单独设一个 key（user:1:name、user:1:email…），不如用一条 hash\n命令把整个用户对象存到一个 key 里，字段对应各属性。这样做的好处：一是内存更紧凑，\n小 hash 在 ziplist 编码下非常省内存；二是可以单独读取或修改某个字段（hget/hset），不\n必整体序列化。例如在单点登录场景中，博主就以 cookieId 作为 key，把用户信息存入\nhash，并设置 30 分钟过期来模拟 session 效果。注意 hash 的 field 不宜过多，否则退化为\nhashtable 编码后内存优势减弱，并且大 hash 也会变成大 key。（来源：阿里面试.pdf.txt，\n约第 24 页；Redis_快看看这 40 道面试题.pdf.txt，约第 3 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q415", "number": 415, "title": "List 数据结构能实现哪些功能，如何实现分页？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 171, "page_end": 171, "answer_original": "List 是双向链表结构，在 Redis 中可用于实现简单消息队列和分页列表。作为队列时，常用\nrpush 生产消息、lpop 消费消息，若想阻塞等待可用 blpop；若需要 1:N 消费则改用\npub/sub。作为分页时，利用 lrange 命令按索引范围取元素非常高效，比如最新动态、评论\n列表等场景，性能远优于数据库 limit 分页，用户体验好。但要注意：List 做队列时不保证可\n靠投递，消费者掉线消息可能丢失，且 blpop 只能单消费者；做分页时若列表过长（百万\n级）会成为大 key，建议限制长度或用 Sorted Set 按时间 score 维护。另外 List 的元素上限\n为 2^32-1，但实际受内存限制。（来源：阿里面试.pdf.txt，约第 24 页；Redis_快看看这\n40 道面试题.pdf.txt，约第 11-13 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q416", "number": 416, "title": "Set 集合除了去重，还能做哪些运算？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 171, "page_end": 171, "answer_original": "Set 存放一堆不重复的值，基于它可实现全局去重。与 JVM 自带 Set 相比，Redis Set 天然\n支持集群部署下的全局去重，无需为了去重再起一个公共服务。除了去重，Set 还提供交集\n（sinter）、并集（sunion）、差集（sdiff）等集合运算，非常适合社交类业务：例如计算两\n个用户的共同好友（交集）、全部好友（并集）、自己独有的好友（差集）等。此外 Set 还可\n用于标签系统、随机抽奖（srandmember）以及判断某元素是否存在（sismember）。需注\n意 Set 中的元素也是字符串，且集合过大时相关运算会消耗 CPU 与网络带宽，必要时应控制\n规模或异步计算。（来源：阿里面试.pdf.txt，约第 24 页；Redis_快看看这 40 道面试\n题.pdf.txt，约第 3 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q417", "number": 417, "title": "Sorted Set 相比 Set 多了什么能力，典型应用有哪些？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 171, "page_end": 172, "answer_original": "Sorted Set（zset）在 Set 不重复的基础上，为每个元素附加了一个 score 权重参数，元素按\nscore 排序，因此具备排序和范围查询能力。典型应用包括：第一，排行榜，用 zadd 更新分\n数、zrevrange 取 TOP N，如游戏积分榜、热度榜；第二，延时任务，把执行时间戳作为\nscore，用 zrangebyscore 轮询获取到期任务处理；第三，范围查找，如按价格区间、时间区\n间取数据；第四，带权重的消息优先级队列。相比 List，zset 支持按 score 排序和去重，适\n合需要排名与区间检索的场景。但 zset 的插入和范围操作有一定开销，元素过多时也会成为\n大 key，需关注内存与命令耗时。（来源：阿里面试.pdf.txt，约第 24 页；Redis_快看看这\n40 道面试题.pdf.txt，约第 11-12 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q418", "number": 418, "title": "Redis 的持久化机制有哪几种，RDB 的原理是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-persistence", "topic": "Redis 持久化", "learning_priority": "核心", "page_start": 172, "page_end": 172, "answer_original": "Redis 提供两种持久化机制：RDB（Redis DataBase）和 AOF（Append Only File）。RDB\n是快照（snapshot）方式，它在某个时间点把内存中所有键值对全量写入一个临时文件，持\n久化结束后再用这个临时文件替换上一次的 dump.rdb 文件，从而达到数据恢复的目的。\nRDB 由主进程 fork 出子进程来完成写操作，主进程继续处理命令，因此不阻塞服务。触发方\n式包括配置 save 规则自动触发、手动执行 save（阻塞）/bgsave（后台）。RDB 适合做定\n时备份和灾难恢复，文件紧凑、恢复快，但它是间隔性快照，若两次快照之间宕机，中间写入\n的数据会丢失，因此数据安全性相对较弱。（来源：Redis_快看看这 40 道面试题.pdf.txt，约\n第 5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q419", "number": 419, "title": "AOF 持久化的原理是什么，有哪些配置项？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-persistence", "topic": "Redis 持久化", "learning_priority": "核心", "page_start": 172, "page_end": 172, "answer_original": "AOF（Append Only File）以日志形式持久化，它把每一次写命令以 Redis 命令请求协议的\n格式追加保存到 aof 文件，重启时通过重放这些命令来恢复数据。其关键在于 appendfsync\n配置，控制刷盘时机：always 表示每次命令都同步落盘，数据最安全但性能最低；everysec\n每秒同步一次，是常用折中；no 由操作系统决定。AOF 采用追加写，即使服务器宕机，也可\n通过 redis-check-aof 工具修复一致性问题。当 aof 文件过大时，Redis 会触发 rewrite 重\n写，合并压缩命令（例如多个 incr 合并为一个 set），从而减小体积并可删除误操作的\nflushall 等命令。相比 RDB，AOF 数据更安全但文件更大、恢复更慢。（来源：Redis_快看\n看这 40 道面试题.pdf.txt，约第 5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q420", "number": 420, "title": "请对比 RDB 和 AOF 各自的优缺点？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-persistence", "topic": "Redis 持久化", "learning_priority": "核心", "page_start": 172, "page_end": 173, "answer_original": "RDB 优点：只有一个 dump.rdb 文件，方便持久化和容灾备份；通过 fork 子进程写，主进\n程无 IO，性能最大化；数据集大时启动恢复效率比 AOF 高。RDB 缺点：是间隔快照，两次\n持久化之间发生故障会丢数据，数据安全性低，不适合对数据要求严格的场景。AOF 优点：\n可配置 appendfsync=always 做到每次操作都记录，数据安全；追加写中途宕机可用 redis-\ncheck-aof 修复；支持 rewrite 重写压缩并可剔除误删命令。AOF 缺点：文件比 RDB 大，恢\n复速度慢；数据集大时启动效率低于 RDB。生产上常组合使用：用 RDB 做定时全量备份，用\nAOF 保证秒级数据安全，重启优先加载 AOF。两者取舍本质是性能与数据安全性的权衡。\n（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q421", "number": 421, "title": "什么是 AOF 重写（rewrite），它有什么作用？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-persistence", "topic": "Redis 持久化", "learning_priority": "核心", "page_start": 173, "page_end": 173, "answer_original": "AOF 重写是 Redis 对 AOF 文件的一种压缩机制。AOF 长期追加写命令，文件会越来越大，\n重放恢复也变慢。重写时 Redis 并不读取旧 aof，而是基于当前内存中的数据状态，生成一份\n等效的最小命令集重新写入新文件（例如对同一个 key 的多次 incr 会被合并成一条 set 最终\n值）。其作用是：第一，显著减小 AOF 文件体积；第二，加快重启恢复速度；第三，可以在\n重写时用命令剔除误操作的破坏性指令（如误执行的 flushall）。重写过程也是 fork 子进程\n后台进行，期间新写命令会同时追加到旧文件并缓存，保证数据不丢。需要注意 rewrite 本身\n也会消耗 CPU 和 IO，应合理设置触发阈值。（来源：Redis_快看看这 40 道面试题.pdf.txt，\n约第 5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q422", "number": 422, "title": "AOF 的 appendfsync 策略有哪几种，如何选型？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-persistence", "topic": "Redis 持久化", "learning_priority": "核心", "page_start": 173, "page_end": 173, "answer_original": "AOF 的 appendfsync 决定命令刷盘时机，有三种：always 每次写命令都立即 fsync 到磁\n盘，数据最安全（最多丢一条命令），但磁盘 IO 成为瓶颈，性能最差；everysec 每秒由后台\n线程 fsync 一次，最多丢失 1 秒数据，是性能与安全的常用折中，绝大多数线上场景选它；\nno 完全交给操作系统调度刷盘，性能最好但丢失数据风险最高。选型原则：对数据一致性要\n求极高的金融类业务可权衡用 always；普通缓存/会话类业务用 everysec 即可；no 一般不推\n荐。另外，Redis 4.0 之后支持混合持久化（RDB 快照+AOF 增量），可在重写时兼顾恢复速\n度与数据安全。配置不当会直接放大故障时的数据丢失面，需结合业务容忍度设定。（来源：\nRedis_快看看这 40 道面试题.pdf.txt，约第 5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q423", "number": 423, "title": "主节点做内存快照（RDB）有什么性能隐患？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-persistence", "topic": "Redis 持久化", "learning_priority": "核心", "page_start": 173, "page_end": 173, "answer_original": "主节点执行 RDB 快照（尤其 save 命令触发的 rdbSave 函数）会阻塞主线程，当内存中数据\n集很大时，生成快照需要较长时间，期间服务会出现间歇性的暂停（卡顿），严重影响线上读\n写响应。因此生产上强烈建议：Master 最好不要写内存快照，而让 Slave 来做持久化和备\n份。若必须要做快照，应使用 bgsave 由子进程在后台完成，避免直接阻塞主线程；同时把\nMaster 和 Slave 部署在同一局域网，保证主从复制速度和连接稳定。此外，不要在压力很大\n的主库上随意增加从库，以免复制流量进一步拖垮主节点性能。这些都属于 Redis 常见性能\n问题及其解决方案，核心是保护主线程不被持久化 IO 阻塞。（来源：Redis_快看看这 40 道\n面试题.pdf.txt，约第 6 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q424", "number": 424, "title": "为什么 Redis 要把所有数据放在内存中，断电后数据会丢吗？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-persistence", "topic": "Redis 持久化", "learning_priority": "核心", "page_start": 174, "page_end": 174, "answer_original": "Redis 把数据放内存是为了达到最快的读写速度，内存读写远快于磁盘 IO，所有数据操作都\n在内存中完成，因此能达到十万级 QPS。但它并非“断电即丢”：Redis 通过异步方式把数\n据持久化到磁盘（RDB 快照和 AOF 日志），重启时再加载回内存，从而兼具高速与持久化能\n力。如果不放内存而依赖磁盘，磁盘 IO 速度会严重制约 Redis 性能。在内存越来越廉价的今\n天，这种取舍使 Redis 既快又可靠。需要注意：若设置了 maxmemory 上限，数据记录数达\n到内存限制后就不能继续插入新值（除非配置淘汰策略驱逐旧数据）。所以“全内存”指的是\n工作数据集在内存，持久化只是异步备份手段，不能替代合理的备份与高可用架构。（来源：\nRedis_快看看这 40 道面试题.pdf.txt，约第 7 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q425", "number": 425, "title": "Redis 的键过期删除策略有哪几种？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 174, "page_end": 174, "answer_original": "Redis 的过期键删除有三种策略：第一，定时删除，在设置键过期时间的同时创建定时器，过\n期来临立刻删除，内存释放最及时，但需占用 CPU 定时扫描，高并发下会争抢 CPU；第二，\n惰性删除，放任键过期不管，每次访问键时才检查是否过期，过期则删除，对 CPU 最友好但\n对内存不友好，过期键可能长期占用内存；第三，定期删除，Redis 默认每 100ms 随机抽取\n一部分键检查并删除过期键。Redis 实际采用的是“定期删除+惰性删除”组合：定期删除兜\n底清理，惰性删除在访问时顺手清理，二者互补以平衡 CPU 与内存。这解释了为何设置了过\n期时间但内存仍高——因为定期删除是抽样而非全量。（来源：Redis_快看看这 40 道面试\n题.pdf.txt，约第 6 页；阿里面试.pdf.txt，约第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q426", "number": 426, "title": "请说明定期删除的具体工作机制？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 174, "page_end": 174, "answer_original": "定期删除由 Redis 内部的 serverCron 定时任务驱动，默认大约每 100ms 执行一次。它并不\n是把数据库里所有 key 都扫描一遍（那样在 key 数量巨大时会直接卡死），而是从每个库的\n过期字典中“随机抽取”一定数量的 key 进行检查：如果抽取的 key 已经过期，就立即删\n除；同时 Redis 会限制每次删除操作的时长和数量，避免一次清理占用过多 CPU。抽取后若\n发现过期比例较高，还会再抽一批继续清理，形成自适应。因为只是抽样，所以必然有“漏\n网”的过期 key 没被及时删掉，这就需要惰性删除在访问时补刀，以及内存淘汰策略在内存\n吃紧时兜底。理解这一点很关键：过期时间到了不代表 key 立刻消失，只是“逻辑过期”，\n真正删除可能被延迟。（来源：阿里面试.pdf.txt，约第 24 页；Redis_快看看这 40 道面试\n题.pdf.txt，约第 6 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q427", "number": 427, "title": "Redis 的内存淘汰（回收）策略有哪些？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 174, "page_end": 175, "answer_original": "Redis 提供 6 种内存淘汰策略（maxmemory-policy）：volatile-lru，从设置了过期时间的\n键中淘汰最近最少使用的；volatile-ttl，从设置了过期时间的键中淘汰即将过期的；volatile-\nrandom，从设置了过期时间的键中随机淘汰；allkeys-lru，从所有键中淘汰最近最少使用\n（最常用，推荐）；allkeys-random，从所有键中随机淘汰；noeviction，禁止驱逐，内存\n满时写命令报错（默认行为）。其中 volatile 系列只在带过期时间的键空间内生效，allkeys\n系列面向全量键空间。若键没设过期时间，volatile-lru/random/ttl 实际会退化为\nnoeviction 行为。策略通过 redis.conf 配置。选型要结合数据访问特征，例如幂律分布用\nallkeys-lru，均匀分布用 allkeys-random。（来源：Redis_快看看这 40 道面试题.pdf.txt，\n约第 6-7 页；阿里面试.pdf.txt，约第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q428", "number": 428, "title": "各种内存淘汰策略应该如何选择？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 175, "page_end": 175, "answer_original": "选择淘汰策略要看数据访问分布和业务定位。如果数据呈现幂律分布（一小部分热点数据被高\n频访问，大部分很少访问），推荐使用 allkeys-lru，它把最近最少使用的键淘汰，能很好保\n住热点。如果所有数据访问频率差不多（平等分布），用 allkeys-random 即可。volatile-\nlru/ttl/random 只在“既当缓存又做持久化存储、且希望只淘汰带过期时间的键”时使用，\n一般不推荐，因为可能误淘汰仍需要的持久数据。noeviction 则会直接对写命令报错，基本\n没人用。多数纯缓存场景直接 allkeys-lru。配置示例：maxmemory 4gb、maxmemory-\npolicy allkeys-lru。务必设置 maxmemory，否则达到系统内存上限会被 OS 触发 OOM，\n写命令也会失败。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 6-7 页；阿里面\n试.pdf.txt，约第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q429", "number": 429, "title": "Redis 的回收进程是如何工作的？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 175, "page_end": 175, "answer_original": "当客户端执行新命令产生新数据、Redis 检查内存使用量超过 maxmemory 限制时，就会按\n照设定的淘汰策略回收内存。具体流程是：每个命令执行前/后都会检查内存，若超出上限，\n则根据策略（如 LRU）挑选并删除部分键，直到内存回到限制以下；之后新命令继续执行。\n如此循环，Redis 就在“达到内存边界—回收—回到边界以下”之间不断穿越。需要注意，如\n果一个命令本身会产生大量内存占用（例如把两个大集合的交集结果保存到一个新 key），其\n执行过程中内存可能瞬间越过上限，回收动作会在后续命令触发。因此回收不是后台独立进\n程，而是镶嵌在命令执行链路中的被动行为，理解这一点有助于排查“偶发写失败/延迟”问\n题。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 10 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q430", "number": 430, "title": "当 Redis 内存用完（达到上限）会发生什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 175, "page_end": 176, "answer_original": "当 Redis 达到 maxmemory 上限时，行为取决于是否配置了淘汰策略：如果策略是\nnoeviction（默认），所有写命令会返回错误信息，但读命令仍可正常返回，此时服务处于\n“只能读不能写”的半瘫痪状态；如果配置了如 allkeys-lru 等淘汰策略，Redis 会在写入新\n数据前主动驱逐旧数据（冲刷掉旧内容），从而继续接受写入，相当于把 Redis 当缓存使\n用。需要警惕的是，若完全没设 maxmemory，Redis 会一直吃内存直到耗尽系统内存，被\n操作系统 OOM Killer 干掉，造成整体不可用。因此线上必须设置 maxmemory 并配合合适\n的淘汰策略；同时监控内存水位和 evicted_keys 指标，避免频繁淘汰导致的命中率下降。\n（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 10 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q431", "number": 431, "title": "什么是缓存穿透，如何解决这个问题？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 176, "page_end": 176, "answer_original": "缓存穿透是指查询一个根本不存在的 key（数据库和缓存都没有），导致缓存完全不起作用，\n请求每次都直接穿透到数据库；当恶意或异常流量大量请求这种不存在的 key 时，数据库会\n因瞬时高压力而挂掉。解决方案主要有两种：第一，使用布隆过滤器（Bloom Filter），在访\n问缓存/数据库前用足够大的 bitmap 记录所有可能存在的合法 key，不存在的 key 直接被拦\n截，不落到 DB；第二，即使 DB 也没查到值，也把空结果（null）写进缓存，并设置一个较\n短的过期时间，这样短期内相同请求会被缓存挡住。注意空值缓存要设短 TTL 并考虑数据一\n致性，防止后期真实数据写入后长期读不到。两者可结合使用，布隆过滤器防绝大多数，空值\n缓存兜底。（来源：阿里面试.pdf.txt，约第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q432", "number": 432, "title": "什么是缓存雪崩，有哪些应对方案？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 176, "page_end": 176, "answer_original": "缓存雪崩是指大量 key 在同一时刻集中失效（例如设置了相同的过期时间），瞬间所有请求\n都击穿缓存打到数据库，造成 DB 请求量骤增、压力暴增，甚至引起系统雪崩式崩溃。它与穿\n透的区别在于：雪崩针对的是“原本存在但同时过期”的热点 key。应对方案：第一，给缓存\n过期时间加上随机值（如基础 30 分钟 + 随机 0~300 秒），让过期时间打散，避免集体失\n效；第二，采用限流算法（计数器、滑动窗口、令牌桶等）限制打到 DB 的流量；第三，对热\n点数据使用分布式锁或互斥重建，保证同一 key 同时只有一个线程去查 DB 并回填缓存；第\n四，对极热点 key 做永不过期或逻辑过期+异步刷新。多级缓存和熔断降级也能提升整体韧\n性。（来源：阿里面试.pdf.txt，约第 25 页；Redis_快看看这 40 道面试题.pdf.txt，约第 13\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q433", "number": 433, "title": "什么是缓存击穿，它和缓存雪崩有什么区别？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 176, "page_end": 177, "answer_original": "缓存击穿是指某一个极热点 key（如爆款商品、首页头条）在过期的瞬间，恰好有大量并发请\n求同时访问它，此时缓存已失效，所有并发请求瞬间穿透到数据库去重建缓存，给 DB 造成巨\n大压力。它与雪崩的区别在于范围：雪崩是“大量 key 同时失效”引发的集体穿透；击穿是\n“单个热点 key 失效”引发的集中冲击，影响面更小但瞬时压力同样可观。解决思路围绕\n“避免并发重建”：可以给热点 key 设置逻辑过期（不真正 expire，业务自己判断过期后异\n步刷新）或永不过期；也可以在重建缓存时加互斥锁（如 Redis 分布式锁），保证同一时刻\n只有一个线程查 DB 并回填，其余线程等待或读旧值。把击穿理解为“雪崩的单 key 特例”\n更容易记忆。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 13 页；阿里面试.pdf.txt，\n约第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q434", "number": 434, "title": "什么是布隆过滤器，它的基本原理是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 177, "page_end": 177, "answer_original": "布隆过滤器（Bloom Filter）是一种空间效率极高的概率型数据结构，用于判断“一个元素是\n否可能存在于集合中”。原理是：使用一个位数组（bitmap）和多个独立的哈希函数；添加\n元素时，用各哈希函数算出若干位置，把对应 bit 置 1；查询元素时，同样哈希得到若干位\n置，只要有一个 bit 为 0，就说明该元素一定不存在；若全部为 1，则说明“可能存在”（有\n误判可能）。它的核心优势是用极小的空间（几个 bit 即可代表一个元素）完成海量数据的存\n在性判断，且不保存原数据，隐私性好。在缓存场景中，用足够大的 bitmap 记录所有可能访\n问的合法 key，请求到来先过布隆过滤器，不存在的 key 直接拦截，从而防住缓存穿透。它\n是以“允许极小误判”换取“极低空间与极快查询”的典型权衡结构。（来源：阿里面\n试.pdf.txt，约第 9 页、第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q435", "number": 435, "title": "布隆过滤器在解决缓存穿透中是如何应用的？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 177, "page_end": 177, "answer_original": "在缓存穿透防护中，布隆过滤器充当“第一道闸门”。系统初始化时，把所有合法、可能存在\n的 key（如有效商品 ID 集合）通过多个哈希函数映射到一个足够大的 bitmap 中。当请求查\n询某个 key 时，先问布隆过滤器：若返回“不存在”（bitmap 中有 0），说明该 key 必然非\n法或从未存在，直接拒绝请求，根本不会打到缓存和数据库，从而拦截绝大多数穿透流量；若\n返回“可能存在”，才继续走“查缓存→未命中查 DB→回填缓存”的正常流程。这样即便攻\n击者用海量随机不存在的 key 轰炸，也被过滤器挡在门外。需定期把新增合法 key 同步进过\n滤器，并在数据删除时考虑使用支持删除的变体（如 Counting Bloom Filter）或重建过滤\n器，否则已删数据会一直被误判存在。（来源：阿里面试.pdf.txt，约第 25 页、第 9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q436", "number": 436, "title": "布隆过滤器有什么优缺点，为什么会有误判？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 177, "page_end": 178, "answer_original": "布隆过滤器的优点：空间占用极小（每个元素只需几个 bit）、查询和插入时间复杂度都为\nO(k)（k 为哈希函数个数）、不存储原数据、保密性好，非常适合海量数据的存在性过滤。缺\n点主要有二：第一，存在误判（假阳性），即可能把“不存在的元素”误判为“存在”，但不\n会把存在的误判为不存在；第二，标准布隆过滤器不支持删除元素（因为多个元素可能共享同\n一个 bit，直接置 0 会影响其他元素）。误判的根因是哈希冲突：不同元素经哈希后映射到相\n同的 bit 位都被置 1，查询时无法区分是自身还是他人置的。降低误判率的方法是增大\nbitmap 长度、选用更多且独立的哈希函数；对删除需求可改用 Counting Bloom Filter 或布\n谷鸟过滤器（Cuckoo Filter）。（来源：阿里面试.pdf.txt，约第 9 页、第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q437", "number": 437, "title": "使用 Redis 做缓存时，如何保证缓存与数据库的数据一致性？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 178, "page_end": 178, "answer_original": "缓存与数据库一致性是经典难题，核心思路是“以数据库为权威，缓存作为加速副本”。最常\n用的是 Cache-Aside（旁路缓存）模式：读时先查缓存，命中直接返回，未命中查 DB 并回\n填缓存；写时先更新数据库，再删除缓存（而非更新缓存），让下一次读自动加载最新值，这\n叫“延迟删除”。之所以删缓存而不是更新缓存，是因为并发写场景下更新缓存容易产生脏数\n据，且避免无效缓存计算。要注意“先更新 DB 再删缓存”仍可能因极端时序出现不一致，可\n引入延迟双删（更新 DB 后删一次，间隔短时间再删一次）或基于 binlog（如 Canal）异步\n淘汰缓存来增强最终一致性。总之追求的是最终一致，而非强一致，并需配合过期时间兜底防\n脏数据长期驻留。（来源：阿里面试.pdf.txt，缓存章节，约第 2 页、第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q438", "number": 438, "title": "什么是 Cache-Aside 模式，读写分别怎么处理？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 178, "page_end": 178, "answer_original": "Cache-Aside（旁路缓存）是工程中最经典的缓存使用模式。读路径：先读缓存，命中则直接\n返回；未命中则读数据库，把结果写入缓存后再返回。写路径：先更新数据库，再使缓存失效\n（删除对应 key），而不是去主动更新缓存内容；下次读请求会自然把最新数据加载回缓存。\n这样做的好处是逻辑简单、缓存只在被访问时才构建，且避免了并发写导致的缓存脏数据。关\n键点：写入顺序必须是“先 DB 后删缓存”，且删除动作要可靠（失败要重试）。该模式保证\n的是最终一致性——在“删缓存”到“下次回填”的窗口内，可能有请求读到旧值，但只要\n业务能接受短暂不一致，配合 key 的过期时间兜底，就能在性能与一致性间取得平衡。（来\n源：阿里面试.pdf.txt，缓存章节，约第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q439", "number": 439, "title": "更新数据时，应该更新缓存还是删除缓存，为什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 178, "page_end": 179, "answer_original": "普遍建议“删除缓存”而非“更新缓存”，理由有三：第一，并发写场景下，若两个写请求\nA、B 先后更新 DB，但更新缓存的顺序反过来（B 先写缓存），会导致缓存里是旧值、DB 是\n新值，产生脏数据；而删除缓存不存在顺序问题，下次读自然回填最新。第二，有些缓存值是\n复杂计算结果（如排行榜、聚合查询），立即重算成本高，不如等真正需要时再懒加载。第\n三，删除缓存实现简单、容错好。当然删除也有风险：若删缓存成功但更新 DB 失败，会导致\n缓存无、DB 旧，需在事务或补偿机制中保证两者至少最终一致。综合结论是“先更新数据\n库，再删除缓存”，并配合重试/延时双删来降低不一致窗口。这是面试中区分熟手与新手的\n细节。（来源：阿里面试.pdf.txt，缓存章节，约第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q440", "number": 440, "title": "缓存与数据库一致性有哪些常见“坑”需要规避？", "group_id": "data", "group": "数据库与缓存", "topic_id": "cache", "topic": "缓存异常与数据库一致性", "learning_priority": "核心", "page_start": 179, "page_end": 179, "answer_original": "常见坑有：①顺序错误，先删缓存再更新 DB，期间读请求会把旧值回填，造成长期脏数据，\n正确做法是先更新 DB 再删缓存；②删除缓存失败未重试，导致缓存一直是旧值，需要可靠删\n除+补偿重试；③并发回填空窗，读未命中→查 DB→写缓存之间被其他写打断，可加分布式\n锁或延迟双删缓解；④把缓存当强一致存储，实际上 Redis 与 DB 只能保证最终一致，关键\n业务要以 DB 为准并容忍短暂不一致；⑤缓存过期时间设得过长，脏数据难以自愈，应给所有\n缓存设合理 TTL 兜底；⑥双写（同时写 DB 和缓存）在并发下极易产生不一致，能删则删；\n⑦忽略主从延迟，DB 主从同步延迟期间读从库可能拿到旧值并回填缓存。理解这些坑才能在\n设计缓存层时规避数据错乱。（来源：阿里面试.pdf.txt，缓存章节）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q441", "number": 441, "title": "什么是分布式锁，为什么在分布式系统中需要它？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-lock", "topic": "Redis/ZooKeeper 分布式锁", "learning_priority": "核心", "page_start": 179, "page_end": 179, "answer_original": "分布式锁是控制分布式系统中多个进程/服务实例对共享资源互斥访问的机制。在单机多线程\n里我们用 synchronized、ReentrantLock 即可，但系统拆分到多台机器后，本地锁只对单\nJVM 有效，无法跨进程协调。例如多个服务实例同时做“插入/更新同一条数据”或“扣减同\n一库存”时，需要一把第三方提供的全局锁（如 Redis 或 ZooKeeper）来保证同一时刻只有\n一个实例能执行临界区，其余获取锁失败。它把多线程并发锁的思路延伸到多系统（分布式）\n场景。好的分布式锁应满足：互斥性、不会死锁（有超时）、容错（部分节点挂了仍能工\n作）、尽量可重入。它常用于防重复提交、防超卖、定时任务幂等执行等。选择实现时要权衡\n性能与可靠性。（来源：阿里面试.pdf.txt，约第 7 页）", "version_review_recommended": false, "related_question_ids": ["Q442", "Q443", "Q444", "Q445", "Q446", "Q658", "Q659", "Q660"]}, {"id": "Q442", "number": 442, "title": "如何用 Redis 实现一个基本的分布式锁，核心命令是什么？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-lock", "topic": "Redis/ZooKeeper 分布式锁", "learning_priority": "核心", "page_start": 179, "page_end": 180, "answer_original": "最经典的做法是用 SETNX（set if not exists）争抢锁：某个客户端执行 SETNX lock_key\nunique_value，若返回 1 表示抢到锁，之后用 EXPIRE 给锁设过期时间防止忘记释放；执行\n完业务后 DEL 释放锁。但 SETNX 与 EXPIRE 分两步执行有风险：若在 SETNX 之后、EXPIRE\n之前进程崩溃或重启维护，锁就永远没有过期时间，造成死锁。更优方案是用一条原子的 SET\n命令同时设置值和过期时间（如 SET lock_key unique_value NX PX 30000），把“抢锁+\n设超时”合成一步，避免中间崩溃导致锁无法释放。释放锁时要先判断 value 是否为自己持有\n再删除（用 Lua 脚本保证原子），防止误删别人的锁。这样才是一个健壮的 Redis 分布式锁\n雏形。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 13 页；阿里面试.pdf.txt，约第 7\n页）", "version_review_recommended": false, "related_question_ids": ["Q441", "Q443", "Q444", "Q445", "Q446", "Q658", "Q659", "Q660"]}, {"id": "Q443", "number": 443, "title": "SETNX 加锁后设置过期时间之间崩溃会有什么问题，怎么解决？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-lock", "topic": "Redis/ZooKeeper 分布式锁", "learning_priority": "核心", "page_start": 180, "page_end": 180, "answer_original": "传统写法先 SETNX 抢锁、再 EXPIRE 设过期时间，两步之间不是原子的。如果客户端在\nSETNX 成功之后、执行 EXPIRE 之前发生进程崩溃、宕机或运维重启，那么这把锁就没有任\n何过期时间，会永远留在 Redis 中无法自动释放，其他实例永远抢不到锁，形成死锁，相关\n业务彻底卡死。解决办法是把它合并成一条原子命令：Redis 的 SET 指令支持额外参数，可\n以用 SET key value NX PX milliseconds 一次性完成“不存在才设置”和“设置毫秒级过期\n时间”，彻底消除两步之间的时间窗口。此外释放锁也不能简单 DEL，需先校验 value（用随\n机唯一值标识自己）再删除，并用 Lua 脚本保证“校验+删除”原子，避免误删他人锁。（来\n源：Redis_快看看这 40 道面试题.pdf.txt，约第 13 页）", "version_review_recommended": false, "related_question_ids": ["Q441", "Q442", "Q444", "Q445", "Q446", "Q658", "Q659", "Q660"]}, {"id": "Q444", "number": 444, "title": "分布式锁如果业务执行时间超过锁过期时间怎么办？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-lock", "topic": "Redis/ZooKeeper 分布式锁", "learning_priority": "核心", "page_start": 180, "page_end": 180, "answer_original": "这是分布式锁的典型难题：若锁设置了 30 秒过期，但业务执行了 60 秒，锁提前释放，其他\n客户端会抢到锁进入临界区，破坏互斥性。常见应对有三种：第一，合理评估业务耗时，把过\n期时间设得足够长，但过长又会增加死锁风险，治标不治本；第二，引入“看门狗”（watch\ndog）自动续期机制，客户端获取锁后启动一个后台定时任务，只要还持有锁就周期性地延长\n过期时间（如每隔 1/3 过期时间续一次），业务结束再取消续期，Redisson 即采用此方案；\n第三，缩短临界区、把长事务拆小，减少持锁时间。无论哪种，都要配合“唯一 value + Lua\n原子释放”，避免续期/释放错乱。本质上要在“不死锁”和“不提前失效”之间找平衡。\n（来源：阿里面试.pdf.txt，约第 7 页；Redis_快看看这 40 道面试题.pdf.txt，约第 13 页）", "version_review_recommended": false, "related_question_ids": ["Q441", "Q442", "Q443", "Q445", "Q446", "Q658", "Q659", "Q660"]}, {"id": "Q445", "number": 445, "title": "分布式锁的可重入性如何设计？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-lock", "topic": "Redis/ZooKeeper 分布式锁", "learning_priority": "核心", "page_start": 180, "page_end": 181, "answer_original": "可重入锁指同一线程/客户端在持有锁期间，能再次获取同一把锁而不被自己阻塞。基于\nRedis 实现可重入，可在锁的 value 中存放持有者标识和重入计数：获取锁时，若发现锁已存\n在且 value 中的持有者就是自己，则把重入计数加 1 并返回成功；释放锁时若计数大于 1 则\n减 1，等于 1 才真正删除。这套“判断归属+计数增减”需用 Lua 脚本保证原子性，否则并发\n下计数会乱。Redisson 的 RLock 正是用 Hash 结构（key=锁名，field=客户端 ID，value=\n重入次数）配合 Lua 实现可重入，并配合看门狗续期。设计可重入锁时要防止计数溢出和误\n删，释放次数必须和获取次数严格配对，并在客户端宕机时由过期时间兜底清理，避免重入计\n数永久残留。（来源：阿里面试.pdf.txt，约第 7 页）", "version_review_recommended": false, "related_question_ids": ["Q441", "Q442", "Q443", "Q444", "Q446", "Q658", "Q659", "Q660"]}, {"id": "Q446", "number": 446, "title": "使用 Redis 分布式锁有哪些注意事项？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-lock", "topic": "Redis/ZooKeeper 分布式锁", "learning_priority": "核心", "page_start": 181, "page_end": 181, "answer_original": "使用 Redis 分布式锁需注意：①加锁与设过期必须原子（SET NX PX），避免崩溃死锁；②\n释放锁必须校验持有者并用 Lua 原子删除，防止误删他人锁；③必须设置过期时间兜底，防\n止客户端崩溃后锁永不释放；④业务耗时要小于锁过期时间，或引入看门狗自动续期，避免锁\n提前失效破坏互斥；⑤主从架构下，若 master 刚加锁就宕机且锁未同步到 slave，slave 被\n提升后新客户端可能再抢到锁，造成双持锁，极端一致性场景需用 Redlock 或多副本确认；\n⑥锁粒度要细（如按订单 ID 而非全局），避免无谓串行化影响并发；⑦不要用于超长临界\n区，否则锁竞争和续期压力大会拖累系统。把这些细节讲清楚，是分布式锁面试的高分点。\n（来源：阿里面试.pdf.txt，约第 7 页；Redis_快看看这 40 道面试题.pdf.txt，约第 13 页）", "version_review_recommended": false, "related_question_ids": ["Q441", "Q442", "Q443", "Q444", "Q445", "Q658", "Q659", "Q660"]}, {"id": "Q447", "number": 447, "title": "请说明 Redis 的主从同步（复制）机制原理？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 181, "page_end": 181, "answer_original": "Redis 支持主从同步、从从同步。首次同步时，从节点向主节点发起全量复制：主节点做一次\nbgsave 生成 RDB 快照，同时把快照期间的写操作记录到内存 buffer；RDB 生成后全量发送\n给从节点，从节点接收并加载 RDB 到内存；加载完成后，主节点再把 buffer 中累积的增量写\n命令同步给从节点重放，从而完成初次同步。此后进入命令传播阶段，主节点每执行一个写命\n令就异步发送给从节点保持数据一致。若从节点短暂断连，重连后可基于已同步的偏移量做部\n分重同步（PSYNC），只补传断连期间的增量，避免每次都全量。主从复制是异步的，因此\n从节点数据可能略有延迟，且主节点故障需靠哨兵或人工提升从节点。（来源：Redis_快看看\n这 40 道面试题.pdf.txt，约第 7 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q448", "number": 448, "title": "主从复制中全量同步和增量同步分别是怎样的？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 181, "page_end": 182, "answer_original": "全量同步发生在从节点初次连接或无法做部分重同步时：主节点 bgsave 生成 RDB，期间写\n命令进 buffer，RDB 传给从节点加载入内存，随后主节点把 buffer 中增量命令发给从节点重\n放，达到一致。增量同步（部分重同步）依赖复制偏移量（replication offset）和复制积压缓\n冲区（repl_backlog）：从节点断连重连后，把自身 offset 发给主节点，若主节点积压缓冲\n区里还保留着对应偏移之后的数据，就只把这段增量补发给从节点，免去全量开销。因此生产\n上应保持主从网络稳定、适当调大 repl_backlog_size，让短暂抖动后能快速部分重同步。理\n解 offset 与 backlog 是排查主从延迟、频繁全量同步的关键。（来源：Redis_快看看这 40\n道面试题.pdf.txt，约第 7 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q449", "number": 449, "title": "Redis 哨兵（Sentinel）的作用是什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 182, "page_end": 182, "answer_original": "Redis Sentinel 着眼于高可用，解决主从架构下主节点故障时的自动 failover 问题。它持续\n监控 master 和 slave 的健康状态，当认定 master 客观下线（多个哨兵达成共识）时，哨兵\n会自动从 slave 中选举出一个提升为新的 master，并让其他 slave 改为复制新 master，同时\n把新地址通知给客户端，整个过程无需人工介入。哨兵本身也应部署为多个（奇数个）节点以\n避免自身单点。此外哨兵还提供通知、配置提供等能力。需要注意哨兵只负责“主从切换的高\n可用”，不解决数据分片扩展问题；分片要交给 Redis Cluster。面试中常把 Sentinel（高可\n用）与 Cluster（扩展性）并列，二者职责清晰、可叠加使用。（来源：Redis_快看看这 40\n道面试题.pdf.txt，约第 7 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q450", "number": 450, "title": "Redis Cluster 集群的原理是什么，解决什么问题？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 182, "page_end": 182, "answer_original": "Redis Cluster 着眼于扩展性，解决单机内存不足和写性能瓶颈的问题。它采用去中心化的分\n片方案：没有使用一致性哈希，而是引入“哈希槽（hash slot）”概念，整个集群共有\n16384 个槽，每个 key 通过 CRC16 校验后对 16384 取模，决定落到哪个槽，集群每个节点\n负责一部分槽。这样数据和请求被均匀分散到多台机器，突破单机内存上限。节点间通过\ngossip 协议互通状态，客户端可直接路由到正确节点。Cluster 同时借助主从复制模型保证高\n可用：每个主节点配若干从节点，主挂了从节点顶上。因此 Cluster 既做数据分片（扩展），\n又通过主从+故障转移保证可用，是大规模 Redis 部署的主流方案。（来源：Redis_快看看这\n40 道面试题.pdf.txt，约第 7-8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q451", "number": 451, "title": "请解释 Redis 集群的哈希槽（hash slot）概念及数量？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 182, "page_end": 182, "answer_original": "Redis 集群没有采用一致性哈希，而是引入哈希槽机制：整个集群预分配 16384 个哈希槽\n（slot）。当客户端写入一个 key 时，Redis 先对 key 做 CRC16 校验得到一个 16 位哈希\n值，再对 16384 取模，结果即为该 key 所属的槽编号（0~16383）。集群中的每个主节点负\n责其中一部分槽，例如三主节点可各负责约 5461 个槽。这样做的好处是：槽数量固定且远小\n于节点数，节点增减时只需迁移部分槽（而非所有数据），迁移粒度可控、配置清晰；客户端\n和节点都能快速计算 key 路由。相比一致性哈希，哈希槽在扩容缩容、数据均衡上更直观可\n控。理解 16384 这个魔数是 Cluster 面试题的常见考点。（来源：Redis_快看看这 40 道面\n试题.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q452", "number": 452, "title": "Redis 集群的主从复制模型是怎样的，为什么需要它？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 183, "page_end": 183, "answer_original": "为了使集群在部分节点失败或多数节点无法通信时仍然可用，Redis Cluster 采用了主从复制\n模型：每个主节点（master）都配置 N-1 个复制品（从节点 slave），数据由主节点写入并\n异步复制到从节点。当某个主节点宕机，其对应的从节点会被集群提升为新的主节点继续提供\n服务，从而保证该槽位的数据仍可访问。如果没有主从模型，任意主节点失败都会导致它负责\n的槽不可写、甚至整个相关范围不可用。因此主从复制是集群高可用的基石，与分片扩展同样\n重要。需要注意的是，集群复制是异步的，极端情况下失败切换瞬间可能丢失少量未复制的\n写；同时主从数量要权衡资源成本与可用性等级。（来源：Redis_快看看这 40 道面试\n题.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q453", "number": 453, "title": "什么情况下 Redis 集群会整体不可用？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 183, "page_end": 183, "answer_original": "在没有复制模型（即每个槽只有一个主节点、无 slave 备份）的情况下，如果某个持有槽的节\n点失败，该节点负责的槽就处于缺失状态，集群会认为这部分范围不可用。例如有 A、B、C\n三个节点的集群，若节点 B 失败，由于缺少 5501-11000 这个范围的槽，整个集群会因这部\n分槽不可用而整体不可用。引入主从复制后，B 的从节点会顶上，集群仍可服务。此外，若集\n群中超过半数的主节点同时不可达（无法满足大多数投票），集群也会停止接受写入以保数据\n安全。所以“节点失败是否导致整体不可用”取决于该节点是否有从节点接管其槽，以及失败\n节点数量是否超过集群容错阈值。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 7 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q454", "number": 454, "title": "Redis 集群最大节点个数和数据库选择有什么限制？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ha", "topic": "Redis 复制、哨兵与集群", "learning_priority": "核心", "page_start": 183, "page_end": 183, "answer_original": "Redis 集群的最大节点个数是 16384 个，这个数字与哈希槽总数一致，因为每个节点至少要\n负责一个槽，槽数上限也就限制了节点上限。实际生产中很少部署这么多节点，通常按数据量\n和 QPS 规划（如 3~几百个节点）。关于数据库选择，Redis 单机支持多数据库（默认\n0~15），但集群模式下目前无法做数据库选择，所有数据都默认放在 0 号数据库，因此使用\nCluster 时不应依赖 SELECT 切换库。另外集群节点间的数据复制是异步复制，写操作存在特\n定条件下丢失的可能。理解这些限制有助于在迁移到集群架构时避免踩坑（如多库依赖、跨槽\n事务不支持等）。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 9 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q455", "number": 455, "title": "什么是大 key，它有什么危害，如何排查和处理？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 183, "page_end": 184, "answer_original": "大 key 指占用内存过大或元素过多的 key，如一个存了百万成员的 Set/Hash/List，或一个几\nMB 的 String。危害显著：第一，删除或过期清理大 key 时会阻塞单线程的 Redis，造成命\n令卡顿甚至超时；第二，网络传输大 key 占用带宽，拖慢其他请求；第三，扩容迁移、主从\n全量同步时大 key 会拉长同步时间；第四，易触发客户端/服务端内存与超时问题。排查可用\nredis-cli --bigkeys 扫描、或用 DEBUG OBJECT、MEMORY USAGE 评估单个 key，线上也\n可用 scan 配合类型判断。处理思路：拆分大 key（如按分片把大 Hash 拆成多个小\nHash）、压缩 value、设置较短过期、对集合类做分批删除（hscan/zscan 逐步删）避免一\n次性 del 阻塞。32 位实例尤其要注意紧凑编码以省内存。（来源：Redis_快看看这 40 道面\n试题.pdf.txt，约第 9-10 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q456", "number": 456, "title": "什么是热 key，如何发现并解决热 key 问题？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 184, "page_end": 184, "answer_original": "热 key 指被超高并发集中访问的个别 key（如爆款商品、秒杀库存、热点新闻），它会把单\n台 Redis 节点的 CPU 和网络打满，成为性能瓶颈甚至引发雪崩式连锁反应。发现手段：①服\n务端监控（Redis 的 hotkey 相关命令/代理层统计）；②客户端埋点统计访问频次；③proxy\n或 SDK 层面聚合上报。解决思路：第一，本地多级缓存，在应用层用 Caffeine/Guava 缓存\n热 key，大幅削减对 Redis 的访问；第二，热 key 打散，把单个热 key 拆成多个子 key（如\nkey_1…key_N）分散到不同请求，再汇总；第三，对热 key 做逻辑过期/永不过期+后台异步\n刷新，避免重建冲击；第四，集群架构下确保热 key 路由均衡、必要时专用节点承载。核心\n是把“单点极热”转化为“多点分摊”。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第\n9-10 页；阿里面试.pdf.txt，约第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q457", "number": 457, "title": "Redis 的 Pipeline 有什么好处，为什么要用它？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 184, "page_end": 184, "answer_original": "Pipeline（管道）用于批量执行命令，它把多条命令一次性发给 Redis 服务端，再一次性读取\n全部响应，从而把原本 N 次网络往返（RTT）压缩成 1 次，显著降低网络延迟带来的开销，\n提升吞吐量。它适合批量读写、批量预热缓存、批量灌数据等场景。使用 redis-benchmark\n压测时会发现，影响 Redis QPS 峰值的重要因素之一正是 pipeline 批次指令的数目——批次\n越大、往返越少，吞吐越高。但前提是 pipeline 中的多条指令之间不能有因果相关性（因为\n命令是批量发出、按顺序返回，不能“等上一条结果再决定下一条”）。另外，Pipeline 并不\n是事务，不保证原子性，也不像 MULTI/EXEC 那样隔离，只是网络层面的优化。掌握好它能\n在高并发批量操作场景带来数倍性能提升。（来源：Redis_快看看这 40 道面试题.pdf.txt，约\n第 7 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q458", "number": 458, "title": "怎么理解 Redis 事务，它和关系型数据库事务有何不同？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 184, "page_end": 185, "answer_original": "Redis 事务是一组命令的隔离执行单元：通过 MULTI 开启事务，之后输入的命令会被序列\n化、按顺序放入队列，并不会立即执行；直到 EXEC 才一次性、按顺序地执行队列中所有命\n令，期间不会被其他客户端的请求打断（隔离性）。事务中的命令要么全部执行、要么全部不\n执行（原子性的体现，但不支持回滚——某条命令失败不影响其余命令继续执行）。这与关\n系型数据库的事务（ACID、可回滚、隔离级别）不同：Redis 没有 undo 日志，命令执行失\n败不会回滚已执行的命令；也不保证一致性约束。另外 Redis 提供 WATCH 命令实现乐观\n锁：WATCH 某 key 后，若 EXEC 前该 key 被其他客户端修改，则事务被中止（类似\nCAS）。因此 Redis 事务更轻量，常用于“批量命令 + 乐观锁防并发修改”的场景。（来\n源：Redis_快看看这 40 道面试题.pdf.txt，约第 9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q459", "number": 459, "title": "Redis 事务相关命令有哪些，分别起什么作用？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 185, "page_end": 185, "answer_original": "Redis 事务的核心命令有四个：①MULTI：标记事务开始，之后输入的命令进入队列而非立即\n执行；②EXEC：执行事务队列中的所有命令，按顺序返回各命令结果；③DISCARD：取消事\n务，清空已入队的命令，放弃执行；④WATCH：在 MULTI 之前对一个或多个 key 加乐观锁\n监视，若这些 key 在 EXEC 前被其他客户端修改，则本次 EXEC 会失败（返回 nil），实现\n“先检查后执行”的并发安全。典型用法：WATCH key → MULTI → 入队若干命令 →\nEXEC，若 WATCH 的 key 中途被改则整个事务不执行，客户端可重试。需要注意 Redis 事\n务不支持回滚（某条命令类型错误会在入队时即报错，运行期错误则跳过继续），理解这一点\n才能在生产中正确使用事务而非误以为它像数据库事务一样安全。（来源：Redis_快看看这\n40 道面试题.pdf.txt，约第 9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q460", "number": 460, "title": "如何设置 Redis key 的过期时间和永久有效？", "group_id": "data", "group": "数据库与
