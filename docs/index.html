", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 43, "page_end": 43, "answer_original": "Java 语言的主要特点可以归纳为以下几点：一是简单易学，语法接近 C++但去除了指针、多\n继承等复杂特性，并提供了丰富的类库；二是面向对象，这是 Java 最重要的特性，封装、继\n承、多态让程序耦合度更低、内聚性更高；三是平台无关性，依靠 JVM 实现“一次编写、到\n处运行”，JVM 是跨平台的根本；四是可靠安全，提供了自动内存管理、强类型检查、异常\n处理和类加载器安全机制；五是原生支持多线程，语言层面内置了 Thread 类与同步机制。此\n外 Java 还具备健壮性、分布式支持等特征。这些特点使 Java 非常适合企业级应用开发。（来\n源：Java 面试题_面经_八股文.pdf.txt，约第 1 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q002", "number": 2, "title": "面向对象和面向过程有什么区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 43, "page_end": 43, "answer_original": "面向过程是把解决问题的步骤一步步分析出来，用函数实现每个步骤，使用时依次调用，性能\n较高，因此单片机、嵌入式开发常采用面向过程。面向对象则是把问题域拆解为若干对象，建\n立对象的目的是描述事物在解决问题过程中发生的行为，而非完成某个步骤。面向对象具备封\n装、继承、多态三大特性，因此易维护、易复用、易扩展，能够设计出低耦合、高内聚的系\n统。但相对而言，面向对象由于存在方法调用、对象管理等开销，在纯性能上比面向过程略\n低。面试中常借此考察候选人对两种程序设计范式的理解与设计取舍能力。（来源：Java 面\n试题_面经_八股文.pdf.txt，约第 1 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q003", "number": 3, "title": "Java 的八种基本数据类型及其封装类、大小、默认值分别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 43, "page_end": 43, "answer_original": "Java 共有八种基本数据类型：byte 占 1 字节、默认 0、封装类 Byte；short 占 2 字节、默认\n0、封装类 Short；int 占 4 字节、默认 0、封装类 Integer；long 占 8 字节、默认 0L、封装\n类 Long；float 占 4 字节、默认 0.0f、封装类 Float；double 占 8 字节、默认 0.0d、封装类\nDouble；char 占 2 字节、默认\\u0000、封装类 Character；boolean 理论上表示真假、默\n认 false、封装类 Boolean。基本类型在声明时由系统直接分配栈上空间，而封装类是引用类\n型，默认值为 null，能够区分未赋值（null）与数值 0 的情形，这也是实际开发中使用包装类\n的重要原因。（来源：Java 面试题_面经_八股文.pdf.txt，约第 1 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q004", "number": 4, "title": "int 和 Integer 有什么区别？为什么有了 int 还需要 Integer？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 43, "page_end": 44, "answer_original": "int 是 Java 的基本数据类型，Integer 是 int 的封装类（引用类型）。int 默认值是 0，而\nInteger 默认值是 null，因此 Integer 能够区分“值为 0”与“尚未指向任何对象（null）”\n两种不同语义，在数据库映射、表单参数等场景非常重要。基本数据类型声明时系统自动分配\n空间，而引用类型声明只分配引用空间，必须实例化后才能真正存储数据。数组也是引用类\n型，把一个数组赋值给另一个数组只是复制引用，通过任一数组的修改在另一数组中都可见。\n包装类还提供了诸如 parseInt、valueOf 等工具方法，并支持泛型（泛型不可使用基本类\n型），所以二者缺一不可。（来源：Java 面试题_面经_八股文.pdf.txt，约第 2 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q005", "number": 5, "title": "boolean 类型在 Java 虚拟机中到底占几个字节？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 44, "page_end": 44, "answer_original": "这个问题容易被忽略。虽然 Java 定义了 boolean 类型，但 JVM 并没有为 boolean 提供专用\n的字节码指令，编译后 boolean 表达式会统一用 int 类型代替；boolean 数组则被编码成\nbyte 数组，每个元素占 8 位（1 字节）。因此结论是：boolean 单独使用时作为 int 处理，占\n4 字节，在数组中占 1 字节。之所以用 int，是因为对 32 位 CPU 而言一次处理 32 位数据存\n取效率最高（这里指 CPU 硬件层面，不是 32/64 位操作系统层面）。理解这一点有助于在内\n存敏感场景下正确估算对象与数组的内存占用。（来源：Java 面试题_面经_八股文.pdf.txt，\n约第 2 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q006", "number": 6, "title": "Java 标识符的命名规则和命名规范分别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 44, "page_end": 44, "answer_original": "标识符是程序中由开发者自定义的内容，如类名、方法名、变量名。硬性命名规则有三条：标\n识符可以包含英文字母、数字 0-9、美元符$和下划线_；不能以数字开头；不能是 Java 关键\n字。命名规范虽非强制但务必遵守：类名采用大驼峰式（首字母大写、后续每个单词首字母大\n写）；变量名和方法名采用小驼峰式（首字母小写、后续单词首字母大写）。良好的命名能够\n显著提升代码可读性与团队协作效率，也是面试中考察编码素养的基础点。规范与规则的区别\n在于前者违反会告警，后者违反会导致编译错误。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 2 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q007", "number": 7, "title": "instanceof 关键字的作用是什么？使用时有哪些注意事项？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 44, "page_end": 44, "answer_original": "instanceof 是 Java 中的双目运算符，用来测试一个对象是否为某个类（或接口）的实例，用\n法为“boolean result = obj instanceof Class”。当 obj 是该 Class 的对象、其直接/间接子\n类对象，或该接口实现类的对象时，结果都返回 true，否则返回 false。需要注意三点：编译\n器会检查 obj 能否转换成右边的类型，若确定不能转换则直接编译报错；若类型无法确定则编\n译通过、运行时判定；obj 必须是引用类型，基本类型如 int 不能做 instanceof 运算，否则编\n译不通过；当 obj 为 null 时，instanceof 一律返回 false，不会抛异常。它常用于类型判断与\n安全向下转型前的防御性检查。（来源：Java 面试题_面经_八股文.pdf.txt，约第 2 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q008", "number": 8, "title": "什么是 Java 的自动装箱与拆箱？其底层分别调用什么方法？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 45, "page_end": 45, "answer_original": "自动装箱指编译器在需要对象的地方，自动把基本数据类型转换为对应的包装器类型，例如\n“Integer i = 10;”底层调用的是 Integer.valueOf(int)。自动拆箱则相反，把包装器类型自\n动转换为基本数据类型，例如“int n = i;”底层调用的是 Integer 的 intValue()方法。在 Java\nSE5 之前，必须显式写“new Integer(10)”来创建包装对象，SE5 之后引入自动装箱，代码\n更简洁。需要特别留意的是，自动装箱发生在编译期，是编译器的语法糖，运行时仍然走\nvalueOf/intValue，理解这一点对排查包装类型比较、性能及 NullPointerException 问题非\n常关键。（来源：Java 面试题_面经_八股文.pdf.txt，约第 3 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q009", "number": 9, "title": "为什么 Integer i1=100 与 i2=100 相等，而 i3=200 与 i4=200 不相等？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 45, "page_end": 45, "answer_original": "这是因为 Integer 内部维护了整数缓存 IntegerCache。查看 valueOf 源码可知：当数值在-\n128 到 127（high 默认 127，可由属性配置）之间时，valueOf 会直接返回\nIntegerCache.cache 数组中已存在的对象引用；超出该范围才会 new 一个新的 Integer 对\n象。因此 i1=100 和 i2=100 都取自同一缓存对象，==比较地址相等，结果为 true；而\ni3=200、i4=200 超出缓存范围，分别 new 了不同对象，地址不同，==比较结果为 false。\n这一特性提醒我们：对包装类型比较内容必须始终使用 equals，而非==，否则会在边界值附\n近出现隐蔽的逻辑错误。（来源：Java 面试题_面经_八股文.pdf.txt，约第 3 至 4 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q010", "number": 10, "title": "Double 等浮点包装类型为什么不像 Integer 那样有缓存？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 45, "page_end": 45, "answer_original": "考察 Integer 的面试题中，如果把 Integer 换成 Double，无论数值是否在常用范围，\ni1==i2、i3==i4 都会返回 false。原因在于整型数值在某一范围内的个数是有限的、可枚举\n的，因此可以预先创建缓存对象复用；而浮点数（包括 float、double）在实数轴上是无限、\n不可数的，无法通过有限缓存覆盖所有可能值，所以 Double、Float 的 valueOf 不会做缓\n存，每次都会创建新对象。这说明自动装箱缓存仅适用于“值有限且常用”的整型，理解其背\n后的数学与实现差异，能避免把 Integer 的缓存经验错误套用到浮点类型上。（来源：Java\n面试题_面经_八股文.pdf.txt，约第 4 至 5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q011", "number": 11, "title": "面向对象三大特性是什么？请简要说明各自作用。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 45, "page_end": 46, "answer_original": "面向对象三大特性是封装、继承、多态。封装是把对象的属性和行为包装在类中，隐藏内部实\n现细节，仅通过公开接口与外界交互，从而提高安全性与可维护性；继承允许子类复用父类的\n属性和方法，并在此基础上扩展，建立类之间的“is-a”关系，提升代码复用；多态指同一操\n作作用于不同对象可以产生不同行为，通常通过父类引用指向子类对象、配合方法重写实现，\n使程序具有良好扩展性，符合“开闭原则”。正是这三大特性，使面向对象系统相比面向过程\n更易维护、易复用、易扩展，能够构建出低耦合、高内聚的软件架构。（来源：Java 面试题_\n面经_八股文.pdf.txt，约第 1 至 2 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q012", "number": 12, "title": "方法重载（Overload）和重写（Override）有什么区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 46, "page_end": 46, "answer_original": "重写发生在父子类之间：子类重新实现父类已有的方法，要求方法名、参数列表、返回类型\n（除返回类型是父类返回类型的子类外）完全相同，并对方法体进行修改；访问修饰符不能比\n父类更严格（public>protected>default>private），且不能抛出比父类更宽泛的新检查异\n常。重载发生在同一个类中：同名方法只要参数列表不同（类型、个数、顺序）即构成重载，\n与返回值类型无关，无法以返回类型区分重载。简言之，重写是“子类改父类行为”，体现多\n态；重载是“同名不同参”，体现编译期多态。面试中常要求结合代码指出二者差异与约束。\n（来源：Java 面试题_面经_八股文.pdf.txt，约第 6 至 7 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q013", "number": 13, "title": "重写（Override）时有哪些具体约束需要注意？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 46, "page_end": 46, "answer_original": "重写需满足以下约束：第一，必须发生在父类与子类之间；第二，方法名、参数列表、返回类\n型（除子类返回类型是父类返回类型的子类）必须相同；第三，子类重写方法的访问修饰符限\n制不能大于（即不能比）被重写方法，例如父类是 protected，子类只能是 protected 或\npublic，不能是 private；第四，重写方法不能抛出新的、比被重写方法声明更宽泛的检查异\n常。此外，被 private、final、static 修饰的方法不能被重写（static 属于隐藏而非重写）；构\n造方法不能被重写。满足这些约束才能保证多态行为正确，否则会触发编译错误或在运行时出\n现非预期调用。（来源：Java 面试题_面经_八股文.pdf.txt，约第 6 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q014", "number": 14, "title": "== 和 equals 的区别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 46, "page_end": 46, "answer_original": "“==”比较的是变量（栈）内存中存放的对象在堆中的内存地址，用来判断两个引用是否指\n向同一个对象，本质上是地址（指针）比较；它要求两端操作数是同一类型（可为父子类）才\n能编译通过；对于具体数值比较（如 int a=10、long b=10L、double c=10.0），由于都指\n向值为 10 的常量，==结果为 true。equals 用来比较“两个对象的内容是否相等”，所有类\n都继承自 Object，若未重写 equals，调用的仍是 Object 的实现，而 Object 的 equals 返回\n的就是==的判断。因此是否“内容相等”取决于是否重写了 equals（如 String 重写了）。\n结论：比较对象内容一律用 equals，且常量写在前面以防空指针。（来源：Java 面试题_面经\n_八股文.pdf.txt，约第 7 至 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q015", "number": 15, "title": "为什么比较字符串相等推荐用 equals，并且把常量写在前面？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 46, "page_end": 47, "answer_original": "因为“==”比较的是对象地址而非内容，对引用类型往往得到 false，无法正确判断字符串内\n容是否相同；而 equals 才是内容比较。阿里巴巴代码规范也建议只使用 equals，其插件还能\n自动识别并把老代码中的“==”替换为 equals。把常量写在前面（如\"abc\".equals(str)）是\n为了避免空指针：若写成 str.equals(\"abc\")，当 str 为 null 时会抛出\nNullPointerException；反过来常量在前即使 str 为 null 也会安全返回 false，不会中断程\n序。这是防御性编程的良好习惯，也是面试中常见的代码规范与健壮性考点。（来源：Java\n面试题_面经_八股文.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": ["Q073"]}, {"id": "Q016", "number": 16, "title": "hashCode 的作用是什么？它和 equals 有怎样的关系？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 47, "page_end": 47, "answer_original": "Java 集合分 List（有序可重复）和 Set（无序不重复）两类。当向 Set 插入元素时，需要判断\n该元素是否已存在，若只用 equals 逐一比较，元素很多时效率极低。哈希算法将集合划分成\n若干存储区域，每个对象可算出哈希码，直接定位到应存放的物理位置：若该位置为空，直接\n存入，无需比较；若已有元素，再调用 equals 比较，相同则不存，不同则散列到其他地址，\n这样 equals 调用次数降到一两次。所以 hashCode 可理解为根据对象内存地址换算出的一个\n值，它把查找效率从 O(n)降到接近 O(1)。注意：hashCode 相同不代表对象相等，必须再经\nequals 确认。（来源：Java 面试题_面经_八股文.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q017", "number": 17, "title": "为什么重写 equals 时必须同时重写 hashCode？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 47, "page_end": 47, "answer_original": "因为 Java 规范约定：如果两个对象 equals 比较为 true，那么它们的 hashCode 必须相等；\n反之 hashCode 相等的两个对象 equals 不一定为 true（发生哈希冲突）。若只重写 equals\n而不重写 hashCode，两个内容相同但 hashCode 不同的对象会被当作不同元素存入\nHashSet 或作为不同 key 存入 HashMap，导致去重、查找逻辑彻底失效，违背了集合的语\n义。因此，只要重写了 equals，就必须用相同的一组字段来重写 hashCode，保证“相等对\n象必有相等哈希码”。在 HashMap、HashSet 等基于哈希的容器中，正是先比 hashCode\n再比 equals 来完成定位与判重。（来源：Java 面试题_面经_八股文.pdf.txt，约第 8 页；\nJAVA 面试知识点总结.pdf.txt，约第 48 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q018", "number": 18, "title": "两个不相等的对象有可能产生相同的 hashCode 吗？哈希冲突如何处理？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 47, "page_end": 48, "answer_original": "完全有可能。当发生哈希冲突时，两个不相等的对象就会拥有相同的 hashCode 值。处理哈\n希冲突常见有三种方式：一是拉链法，每个哈希表节点带有 next 指针，多个节点用 next 构成\n单向链表，分配到同一索引的节点用链表存储，Java 中 HashMap 即采用数组+链表+红黑\n树；二是开放定址法，一旦发生冲突就去寻找下一个空的散列地址，只要表足够大总能找到；\n三是再哈希（双哈希），准备多个不同哈希函数，发生冲突时依次用第二个、第三个函数计算\n地址，直到无冲突。理解这些机制有助于解释 HashMap 的性能表现与求模定位原理。（来\n源：Java 面试题_面经_八股文.pdf.txt，约第 10 至 11 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q019", "number": 19, "title": "String、StringBuffer、StringBuilder 三者的区别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 48, "page_end": 48, "answer_original": "String 是只读字符串，底层是 private final char value[]，引用指向的字符串不可改变，任何\n修改（如拼接）都会生成新的 String 对象，频繁操作会产生大量临时对象。StringBuffer 和\nStringBuilder 都继承自 AbstractStringBuilder，底层是可变的 char[]，适合频繁字符串操\n作。二者区别在于线程安全：StringBuffer 对方法加了同步锁（或调用处加锁），是线程安全\n的；StringBuilder 没有加锁，是非线程安全的，但单线程下性能更高。实际开发中，单线程\n拼接用 StringBuilder，多线程拼接用 StringBuffer，常量拼接可用 String。这也是面试字符\n串章节的高频考点。（来源：Java 面试题_面经_八股文.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q020", "number": 20, "title": "为什么 String 被设计为不可变（immutable）？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 48, "page_end": 48, "answer_original": "从源码看 String 内部是“private final char value[]”，value 用 final 修饰且为私有，外部无\n法修改其引用与内容，因此 String 一经创建就不可变。这样设计有诸多好处：一是字符串常\n量池可以安全地复用相同字面量，节省内存；二是不可变对象天生线程安全，可被多个线程共\n享而无需同步；三是其哈希值只需计算一次并可缓存，适合作为 HashMap 的 key；四是安全\n性更好，例如作为类加载、网络连接、数据库 URL 参数时不会被篡改。代价是每次“修改”\n都会产生新对象，所以在循环拼接等高频场景应使用 StringBuilder/StringBuffer 替代。（来\n源：Java 面试题_面经_八股文.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q021", "number": 21, "title": "字符串使用“+”号拼接时，底层究竟发生了什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 48, "page_end": 48, "answer_original": "由于 String 是不可变的，每次使用“+”拼接都会在堆上隐式 new 一个 StringBuilder 对\n象，调用其 append 方法把原字符串与后面的字符拼接，最后通过 toString 生成新的 String\n对象。这意味着在循环中用“+”拼接字符串会反复创建大量 StringBuilder 和 String 对象，\n造成严重的性能问题与内存压力。因此，对于动态、频繁的字符串拼接，应该显式使用\nStringBuilder（或线程安全场景用 StringBuffer）的 append 方法，避免无谓的对象创建。\n编译器对少量字面量拼接会做优化（如编译期常量折叠），但变量拼接仍需谨慎。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 8 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q022", "number": 22, "title": "什么是字符串常量池？new String(\"abc\")会创建几个对象？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 48, "page_end": 49, "answer_original": "字符串常量池（String Pool）是 JVM 为了复用字符串字面量而在方法区/堆中维护的一块区\n域，字面量“abc”在首次出现时会被放入池中，后续相同字面量直接复用。对于“new\nString(\"abc\")”：若常量池尚无“abc”，则先在池中创建一个“abc”字面量对象，再在堆\n上 new 一个 String 对象，共 2 个；若常量池已存在“abc”，则只在堆上 new 一个 String\n对象，共 1 个。通过 intern()方法可把字符串显式入池，返回池中已有引用。理解常量池与堆\n中对象的关系，是解释字符串==比较结果、内存占用与 intern 机制的关键。（来源：JAVA\n面试知识点总结.pdf.txt，约第 23 页；Java 面试题_面经_八股文.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q023", "number": 23, "title": "RuntimeException 和 CheckedException（受检异常）有什么区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 49, "page_end": 49, "answer_original": "RuntimeException 及其子类称为运行时异常，Java 编译器不会检查它，即便代码中既未用\nthrows 声明也未用 try-catch 捕获，仍能编译通过，典型如除零 ArithmeticException、数组\n越界 IndexOutOfBoundsException、空指针 NullPointerException 等，通常由糟糕的编程\n引起，应当通过修正代码而非捕获来规避。CheckedException 指 Exception 中除\nRuntimeException 外的子类（如 IOException、SQLException、\nCloneNotSupportedException），编译器会强制检查，必须显式捕获或声明抛出，否则编\n译失败，这类异常通常是可以恢复的、由外部环境因素（文件不存在、网络异常）引起的。二\n者区分了“程序错误”与“可预期外部异常”。（来源：Java 面试题_面经_八股文.pdf.txt，\n约第 13 至 14 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q024", "number": 24, "title": "Error 和 Exception 有什么不同？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 49, "page_end": 49, "answer_original": "Error 与 Exception 同为 Throwable 的子类，但性质不同。Error 表示严重的系统级错误和资\n源耗尽（如 OutOfMemoryError、ThreadDeath、VirtualMachineError），这类问题超出\n了程序可处理的范围，编译器同样不检查，程序本身无法修复，通常只能告知用户并尽量安全\n终止。Exception 则表示程序本身可以捕获并处理的异常，分为运行时异常与受检异常。一句\n话概括：Error 是“不可恢复的系统故障”，Exception 是“可恢复的异常”。面试中通过对\n比二者，可考察候选人对 JVM 内存模型与异常处理边界的理解。（来源：Java 面试题_面经_\n八股文.pdf.txt，约第 13 至 14 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q025", "number": 25, "title": "try-catch-finally 中，如果 try 里有 return，finally 还会执行吗？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 49, "page_end": 50, "answer_original": "会执行，而且 finally 的执行早于 try 里的 return 返回。具体结论是：第一，无论是否出现异\n常，finally 块中的代码都会执行；第二，即便 try 或 catch 中有 return，finally 仍然会执行；\n第三，finally 是在 return 后面表达式运算之后执行的——此时返回值已经被保存起来，\nfinally 中对变量的修改不会改变已保存的返回值，函数返回值在 finally 执行前就已确定；第\n四，finally 中最好不要包含 return，否则程序会提前退出，返回值将是 finally 中 return 的值\n而非 try/catch 中保存的返回值，容易造成逻辑混乱。这是面试中极易踩坑的细节题。（来\n源：Java 面试题_面经_八股文.pdf.txt，约第 13 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q026", "number": 26, "title": "throw 和 throws 的区别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 50, "page_end": 50, "answer_original": "二者都用于异常处理，但位置和功能不同。位置不同：throws 用在函数声明上，后面跟异常\n类，可以跟多个；throw 用在函数内部，后面跟具体的异常对象。功能不同：throws 用来声\n明异常，告知调用者该功能可能出现的问题，便于预先处理；throw 则抛出具体的问题对象，\n执行到 throw 时功能即结束并跳转至调用者。此外，throws 表示“可能出现异常的一种可能\n性”，并不一定会发生；而 throw 是“确实抛出了某种异常对象”，执行 throw 则一定抛出\n了异常。二者都是消极处理异常的方式，真正的处理仍由上层调用者完成。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 102 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q027", "number": 27, "title": "Java 中异常处理有哪些方式？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 50, "page_end": 50, "answer_original": "异常处理主要有两种方式：一是遇到问题不进行具体处理，而是继续抛给调用者，有 throw\n（在函数内抛出具体异常对象）、throws（在函数声明上声明异常）以及系统自动抛异常三\n种形式；二是使用 try-catch 捕获异常做针对性处理。处理异常的核心目的是：当方法无法按\n正常途径完成任务时，抛出一个封装错误信息的对象并立即退出该方法，同时不返回任何值，\n把控制权交给异常处理器，使调用链上的其他代码不至于在错误状态下继续执行。良好的异常\n处理应当捕获具体异常、避免吞掉异常、并在合适层级处理，而不是一律向上抛。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 101 至 102 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q028", "number": 28, "title": "请列举常见的几种 RuntimeException（运行时异常）。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 50, "page_end": 50, "answer_original": "常见的运行时异常包括：ClassCastException（类转换异常，如错误强制类型转换）、\nIndexOutOfBoundsException（数组或集合下标越界）、NullPointerException（空指针异\n常，调用 null 对象的方法或属性）、ArrayStoreException（数据存储异常，向数组存入类型\n不一致的元素）、BufferOverflowException（缓冲区溢出）等。这些异常都属于\nRuntimeException 子类，编译器不强制捕获，往往暴露了代码中的逻辑缺陷。面试中要求能\n手写出几种，并能说明它们通常的触发场景，由此判断是否真正理解“unchecked\nexception”与代码健壮性之间的关系。（来源：Java 面试题_面经_八股文.pdf.txt，约第 14\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q029", "number": 29, "title": "fail-fast（快速失败）和 fail-safe（安全失败）有什么区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 51, "page_end": 51, "answer_original": "fail-fast 是 Java 集合的一种错误检测机制，java.util 包下集合（如 ArrayList、HashMap）\n的迭代器在遍历时若发现其他线程对集合结构做了修改（增删），会立即抛出\nConcurrentModificationException。fail-safe 指 java.util.concurrent 包下的集合（如\nConcurrentHashMap）在遍历时基于原数据副本进行，即使数据被修改也不会抛异常，体现\n的是弱一致性，以效率与一致性权衡换取并发安全。简言之：fail-fast“一经发现并发修改立\n即报错”，适合单线程或需严格一致性的场景；fail-safe“容忍并发修改不报错”，适合高并\n发场景，但可能读到旧数据。（来源：Java 面试题_面经_八股文.pdf.txt，约第 14 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q030", "number": 30, "title": "什么是 Java 反射机制？它的核心概念是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 51, "page_end": 51, "answer_original": "反射机制是指在运行状态中，对于任意一个类，都能够知道这个类所有的属性和方法；对于任\n意一个对象，都能够调用它的任意一个方法。这种动态获取类信息以及动态调用对象方法的功\n能，称为 Java 语言的反射机制。从动态语言角度看，Java 属于“半动态语言”。反射的核心\n类是 Class，它代表运行时加载到 JVM 中的类或接口信息；借助 Class 可以获取 Field（成员\n变量）、Method（方法）、Constructor（构造方法）等，并在运行期动态操作它们，而不\n需要在编译期就确定具体类型。反射是很多框架（如 Spring、Hibernate）的基础。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 103 页；Java 面试题_面经_八股文.pdf.txt，约第 19\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q031", "number": 31, "title": "反射一般应用在哪些场合？请举例说明。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 51, "page_end": 51, "answer_original": "反射最典型的应用场景是“编译时类型与运行时类型不一致，需要在运行期动态发现对象真实\n信息”。例如代码“Person p = new Student();”编译时类型为 Person，运行时类型为\nStudent，若需调用 Student 特有方法就必须用反射。外部传入的对象编译时类型是\nObject，但程序需要调用其运行时类型的方法，也只能靠反射。具体落地案例：JDBC 加载驱\n动“Class.forName(\"com.mysql.jdbc.Driver\")”就是反射；Hibernate、Struts、Spring 等\n框架大量使用反射实现对象实例化、依赖注入与 ORM 映射。框架之所以能解耦，正是因为反\n射把“写死的逻辑”变成了“运行时动态决定”。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 19 页；JAVA 面试知识点总结.pdf.txt，约第 103 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q032", "number": 32, "title": "获取一个类的 Class 对象有哪几种方式？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 51, "page_end": 52, "answer_original": "获取 Class 对象常见有几种方式：一是调用 Class.forName(\"类的全路径\")静态方法，最安全\n且性能较好，最常用，如加载 JDBC 驱动；二是调用某个类的 class 属性，如“Class clazz =\nPerson.class”，编译期即可确定；三是调用某个对象的 getClass()方法，如“Class clazz =\np.getClass()”；四是对于基本类型的包装类，可调用其 TYPE 属性获得对应基本类型的 Class\n对象（如 Integer.TYPE 即 int.class）。获得 Class 对象是使用反射的第一步，也是反射的核\n心入口，后续的方法、字段、构造器都围绕它展开。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 19 页；JAVA 面试知识点总结.pdf.txt，约第 104 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q033", "number": 33, "title": "Java 反射 API 的核心类有哪些？各自负责什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 52, "page_end": 52, "answer_original": "反射 API 用来生成 JVM 中类、接口或对象的信息，核心类位于 java.lang.reflect 包：Class\n类是所有反射的入口，可获取类的属性、方法、构造器等信息；Field 类表示类的成员变量，\n可获取和动态设置属性值；Method 类表示类的方法，可获取方法信息或动态执行方法\n（invoke）；Constructor 类表示类的构造方法，用于动态创建实例。除此之外还有\nModifier、Array、Proxy 等辅助类。整个反射流程是：先拿到 Class 对象，再通过 Class 获\n取 Field/Method/Constructor，最后用这些对象去读取或修改成员、调用方法、创建实例，\n从而实现运行期的动态操控。（来源：JAVA 面试知识点总结.pdf.txt，约第 104 页；Java 面\n试题_面经_八股文.pdf.txt，约第 19 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q034", "number": 34, "title": "反射有哪些优点和缺点？如何优化反射性能？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 52, "page_end": 52, "answer_original": "反射的优点是提高了程序的灵活性和扩展性，能够在运行期动态获取类实例、与动态编译结\n合，框架因此得以解耦。缺点主要有二：一是性能较低，需要解析字节码、在内存中解析对\n象；二是相对不安全，可突破封装访问私有属性和方法。优化手段包括：调用\nsetAccessible(true)关闭 JDK 安全检查以提升速度；多次创建同一类实例时利用缓存（如\nConstructor 缓存）会快很多；使用 ReflectASM 等基于字节码生成的工具类进一步加速。面\n试中通常会追问“反射慢在哪”，答案是 Method.invoke 涉及参数装箱、方法查找与安全校\n验等额外开销。（来源：Java 面试题_面经_八股文.pdf.txt，约第 19 至 20 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q035", "number": 35, "title": "为什么说 Java 是“半动态语言”？动态语言指什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 52, "page_end": 53, "answer_original": "动态语言指程序在运行时可以改变其结构，例如可以动态引入新函数、删除已有函数，\nJavaScript、Ruby、Python 都属于动态语言，而 C、C++不属于。从反射角度看，Java 虽\n然能在运行期通过反射获取类的属性和方法、动态调用对象方法，但无法像动态语言那样在运\n行期动态增删类的方法与结构，因此被称为“半动态语言”。反射赋予了 Java 一定程度的动\n态能力（如插件化、框架扩展），但语法与类型系统在编译期仍然静态确定，这正是“半动\n态”的准确含义，也是 Java 兼顾安全与灵活的体现。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 103 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q036", "number": 36, "title": "什么是 Java 注解（Annotation）？基本概念是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 53, "page_end": 53, "answer_original": "注解是 Java 提供的一种为程序元素（类、方法、变量等）关联信息与元数据（metadata）的\n途径。注解本质上是一个接口，程序可以通过反射获取指定元素的 Annotation 对象，再从中\n读取元数据。它不改变程序的逻辑执行，而是为编译器、框架或工具提供额外信息，例如标记\n作用、配置参数、生成文档等。常见的@Override、@Deprecated、@SuppressWarnings\n就是 JDK 内置注解。注解与注释不同，注释仅给人看，而注解可被程序在编译期或运行期读\n取并据此做出处理，是现代框架（如 Spring、MyBatis）实现声明式编程的基石。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 106 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q037", "number": 37, "title": "Java 的四种标准元注解分别是什么？各自作用？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 53, "page_end": 53, "answer_original": "Java 5.0 定义了四种标准元注解，用来注解其他注解：@Target 说明 Annotation 所修饰的\n对象范围，可用于包、类型（类/接口/枚举/注解）、类型成员（方法、构造器、字段）、方\n法参数和本地变量；@Retention 定义注解被保留的时间长短，取值 SOURCE（源文件保\n留）、CLASS（class 文件保留）、RUNTIME（运行时保留，最常用，可被反射读取）；\n@Documented 表示该注解应被 javadoc 等工具文档化，作为公共 API 的一部分；\n@Inherited 表示若注解修饰某个类，则该注解会遗传给其子类。掌握这四个元注解，才能正\n确定义并控制自定义注解的生命周期与作用目标。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 106 至 107 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q038", "number": 38, "title": "@Target 和@Retention 这两个元注解分别控制什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 53, "page_end": 53, "answer_original": "@Target 用于限定被它修饰的注解能够作用在什么程序元素上，例如可指定为 FIELD（字\n段）、METHOD（方法）、TYPE（类/接口）等，使注解的修饰目标更明确，避免误用。\n@Retention 用于定义注解被保留的时间长短，描述其生命周期，取值有三种：SOURCE 表\n示只在源文件中有效，编译后丢弃；CLASS 表示保留到 class 文件但运行时不可见；\nRUNTIME 表示运行时仍保留，可被反射 API 读取，这是自定义注解处理器最常用的级别。二\n者一个管“作用在哪”，一个管“活到什么时候”，是定义注解时最关键的两个元注解。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 106 至 107 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q039", "number": 39, "title": "什么是注解处理器？如何基于反射实现一个注解处理器？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 53, "page_end": 54, "answer_original": "如果没有读取和处理注解的机制，注解就形同注释。注解处理器负责读取注解信息并据此执行\n逻辑。Java SE5 扩展了反射 API，使开发者能快速构造自定义注解处理器。典型实现是：先定\n义注解（如@FruitProvider，指定@Target(FIELD)、@Retention(RUNTIME)）；再在目标\n类字段上使用它；最后编写处理器通过 clazz.getDeclaredFields()遍历字段，用\nfield.isAnnotationPresent(FruitProvider.class)判断、用\nfield.getAnnotation(FruitProvider.class)获取注解对象并读取其元数据（id、name、\naddress 等）进行处理。整个过程依赖反射在运行期读取 RUNTIME 级别注解，是框架自动配\n置的常见模式。（来源：JAVA 面试知识点总结.pdf.txt，约第 107 至 108 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q040", "number": 40, "title": "@Inherited 和@Documented 元注解有什么作用？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 54, "page_end": 54, "answer_original": "@Inherited 是一个标记型元注解，表示“被标注的类型是可被继承的”：如果一个使用了\n@Inherited 的注解修饰了某个 class，那么该注解会自动作用于这个 class 的子类，即子类无\n需显式标注也能“继承”到该注解。@Documented 用于描述其他注解应当作为被标注程序\n成员的公共 API，因此可以被 javadoc 之类的工具文档化，使注解信息出现在生成的 API 文档\n中。二者都属于辅助型元注解：@Inherited 影响注解在类继承体系中的传递性，\n@Documented 影响注解是否进入文档，本身不改变程序运行逻辑。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 106 至 107 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q041", "number": 41, "title": "Java 内部类分为哪几种？各自适用场景是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 54, "page_end": 54, "answer_original": "定义在类内部的类称为内部类，按定义方式分为四种：静态内部类（用 static 修饰，可访问外\n部类所有静态成员，使用“外部类.内部类”实例化，如 HashMap.Entry）；成员内部类（非\n静态，可访问外部类所有成员，但不能定义静态变量/方法，final 除外）；局部内部类（定义\n在方法内部，仅在该方法内使用）；匿名内部类（没有类名，必须继承一个父类或实现一个接\n口，直接用 new 生成对象引用，常用于回调）。内部类能把只在一个地方使用的类隐藏起\n来，增强封装，并能直接访问外围实例，是 Java 表达“紧密关联”结构的重要手段。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 109 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q042", "number": 42, "title": "静态内部类有什么特点？和普通内部类有何不同？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 54, "page_end": 55, "answer_original": "静态内部类是定义在类内部的静态类，特点有：可以访问外部类所有的静态变量和方法（即使\n是 private）；与一般的顶级类一致，可以定义静态变量、方法、构造方法；其他类使用时需\n要“外部类.静态内部类”方式，如“Out.Inner inner = new Out.Inner();”。与成员内部类\n的本质区别在于，静态内部类不持有外部类实例的引用，因此不依赖外部类实例即可创建；而\n成员内部类会隐式持有外部类引用，必须先有外部类实例才能创建。典型应用如 HashMap 中\n的静态内部类 Entry，与外部类关系密切且不依赖外部实例，适合用静态内部类。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 109 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q043", "number": 43, "title": "成员内部类有哪些限制？为什么不能定义静态成员？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 55, "page_end": 55, "answer_original": "成员内部类是定义在类内部的非静态类，它可以访问外部类的所有成员（静态与非静态）。但\n有一个重要限制：成员内部类不能定义静态方法和静态变量（final 修饰的常量除外）。原因\n是成员内部类是非静态的，类初始化时先初始化静态成员；如果允许成员内部类定义静态变\n量，那么这些静态变量的初始化顺序就会与外部类产生歧义（它依赖外部实例又属于类级\n别）。因此语言层面禁止。此外，成员内部类必须依附外部类实例存在，创建时需先有外部类\n对象（out.new Inner()）。理解这点有助于厘清内部类与静态上下文的关系。（来源：JAVA\n面试知识点总结.pdf.txt，约第 110 页）", "version_review_recommended": true, "related_question_ids": [], "correction": {"text": "该限制须限定 Java 版本：Java SE 16 起允许内部类声明静态成员与静态初始化器。原回答未注明版本。", "url": "https://docs.oracle.com/javase/specs/jls/se17/html/jls-8.html#jls-8.1.3", "verified_on": "2026-11-09"}}, {"id": "Q044", "number": 44, "title": "什么是局部内部类和匿名内部类？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 55, "page_end": 55, "answer_original": "局部内部类是定义在方法中的类，适用于某个类只在某一个方法内使用的场景，它只在方法作\n用域内可见，可访问方法的 final 局部变量（及外部类成员）。匿名内部类则没有 class 关键\n字，必须继承一个父类或实现一个接口（且只能继承一个父类或实现一个接口），通过“new\n父类/接口(){...}”直接生成一个对象的引用；常用于事件监听、回调、线程 Runnable 等一次\n性实现。二者的共同点是都隐藏在局部作用域，生命周期受限、封装性强。匿名内部类无法定\n义构造方法（没有类名），若有初始化逻辑需放在实例初始化块中，是简化代码的常用技巧。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 110 至 111 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q045", "number": 45, "title": "什么是 Java 泛型？使用泛型有什么好处？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 55, "page_end": 55, "answer_original": "泛型是 Java SE 1.5 引入的特性，本质是参数化类型，即所操作的数据类型被指定为一个参\n数，在编译期提供类型安全检测机制，能在编译时阻止非法类型。例如写一个排序方法，若不\n用泛型就要为整型、字符串等各写一份，用泛型则可统一处理。以集合为例，泛型的好处是不\n必为每种元素类型定义不同的集合类，更重要的是可以通过规则约束存储的数据类型（如\nList\u003cInteger>只能放 Integer），把运行期类型错误提前到编译期暴露，显著提升代码复用\n率、可读性与类型安全，避免了频繁的类型强制转换与 ClassCastException。（来源：Java\n面试题_面经_八股文.pdf.txt，约第 10 页；JAVA 面试知识点总结.pdf.txt，约第 112 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q046", "number": 46, "title": "泛型方法和泛型类分别如何定义？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 55, "page_end": 56, "answer_original": "泛型方法是在方法声明中加入类型参数，如“public static \u003cE> void printArray(E[]\ninputArray)”，调用时根据传入参数类型由编译器分别处理，也可使用“\u003c? extends T>”\n（表示通配符类型是 T 的子类）和“\u003c? super T>”（表示是 T 的父类）界定边界。泛型类是\n在类名后添加类型参数声明，如“public class Box\u003cT> { private T t; public void add(T\nt){...} public T get(){...} }”，类型参数可有一个或多个，用逗号隔开，被称为类型变量。泛型\n方法可出现在普通类或泛型类中，而泛型类的类型参数作用于整个类。掌握二者是编写通用、\n类型安全工具类与集合的基础。（来源：JAVA 面试知识点总结.pdf.txt，约第 112 至 113\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q047", "number": 47, "title": "什么是泛型的通配符？extends 和 super 有什么区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 56, "page_end": 56, "answer_original": "类型通配符一般用“?”代替具体的类型参数，例如 List\u003c?>在逻辑上是 List\u003cString>、\nList\u003cInteger>等所有具体类型实参 List 的父类，表示“未知类型”。为了限定范围，提供了\n上界和下界：\u003c? extends T>表示该通配符所代表的类型是 T 类型及其子类（上界限定，适合\n“生产者/读取”场景，PECS 原则中的 Producer）；\u003c? super T>表示该通配符所代表的类\n型是 T 类型及其父类（下界限定，适合“消费者/写入”场景）。合理使用通配符与边界，可\n以在保持灵活性的同时保证类型安全，避免无谓的强制转换，是泛型高级用法中的重点。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 112 至 113 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q048", "number": 48, "title": "什么是 Java 的类型擦除（Type Erasure）？会带来什么影响？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 56, "page_end": 56, "answer_original": "Java 的泛型基本只在编译器这一层次实现，生成的字节码中并不包含泛型类型信息。编译时\n加上的类型参数会被编译器“擦除”掉：例如代码中定义的 List\u003cObject>和 List\u003cString>，\n编译之后都会变成 List，JVM 看到的只是裸 List，由泛型附加的类型信息对 JVM 不可见。擦\n除过程是先找到替换类型参数的具体类（一般是 Object，若指定了上界则用上界），再把代\n码中的类型参数全部替换成具体类。正因类型擦除，泛型不能用于基本类型（会被擦成\nObject），运行时无法获取泛型实际类型，也不能创建泛型数组，这些都是面试常问的“泛\n型限制”根源。（来源：JAVA 面试知识点总结.pdf.txt，约第 113 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q049", "number": 49, "title": "什么是 Java 对象序列化？它主要解决什么问题？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 56, "page_end": 57, "answer_original": "序列化是把 Java 对象及其状态保存（持久化）到内存或磁盘，未来再把这些字节重新组装成\n对象的过程。Java 对象通常只在 JVM 运行时存在，生命周期不超过 JVM；但现实中需要在\nJVM 停止后保存指定对象，并在将来重新读取，序列化即为此而生。除了持久化，序列化还\n广泛用于 RMI 远程方法调用、网络传输对象等场景。序列化保存的是对象的“状态”即成员\n变量，不会关注类中的静态变量。Java 序列化 API 提供了一套标准机制，简单易用，是分布\n式、缓存、深拷贝等技术方案的底层支撑。（来源：JAVA 面试知识点总结.pdf.txt，约第 113\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q050", "number": 50, "title": "如何实现 Java 对象的序列化与反序列化？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 57, "page_end": 57, "answer_original": "在 Java 中，只要一个类实现了 java.io.Serializable 接口（它只是一个标记接口，无需实现任\n何方法），该类的对象就可以被序列化。具体读写通过 ObjectOutputStream 和\nObjectInputStream 完成：用 ObjectOutputStream 的 writeObject(obj)把对象写入流，用\nObjectInputStream 的 readObject()读回对象。若想自定义序列化策略，可以在类中增加私\n有的 writeObject 和 readObject 方法，由它们接管默认的序列化逻辑。此外\nserialVersionUID（private static final long）用于标识类的版本，虚拟机是否允许反序列化\n不仅看类路径与功能代码，还要看双方 serialVersionUID 是否一致，版本不一致会抛\nInvalidClassException。（来源：JAVA 面试知识点总结.pdf.txt，约第 113 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q051", "number": 51, "title": "transient 关键字在序列化中起什么作用？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 57, "page_end": 57, "answer_original": "在成员变量声明前加 transient 关键字，可以阻止该变量被序列化到流/文件中。反序列化后，\ntransient 变量会被设为对应类型的初始值（如 int 为 0，对象引用为 null）。典型应用场景是\n数据安全：例如对象中有密码字符串等敏感字段，在序列化前不希望它明文落盘，可加\ntransient 阻止其默认序列化，再在 writeObject/readObject 中做加密/解密处理，只有持有\n密钥的客户端才能还原。需要注意：transient 只影响默认的 JVM 序列化机制，若完全自定义\nwriteObject 逻辑仍可能手动写出该字段。它与 static 的区别是，static 变量本身就不会被序\n列化。（来源：JAVA 面试知识点总结.pdf.txt，约第 114 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q052", "number": 52, "title": "为什么说序列化不保存静态变量？父类对象如何一起序列化？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 57, "page_end": 57, "answer_original": "序列化保存的是对象的状态（即成员变量的值），而静态变量属于类而非对象，存在于方法\n区，因此序列化不会关注也不会保存类的静态变量，反序列化后静态变量取当前类的静态值而\n非持久化的旧值。关于父子类：若希望父类对象也一并序列化，必须让父类也实现\nSerializable 接口，否则父类字段在序列化时会被忽略、反序列化后无法恢复。因此设计可序\n列化类时，要确认其整个继承链上需要持久化的部分都实现了 Serializable。这也是为什么很\n多基类（如某些 DTO 父类）会特意实现 Serializable 以保证子类可正确序列化。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 113 至 114 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q053", "number": 53, "title": "Java 中创建对象有哪几种方式？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 57, "page_end": 58, "answer_original": "Java 中创建对象主要有四种方式：一是使用 new 关键字直接创建新对象，最常见；二是通过\n反射机制，包括 Class.newInstance()或 Constructor.newInstance()，由框架大量使用；三\n是采用 clone 机制，通过实现 Cloneable 接口并调用 clone()方法复制已有对象；四是通过反\n序列化机制，把已序列化的字节流恢复成 Java 对象。这四种方式中，new 和反射是主动创\n建，clone 是复制已有对象，反序列化则是从持久化或网络数据中重建对象。理解这些方式有\n助于厘清对象生命周期、框架实例化原理以及深浅拷贝与序列化的内在联系。（来源：Java\n面试题_面经_八股文.pdf.txt，约第 11 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q054", "number": 54, "title": "Object 类有哪些重要的方法？请列举并说明。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 58, "page_end": 58, "answer_original": "Object 是所有 Java 类的根类，其重要方法有：equals(Object)用于比较对象内容（默认即\n==）；hashCode()返回对象哈希码，配合 equals 使用；toString()返回对象字符串表示，打\n印对象时默认调用；getClass()返回运行时 Class 对象，反射的入口；clone()创建并返回对象\n副本，需实现 Cloneable；finalize()在对象被 GC 回收前调用，可释放资源（但低效不安全，\n已不推荐使用）；wait()、wait(long)、notify()、notifyAll()用于线程间通信与同步，必须在\n同步块中调用。这些方法构成了 Java 对象行为的基础，重写 equals 务必同时重写 hashCode\n是面试经典要求。（来源：Java 面试题_面经_八股文.pdf.txt，约第 7 至 8 页、第 36 至 37\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q055", "number": 55, "title": "wait()、notify()、notifyAll()的作用与区别是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 58, "page_end": 58, "answer_original": "这三个方法都定义在 Object 类中，用于线程间等待/唤醒协作。wait()使当前线程释放对象\n锁，进入该对象的等待池；notify()随机唤醒一个在该对象上等待的线程，使其重新竞争锁；\nnotifyAll()唤醒所有在该对象上等待的线程，让它们重新进入锁争夺队列。区别在于唤醒范\n围：notify 只唤醒一个，若被唤醒的线程无法正确处理条件可能导致死锁，因此要求用法精\n确；notifyAll 唤醒全部，更安全但开销更大。最佳实践是用 while 循环而非 if 包裹 wait()，\n在 wait 前后都检查条件，不满足则继续 wait，以防虚假唤醒与竞态条件。（来源：Java 面试\n题_面经_八股文.pdf.txt，约第 36 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q056", "number": 56, "title": "为什么 wait、notify、notifyAll 定义在 Object 类中，而不是 Thread 类？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 58, "page_end": 59, "answer_original": "原因在于 Java 的锁是对象级别的，而非线程级别的——每个 Java 对象都自带一个锁（监视\n器），线程通过获取某个对象的锁来进行同步。wait/notify/notifyAll 都是“锁级别”的操\n作：调用 wait 的线程要释放的是“当前对象”的锁并进入该对象的等待池，notify 唤醒的也\n是“该对象”上等待的线程。如果把这些方法放在 Thread 类里，线程正在等待“哪个对象的\n锁”就不明确了。把它们定义在 Object 中，语义上就是“针对某个具体对象的监视器进行等\n待与唤醒”，与对象锁模型天然契合，因此必须属于 Object 而非 Thread。（来源：Java 面\n试题_面经_八股文.pdf.txt，约第 37 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q057", "number": 57, "title": "为什么 wait 和 notify 必须在同步块（synchronized）中调用？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 59, "page_end": 59, "answer_original": "因为只有在调用线程已经拥有某个对象的独占锁时，才能调用该对象的 wait()、notify()、\nnotifyAll()方法，否则代码会抛出 IllegalMonitorStateException。具体来说：wait()会强制\n当前线程释放对象锁，所以在调用 wait()前必须已获得该对象锁，即必须处于该对象的同步方\n法或同步代码块中；同理，调用 notify()/notifyAll()前也必须持有该对象锁。另一个重要原因\n是为了避免 wait 和 notify 之间产生竞态条件：若没有同步保护，可能出现“线程先 wait、但\nnotify 已错过”的丢失唤醒问题。因此同步块既是语法要求，也是正确协作的保证。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 37 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q058", "number": 58, "title": "sleep()和 wait()有什么区别？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 59, "page_end": 59, "answer_original": "二者都让线程暂停，但区别明显：一是所属类不同，sleep()属于 Thread 类，wait()属于\nObject 类；二是锁的处理不同，sleep()调用时线程会让出 CPU、暂停指定时间，但一直保持\n对象监视器锁（不释放锁），时间到后自动恢复；而 wait()调用时线程会放弃对象锁，进入该\n对象的等待池，只有其他线程对该对象调用 notify()/notifyAll()后，本线程才重新进入锁池去\n竞争锁；三是使用位置不同，wait()必须在同步块中调用，sleep()可在任何地方调用；四是\nsleep()通常用于暂停执行，wait()用于线程间通信与条件等待。（来源：Java 面试题_面经_八\n股文.pdf.txt，约第 36 页）", "version_review_recommended": false, "related_question_ids": ["Q143"]}, {"id": "Q059", "number": 59, "title": "Java 中的 clone 机制是什么？浅拷贝和深拷贝有何区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 59, "page_end": 59, "answer_original": "clone()方法来自 Object，实现 Cloneable 接口后调用 clone()可复制对象，是创建对象的方\n式之一。浅拷贝：创建一个新对象，将当前对象的非静态字段复制过去；若字段是值类型则复\n制值，若是引用类型则只复制引用而不复制引用指向的对象，因此原对象与副本共享同一个引\n用对象。深拷贝：不仅复制对象本身，还把对象所引用的所有对象也一并复制，原对象与副本\n完全独立。实际中可通过逐层 clone、序列化（把对象写入流再读出，得到全新深复制）等方\n式实现深拷贝。选择浅拷贝还是深拷贝，取决于是否需要副本间相互独立，避免“改一处影响\n另一处”。（来源：Java 面试题_面经_八股文.pdf.txt，约第 11 页；JAVA 面试知识点总\n结.pdf.txt，约第 114 至 115 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q060", "number": 60, "title": "finalize()方法有什么作用？为什么现在不推荐依赖它？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "reflection", "topic": "异常、反射与注解", "learning_priority": "核心", "page_start": 59, "page_end": 60, "answer_original": "finalize()定义在 Object 中，在对象被垃圾回收器回收之前由 JVM 调用一次，理论上可用于\n释放非 Java 资源（如关闭文件句柄）。但实践中 finalize 存在严重问题：一是调用时机不确\n定，对象何时被回收不可控，导致资源迟迟不释放；二是性能差，会拖慢 GC；三是不安全，\n可能使对象“复活”引发混乱。因此官方与现代 Java（如 Java 9 起标记@Deprecated）都\n不推荐使用。更好的替代方案是使用虚引用（PhantomReference）配合\nReferenceQueue，在对象销毁前做资源清理，或在 try-with-resources 中显式关闭资源。\n面试中常借此考察对 GC 与资源管理的理解。（来源：Java 面试题_面经_八股文.pdf.txt，约\n第 10 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q061", "number": 61, "title": "final 关键字有哪些常见用法？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 60, "page_end": 60, "answer_original": "final 在 Java 中常见用法有五点：被 final 修饰的类不可以被继承（如 String）；被 final 修饰\n的方法不可以被子类重写；被 final 修饰的变量（常量）不可以被改变，若修饰引用类型则表\n示引用不可变，但引用指向的内容可变；被 final 修饰的方法，JVM 会尝试将其内联以提升运\n行效率；被 final 修饰的常量会在编译阶段存入常量池。此外还有内存可见性维度的保证：构\n造函数内对 final 域的写入，与把该对象引用赋值给变量这两个操作之间不能重排序；初次读\n取含 final 域的对象引用与初次读该 final 域之间也不能重排序。这些特性保证了 final 字段在\n并发下的安全发布。（来源：Java 面试题_面经_八股文.pdf.txt，约第 11 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q062", "number": 62, "title": "static 关键字有哪些用法？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 60, "page_end": 60, "answer_original": "static 最常见的两种基础用法是修饰静态变量和静态方法，它们属于类的静态资源，被所有类\n实例共享，可直接通过类名访问。除此之外还有：静态代码块（static{}），多用于类加载时\n的初始化操作；修饰内部类，形成静态内部类，不依赖外部类实例；静态导包（import\nstatic，JDK 1.5 引入），可指定导入某类的静态资源，之后直接使用资源名而无需类名前\n缀，例如“import static java.lang.Math.*;”后可直接写 sin(20)。综上 static 的五种用法\n是：静态变量、静态方法、静态块、静态内部类、静态导包。它在工具类、常量类、单例与工\n厂模式中应用极广。（来源：Java 面试题_面经_八股文.pdf.txt，约第 12 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q063", "number": 63, "title": "请对比说明抽象类和接口在设计上的主要差异及使用场景。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "types", "topic": "面向对象与类型系统", "learning_priority": "核心", "page_start": 60, "page_end": 61, "answer_original": "抽象类与接口都用于抽象，但定位不同。从 PDF 实例看：HashMap 继承自 AbstractMap 抽\n象类，同时实现了 Map、Cloneable、Serializable 等接口；StringBuilder 继承自\nAbstractStringBuilder 抽象类。抽象类强调“is-a”的继承关系，可以包含已实现的方法、\n构造器、成员变量，适合作为一组相关类的共同基类，复用代码；接口强调“can-do”的能\n力契约，Java 8 前只能有抽象方法（现可有默认/静态方法），适合定义跨继承体系的公共能\n力（如 Runnable 表示“可运行”，Serializable 表示“可序列化”）。经验法则：需要共享\n代码与状态用抽象类，需要解耦能力定义、支持多重实现用接口。二者结合可兼顾复用与灵\n活。（来源：Java 面试题_面经_八股文.pdf.txt，约第 9 页；JAVA 面试知识点总结.pdf.txt，\n约第 113 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q064", "number": 64, "title": "Java IO 流按不同维度可以分为哪几类？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 61, "page_end": 61, "answer_original": "Java IO 流按多个维度划分：按流的流向分，可分为输入流（读数据）和输出流（写数据）；\n按操作单元划分，可划分为字节流（以字节为单位，处理所有类型数据）和字符流（以字符为\n单位，专用于处理文本）；按流的角色划分，可分为节点流（直接连接数据源，如文件流）和\n处理流（包装其它流，提供缓冲、转换等增强，如 BufferedInputStream）。Java IO 共涉及\n40 多个类，看似杂乱，实则高度规整，彼此联系紧密，所有类都从四个抽象基类派生而来。\n理解这种分类，是掌握 Java IO 整体体系、正确选型（字节还是字符、节点还是处理流）的前\n提。（来源：Java 面试题_面经_八股文.pdf.txt，约第 17 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q065", "number": 65, "title": "Java IO 的四个抽象基类是什么？各自职责？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 61, "page_end": 61, "answer_original": "Java IO 流的 40 多个类都是从如下四个抽象基类派生出来的：InputStream 是所有字节输入\n流的基类；OutputStream 是所有字节输出流的基类；Reader 是所有字符输入流的基类；\nWriter 是所有字符输出流的基类。其中 InputStream/OutputStream 负责字节（8 位）读\n写，适合图片、音视频、任意二进制；Reader/Writer 负责字符（按编码解析，通常 16 位\nchar）读写，适合文本文件。具体类如 FileInputStream、BufferedInputStream、\nFileReader、BufferedWriter 等都是这四个基类的子类。掌握这四个基类，就能以“基类看\n共性、子类看特性”的方式快速理解整个 IO 类继承体系。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 17 至 18 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q066", "number": 66, "title": "Java 中阻塞 IO、非阻塞 IO、多路复用 IO 模型分别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 61, "page_end": 62, "answer_original": "阻塞 IO 最传统：用户线程发起 IO 请求后若数据未就绪就一直阻塞，直到数据就绪并拷贝完\n成才返回，如 socket.read()。非阻塞 IO：发起 read 后立即返回结果，若数据未就绪就不断\n轮询询问内核，会持续占用 CPU，效率很低。多路复用 IO（Java NIO 即采用）：用一个线程\n不断轮询多个 socket，只有真正发生读写事件时才进行实际 IO，通过 selector.select()查\n询，能用一个线程管理大量连接，资源占用小，适合连接数多的场景；但其缺点是若某事件响\n应体很大，会阻塞后续事件轮询。理解这三种模型差异，有助于解释为什么高并发网络编程普\n遍采用 NIO 多路复用。（来源：JAVA 面试知识点总结.pdf.txt，约第 34 至 35 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q067", "number": 67, "title": "Java 传统 IO 与 NIO 的主要区别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 62, "page_end": 62, "answer_original": "传统 IO 与 NIO 最核心的区别有几点：一是传统 IO 是面向流的，数据从流中逐个字节读取，\n无法前后移动，需自己缓存；NIO 是面向缓冲区的，数据读入 Buffer 后可前后移动，处理更\n灵活。二是传统 IO 的流是阻塞的，read/write 会一直阻塞线程；NIO 支持非阻塞模式，线程\n请求读数据时只取当前可用部分，无数据就去做别的事，单个线程可管理多个通道。三是\nNIO 引入了选择器 Selector，可监听多个通道的事件，实现单线程管理大量连接。概括来\n说，传统 IO 适合简单、低并发场景，NIO 凭借 Channel/Buffer/Selector 更适合高并发、海\n量连接网络编程。（来源：Java 面试题_面经_八股文.pdf.txt，约第 19 页；JAVA 面试知识点\n总结.pdf.txt，约第 37 至 38 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q068", "number": 68, "title": "NIO 的三大核心组件是什么？各自作用？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 62, "page_end": 62, "answer_original": "Java NIO 有三大核心组件：Channel（通道）是数据传输的通道，类似传统 IO 的 Stream 但\n它是双向的，既可读也可写，主要实现有 FileChannel、DatagramChannel、\nSocketChannel、ServerSocketChannel；Buffer（缓冲区）是一个连续数组容器，是 NIO\n面向缓冲区的关键，所有读写都必须经由 Buffer（写入时先存入 Buffer 再写通道，读取时通\n道数据先读入 Buffer），常用子类有 ByteBuffer、CharBuffer 等；Selector（选择器）是\nNIO 的核心，能检测多个注册通道上是否有事件发生，有事件才获取并响应，从而让单线程\n管理多个连接，大幅减少线程开销与上下文切换。三者配合实现高效非阻塞 IO。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 37 至 40 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q069", "number": 69, "title": "NIO 中的 Buffer（缓冲区）有什么作用？为什么重要？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 62, "page_end": 62, "answer_original": "Buffer 即缓冲区，本质上是一个连续数组容器，是 NIO“面向缓冲区”读写的承载体。\nChannel 本身只负责传输，真正读写的数据都必须经过 Buffer：客户端发送数据要先把数据\n放入 Buffer 再写入 Channel；服务端接收数据要通过 Channel 把数据读入 Buffer，再从\nBuffer 取出处理。相比传统流“读多少算多少、不能回退”，Buffer 允许在内存中前后移动\n数据，处理更灵活。但使用 Buffer 需注意：要检查其中是否包含完整待处理数据，且在读入\n更多数据时不能覆盖尚未处理的部分。ByteBuffer、CharBuffer、IntBuffer 等是其常用子\n类，按数据类型划分。（来源：JAVA 面试知识点总结.pdf.txt，约第 38 至 40 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q070", "number": 70, "title": "NIO 的 Selector（选择器）解决了什么问题？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 62, "page_end": 63, "answer_original": "Selector 是 NIO 的核心类，作用是检测多个已注册通道上是否有事件发生（如连接打开、数\n据到达）。如果没有事件就阻塞在 selector.select()，一旦有事件便获取事件并逐一响应。这\n样只需一个单线程就能管理多个通道（即多个连接），只有在连接真正发生读写事件时才调用\n函数进行实际操作，从而大幅降低系统开销，不必为每个连接都创建一个线程，也避免了多线\n程间频繁上下文切换的成本。这正是 NIO 能支撑高并发、海量连接的根本原因。它让“一个\n线程服务大量客户端”成为可能，是构建高性能网络服务器（如 Netty 底层）的关键。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 40 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q071", "number": 71, "title": "除了阻塞、非阻塞、多路复用，还有哪些 IO 模型？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "io", "topic": "序列化与 IO/NIO", "learning_priority": "进阶", "page_start": 63, "page_end": 63, "answer_original": "完整的 IO 模型还包括：信号驱动 IO，用户线程发起 IO 请求时为对应 socket 注册一个信号函\n数并继续执行，内核数据就绪后发信号给用户线程，线程在信号处理函数中调用 IO 读写；异\n步 IO（AIO），是最理想的模型，用户线程发起 read 后立即去做别的事，内核自动完成“等\n待数据+拷贝数据”两个阶段，全部完成后发信号通知用户线程“IO 已完成”，用户线程无需\n再调用读写函数（Java 7 提供 Asynchronous IO，需操作系统底层支持）。它与信号驱动的\n本质区别是：信号驱动收到信号时数据仅就绪、仍需用户线程自己读写，而异步 IO 收到信号\n时数据已可用。IO 模型的演进核心就是“减少线程阻塞与 CPU 空耗”。（来源：JAVA 面试\n知识点总结.pdf.txt，约第 34 至 36 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q072", "number": 72, "title": "volatile 关键字有什么作用？能保证原子性吗？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 63, "page_end": 63, "answer_original": "volatile 提供两层语义：一是保证变量对所有线程的可见性，一个线程修改变量后新值立即写\n入主存，其他线程读取时总能得到最新值，不会被缓存在寄存器或各 CPU 私有 cache 中；二\n是禁止指令重排序，保证其前后操作的可见性顺序。但 volatile 不是原子性操作，单次读/写\n（如 long、double）能保证原子，像 i++这种“读-改-写”复合操作无法保证原子性。它也\n不能完全替代 synchronized，只有同时满足“写操作不依赖当前值”且“变量不参与其他变\n量的不变式”两个条件时，才能安全替代。典型应用场景是状态标记量和单例模式的双重检查\n锁。（来源：Java 面试题_面经_八股文.pdf.txt，约第 36 页；JAVA 面试知识点总\n结.pdf.txt，约第 87 页）", "version_review_recommended": false, "related_question_ids": ["Q165", "Q166", "Q167", "Q168"]}, {"id": "Q073", "number": 73, "title": "为什么比较对象内容统一用 equals，并且把常量写在前面？请结合阿里规范说明。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "objects", "topic": "对象协议与字符串", "learning_priority": "核心", "page_start": 63, "page_end": 64, "answer_original": "比较对象内容必须用 equals，因为“==”比较的是引用地址而非内容，对字符串、包装类等\n引用类型往往得到 false，而重写了 equals 的类（如 String、Integer）才真正按内容判等。\n把常量写在前面（如\"SUCCESS\".equals(status)）是防御性写法：若写成\nstatus.equals(\"SUCCESS\")，当 status 为 null 时会抛出 NullPointerException 导致程序中\n断；常量在前即使 status 为 null 也会安全返回 false。阿里巴巴 Java 开发手册明确要求仅使\n用 equals 比较，其 IDE 插件还能扫描老代码把“==”自动替换为 equals。这种写法既符合\n规范，又提升了代码的健壮性与可维护性。（来源：Java 面试题_面经_八股文.pdf.txt，约第\n8 页）", "version_review_recommended": false, "related_question_ids": ["Q015"]}, {"id": "Q074", "number": 74, "title": "请说明 ArrayList 和 LinkedList 的区别及各自适用场景。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 64, "page_end": 64, "answer_original": "Array（数组）基于索引，读取数据时间复杂度 O(1)很快，但删除数据需重排其后所有元素，\n开销大，且初始化必须指定长度。List 是有序可重复的集合，重要实现类有 ArrayList 和\nLinkedList。ArrayList 底层是数组，可自动扩容，按索引访问、遍历性能好，但中间增删需\n移动元素、性能较差；LinkedList 是双向链表，在头尾及中间增删元素时性能优于\nArrayList，但按索引 get/set 需要遍历、弱于 ArrayList（当然数据量很小或操作不频繁时差\n异不大）。经验法则：读多写少、频繁随机访问用 ArrayList；频繁在中间增删用\nLinkedList。面试常结合底层结构与时间复杂度作答。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 8 至 9 页）", "version_review_recommended": false, "related_question_ids": ["Q086"]}, {"id": "Q075", "number": 75, "title": "Collection 和 Collections 有什么区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 64, "page_end": 64, "answer_original": "Collection 是集合类的上级接口，定义了集合体系的根行为，其下有 Set、List 等子接口，以\n及 ArrayList、LinkedList、Vector、Stack、HashSet 等具体实现类，代表“一组对象”的容\n器本身。Collections 则是集合类的工具类（帮助类），包含各种有关集合操作的静态多态方\n法，如排序（sort）、查找（binarySearch）、线程安全化（synchronizedList）、不可变包\n装（unmodifiableList）、反转、填充等，服务于整个 Collection 框架。简单记忆：\nCollection 是“接口/容器”，Collections 是“工具类”。面试中常以此考察对集合框架结构\n的理解，以及是否会正确使用 Collections 提供的便捷算法。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q076", "number": 76, "title": "请简要说明 Java 集合框架的整体体系结构，List、Set、Queue、Map 四大接口分别 解决什么问题？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 64, "page_end": 65, "answer_original": "Java 集合框架位于 java.util 包下，整体分为两大根接口：Collection 与 Map。Collection 下\n辖 List、Set、Queue 三个子接口。List 代表有序、可重复的集合，底层常用数组或链表实\n现，适合按索引访问；Set 代表无序、不可重复的集合，强调元素唯一性，常用哈希表或红黑\n树实现；Queue 代表队列，支持 FIFO 或优先级出队；Map 则是独立的键值对映射体系，不\n继承 Collection，通过 key 快速定位 value。面试中常要求区分“单列集合 Collection”与\n“双列集合 Map”，这是理解 HashMap、HashSet、ArrayList 等类继承关系的基础。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 45 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q077", "number": 77, "title": "Collection 体系和 Map 体系最大的区别是什么？为什么说 Map 不是 Collection 的 子接口？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 65, "page_end": 65, "answer_original": "二者保存数据的维度不同。Collection 是单列集合，每个元素独立存放，关注元素本身的增删\n查；Map 是双列集合，以 key-value 键值对为单位存储，通过 key 唯一确定 value，一个\nkey 最多映射一个 value。正因为数据结构本质不同（一个是“元素集合”，一个是“映射\n表”），Java 设计上让 Map 独立于 Collection 接口体系，二者没有继承关系。实际开发\n中，Map 常用于缓存、字典、计数统计；Collection 更适合管理一组同类型对象。理解这一\n区别有助于正确使用 entrySet、keySet、values 等 Map 专属视图方法，也避免在遍历与并\n发修改时混淆二者的迭代器机制。（来源：JAVA 面试知识点总结.pdf.txt，约第 45 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q078", "number": 78, "title": "为什么说 Set 集合“无序且不可重复”？这里的“无序”具体指什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 65, "page_end": 65, "answer_original": "Set 强调元素的唯一性，存入和取出的顺序不一定相同，因此称其“无序”。所谓无序是指\nSet 不保证按插入顺序或任何业务顺序返回元素（LinkedHashSet 除外，它额外维护了插入顺\n序）。不可重复则由元素的 hashCode 与 equals 共同决定：两个元素 equals 为 true 即视为\n同一元素，不可重复存入。需要注意，HashSet 的“无序”区别于“随机”，它是按哈希值\n分布到哈希桶中的确定性顺序，只是与插入顺序无关。TreeSet 则完全不同，它按 key 的排序\n规则有序存放。面试时要区分 HashSet 的无序、TreeSet 的有序、LinkedHashSet 的插入有\n序三种语义。（来源：JAVA 面试知识点总结.pdf.txt，约第 48 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q079", "number": 79, "title": "实际开发中应该如何根据场景在 List、Set、Map 之间选型？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 65, "page_end": 66, "answer_original": "选型核心看数据特征与访问方式。需要保留顺序、允许重复、频繁按索引随机访问或遍历—\n—选 List，如 ArrayList；需要频繁在中间插入删除——选 LinkedList。需要去重且不在乎顺\n序——选 HashSet；需要去重且按排序输出——选 TreeSet；需要去重且保持插入顺序——\n选 LinkedHashSet。需要键值映射、按 key 高速查找——选 Map，其中 HashMap 最常用，\n需要线程安全选 ConcurrentHashMap，需要排序选 TreeMap，需要记录插入/访问顺序选\nLinkedHashMap。选型直接决定时间复杂度与并发安全，是集合框架面试最常见的开放性追\n问。（来源：JAVA 面试知识点总结.pdf.txt，约第 47 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q080", "number": 80, "title": "Iterator 迭代器的作用是什么？它和 for-each 循环有什么关系？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 66, "page_end": 66, "answer_original": "Iterator 是集合的统一遍历接口，定义了 hasNext()、next()、remove()三个方法，让客户端\n以一致方式遍历 List、Set 等 Collection，而不必关心底层是数组还是链表。for-each（增强\nfor 循环）底层编译后正是调用 Iterator 实现的，因此二者在遍历语义上等价。但 Iterator 的\n优势在于可以在遍历过程中安全地删除元素（调用 iterator.remove()），而 for-each 中直接\n调用集合的 remove 会触发 fail-fast。此外，Map 没有实现 Iterable，需通过\nentrySet().iterator()获取迭代器。掌握 Iterator 是理解 fail-fast 机制与并发修改异常的前\n提。（来源：Java 集合框架常见面试题.pdf.txt，约第 3 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q081", "number": 81, "title": "为什么 Java 集合框架要设计那么多层接口和抽象类？这样做有什么好处？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 66, "page_end": 66, "answer_original": "多层接口与抽象类（如 Collection、List、AbstractList、ArrayList）体现了面向接口编程与\n模板方法思想。好处有三：一是解耦，使用者面向 List/Set/Map 接口编程，底层实现可自由\n替换而不影响调用方；二是复用，AbstractXxx 抽象类抽取了各实现类的公共逻辑（如迭代、\n批量操作），减少重复代码；三是扩展，新增一种集合只需实现对应接口并继承抽象类即可。\n同时，RandomAccess、Cloneable、Serializable 等标记接口让算法（如\nCollections.binarySearch）能根据集合特征选择最优遍历策略。这种分层设计是集合框架可\n维护、可演进的关键。（来源：JAVA 面试知识点总结.pdf.txt，约第 45 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q082", "number": 82, "title": "请说明 ArrayList 的底层数据结构与主要特点。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 66, "page_end": 66, "answer_original": "ArrayList 底层是一个 Object 数组，允许对元素进行快速随机访问，通过下标定位元素时间复\n杂度为 O(1)。它是最常用的 List 实现类。数组的缺点是每个元素之间不能有间隔，当数组容\n量不足时，需要把已有数据复制到新的、更大的存储空间中完成扩容。由于数组在内存中连\n续，ArrayList 擅长随机查找与遍历，但缺点也很明显：从中间位置插入或删除元素时，需要\n对该位置之后的元素进行复制、移动，代价较高。因此 ArrayList 适合“读多写少、以遍历和\n随机访问为主”的场景，不适合频繁在中间插入删除。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 47 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q083", "number": 83, "title": "Vector 的底层实现是什么？它与 ArrayList 相比有什么不同？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 66, "page_end": 67, "answer_original": "Vector 与 ArrayList 一样，底层也是通过数组实现的，但 Vector 支持线程同步：它几乎对所\n有公开方法（如 add、get、remove）都加了 synchronized 关键字，保证某一时刻只有一个\n线程能够写 Vector，从而避免多线程同时写造成的数据不一致。代价是同步带来显著的性能\n开销，因此访问 Vector 比访问 ArrayList 慢。此外 Vector 默认扩容为原来的 2 倍，而\nArrayList 默认扩容为 1.5 倍。由于性能差且锁粒度粗，现代开发中 Vector 已被 ArrayList\n（单线程）或 CopyOnWriteArrayList/Collections.synchronizedList（多线程）取代，面试\n常将其作为“过时同步容器”的典型反面案例。（来源：JAVA 面试知识点总结.pdf.txt，约第\n47 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q084", "number": 84, "title": "LinkedList 的底层结构是什么？它适合哪些操作？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 67, "page_end": 67, "answer_original": "LinkedList 底层采用双向链表结构存储数据，每个节点包含 prev、next 指针和元素本身\n（JDK1.6 及以前是双向循环链表，JDK1.7 起改为双向链表，取消头尾循环）。它非常擅长数\n据的动态插入和删除，在头部、尾部或已知节点处增删只需修改指针，时间复杂度 O(1)；但\n随机访问需要沿链表逐个遍历，速度较慢，get(int index)为 O(n)。此外 LinkedList 实现了\nList 和 Deque 接口，提供了操作表头表尾的专属方法（如 addFirst、addLast、peek、\npoll），可以当作栈、队列或双端队列使用。它适合“写多读少、需要队列/栈语义”的场\n景。（来源：JAVA 面试知识点总结.pdf.txt，约第 47 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q085", "number": 85, "title": "ArrayList 和 Vector 的区别有哪些？请全面对比。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 67, "page_end": 67, "answer_original": "二者主要区别有：一、线程安全：Vector 方法基本都加 synchronized，线程安全；ArrayList\n非线程安全。二、性能：Vector 因同步开销大，访问更慢；ArrayList 更快。三、扩容策略：\nArrayList 默认按 1.5 倍扩容，Vector 默认按 2 倍扩容。四、迭代器：Vector 支持较老的\nEnumeration 和 Iterator，ArrayList 只支持 Iterator。五、出现年代：Vector 是 JDK1.0 遗\n留类，ArrayList 是 JDK1.2 集合框架引入。六、构造参数：Vector 可指定扩容增量，\nArrayList 通过底层算法确定。实际面试结论：单线程用 ArrayList，多线程优先用\nCopyOnWriteArrayList 或加锁包装，不要用 Vector。在 JDK1.2 集合框架出现后，Vector\n虽仍保持线程安全，但其同步粒度过粗、已无法适应现代高并发需求，官方也建议通过\nCollections 工具类或 java.util.concurrent 并发包来获取线程安全的集合。（来源：Java 集\n合框架常见面试题.pdf.txt，约第 4 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q086", "number": 86, "title": "ArrayList 和 LinkedList 的区别是什么？开发中如何选型？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 67, "page_end": 68, "answer_original": "一、底层结构：ArrayList 是动态 Object 数组，LinkedList 是双向链表。二、随机访问：\nArrayList 支持 O(1)下标访问，实现了 RandomAccess；LinkedList 需遍历，O(n)。三、插\n入删除：ArrayList 在尾部 add 为 O(1)（均摊），中间插入删除需移动元素 O(n)；LinkedList\n在已知节点处增删 O(1)，但定位节点本身 O(n)。四、内存：ArrayList 连续存储、节省指针开\n销；LinkedList 每个节点额外维护前后指针，内存占用更大。五、额外能力：LinkedList 可作\n队列、栈、双端队列。选型原则：读多写少、要随机访问用 ArrayList；频繁头尾增删或需队\n列语义用 LinkedList。（来源：Java 集合框架常见面试题.pdf.txt，约第 4 页）", "version_review_recommended": false, "related_question_ids": ["Q074"]}, {"id": "Q087", "number": 87, "title": "ArrayList 的扩容机制是怎样的？扩容会带来什么性能影响？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 68, "page_end": 68, "answer_original": "ArrayList 默认初始容量为 10（JDK1.8 延迟初始化，首次 add 才分配 10）。当元素数量超过\n当前容量时触发扩容：创建一个原容量 1.5 倍（oldCapacity + (oldCapacity >> 1)）的新数\n组，并通过 Arrays.copyOf/System.arraycopy 将旧数组元素拷贝过去，扩容阈值 threshold\n随之更新。扩容涉及整段数组复制，是 O(n)的昂贵操作。若在循环中预先知道元素规模，应\n通过 new ArrayList(int initialCapacity)指定容量避免多次扩容；若元素已确定，也可调用\ntrimToSize()释放多余容量。理解扩容对“批量 add”性能调优很关键，是高并发或大数据量\n场景的常见优化点。（来源：JAVA 面试知识点总结.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q088", "number": 88, "title": "为什么 ArrayList 的 add(int index, E element)比 add(E e)慢？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 68, "page_end": 68, "answer_original": "add(E e)默认在数组尾部追加元素，只要容量足够就是 O(1)的均摊操作；而 add(int index, E\nelement)要在指定下标插入，必须先将该位置及其之后的所有元素整体向后移动一位\n（System.arraycopy），以腾出空位，元素越多、index 越靠前，移动成本越高，时间复杂\n度为 O(n-i)。删除 remove(int index)同理，需要把后续元素整体向前移动。因此 ArrayList\n不适合频繁在中间插入删除，这正是 LinkedList 的用武之地。面试常借此考察对数组“连续\n存储”本质与复杂度模型的理解。（来源：Java 集合框架常见面试题.pdf.txt，约第 4 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q089", "number": 89, "title": "LinkedList 除了实现 List，还能充当什么角色？为什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 68, "page_end": 68, "answer_original": "因为 LinkedList 同时实现了 Deque（双端队列）接口，它天然具备栈、队列、双端队列的能\n力。具体看：作为队列，可用 offer()/poll()在尾部入队、头部出队；作为栈，可用\npush()/pop()在头部压栈弹栈；作为双端队列，可在头尾任意一端 addFirst/addLast、\npeekFirst/peekLast。其内部双向链表结构使头尾操作均为 O(1)，无需移动元素。相较\nArrayDeque，LinkedList 功能重叠但性能略低（节点对象内存开销大、缓存局部性差），所\n以纯队列/栈场景更推荐 ArrayDeque，但 LinkedList 接口更全面兼容 List。（来源：JAVA\n面试知识点总结.pdf.txt，约第 47 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q090", "number": 90, "title": "RandomAccess 接口有什么作用？为什么 ArrayList 实现它而 LinkedList 没有？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 68, "page_end": 69, "answer_original": "RandomAccess 是一个标记接口（内部无任何方法），用于标识“支持高效随机访问（下标\n访问）”的 List 实现。Collections 工具类的 binarySearch 等算法会先判断 list instanceof\nRandomAccess，若是则走 indexedBinarySearch（按索引二分，O(log n)访问），否则走\niteratorBinarySearch（用迭代器遍历，避免 LinkedList 的随机访问陷阱）。ArrayList 底层\n是数组，get(i)为 O(1)，所以实现 RandomAccess；LinkedList 是链表，随机访问 O(n)，故\n不实现该接口。这是“面向接口编程+运行时特征自适应算法”的经典设计，也是考察集合底\n层认知的好问题。实际使用中可用 list instanceof RandomAccess 先做判断，让算法根据底\n层结构自动选择最优实现，这正是策略模式与运行时类型识别的典型体现，也常被引申到为什\n么二分查找要先判断是否支持随机访问的问题上。（来源：Java 集合框架常见面试\n题.pdf.txt，约第 5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q091", "number": 91, "title": "遍历 ArrayList 有哪些方式？它们各自的性能差异如何？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 69, "page_end": 69, "answer_original": "常见四种：一、普通 for 循环（下标遍历），利用 RandomAccess，ArrayList 下 O(1)随机访\n问，性能最好；二、增强 for-each，底层用 Iterator；三、显式 Iterator 迭代器，支持遍历中\n安全删除；四、Java8 的 forEach+Lambda，语法简洁但略慢。对 ArrayList 而言，下标遍历\n和迭代器遍历性能接近，都很快；对 LinkedList，下标遍历会退化为 O(n²)，必须用迭代器或\nfor-each。并发修改方面，for-each/迭代器中调用集合自身 remove 会抛\nConcurrentModificationException，应使用 iterator.remove()。选型取决于是否需要删除\n元素与代码风格。综合来看，纯遍历且无需删除元素时，for-each 与迭代器即可满足；需要\n按索引随机定位时用下标循环；大数据量并行处理可考虑 stream().parallelStream()，但需注\n意并行流对共享状态带来的线程安全问题。（来源：Java 集合框架常见面试题.pdf.txt，约第\n6 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q092", "number": 92, "title": "HashSet 的底层实现原理是什么？为什么它查询很快？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 69, "page_end": 70, "answer_original": "HashSet 底层是基于 HashMap 实现的，它把元素作为 HashMap 的 key 存入，value 统一\n用一个固定的 Object 常量占位。因此 HashSet 的“去重”和“定位”完全依赖 HashMap 的\n哈希机制：存入元素时计算其 hashCode，定位到哈希桶，再比较 equals。借助哈希表，\nHashSet 在大多数情况下能直接定位元素，平均查找、插入、删除都为 O(1)，查询很快。由\n于底层是 HashMap，HashSet 同样不保证顺序、允许一个 null 元素（HashMap 允许一个\nnull 键）。理解“HashSet=HashMap 的 key 集合”是回答一切 HashSet 问题的钥匙。当哈\n希冲突较多时，HashMap 会将长链表转化为红黑树以维持查询性能，HashSet 也因此获得稳\n定的平均 O(1)查找；合理设置初始容量与负载因子能减少扩容与再哈希，进一步提升查询效\n率。（来源：JAVA 面试知识点总结.pdf.txt，约第 48 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q093", "number": 93, "title": "HashSet 是如何判断两个元素是否重复的？为什么必须同时依赖 hashCode 和 equals？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 70, "page_end": 70, "answer_original": "HashSet 判定重复分两步：先比较 hashCode，若 hashCode 不同，直接视为不同元素；若\nhashCode 相同，再调用 equals 比较，equals 为 true 才算同一元素。只靠 hashCode 不\n够，因为不同对象可能哈希冲突（哈希值相同但内容不同）；只靠 equals 也不行，因为\nHashSet 靠 hashCode 定位桶，若两个相等对象 hashCode 不同会被放进不同桶，仍能重复\n存入，破坏 Set 语义。因此约定：若两个对象 equals 为 true，hashCode 必须相等；但\nhashCode 相等，equals 可以为 false（冲突存放同一桶的链表/红黑树中）。这就是为什么\n重写 equals 必须同时重写 hashCode 的根本原因。（来源：JAVA 面试知识点总结.pdf.txt，\n约第 48 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q094", "number": 94, "title": "HashSet 的存储顺序为什么和插入顺序不一致？哈希冲突的元素如何存放？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 70, "page_end": 70, "answer_original": "HashSet 按元素的 hashCode 值决定在哈希桶中的位置，并非按插入先后，所以取出顺序与\n插入顺序通常不同。当发生哈希冲突（两个元素 hashCode 相同但 equals 为 false）时，它\n们会被放在同一个哈希桶中顺延存储——在 JDK1.8 的 HashMap 中，同一桶以链表形式串\n联，当链表长度超过 8 且数组容量≥64 时转成红黑树，以提升查找效率。也就是说“哈希值\n相同的元素放在一个哈希桶（一列）里”。这正是 HashSet 无序但查询仍快的原因：靠哈希\n定位桶，靠链表/红黑树解决冲突。（来源：JAVA 面试知识点总结.pdf.txt，约第 48 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q095", "number": 95, "title": "重写 hashCode 和 equals 有哪些重要约定？不遵守会有什么后果？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 70, "page_end": 70, "answer_original": "约定有三条：一、一致性，同一对象多次调用 hashCode 应返回相同值（前提参与计算的字\n段未变）；二、相等性，若 a.equals(b)为 true，则 a.hashCode()必须等于 b.hashCode()；\n三、非强制性但推荐：hashCode 相等的两个对象 equals 不一定为 true（允许哈希冲突）。\n若只重写 equals 不重写 hashCode，两个内容相等对象可能被分配到不同哈希桶，导致\nHashSet/HashMap 把它们当作不同元素，破坏去重与查找；若只重写 hashCode 不重写\nequals，可能出现哈希相同但 equals 为 false 却被误判，或无法正确识别相等对象。因此两\n者必须成对重写，且所用字段保持一致。（来源：JAVA 面试知识点总结.pdf.txt，约第 48\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q096", "number": 96, "title": "TreeSet 的底层是什么？它如何保证元素有序且唯一？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 70, "page_end": 71, "answer_original": "TreeSet 底层基于 TreeMap（红黑树）实现，是二叉排序树的一种自平衡变体。它保证元素\n有序且唯一：有序是因为每 add 一个新对象都按指定顺序（默认升序，或自定义\nComparator/Comparable）插入到红黑树的正确位置；唯一是因为红黑树中\ncompareTo/compare 返回 0 即视为相同 key，不会重复插入。Integer、String 等已默认实\n现 Comparable，可直接排序；自定义类必须实现 Comparable 接口并重写 compareTo，或\n在构造 TreeSet 时传入 Comparator，否则运行时会抛 ClassCastException。TreeSet 的查\n找、插入、删除均为 O(log n)。（来源：JAVA 面试知识点总结.pdf.txt，约第 49 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q097", "number": 97, "title": "为什么把自定义类对象放进 TreeSet 必须实现 Comparable 或提供 Comparator？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 71, "page_end": 71, "answer_original": "因为 TreeSet 依靠排序规则把元素插入红黑树并确定唯一性，而它自身并不知道对象之间“谁\n大谁小”。若元素类实现了 Comparable 接口并正确重写 compareTo，TreeSet 就按自然顺\n序排序；若不想或不能修改类，可在构造 TreeSet 时传入 Comparator 来自定义比较逻辑。\n如果两者都没提供，TreeSet 在插入第一个元素时无法比较，运行时会抛出\njava.lang.ClassCastException。注意 compareTo/compare 返回负整数、0、正整数分别表\n示小于、等于、大于；返回 0 会被 TreeSet 视为重复元素而忽略插入，因此比较逻辑必须和\nequals 语义保持一致，否则会出现“逻辑相等却不唯一”的隐患。（来源：JAVA 面试知识点\n总结.pdf.txt，约第 49 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q098", "number": 98, "title": "LinkedHashSet 是什么？它和 HashSet 有什么区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 71, "page_end": 71, "answer_original": "LinkedHashSet 继承自 HashSet，底层又基于 LinkedHashMap 实现。它在 HashSet 去重能\n力的基础上，额外维护了一条贯穿所有元素的双向链表，用于记录元素的插入顺序。因此遍历\nLinkedHashSet 时，元素会按插入的先后顺序返回，而普通 HashSet 顺序不确定。其底层仍\n是哈希表+链表/红黑树保证 O(1)查找，只是多了维护插入链表的开销，内存占用略高。实现\n上 LinkedHashSet 非常简单，仅提供几个构造方法，通过父类构造器传入“以插入顺序排\n序”的 LinkedHashMap 参数，其余操作直接复用 HashSet。适合需要“去重且保持插入顺\n序”的场景，如缓存最近访问记录。（来源：JAVA 面试知识点总结.pdf.txt，约第 49 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q099", "number": 99, "title": "HashSet、LinkedHashSet、TreeSet 三者应如何对比选型？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 71, "page_end": 72, "answer_original": "三者都实现 Set，保证元素唯一，差异在顺序与底层：HashSet 底层 HashMap，无序、最快\nO(1)，适合纯去重；LinkedHashSet 底层 LinkedHashMap，保持插入顺序，性能略低于\nHashSet，适合既要去重又要保序；TreeSet 底层 TreeMap（红黑树），按排序规则有序，\n查找 O(log n)，适合需要自动排序输出或范围查询。线程安全方面三者都不是线程安全，多\n线程需外部同步或用 ConcurrentHashMap 实现的并发 Set。内存：TreeSet 要维护树结构，\nLinkedHashSet 多一条链表，HashSet 最省。面试结论：去重选 HashSet，保序去重选\nLinkedHashSet，排序去重选 TreeSet。（来源：JAVA 面试知识点总结.pdf.txt，约第 48\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q100", "number": 100, "title": "comparable 和 Comparator 接口有什么区别？分别在什么场景使用？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 72, "page_end": 72, "answer_original": "二者都用于排序，但定位不同。Comparable 位于 java.lang，是“内部比较器”，由元素类\n自身实现 compareTo(Object o)，定义自然排序（如 Integer 升序、String 字典序），侵入\n性强但语义内聚。Comparator 位于 java.util，是“外部比较器”，通过单独的比较器类或匿\n名类实现 compare(o1,o2)，不修改元素类即可灵活定制排序规则，如降序、多字段排序，且\n可随时切换。优先级上：若 TreeSet/TreeMap 构造时传入了 Comparator，则以\nComparator 为准，否则用元素自身的 Comparable。实际开发推荐 Comparator 解耦，\nCollections.sort(list, comparator)即典型用法。（来源：Java 集合框架常见面试题.pdf.txt，\n约第 6 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q101", "number": 101, "title": "为什么 String 和 Integer 能直接放进 TreeSet 排序，自定义类却不行？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 72, "page_end": 72, "answer_original": "因为 String 和 Integer 等 JDK 内置类已经在类定义中实现了 Comparable 接口并重写了\ncompareTo 方法，TreeSet 可以调用它们的自然排序逻辑（String 按 Unicode 字典序，\nInteger 按数值大小），所以无需额外配置即可排序。而自定义类默认只继承 Object，\nObject 没有有意义的比较逻辑（其 compareTo 来自 Comparable 的约定但类本身未实\n现），TreeSet 插入时无法获知对象间的顺序，便会抛出 ClassCastException。要让自定义\n类可排序，要么让该类 implements Comparable\u003cT>并实现 compareTo，要么在 new\nTreeSet\u003c>(comparator)时提供 Comparator。这是面试考察“排序契约”的常见陷阱题。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 49 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q102", "number": 102, "title": "TreeSet 的 compareTo 方法返回值（负、零、正）分别代表什么含义？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "set", "topic": "Set 与排序规则", "learning_priority": "核心", "page_start": 72, "page_end": 73, "answer_original": "compareTo 规定：若当前对象小于指定对象返回负整数，等于返回 0，大于返回正整数。\nTreeSet 据此把元素插入红黑树：返回负数放左子树，正数放右子树，0 视为相同 key 不重复\n插入。因此返回值符号直接决定排序位置与唯一性。常见错误是只在“大于”时返回 1、其余\n都返回 0（如只比较一个字段），这会导致其他字段不同的对象被误判为重复而丢失。正确做\n法应综合所有关键字段比较：先比主字段，相等再比次要字段，最后都不能区分才返回 0。编\n写 Comparator 时同理，可用 Integer.compare(a,b)等工具方法避免手写出错。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 49 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q103", "number": 103, "title": "HashMap 的底层数据结构是什么？为什么说它是“数组+链表+红黑树”？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 73, "page_end": 73, "answer_original": "HashMap 底层是一个 Node 数组（哈希桶数组），数组每个元素是一个桶。当发生哈希冲突\n时，同一桶内的多个元素以链表形式串联；JDK1.8 起，当链表长度超过 8 且数组容量≥64\n时，链表会转化为红黑树，将查找复杂度从 O(n)降为 O(log n)。所以 HashMap 在 JDK1.8\n及以后是“数组+链表+红黑树”的组合结构：数组负责 O(1)定位桶，链表/红黑树负责解决\n桶内冲突。数组默认容量 16，始终是 2 的幂，扩容时翻倍。理解这种结构是回答 HashMap\n性能、扩容、线程安全等一系列问题的核心基础。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q104", "number": 104, "title": "HashMap 是如何根据 key 的 hashCode 快速定位到 value 的？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 73, "page_end": 73, "answer_original": "存入或查找时，HashMap 先对 key 调用 hashCode()，再经过一次扰动函数（hash()）混合\n后，与数组长度做位与运算 (n-1) & hash 计算出桶下标。因为容量 n 是 2 的幂，(n-\n1)&hash 等价于取模但更快，从而 O(1)定位到数组某个桶。若桶为空，直接存取；若桶内有\n元素，则在链表或红黑树中逐个比较 key 的 hash 和 equals 找到目标。扰动函数把高位也参\n与运算，降低哈希冲突概率。定位快是 HashMap“大多数情况下可直接定位 value、访问速\n度很快”的原因，但遍历顺序不确定，且极端哈希冲突会退化为链表/树遍历。（来源：JAVA\n面试知识点总结.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q105", "number": 105, "title": "JDK1.7 和 JDK1.8 的 HashMap 实现主要区别是什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 73, "page_end": 73, "answer_original": "JDK1.7 的 HashMap 是“数组+单向链表”，冲突元素挂在链表上，查找最坏 O(n)。JDK1.8\n做了重大优化：引入红黑树，当链表长度超过 8 且数组容量≥64 时链表转红黑树，查找降为\nO(log n)；同时解决了 1.7 头插法在多线程下扩容可能形成环形链表的隐患，1.8 改为尾插\n法；此外 1.8 把数据节点从 Entry 改为 Node，并增加了树化/退树化逻辑。容量、负载因\n子、扩容翻倍等核心机制二者一致。面试常问“为什么 1.8 引入红黑树”——就是为了对抗哈\n希冲突导致的长链表，保证最坏情况下仍有可接受的性能。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 50 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q106", "number": 106, "title": "HashMap 中链表转红黑树的条件是什么？为什么阈值是 8？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 73, "page_end": 74, "answer_original": "JDK1.8 规定：当某个桶内链表长度达到 8，且当前数组容量≥64 时，该桶的链表会转换为红\n黑树；若容量不足 64，则优先扩容而非树化。阈值取 8 来源于泊松分布统计：在负载因子\n0.75、理想哈希下，一个桶出现 8 个元素的概率极小（约千万分之六），即正常情况下几乎不\n会触发树化；一旦触发，说明哈希分布严重不均或遭遇恶意哈希攻击，此时用红黑树把查找从\nO(n)降到 O(log n)很有价值。反之当树节点因删除减少到 6 时，会退化为链表（6 是防止频\n繁树化/退树化震荡的缓冲阈值）。这是性能与内存的权衡设计。（来源：JAVA 面试知识点\n总结.pdf.txt，约第 51 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q107", "number": 107, "title": "HashMap 的扩容机制是怎样的？扩容时会发生什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 74, "page_end": 74, "answer_original": "HashMap 维护 capacity（数组容量，默认 16，始终 2 的幂）和 threshold（扩容阈值\n=capacity×loadFactor，默认 0.75）。当元素数量 size 超过 threshold 时触发扩容：新建一\n个容量为原来 2 倍的新数组，然后遍历旧数组所有桶，把每个节点重新计算桶下标\n（rehash）迁移到新数组。JDK1.8 利用容量翻倍的特性，用(e.hash & oldCap)判断节点留\n在原索引还是原索引+oldCap，避免了 1.7 全部重算的代价，且采用尾插法防止环形链表。扩\n容是 O(n)操作且需暂停写入，因此预分配合理初始容量能显著减少扩容次数，是高并发写入\n场景的重要优化手段。（来源：JAVA 面试知识点总结.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q108", "number": 108, "title": "什么是 HashMap 的负载因子？默认 0.75 代表什么含义？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 74, "page_end": 74, "answer_original": "负载因子 loadFactor 衡量哈希表在“扩容前”允许达到的填满程度，默认 0.75。\nthreshold=capacity×loadFactor，即默认容量 16 时，元素达到 12 就触发扩容。0.75 是时\n间与空间的折中：若设得过高（如 1.0），桶更密集、冲突增多、查找变慢；若设得过低（如\n0.5），冲突少、查找快，但数组利用率低、频繁扩容浪费内存。官方经验值 0.75 在空间开销\n与哈希冲突概率间取得较好平衡。构造 HashMap 时可指定 initialCapacity 和 loadFactor，\n但 loadFactor 一旦设定不建议随意改大，否则会显著增加哈希冲突与退化风险。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q109", "number": 109, "title": "为什么 HashMap 的容量总是 2 的幂？tableSizeFor 有什么作用？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 74, "page_end": 74, "answer_original": "容量取 2 的幂（如 16、32、64）是为了让“定位桶下标”的取模运算被优化为位与：(n-1)\n& hash。当 n 是 2 的幂时，n-1 的二进制全是 1，与 hash 做&恰好等价于 hash % n，但位\n运算远快于取模。此外扩容翻倍后，节点只需判断 hash 某一位是 0 还是 1，即可决定留在原\n桶还是移到“原索引+旧容量”桶，迁移更高效。tableSizeFor(initialCapacity)方法的作用正\n是把用户传入的任意初始容量，向上取整为最近的 2 的幂（如传 10 得到 16），保证内部容量\n永远是 2 的幂。这是 HashMap 性能设计的关键技巧。（来源：Java 集合框架常见面试\n题.pdf.txt，约第 10 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q110", "number": 110, "title": "HashMap 对 null 键和 null 值有什么特殊规定？为什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 75, "page_end": 75, "answer_original": "HashMap 允许最多一个 null 键，以及任意多个 null 值。因为 HashMap 的 hash()方法对\nnull 键做了特殊处理：当 key 为 null 时，固定存到桶下标 0 的位置（hash 值取 0），所以只\n能有一个 null 键；而 value 可以是 null，多个不同的 key 都能映射到 null 值，没有限制。与\n之相对，Hashtable 既不允许 null 键也不允许 null 值，写入 null 会直接抛\nNullPointerException。这一差异常被用作 HashMap 与 Hashtable 的对比点。实际开发中\n虽支持 null 键，但为代码清晰和避免歧义，一般不建议依赖 null 键，尤其并发场景下更应避\n免。（来源：JAVA 面试知识点总结.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q111", "number": 111, "title": "HashMap 为什么是非线程安全的？多线程下随意使用会有什么后果？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 75, "page_end": 75, "answer_original": "HashMap 的设计未做任何同步保护，多线程同时 put 可能导致：一、数据覆盖，两个线程同\n时计算到同一空桶并写入，后写的覆盖先写的；二、size 计数不准；三、JDK1.7 在扩容并发\n时可能形成环形链表，导致后续 get 无限循环（1.8 改为尾插法缓解但仍不安全）；四、可见\n性问题，一个线程的修改对其他线程未必立即可见。因此并发写 HashMap 会出现数据不一致\n甚至死循环。解决方法：单线程用 HashMap；需要线程安全可用\nCollections.synchronizedMap 包装（全局锁，性能低），或 ConcurrentHashMap（分段/\n桶级锁，推荐），切勿在多线程中裸用 HashMap。（来源：JAVA 面试知识点总结.pdf.txt，\n约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q112", "number": 112, "title": "为什么 JDK1.7 的 HashMap 在多线程扩容时可能形成环形链表，JDK1.8 又是如何 修复的？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 75, "page_end": 75, "answer_original": "JDK1.7 的 HashMap 扩容 resize 时采用“头插法”迁移节点：遍历旧桶链表，把每个节点重\n新计算下标后用头插法挂到新桶，新节点始终插在链表最前面。单线程下没问题，但多线程并\n发扩容时，两个线程可能交替执行迁移，导致某个节点的 next 指针被一个线程反转后，又被\n另一线程再次处理，最终形成“节点互指”的环形链表。此后对该桶执行 get()会沿环无限循\n环，CPU 飙升甚至卡死，这是 HashMap 非线程安全最典型的故障案例。JDK1.8 改为“尾插\n法”（新节点追加到链表尾部），且迁移时利用容量翻倍的特性按位拆分，避免了指针反转，\n从而从机制上消除了环形链表问题；但 1.8 的 HashMap 仍非线程安全（仍有数据覆盖、计数\n不准等），高并发写仍须用 ConcurrentHashMap。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 50 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q113", "number": 113, "title": "HashMap 和 Hashtable 的区别有哪些？为什么现在不推荐用 Hashtable？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 75, "page_end": 76, "answer_original": "一、线程安全：Hashtable 方法几乎都加 synchronized，线程安全；HashMap 非线程安\n全。二、null 支持：HashMap 允许一个 null 键和多个 null 值；Hashtable 都不允许，否则\n抛 NullPointerException。三、继承：Hashtable 继承古老的 Dictionary 类，HashMap 继\n承 AbstractMap。四、性能：Hashtable 全局锁粒度粗，并发下性能差；HashMap 无锁更\n快。五、迭代器：HashMap 的迭代器是 fail-fast，Hashtable 用 Enumerator（不严格 fail-\nfast）。六、容量：Hashtable 默认 11、扩容 2n+1，HashMap 默认 16、翻倍且取 2 的\n幂。结论：Hashtable 是遗留类，线程安全场景用 ConcurrentHashMap 替换，无需同步用\nHashMap 替换，新代码已不推荐使用 Hashtable。由于 Hashtable 对几乎所有方法都加了\nsynchronized 锁，即便在单线程下也会产生无谓的同步开销，因此在现代开发中已基本被淘\n汰，仅在极少数遗留老系统中才会出现。（来源：Java 集合框架常见面试题.pdf.txt，约第 9\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q114", "number": 114, "title": "HashMap 和 HashSet 有什么关系？它们底层是如何关联的？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 76, "page_end": 76, "answer_original": "HashSet 底层就是基于 HashMap 实现的：HashSet 内部持有一个 HashMap 实例，把集合\n元素作为 HashMap 的 key 存入，value 统一用一个 static final 的 Object 空对象占位\n（PRESENT）。因此 HashSet 的 add(e)等价于 map.put(e, PRESENT)，判断“是否包含”\n用 map.containsKey，size 用 map.size。二者的去重、定位、扩容、哈希冲突处理完全共享\nHashMap 的机制。区别仅在于 HashSet 是 Collection 单列集合、只管 key，HashMap 是\n双列映射、管 key-value。很多 HashSet 的特性（无序、允许一个 null、非线程安全）都直\n接继承自 HashMap。理解这层关系，能一通百通地回答两类问题。两者还共享相同的容量、\n负载因子与扩容策略，因此调优 HashSet 本质上就是在调优其内部的 HashMap，这一层关\n联也是面试中经常被追问的延伸考点。（来源：Java 集合框架常见面试题.pdf.txt，约第 11\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q115", "number": 115, "title": "HashMap 和 TreeMap 的区别是什么？如何选型？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 76, "page_end": 77, "answer_original": "一、底层：HashMap 是数组+链表+红黑树，TreeMap 是纯红黑树\n（NavigableMap/SortedMap）。二、顺序：HashMap 遍历顺序不确定；TreeMap 按 key\n排序（默认升序，可传 Comparator），遍历得到的记录是有序的。三、性能：HashMap 增\n删查平均 O(1)，TreeMap 为 O(log n)。四、key 要求：HashMap 的 key 只需正确实现\nhashCode/equals；TreeMap 的 key 必须实现 Comparable 或构造时传 Comparator，否\n则抛 ClassCastException。五、null：HashMap 允许一个 null 键；TreeMap 不允许 null 键\n（无法比较）。选型：要高速查找去重选 HashMap；需要按键排序或范围查询选\nTreeMap。需要按键的字典序或自定义顺序输出、实现排行榜、以及 subMap 等区间范围查\n询时，必须选择 TreeMap；而在绝大多数常规键值存取场景下，HashMap 凭借 O(1)平均性\n能更占优势，通常被优先考虑。（来源：JAVA 面试知识点总结.pdf.txt，约第 53 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q116", "number": 116, "title": "Hashtable 作为遗留类，为什么说它“并发性不如 ConcurrentHashMap”？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 77, "page_end": 77, "answer_original": "因为 Hashtable 对所有方法加 synchronized，锁的是整个 Hashtable 对象（全局锁），任何\n读写操作都要竞争同一把锁，多线程下几乎完全串行，吞吐量很低。而\nConcurrentHashMap 在 JDK1.7 用分段锁（Segment）把数据分成若干段，不同段可并行\n写；JDK1.8 进一步细化为桶级 CAS+synchronized，并发度更高。因此同样多线程写入，\nConcurrentHashMap 能真正并行，Hashtable 却退化为单线程执行。此外 Hashtable 不允\n许 null、继承 Dictionary、迭代器行为老旧。官方明确建议：不需要线程安全用 HashMap，\n需要线程安全用 ConcurrentHashMap，Hashtable 已不推荐在新代码中使用。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 53 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q117", "number": 117, "title": "TreeMap 有什么特点？它的 key 为什么要实现 Comparable？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 77, "page_end": 77, "answer_original": "TreeMap 实现了 SortedMap 和 NavigableMap 接口，底层是红黑树，能按 key 排序存储，\n默认按键升序，也可在构造时指定 Comparator。遍历 TreeMap 的 entrySet 得到的记录是\n排好序的，且其 NavigableMap 提供了 lowerKey、floorKey、ceilingKey、higherKey 等范\n围导航方法，适合“找最近、找区间”类需求。但 TreeMap 要求 key 必须可比较：要么 key\n类实现 Comparable，要么构造时传入 Comparator，否则插入会抛 ClassCastException；\n同时 TreeMap 不允许 null 键（红黑树无法比较 null）。相比 HashMap，它牺牲了 O(1)查找\n换来有序性，适合统计排序、排行榜、区间查询等场景。红黑树是一棵近似平衡的二叉查找\n树，保证任意一条从根到叶的路径最长不超过最短路径的两倍，从而把查找、插入、删除的最\n坏复杂度都稳定在 O(log n)，这是 TreeMap 有序且性能可控的底层根基。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 53 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q118", "number": 118, "title": "LinkedHashMap 有什么用？它和 HashMap、LRU 缓存有什么关系？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 77, "page_end": 78, "answer_original": "LinkedHashMap 是 HashMap 的子类，在哈希表基础上额外维护一条双向链表，记录元素的\n插入顺序（默认）或访问顺序（构造时 accessOrder=true）。遍历它时，先插入的先返回，\n实现了“可预测的迭代顺序”。这一特性使其成为实现 LRU（最近最少使用）缓存的理想基\n础：重写 removeEldestEntry 方法，当容量超过上限时自动淘汰最久未访问（链表头）的节\n点。相比 HashMap 无序、TreeMap 按 key 排序，LinkedHashMap 按“插入/访问”顺序，\n常用于缓存、会话保持、构建固定容量淘汰策略。理解它是 HashMap 子类、复用全部哈希机\n制，只是多了链表维护，是面试加分点。（来源：互联网大厂面试题库大全.pdf.txt，约第 1\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q119", "number": 119, "title": "请描述一次 HashMap 的 put 操作流程，从计算哈希到存入。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "top
