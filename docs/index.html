JAVA 面试知识点总结.pdf.txt，约第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q236", "number": 236, "title": "如何确定一块内存中的对象是\"垃圾\"？引用计数法的原理及其缺陷是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 113, "page_end": 114, "answer_original": "判断对象是否可回收，最简单的思路是引用计数法：给每个对象维护一个引用计数器，当有引\n用指向它时计数加 1，引用失效时减 1，若计数为 0 则说明对象不可能再被使用、可回收。但\n引用计数法有一个致命缺陷——无法解决循环引用问题：若对象 A 和对象 B 互相引用、且外\n部再无任何引用指向它们，它们的引用计数都不为 0，引用计数法会误判它们\"仍可达\"而不回\n收，造成内存泄漏。正因如此，Java 并没有采用引用计数法作为主回收判定，而是使用可达\n性分析：从 GC Roots 出发向下搜索，若对象到 GC Roots 没有任何引用链相连，才被判定为\n不可达。理解引用计数法的局限，是理解可达性分析为何成为 Java GC 基石的前提。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 26 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q237", "number": 237, "title": "请说明可达性分析（Reachability Analysis）是如何判断对象是否可回收的。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 114, "page_end": 114, "answer_original": "为解决引用计数法的循环引用缺陷，Java 采用可达性分析方法。其核心是：通过一系列称为\n\"GC Roots\"的对象作为起点，向下搜索引用链；如果在 GC Roots 与某个对象之间不存在任\n何可达路径，则该对象被判定为不可达。常见的 GC Roots 包括：虚拟机栈（栈帧局部变量\n表）中引用的对象、本地方法栈中 JNI 引用的对象、方法区中类静态属性引用的对象、方法区\n中常量引用的对象，以及被同步锁（synchronized）持有的对象等。可达性分析只关心\"是否\n从根对象可达\"，与对象间是否存在相互引用无关，因此能正确识别循环引用孤岛并将其标记\n为可回收。需要注意的是，不可达并不等于立即回收，还需经过后续标记与 finalize 过程。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 26 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q238", "number": 238, "title": "不可达对象是否一定会被回收？请说明两次标记的过程。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 114, "page_end": 114, "answer_original": "不可达对象并不等价于可回收对象，它要真正面临回收至少需经过两次标记过程。第一次标记\n发生在可达性分析之后：若对象到 GC Roots 不可达，则被第一次标记，并筛选是否需要执行\nfinalize() 方法——若对象未覆盖 finalize() 或 finalize() 已被调用过，则不再执行，直接视为\n可回收；若有必要执行 finalize()，对象会被放入 F-Queue 队列，由低优先级线程稍后执行。\n第二次标记发生在 finalize 执行后：若对象在 finalize() 中重新与引用链上的任意对象建立关\n联（例如把自己赋值给某个类变量或对象的成员变量），它将被移出\"即将回收\"集合；反之，\n若仍无引用链相连，则进行第二次标记，随后才真正被回收。由此可见，finalize 是对象逃脱\n回收的最后一次机会，但不应依赖它做资源清理。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 27 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q239", "number": 239, "title": "什么是 GC Roots？在 Java 中哪些对象可以作为 GC Roots？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 114, "page_end": 115, "answer_original": "GC Roots 是可达性分析算法中作为搜索起点的\"根对象\"集合，垃圾回收时从它们出发向下遍\n历引用链，凡无法被根对象引用到的对象即判定为不可达。在 Java 中，可作为 GC Roots 的\n对象主要有：虚拟机栈（即栈帧中的本地变量表）所引用的对象，例如正在执行的方法里的局\n部变量；本地方法栈中 JNI（即 Native 方法）所引用的对象；方法区中类静态属性（static\n字段）引用的对象；方法区中常量（final static、运行时常量池中的常量）引用的对象；以及\n被同步监视器（synchronized 锁）持有的对象等。本质上，GC Roots 都是当前\"活跃且必然\n可达\"的引用源头，它们构成对象存活的基准线，任何能追溯到 Roots 的对象都视为存活，否\n则可被回收。（来源：JAVA 面试知识点总结.pdf.txt，约第 27 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q240", "number": 240, "title": "Java 有哪四种引用类型？它们各自的回收时机与特点是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 115, "page_end": 115, "answer_original": "Java 在 JDK 1.2 后把引用分为四种，强度由强到弱依次是：强引用、软引用、弱引用、虚引\n用。强引用是最常见形式，如 Object o = new Object()，只要强引用存在，对象就绝不会被\n回收，是内存泄漏主因之一。软引用用 SoftReference 实现，仅被软引用关联的对象在系统\n内存充足时不会回收，内存不足时才会被回收，常用于内存敏感缓存。弱引用用\nWeakReference 实现，生存期更短，只要垃圾回收运行，无论内存是否充足都会回收仅被弱\n引用关联的对象，典型如 ThreadLocal 的 key。虚引用用 PhantomReference 实现，不能单\n独使用、必须配合引用队列，唯一作用是跟踪对象被回收的状态，无法借此获取对象实例。四\n种引用让开发者能精细控制对象生命周期与缓存策略。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 30 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q241", "number": 241, "title": "强引用为什么是 Java 内存泄漏的主要原因之一？请结合实际说明。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 115, "page_end": 115, "answer_original": "强引用是 Java 中最常见、最强的引用关系，形式如\"Object obj = new Object()\"，把一个对\n象赋给引用变量即构成强引用。当对象被强引用变量关联时，它处于可达状态，垃圾回收机制\n绝对不会回收它，哪怕该对象以后永远不再被使用，JVM 也不会回收，除非显式地把引用置\n为 null 或超出作用域。因此，若开发者把对象放入静态集合（static Map/List）或长生命周\n期容器却忘记移除，这些强引用会一直把对象\"钉\"在内存中，导致内存只增不减，最终引发堆\n溢出，这正是 Java 内存泄漏最常见的原因。排查时应重点关注静态变量、缓存、监听器等长\n期持有强引用的地方，必要时改用弱引用/软引用或及时清理引用。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 30 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q242", "number": 242, "title": "软引用的回收时机是什么？它在工程中有哪些典型应用场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 115, "page_end": 116, "answer_original": "软引用通过 SoftReference 类实现，其特点是：对于只被软引用关联的对象，当系统内存足\n够时不会被回收，只有在系统内存空间不足、即将发生 OOM 之前，垃圾回收器才会回收这\n些软引用对象以腾出空间。这种\"内存宽裕就保留、紧张就释放\"的语义，使软引用非常适合作\n内存敏感型缓存，例如图片缓存、查询结果缓存、大对象临时缓冲等：在内存充足时提升命中\n率与性能，在内存吃紧时自动释放避免 OOM。需要注意的是，软引用对象被回收后，其\nSoftReference 本身会被加入关联的引用队列（若注册了队列），开发者可据此清理映射关\n系。相比强引用，软引用在空间压力下主动让步，是平衡性能与稳定的重要手段。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 30 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q243", "number": 243, "title": "弱引用和虚引用有什么区别？它们各自的使用用途是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 116, "page_end": 116, "answer_original": "弱引用通过 WeakReference 实现，生存期比软引用更短：只要垃圾回收机制一运行，无论\nJVM 内存是否充足，都会回收仅被弱引用关联的对象。典型用途是构建不阻止对象回收的映\n射，如 ThreadLocal 内部用弱引用持有 key，防止线程池场景下线程长期存活导致 value 泄\n漏（虽仍需规范 remove）。虚引用通过 PhantomReference 实现，它最弱，不能单独使\n用、必须与引用队列联合使用，且无法通过它获取对象实例（get 永远返回 null）；其唯一作\n用是跟踪对象被垃圾回收的状态，当对象被回收后虚引用进入队列，可用于在对象销毁后做资\n源清理（如堆外内存释放）。二者核心差异在于：弱引用会在 GC 时被回收、可拿到对象；虚\n引用仅作\"死亡通知\"、拿不到对象。（来源：JAVA 面试知识点总结.pdf.txt，约第 30 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q244", "number": 244, "title": "请说明标记-清除（Mark-Sweep）算法的工作原理及其最大缺点。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 116, "page_end": 116, "answer_original": "标记-清除是最基础的垃圾回收算法，分为两个阶段：标记阶段，遍历所有对象，标记出所有\n需要回收的对象（或不需回收的对象，视实现而定）；清除阶段，回收被标记对象所占用的空\n间。其最大缺点是内存碎片化严重：每次清除后，被回收的对象之间会留下大量不连续的小空\n闲块，随着运行时间推移，堆中可能出现很多碎片。这会导致后续创建大对象时，即便空闲内\n存总和足够，也因找不到一块足够大的连续空间而提前触发 GC 甚至 OOM。此外，标记和清\n除两个过程都需要遍历，效率随堆大小下降。正因碎片问题突出，现代 GC 多在老年代改用标\n记-整理，或在新生代用复制算法规避碎片，标记-清除更多作为理解其他算法的基石。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 27 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q245", "number": 245, "title": "复制（Copying）算法是如何解决内存碎片问题的？它有什么代价？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 116, "page_end": 116, "answer_original": "复制算法是为解决标记-清除的内存碎片化缺陷而提出的。它把可用内存按容量划分为大小相\n等的两块，每次只使用其中一块；当这一块内存用完时，就把仍存活的对象复制到另一块上，\n然后把已使用过的那块内存一次性全部清掉。由于存活对象被紧凑地复制到新空间，旧空间整\n体清空，因此不会产生内存碎片，分配时只需顺序指针移动即可，实现简单、效率高、不易产\n生碎片。但它的代价也很明显：第一，可用内存被压缩到原本的一半，空间利用率低；第二，\n当存活对象较多时，复制成本会大幅上升、效率降低。因此复制算法适合\"存活对象少、回收\n对象多\"的场景——这正是新生代的特点，所以新生代（配合 Eden + 两块 Survivor）采用复\n制算法最为合适。（来源：JAVA 面试知识点总结.pdf.txt，约第 27 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q246", "number": 246, "title": "标记-整理（Mark-Compact）算法的过程是什么？适用于什么场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 117, "page_end": 117, "answer_original": "标记-整理算法结合了标记-清除与复制算法的优点，用于规避各自缺陷。其过程分两步：标记\n阶段与标记-清除相同，先标记出所有存活对象；整理阶段不是直接清理死亡对象，而是把存\n活对象向内存的一端移动（压缩），然后清除端边界以外的全部对象。这样做既避免了标记-\n清除产生的内存碎片，又不需要像复制算法那样把内存对半分、牺牲一半空间，因此空间利用\n率更高。它特别适合老年代：老年代对象存活率高、若用复制算法则要复制大量对象、效率极\n低，而用标记-整理在标记后仅移动一次存活对象并整体清理，虽然仍需 STW 且耗时较长，\n但能维持内存连续、避免碎片，是老年代回收的常用选择（如 Serial Old、Parallel Old 均采\n用标记-整理）。（来源：JAVA 面试知识点总结.pdf.txt，约第 28 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q247", "number": 247, "title": "分代收集算法的核心思想是什么？为什么新生代和老年代要采用不同算法？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 117, "page_end": 117, "answer_original": "分代收集算法是当前大部分 JVM 采用的垃圾回收思想，核心是根据对象存活生命周期的不同\n把内存划分为不同区域（新生代、老年代，甚至永久代/元空间），再对各区域特点选用最合\n适的算法。其依据是统计规律：新生代对象\"朝生夕死\"，每次 GC 时大量对象死亡、仅少量存\n活；老年代对象存活时间长、每次 GC 只回收少量对象。因此新生代适合复制算法——复制\n成本低、且能消除碎片；老年代存活率高、没有额外空间作担保，适合标记-整理（或标记-清\n除），不必复制、直接腾出空闲块。这种\"因地制宜\"的策略让整体回收效率最高：新生代高频\n快速回收，老年代低频但彻底回收。理解分代是理解 Minor/Full GC、Survivor 晋升与收集\n器选型的基础。（来源：JAVA 面试知识点总结.pdf.txt，约第 29 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q248", "number": 248, "title": "分区收集算法与分代收集算法有何区别？它的优势是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 117, "page_end": 117, "answer_original": "分代收集算法按对象生命周期把堆分为新生代、老年代等几块，各自采用不同 GC 算法；而分\n区收集算法（Region）则换了一个思路：它把整个堆空间划分为许多个连续的小区间\n（Region），每个小区间独立使用、独立回收。其优势在于可以精确控制一次回收多少个小\n区间——根据设定的目标停顿时间，每次合理地只回收若干个小区间而不是整个堆，从而显\n著减少单次 GC 所产生的停顿时间。这一点对追求低延迟的应用尤为重要，因为传统整堆回收\n在大堆下停顿会非常长。G1 收集器正是基于分区思想：把堆划分为大小固定的独立区域，跟\n踪各区垃圾进度并在后台维护优先级列表，每次按允许时间优先回收垃圾最多的区域。可理解\n为分代偏\"按年龄分块\"，分区偏\"按可控停顿分块\"。（来源：JAVA 面试知识点总结.pdf.txt，\n约第 30 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q249", "number": 249, "title": "新生代为什么一般采用复制算法？具体是如何划分内存的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 117, "page_end": 118, "answer_original": "新生代中的对象大多\"朝生夕死\"，每次垃圾回收时都有大量对象死亡、只有少量存活，这是选\n择复制算法的根本原因：复制成本低、且复制后天然消除内存碎片。但新生代并不是简单地按\n1:1 划分两块，而是划分为一块较大的 Eden 空间和两块较小的 Survivor 空间（From\nSpace、To Space）。每次分配只使用 Eden 和其中一块 Survivor（From），回收时把这两\n块中存活的对象复制到另一块 Survivor（To）中，然后整体清空 Eden 和 From。这样平时\n仅\"浪费\"一块 Survivor 的空间（远小于一半），比严格的 1:1 复制更高效。存活对象在\nSurvivor 间滚动、年龄增长，熬过阈值才晋升老年代。这种划分是复制算法在\"空间利用率\"与\n\"无碎片\"之间的平衡实践。（来源：JAVA 面试知识点总结.pdf.txt，约第 29 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q250", "number": 250, "title": "老年代为什么采用标记-整理而非复制算法？请说明原因。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 118, "page_end": 118, "answer_original": "老年代存放生命周期长的对象，存活率很高，若采用复制算法，就要把大量存活对象在两块空\n间间来回复制，复制成本极高、效率会大幅下降；同时老年代没有像新生代 Survivor 那样额\n外的\"担保空间\"可供分配，复制算法难以施展。因此老年代更适合标记-整理或标记-清除：只\n需标记出存活对象，把它们向一端移动并清理边界外死亡对象，不必进行大规模内存复制，直\n接腾出连续空闲块。教材中也指出，老年代因对象存活率高、无额外空间分配担保，必须采用\n\"标记—清理\"或\"标记—整理\"，不必内存复制且直接腾出空闲内存。实际中 Serial Old、\nParallel Old 采用标记-整理以避免碎片，而 CMS 为降停顿采用并发的标记-清除（代价是碎\n片）。这都体现了对老年代高存活特征的针对性设计。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 30 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q251", "number": 251, "title": "请介绍 Serial 垃圾收集器，它的特点与适用场景是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 118, "page_end": 118, "answer_original": "Serial（连续）是最基本、最古老的垃圾收集器，使用复制算法，曾是 JDK 1.3.1 之前新生代\n唯一的收集器。它是单线程收集器：不仅只用一个 CPU 或一条线程完成垃圾收集，而且在收\n集期间必须暂停其他所有工作线程（Stop-The-World），直到收集结束。它的最大优点是实\n现简单、没有线程交互开销，在限定单个 CPU 的环境下能获得最高的单线程收集效率。因此\nSerial 依然是 Java 虚拟机运行在 Client 模式下默认的新生代收集器，也常用于桌面应用、嵌\n入式或内存较小的简单场景。缺点是在多核、大堆的 Server 场景下，全程 STW 会造成明显\n停顿，不适合对响应时间敏感的服务端应用。理解 Serial 有助于对比后续多线程、并发收集\n器的演进。（来源：JAVA 面试知识点总结.pdf.txt，约第 31 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q252", "number": 252, "title": "ParNew 收集器与 Serial 收集器是什么关系？有什么区别？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 118, "page_end": 119, "answer_original": "ParNew 收集器本质上是 Serial 收集器的多线程版本，同样使用复制算法作用于新生代，除\n使用多线程并行收集外，其余行为（包括收集逻辑、算法、STW 策略）与 Serial 完全一致，\n收集期间同样要暂停所有工作线程。ParNew 默认开启与 CPU 数目相同的线程数，可通过 -\nXX:ParallelGCThreads 参数限制收集线程数。关键区别在于并行能力：在多核环境下，\nParNew 用多条线程同时回收，可显著缩短新生代 GC 的停顿时间。也正因为它并行且兼容\nCMS，ParNew 成为许多 Java 虚拟机在 Server 模式下新生代的默认收集器（尤其搭配 CMS\n作老年代收集时）。简单说，Serial 是单线程版、ParNew 是多线程版，二者是\"同源不同核\n数\"的关系。（来源：JAVA 面试知识点总结.pdf.txt，约第 31 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q253", "number": 253, "title": "Parallel Scavenge 收集器的设计目标是什么？它与 ParNew 的关键区别在哪里？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 119, "page_end": 119, "answer_original": "Parallel Scavenge 也是新生代的多线程收集器、同样使用复制算法，但它的关注点与\nParNew 不同：它重点追求\"可控的吞吐量\"（Throughput = 运行用户代码时间 / (运行用户\n代码时间 + 垃圾收集时间)）。高吞吐量意味着能最高效利用 CPU、尽快完成运算任务，适合\n后台运算多、交互少的任务。它与 ParNew 的一个重要区别是具备自适应调节策略：Parallel\nScavenge 可配合 -XX:+UseAdaptiveSizePolicy，由 JVM 自动调整新生代大小、Eden 与\nSurvivor 比例、晋升年龄等参数以达成设定吞吐量与停顿目标，而 ParNew 没有这套自适应\n机制。此外 Parallel Scavenge 的老年代搭档是 Serial Old / Parallel Old，与 ParNew（常\n搭 CMS）不同。选型时，吞吐优先选 Parallel Scavenge，延迟优先选 ParNew+CMS。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 32 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q254", "number": 254, "title": "请介绍 Serial Old 和 Parallel Old 收集器，它们各自的定位是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 119, "page_end": 119, "answer_original": "Serial Old 是 Serial 收集器的老年代版本，同样为单线程、使用标记-整理算法，主要作为\nClient 模式下默认的老年代收集器；在 Server 模式下它有两个用途：一是在 JDK 1.5 前与新\n生代 Parallel Scavenge 搭配使用，二是作为老年代 CMS 收集失败时的后备（Serial Old 兜\n底）方案。Parallel Old 则是 Parallel Scavenge 的老年代版本，使用多线程的标记-整理算\n法，从 JDK 1.6 才开始提供。在 JDK 1.6 之前，新生代用 Parallel Scavenge 只能搭配老年代\nSerial Old，只能保证新生代吞吐、无法保证整体吞吐；Parallel Old 的出现正是为了在老年\n代同样提供\"吞吐量优先\"，若系统对吞吐量要求高，可优先考虑 Parallel Scavenge +\nParallel Old 组合，获得整体高吞吐的收集能力。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 32 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q255", "number": 255, "title": "请说明 CMS 收集器的工作目标及其四个工作阶段。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 119, "page_end": 120, "answer_original": "CMS（Concurrent Mark Sweep）是一款以老年代为主的垃圾收集器，最核心目标是获取最\n短的垃圾回收停顿时间，从而提升交互式应用的用户体验，它采用多线程的标记-清除算法\n（不同于多数老年代用标记-整理）。其工作过程分为四个阶段：初始标记，仅标记 GC\nRoots 能直接关联的对象，速度很快，仍需 STW；并发标记，从 GC Roots 向下追踪引用\n链，与用户线程并发工作、无需暂停；重新标记，修正并发标记期间因用户程序继续运行导致\n标记变动的对象，仍需 STW；并发清除，清除 GC Roots 不可达对象，与用户线程并发工\n作、无需暂停。由于在耗时最长的并发标记与并发清除阶段 GC 线程与用户线程一起工作，总\n体上 CMS 的内存回收与用户线程是并发执行的，从而显著降低了停顿。（来源：JAVA 面试\n知识点总结.pdf.txt，约第 33 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q256", "number": 256, "title": "在 CMS 的四个阶段中，哪些需要 STW，哪些可以和用户线程并发？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 120, "page_end": 120, "answer_original": "CMS 的四个阶段里，只有\"初始标记\"和\"重新标记\"需要 Stop-The-World，而\"并发标记\"和\"\n并发清除\"可以与用户线程并发执行。初始标记只标记 GC Roots 直接关联的对象，范围极\n小、速度很快，因此 STW 时间极短；重新标记是为了修正并发标记期间用户线程运行造成的\n标记变动，需要暂停所有工作线程，但由于已基于并发标记结果做局部修正，耗时也远小于整\n堆遍历；真正耗时最长的并发标记（遍历引用链）和并发清除（回收不可达对象）都不暂停用\n户线程。正是这种\"两次极短 STW + 两段长并发\"的设计，让 CMS 在整体上实现了低停顿，\n适合对响应时间敏感、希望减少 GC 卡顿的 Web 服务类应用。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 34 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q257", "number": 257, "title": "CMS 收集器存在哪些缺点或问题？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 120, "page_end": 120, "answer_original": "CMS 虽能降低停顿，但也有明显短板：第一，它使用标记-清除算法，回收后会产生内存碎\n片，长期来看可能造成大对象分配困难、触发额外 Full GC；第二，并发阶段与用户线程同时\n运行，会占用一部分 CPU 和计算资源，在 CPU 核数少、负载高的机器上会与应用争抢资\n源、拉低吞吐量；第三，由于并发清理时用户线程仍在跑、不断产生新垃圾（浮动垃圾），\nCMS 无法在当次回收中清理这些浮动垃圾，必须留到下次 GC，因此 CMS 不能等老年代几乎\n满了才启动，通常需预留空间，反而更容易出现\"并发模式失败\"而退化成 Serial Old 兜底、造\n成长停顿。综合看，CMS 适合低延迟场景，但碎片与资源占用是其代价，这也是 G1 诞生的\n重要背景。（来源：JAVA 面试知识点总结.pdf.txt，约第 34 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q258", "number": 258, "title": "相比 CMS，G1 收集器有哪些主要改进？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 120, "page_end": 121, "answer_original": "G1（Garbage First）是垃圾收集器理论的前沿成果，相比 CMS 有两个最突出的改进：第\n一，G1 基于标记-整理算法，回收时把存活对象压缩到区域一端，因此不产生内存碎片，避免\n了 CMS 标记-清除带来的碎片问题；第二，G1 可以非常精确地控制停顿时间，在不牺牲吞吐\n量前提下实现低停顿垃圾回收。其实现思路是：G1 不再严格分代，而是把堆内存划分为大小\n固定的若干独立 Region，并跟踪每个区域的垃圾收集进度，在后台维护一个\"回收收益优先级\n列表\"，每次根据允许的收集时间，优先回收垃圾最多、收益最大的区域（Garbage First 由此\n得名）。这种区域划分 + 优先级回收机制，使 G1 能在有限时间内获得最高的收集效率，同\n时兼顾低延迟与高吞吐，适合大堆、低延迟的服务端应用。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 34 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q259", "number": 259, "title": "G1 收集器是如何实现\"可预测停顿时间\"的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "collectors", "topic": "垃圾收集器与历史演进", "learning_priority": "进阶", "page_start": 121, "page_end": 121, "answer_original": "G1 实现可预测停顿的核心在于\"分区 + 优先级回收 + 停顿预算\"。首先，G1 把整个堆划分为\n多个大小固定的 Region，每个 Region 独立回收，不必每次都整堆扫描；其次，G1 在后台\n持续跟踪每个 Region 中存活对象与垃圾的比例，维护一个按\"回收收益\"排序的优先级列表；\n每次 GC 时，G1 根据用户设定的停顿时间目标（如 MaxGCPauseMillis），只选取在预算时\n间内能回收完、且垃圾最多的若干个 Region 进行回收，从而把单次停顿控制在预期范围内。\n因为每次只回收部分高收益区域而不是全堆，停顿天然可控；同时标记-整理保证无碎片。简\n言之，G1 用\"按收益优先、按需回收局部\"取代\"整堆回收\"，在不牺牲吞吐量的前提下把停顿\n变得可预测，这是它相对 CMS 的关键优势。（来源：JAVA 面试知识点总结.pdf.txt，约第\n34 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q260", "number": 260, "title": "请整体说明 JVM 类加载机制的五个阶段（加载、验证、准备、解析、初始化）。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "classloading", "topic": "类加载与双亲委派", "learning_priority": "核心", "page_start": 121, "page_end": 121, "answer_original": "JVM 类加载机制分为五个阶段。加载：在内存中生成代表该类的 java.lang.Class 对象，作为\n方法区各类数据的入口，来源可以是 Class 文件、ZIP 包（jar/war）、运行时计算生成（如\n动态代理）或 JSP 转 Class 等。验证：确保 Class 字节流符合当前虚拟机要求且不危害虚拟\n机安全。准备：为类变量（static）分配内存并设置零值初始值（如 int 为 0）。解析：把常\n量池中的符号引用替换为直接引用。初始化：执行类构造器 \u003cclinit>()，真正运行类中定义的\nJava 代码（静态赋值与静态块合并）。其中加载、验证、准备、初始化顺序确定，解析可在\n初始化之后再开始（运行时解析）。除加载阶段可自定义类加载器外，其余主要由 JVM 主\n导，理解这五阶段是掌握类加载全过程的基础。（来源：JAVA 面试知识点总结.pdf.txt，约第\n41 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q261", "number": 261, "title": "类加载的\"准备\"阶段为类变量赋初值有什么容易踩坑的地方？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "classloading", "topic": "类加载与双亲委派", "learning_priority": "核心", "page_start": 122, "page_end": 122, "answer_original": "准备阶段是正式为类变量（static 变量）分配内存并设置初始值的阶段，但这里的\"初始值\"容\n易让人误解：若定义\"public static int v = 8080;\"，准备阶段过后 v 的值其实是 0 而不是\n8080，把 v 赋为 8080 的 putstatic 指令是在编译后存放于类构造器 \u003cclinit>() 中、到初始\n化阶段才执行的。这里真正的坑在于：只有被 final 修饰的常量例外——若定义\"public static\nfinal int v = 8080;\"，编译期会为 v 生成 ConstantValue 属性，准备阶段虚拟机就直接按\nConstantValue 把 v 赋为 8080，不再等到初始化。因此面试常考：普通 static 变量准备阶\n段是零值、final static 常量准备阶段即赋值。混淆二者会导致对类初始化的时序判断错误，\n进而影响对\"类何时真正可用\"的理解。（来源：JAVA 面试知识点总结.pdf.txt，约第 42 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q262", "number": 262, "title": "JVM 提供了哪三种类加载器？各自负责加载什么路径的类？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "classloading", "topic": "类加载与双亲委派", "learning_priority": "核心", "page_start": 122, "page_end": 122, "answer_original": "JVM 提供三种类加载器：一是启动类加载器（Bootstrap ClassLoader），由 C++ 实现，负\n责加载 JAVA_HOME/lib 目录中、或通过 -Xbootclasspath 指定路径中、且被虚拟机认可\n（按文件名识别，如 rt.jar）的类，它是所有加载器的顶层父；二是扩展类加载器（Extension\nClassLoader），负责加载 JAVA_HOME/lib/ext 目录中、或通过 java.ext.dirs 系统变量指定\n路径中的类库；三是应用程序类加载器（Application ClassLoader），负责加载用户路径\n（classpath）上的类库，是程序中默认使用的加载器。三者构成层级关系，配合双亲委派模\n型工作；开发者也可继承 java.lang.ClassLoader 实现自定义类加载器，以打破默认委派或加\n载特殊来源的类。（来源：JAVA 面试知识点总结.pdf.txt，约第 42 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q263", "number": 263, "title": "什么是双亲委派模型？它解决了什么问题？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "classloading", "topic": "类加载与双亲委派", "learning_priority": "核心", "page_start": 122, "page_end": 122, "answer_original": "双亲委派模型指：当一个类收到加载请求时，它首先不会自己去加载，而是把请求委派给父类\n加载器去完成，每一层都如此，因此所有请求最终都会传送到顶层的启动类加载器；只有当父\n类加载器反馈自己无法完成（即在它的加载路径下没找到所需 Class）时，子加载器才尝试自\n己加载。它解决的问题是：保证类的唯一性与安全性。例如位于 rt.jar 中的\njava.lang.Object，无论用哪个加载器加载，最终都委托给顶层启动类加载器，从而保证不同\n加载器得到的都是同一个 Object 类，避免出现多个同名核心类、防止核心 API 被用户自定义\n类篡改，维护了 Java 类型体系的一致与稳定。这是 Java 类加载安全机制的核心，也是自定\n义类加载器必须理解的前提。（来源：JAVA 面试知识点总结.pdf.txt，约第 43 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q264", "number": 264, "title": "请举一个破坏双亲委派模型的例子，并说明自定义类加载器的应用场景。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "classloading", "topic": "类加载与双亲委派", "learning_priority": "核心", "page_start": 122, "page_end": 123, "answer_original": "一个典型的破坏双亲委派的例子是 OSGi（Open Service Gateway Initiative），它是面向\nJava 的动态模块化系统，支持模块级热插拔——程序升级时可只停用、重装、启动其中一部\n分，而无需重启。为实现这种动态性，OSGi 的模块类加载器不再严格遵守双亲委派模型，而\n是按需平级或反向委派，从而让不同版本的同一类能共存、模块可独立加载卸载。此外，\nWeb 容器（如 Tomcat）也为每个 Web 应用使用独立类加载器以隔离应用，是另一类常见\n突破。自定义类加载器的场景包括：从网络、数据库或加密文件中加载类、实现热部署/热更\n新、隔离不同租户代码、以及字节码增强（如诊断 Agent）。实现时继承 ClassLoader 并重\n写 findClass/loadClass，需谨慎处理委派逻辑以免破坏类型安全。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 44 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q265", "number": 265, "title": "请说明字节码与 JIT 在 JVM 中是如何工作的，以及它们对跨平台的意义。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 123, "page_end": 123, "answer_original": "Java 源文件经编译器生成与平台无关的字节码文件（.class），随后由 JVM 执行：字节码先\n由解释器逐条解释为特定机器上的机器码运行；同时 HotSpot 的后台\"编译器线程\"会在运行\n时把热点字节码动态编译成本地平台相关的机器码（即 JIT 即时编译），之后这些热点代码直\n接以机器码执行、无需重复解释，从而兼顾启动速度与峰值性能。由于不同平台有各自不同的\n字节码解释器和 JIT 实现、但都遵循统一的字节码规范，同一份 .class 文件即可在任何平台运\n行，这正是 Java 跨平台的本质。线程映射上，编译器线程属于 JVM 后台系统线程之一，与\n用户线程并发工作。理解\"解释执行 + JIT 编译\"的混合模式，是分析预热期性能、JIT 优化与\n反优化（如去优化）问题的基础。（来源：JAVA 面试知识点总结.pdf.txt，约第 20 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q266", "number": 266, "title": "什么是 Spring 框架？它的核心设计思想是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 123, "page_end": 123, "answer_original": "Spring 是一个轻量级的 IoC 和 AOP 容器框架，为 Java 应用程序提供基础性服务，目的是简\n化企业级应用开发，让开发者只关注业务需求。其核心设计思想是控制反转（IOC）和面向切\n面编程（AOP），这两者是 Spring 的灵魂。传统程序设计中调用者自己创建被调用者实例，\n而在 Spring 里创建对象的工作交给容器完成，再通过依赖注入分配给调用者，从而实现组件\n之间的松散耦合。Spring 常见的配置方式有基于 XML、基于注解和基于 Java 三种。它把对\n象交给容器统一管理，启动时按配置初始化好 Bean，需要时直接注入，避免了在业务代码里\n手动 new 对象，显著降低了模块间的耦合度并提高了可维护性。（来源：Java 面试题_面经_\n八股文.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q267", "number": 267, "title": "Spring 主要由哪些模块组成？请列举并说明其作用。", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 124, "page_end": 124, "answer_original": "Spring 由多个核心模块构成：Spring Core 提供 IOC 基础服务，是框架最底层的核心类库；\nSpring Context 在 Core 之上提供框架式的 Bean 访问方式以及企业级功能（如 JNDI、定时\n任务等）；Spring AOP 负责面向切面编程，把日志、事务、安全等横切逻辑织入业务对象；\nSpring DAO 对 JDBC 做了抽象，统一并简化了数据访问异常的处理；Spring ORM 用于集成\n现有的 ORM 框架（如 Hibernate、MyBatis）；Spring Web 提供面向 Web 的综合特性，\n例如多文件上传；Spring MVC 则提供基于 Model-View-Controller 的 Web 层实现。这些\n模块既可以整体使用，也可以按需选择，体现了 Spring\"按需取用、松耦合\"的设计理念，也\n是它在企业开发中得以广泛应用的基础。（来源：Java 面试题_面经_八股文.pdf.txt，约第 50\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q268", "number": 268, "title": "什么是 IOC（控制反转）？请解释其本质。", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 124, "page_end": 124, "answer_original": "控制反转（Inversion of Control，IOC）是指创建对象主动权的转移：传统方式下对象由使\n用者自己把控创建时机，而在 Spring 中这个权力转移到了容器手中，由容器根据配置去创建\n实例并管理它们之间的依赖关系。最直观的表达是，IOC 让对象的创建不再需要手动 new，\n而是由 Spring 利用 Java 反射机制在运行时依据配置动态生成并管理对象。IOC 和 DI（依赖\n注入）是同一概念从不同角度的描述——控制反转强调\"权力反转给容器\"，依赖注入强调\"运\n行时由容器把外部资源动态注入进来\"。通过这种方式，相互协作的组件保持松散耦合，功能\n也更易于复用，这是 Spring 解耦设计的核心思想。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 47 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q269", "number": 269, "title": "什么是 DI（依赖注入）？它与 IOC 是什么关系？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 124, "page_end": 124, "answer_original": "依赖注入（Dependency Injection，DI）是指应用程序在运行时依赖 IoC 容器来动态注入对\n象所需要的外部资源，它是控制反转的具体实现手段。二者本质上描述的是同一件事：IOC 是\n从\"对象创建控制权交给容器\"的角度命名，DI 是从\"容器把依赖通过某种方式注入给对象\"的角\n度命名。在 Spring 里，调用者不再自己 new 被调用者，而是写好配置文件或注解，容器启动\n时把 Bean 初始化好，再通过 setter 方法或构造器把依赖分配给需要它的类。例如类 A 需要\nUserDao，只需声明属性并加注解，容器就会把已初始化的 UserDao 注入进来，无需在 A 中\n手动创建。面试时若能配合画图说明容器、Bean 与调用者三者关系，会更清晰地展现对其原\n理的掌握。（来源：Java 面试题_面经_八股文.pdf.txt，约第 47 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q270", "number": 270, "title": "依赖注入有哪几种方式？各自的优缺点是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 124, "page_end": 125, "answer_original": "依赖注入主要有三种方式。一是构造器注入：通过构造函数参数在初始化对象时注入依赖，优\n点是对象初始化完成即可直接使用，缺点是需要注入对象多时构造参数列表很长，且不够灵\n活，不同注入组合需要多个重载构造函数，比较麻烦。二是 setter 方法注入：由 IoC 容器调\n用成员变量的 setter 方法注入，优点是非常灵活，可选择性注入所需对象，缺点是注入前对\n象尚未完整，暂时不可用。三是接口注入：依赖类需实现指定接口并实现一个以被注入对象为\n参数的函数，优点是接口名、函数名都不重要只要求参数类型，缺点是侵入性太强（需要为使\n用功能而在自己类中增加额外代码），一般不推荐使用。实际项目中构造器注入和 setter 注\n入最为常见。（来源：Java 面试题_面经_八股文.pdf.txt，约第 49 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q271", "number": 271, "title": "构造器注入和 setter 注入该如何选择？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 125, "page_end": 125, "answer_original": "选择构造器注入还是 setter 注入，关键看依赖的必填性与可变性。构造器注入适合那些对象\n创建时必须存在的强依赖，它在实例化阶段就完成注入，能保证对象一经构造即处于完整、可\n用的合法状态，并且天然支持不可变字段（final），对单元测试也更友好——测试时直接传\n入 Mock 即可。setter 注入适合可选依赖或需要在对象生命周期中更换的依赖，灵活性高，可\n在不同时机注入不同实现。但若依赖是必填的，用 setter 注入会让对象在注入前处于\"半成品\"\n状态，存在空指针隐患。业界主流建议是：必填依赖优先用构造器注入，可选依赖用 setter\n注入；Spring 官方从 4.x 起也推荐构造器注入以表达强契约关系，同时配合 Lombok 的\n@RequiredArgsConstructor 可大幅减少样板代码。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 49 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q272", "number": 272, "title": "@Autowired 和@Resource 注解有什么区别？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 125, "page_end": 125, "answer_original": "二者都用于 Bean 的注入，但来源与策略不同。@Autowired 是 Spring 提供的注解（包路径\norg.springframework.beans.factory.annotation.Autowired），默认按类型（byType）装\n配，要求依赖对象必须存在，允许 null 时可设 required=false；若想按名称装配，需结合\n@Qualifier 使用。@Resource 并非 Spring 注解，而是 J2EE 规范\n（javax.annotation.Resource），Spring 支持其注入，默认按名称（byName）自动注入，\n它有 name 和 type 两个属性：name 解析为 Bean 名字，type 解析为 Bean 类型。二者都可\n写在字段和 setter 方法上，写在字段上时连 setter 都可省略。最佳实践是把@Resource 放在\nsetter 方法上，更符合面向对象的 set/get 思想。简言之：@Autowired 按类型、可配合\n@Qualifier 按名称；@Resource 默认按名称、也可按类型，是 J2EE 标准注解。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 48 页、第 49 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q273", "number": 273, "title": "@Autowired 默认按什么方式装配？如何实现按名称装配？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 126, "page_end": 126, "answer_original": "@Autowired 默认按照类型（byType）装配依赖对象，即容器会在上下文中寻找与字段/参\n数类型匹配的 Bean 进行注入，并且默认要求该依赖必须存在，否则启动报错；若允许为\nnull，可设 required=false。当容器中存在多个同类型 Bean 时，仅用@Autowired 会产生歧\n义而注入失败，此时需要按名称装配：配合@Qualifier(\"beanName\")注解指定具体 Bean 的\n名称，例如@Autowired @Qualifier(\"userDao\") private UserDao userDao; 这样就在按类\n型匹配的基础上再用名称精确锁定。也可以结合@Primary 在配置类上标记首选 Bean，当存\n在多个同类型实现时优先注入被@Primary 标注的那个。理解 byType 与 byName 的切换，\n是面试中考察 Spring 装配机制的常见点，也是实际排查\"找不到唯一 Bean\"异常的关键。（来\n源：Java 面试题_面经_八股文.pdf.txt，约第 48 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q274", "number": 274, "title": "@Resource 的装配顺序是怎样的？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 126, "page_end": 126, "answer_original": "@Resource 的装配顺序有明确规则：①若同时指定 name 和 type，则从 Spring 上下文中找\n唯一匹配的 Bean 装配，找不到抛异常；②若只指定 name，按名称（id）查找匹配 Bean 装\n配，找不到抛异常；③若只指定 type，按类型找唯一匹配的 Bean 装配，找不到或找到多个\n都会抛异常；④若 name 和 type 都不指定，则先按 byName 方式装配，如果没匹配上，再\n回退为按原始类型匹配，匹配成功则自动装配。它的作用相当于@Autowired，只不过\n@Autowired 默认按 byType。正因为@Resource 默认走 byName 且能回退类型匹配，在单\n实现类场景下使用非常顺手；而在多实现类时显式写 name 可避免歧义。掌握这套顺序有助\n于理解 Spring 注入失败时的报错原因。（来源：Java 面试题_面经_八股文.pdf.txt，约第 49\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q275", "number": 275, "title": "什么是 BeanFactory？它在 Spring 中承担什么角色？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 126, "page_end": 126, "answer_original": "BeanFactory 是 Spring IoC 容器的最顶层接口（位于 org.springframework.beans.factory\n包），是 Spring IoC 体系的基础设施，负责定义 Bean 的注册、获取与管理规范。它采用延\n迟加载（懒加载）策略：只有当客户向容器请求一个尚未初始化的 Bean，或初始化某 Bean\n需要注入另一个未初始化的依赖时，容器才会调用 createBean 进行实例化。这种按需创建的\n方式节省了启动开销，但也意味着 Bean 在真正使用时才完成初始化，若有配置错误可能延迟\n到运行时才暴露。BeanFactory 提供基本的 IoC 功能，是 Spring 轻量级容器的代表，适合资\n源受限或对启动速度敏感的场景。与之相对，ApplicationContext 在 BeanFactory 基础上做\n了大量企业级功能增强，是更常用的容器形态。（来源：互联网大厂面试题库大全.pdf.txt，\n约第 52 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q276", "number": 276, "title": "ApplicationContext 和 BeanFactory 有什么区别？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 127, "page_end": 127, "answer_original": "ApplicationContext 是 BeanFactory 的子接口，在基础 IoC 能力之上扩展了大量企业级特\n性。核心区别有：第一，实例化时机不同，BeanFactory 默认延迟加载，用到才创建；\nApplicationContext 在容器启动结束时就通过 BeanDefinition 信息把所有单例 Bean 实例化\n好（预初始化），启动慢但运行时快且能尽早发现配置错误。第二，功能不同，\nApplicationContext 额外提供国际化消息资源、事件发布机制（ApplicationEvent）、统一\n的资源加载、以及更易用的 Bean 访问方式，还内置了对 AOP、事务等企业服务的集成。第\n三，实现形态不同，ApplicationContext 有 ClassPathXmlApplicationContext、\nFileSystemXmlApplicationContext、AnnotationConfigApplicationContext、\nXmlWebApplicationContext 等多种实现，覆盖 XML、注解、Web 等场景。实际开发中几\n乎都使用 ApplicationContext。（来源：互联网大厂面试题库大全.pdf.txt，约第 52 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q277", "number": 277, "title": "ApplicationContext 有哪些常见实现类？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 127, "page_end": 127, "answer_original": "ApplicationContext 针对不同配置方式与运行环境提供了多个实现类。\nClassPathXmlApplicationContext 从 classpath 下的 XML 配置文件加载上下文，是最经典\n的 XML 配置方式；FileSystemXmlApplicationContext 从文件系统的绝对路径读取 XML 配\n置；XmlWebApplicationContext 用于 Web 环境，配合 web.xml 中的 DispatcherServlet\n使用；AnnotationConfigApplicationContext 基于 Java 注解配置（如@Configuration\n类），通过 new AnnotationConfigApplicationContext(AppConfig.class)启动，是纯注解\n时代的代表；AnnotationConfigWebApplicationContext 则用于 Web 环境的注解配置，可\n在 DispatcherServlet 初始化时替代默认的 XmlWebApplicationContext。在 Spring Boot\n中，上述能力被进一步封装，开发者通常只写一个带@SpringBootApplication 的主类即可，\n框架自动选用合适的 ApplicationContext 实现，但这些底层实现类的区别仍是面试常考点。\n（来源：互联网大厂面试题库大全.pdf.txt，约第 52 页、第 53 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q278", "number": 278, "title": "什么是 Spring 的 AOP？它解决了什么问题？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "aop", "topic": "AOP 与代理", "learning_priority": "核心", "page_start": 127, "page_end": 128, "answer_original": "AOP（Aspect-Oriented Programming，面向切面编程）是对 OOP 的补充和完善，用来把\n与业务无关却对多个对象产生影响的公共行为（如日志、权限认证、事务、安全）抽取封装成\n可重用的\"切面\"，再织入到目标对象中。OOP 擅长定义从上到下的纵向对象层次关系，却不\n擅长定义横向关系，例如日志代码会水平散布在所有对象中，与核心功能无关，造成大量重复\n且不利于模块复用。AOP 正是解决这一痛点：它把交叉业务逻辑封装成切面注入到具体业务\n对象，从而减少重复代码、降低耦合度、提高可维护性。在 Spring 中，AOP 只实现方法级别\n的连接点，对企业应用已足够。AOP 的实现关键在于代理模式，分为静态代理（如\nAspectJ，编译期织入）与动态代理（如 Spring AOP，运行期生成代理对象）。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 47 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q279", "number": 279, "title": "AOP 中的核心概念（切面、连接点、通知、切点）分别指什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "aop", "topic": "AOP 与代理", "learning_priority": "核心", "page_start": 128, "page_end": 128, "answer_original": "理解 AOP 要先掌握几个核心概念。切面（Aspect）是横切关注点的模块化封装，比如日志切\n面、事务切面，通常用一个类加@Aspect 表示。连接点（Joinpoint）是程序执行过程中可插\n入切面的点，Spring AOP 中仅指方法执行点。切点（Pointcut）是连接点的匹配规则，用表\n达式定位\"对哪些方法织入\"，决定切面作用在哪些连接点上。通知（Advice）是切面在特定连\n接点执行的动作，分为前置通知（Before）、后置通知（After）、环绕通知（Around）、返\n回后通知（AfterReturning）、异常通知（AfterThrowing）。此外还有引介\n（Introduction）和织入（Weaving，把切面应用到目标对象生成代理的过程，可在编译期、\n类加载期或运行期完成）。清晰区分这几个概念，是回答 AOP 原理题的基础，也是企业面试\n的高频考点。（来源：Java 面试题_面经_八股文.pdf.txt，约第 47 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q280", "number": 280, "title": "AOP 的实现技术分为哪几类？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "aop", "topic": "AOP 与代理", "learning_priority": "核心", "page_start": 128, "page_end": 128, "answer_original": "实现 AOP 的技术主要分为两大类。第一类是动态代理技术：在运行时通过拦截消息、对消息\n进行装饰来取代原有对象行为的执行，Spring AOP 属于此类，它不会修改字节码，而是每次\n运行在内存中临时为方法生成包含目标全部方法、并在切点做了增强的 AOP 对象，再回调原\n对象方法。第二类是静态织入：通过引入特定语法创建\"方面\"，使编译器在编译期间就把方面\n代码织入，AspectJ 即代表，它在编译阶段生成 AOP 代理类（编译时增强）。二者关键区别\n在于生成 AOP 代理对象的时机不同——AspectJ 静态代理在编译期完成、性能更好但需要特\n定编译器；Spring AOP 动态代理无需特殊编译器、更灵活但运行时略有开销。实际选型中，\n若只需方法级拦截，Spring AOP 足够；若要更细粒度（如构造器、字段），才考虑\nAspectJ。（来源：Java 面试题_面经_八股文.pdf.txt，约第 47 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q281", "number": 281, "title": "静态代理和动态代理的区别是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "aop", "topic": "AOP 与代理", "learning_priority": "核心", "page_start": 128, "page_end": 129, "answer_original": "静态代理与动态代理的根本区别在于\"代理类生成的时机与方式\"。静态代理在编码或编译阶段\n就手写或生成好代理类，代理类与委托类实现相同接口，负责预处理、过滤、转发消息及事后\n处理，典型如 AspectJ 在编译期把切面织入字节码，运行的就是增强后的对象，性能更好但依\n赖特定编译器。动态代理则在程序运行期由框架在内存中临时生成代理对象，Spring AOP 是\n代表：它不修改原字节码，每次调用时为方法动态创建包含全部方法并做了增强的 AOP 对\n象，再回调目标方法，无需专门编译器，更灵活但有轻微运行时开销。从使用成本看，静态代\n理需提前写好代理类、维护成本高；动态代理完全托管给框架、业务无侵入。面试中常结合\"\n代理模式\"整体来谈，二者都是为委托类增强服务，只是增强发生的阶段不同。（来源：Java\n面试题_面经_八股文.pdf.txt，约第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q282", "number": 282, "title": "JDK 动态代理和 CGLIB 动态代理有何区别？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "aop", "topic": "AOP 与代理", "learning_priority": "核心", "page_start": 129, "page_end": 129, "answer_original": "Spring AOP 的动态代理有 JDK 动态代理和 CGLIB 两种。JDK 动态代理只针对实现了接口的\n类，核心是 InvocationHandler 接口和 Proxy 类：InvocationHandler 通过 invoke()方法反\n射调用目标代码，Proxy 利用它动态创建符合接口的代理实例。CGLIB（Code Generation\nLibrary）则是通过继承目标类、在运行时动态生成其子类并覆盖特定方法来实现增强，因此\n能代理没有实现接口的类。关键差异：JDK 基于接口、要求目标实现接口；CGLIB 基于继承、\n要求目标类可被继承（final 类无法代理）。此外 JDK 动态代理是 JDK 自带，CGLIB 需引入第\n三方字节码生成库。Spring AOP 默认优先用 JDK 动态代理（目标有接口时），否则 fallback\n到 CGLIB。理解二者选择逻辑，有助于分析\"为什么 final 类/方法无法被 AOP 增强\"等实际坑\n点。（来源：Java 面试题_面经_八股文.pdf.txt，约第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q283", "number": 283, "title": "什么情况下 Spring AOP 会使用 CGLIB 而不是 JDK 动态代理？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "aop", "topic": "AOP 与代理", "learning_priority": "核心", "page_start": 129, "page_end": 129, "answer_original": "Spring AOP 默认优先使用 JDK 动态代理，但存在明确 fallback 条件：当目标类没有实现任\n何接口时，由于 JDK 动态代理只能代理接口，Spring 会改选 CGLIB 通过继承方式生成子类代\n理。此外，从 Spring Boot 2.x 起，AOP 默认统一采用 CGLIB（即使类实现了接口），以统\n一代理语义、避免\"同一 Bean 被 JDK 代理后注入接口类型与自调用增强不一致\"等问题，可通\n过配置 spring.aop.proxy-target-class=false 切回 JDK 优先。还有当需要对类本身（而非接\n口方法）做增强、或目标方法不是接口方法时，也只能用 CGLIB。注意：若目标类被标记为\nfinal，或要增强的方法是 final/static，CGLIB 无法生成子类，AOP 将失效——这是面试故障\n排查中常被追问的点，也体现了\"基于继承\"代理的固有局限。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 55 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q284", "number": 284, "title": "请描述 Spring Bean 的完整生命周期。", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 129, "page_end": 130, "answer_original": "Spring Bean 的生命周期与 Servlet 类似（实例化、初始化、服务、销毁）。具体步骤：①实\n例化 Bean，BeanFactory 在请求未初始化 Bean 或需要注入未初始化依赖时调用\ncreateBean；ApplicationContext 在启动结束后通过 BeanDefinition 信息实例化所有\nBean。②设置对象属性（依赖注入），对象封装进 BeanWrapper，容器据 BeanDefinition\n完成注入。③处理 Aware 接口，若实现 BeanNameAware、BeanFactoryAware、\nApplicationContextAware，则依次回调 setBeanName、setBeanFactory、\nsetApplicationContext 把对应实例注入。④若实现 BeanPostProcessor，调用\npostProcessBeforeInitialization。⑤若配置了 init-method 或实现 InitializingBean，调用\nafterPropertiesSet 或自定义初始化方法。⑥再次调用 BeanPostProcessor 的\npostProcessAfterInitialization（可用于缓存/内存技术）。此时 Bean 已就绪可用。⑦不再\n需要时若实现 DisposableBean，调用 destroy()；⑧若配置了 destroy-method，调用自定\n义销毁方法。（来源：Java 面试题_面经_八股文.pdf.txt，约第 55 页、第 56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q285", "number": 285, "title": "Bean 生命周期中 Aware 接口的作用是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 130, "page_end": 130, "answer_original": "Aware 接口族的作用是让 Bean 在初始化过程中感知并获取 Spring 容器的底层组件，实现\"对\n象与容器交互\"。当 Spring 检测到 Bean 实现了 xxxAware 接口，就会把对应的 Spring 内部\n对象注入给 Bean。常见包括：BeanNameAware，回调 setBeanName(String beanId)传入\n配置文件中的 Bean id；BeanFactoryAware，回调 setBeanFactory()传入 Spring 工厂自\n身，使 Bean 能直接操作容器；ApplicationContextAware，回调\nsetApplicationContext(ApplicationContext)传入整个上下文，便于获取国际化、事件发布\n等能力。此外还有 BeanClassLoaderAware、EnvironmentAware、\nEmbeddedValueResolverAware 等更多变体。合理使用 Aware 能让 Bean 拿到容器资源，\n但也会让 Bean 与 Spring 框架耦合，因此一般仅在确实需要容器能力（如主动 getBean、发\n布事件）时才实现，普通业务 Bean 应尽量保持框架无关。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 55 页、第 56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q286", "number": 286, "title": "BeanPostProcessor 在生命周期中起什么作用？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 130, "page_end": 131, "answer_original": "BeanPostProcessor 是 Spring 留给开发者的\"生命周期钩子\"接口，用于在 Bean 初始化前后\n插入自定义逻辑，是实现 AOP、事务、属性填充等高级功能的底层支柱。它定义了两个方\n法：postProcessBeforeInitialization 在属性设置完成、初始化方法（如\nInitializingBean/afterPropertiesSet、init-method）调用之前执行；\npostProcessAfterInitialization 在初始化方法结束之后执行，常被用于生成代理对象或做缓\n存/后置处理。容器会对每一个 Bean 都调用注册的 BeanPostProcessor。正因为 Spring\nAOP 的自动代理处理器 AbstractAutoProxyCreator 就是 BeanPostProcessor 的实现，所以\nAOP 代理是在初始化后才生成的最终对象。理解这一点能帮助排查\"为什么注入的 Bean 其实\n是代理对象\"以及\"自定义后置处理器影响所有 Bean\"等面试追问。（来源：Java 面试题_面经_\n八股文.pdf.txt，约第 55 页、第 56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q287", "number": 287, "title": "InitializingBean 和 init-method 的关系是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 131, "page_end": 131, "answer_original": "二者都是 Bean 初始化阶段执行自定义逻辑的入口，触发时机相近但形式不同。\nInitializingBean 是 Spring 提供的接口，Bean 实现它后容器在属性注入完成后调用\nafterPropertiesSet()方法做初始化；init-method 则是 XML 或@Bean 配置中指定的自定义\n初始化方法名（如@Bean(initMethod=\"init\")），容器同样在属性注入后调用。执行顺序\n上：先 BeanPostProcessor 的前置处理 → afterPropertiesSet（InitializingBean）→ 自定\n义 init-method，再 BeanPostProcessor 后置处理。二者的取舍：InitializingBean 与\nSpring 耦合但无需额外配置、语义明确；init-method 解耦、符合\"约定配置\"、更推荐在注\n解驱动项目中使用@PostConstruct（JSR-250）来替代，效果等价且在依赖注入后即执行。\n面试常把它们与@PostConstruct 一起对比考察初始化时机。（来源：Java 面试题_面经_八\n股文.pdf.txt，约第 55 页、第 56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q288", "number": 288, "title": "DisposableBean 和 destroy-method 的作用是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 131, "page_end": 131, "answer_original": "DisposableBean 和 destroy-method 是 Bean 销毁阶段执行清理逻辑的两种机制，与初始化\n阶段的 InitializingBean/init-method 相对应。当单例 Bean 不再需要、容器关闭时，若\nBean 实现了 DisposableBean 接口，容器会调用其 destroy()方法释放资源；若在配置中指\n定了 destroy-method（或@Bean(destroyMethod=...)），容器也会调用该自定义销毁方\n法。多例（prototype）作用域的 Bean 容器不管理其完整生命周期，因此销毁回调不会被容\n器调用，需由使用者自行清理。对于注解项目，更常用 JSR-250 的@PreDestroy 标注销毁方\n法，效果等价且在容器关闭前执行。典型使用场景包括：关闭线程池、释放数据库连接、注销\n监听器、刷写缓存等。理解它们有助于写出资源安全、可被容器优雅关闭的 Spring 组件，是\n面试中考察\"Bean 生命周期完整性\"的要点。（来源：Java 面试题_面经_八股文.pdf.txt，约第\n56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q289", "number": 289, "title": "Spring Bean 有哪些作用域？默认是哪种？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 131, "page_end": 132, "answer_original": "Spring 容器中的 Bean 可分为 5 种作用域。singleton：默认作用域，每个容器对一个 Bean\n定义只维护一个实例，所有请求共享，由 BeanFactory 自身维护单例。prototype：每次请求\nBean 都创建一个新的实例。request：为每个 HTTP 请求创建一个实例，请求结束 Bean 失效\n并被 GC 回收，仅 Web 环境有效。session：为每个 HTTP Session 创建一个实例，Session\n过期即失效。global-session：全局 Session 作用域，与 Portlet 应用相关，当应用部署在\nPortlet 容器中、多个 portlet 想共享全局存储变量时使用，效果同 Servlet 的 session 作用\n域。绝大多数业务 Bean 用默认 singleton 即可；若 Bean 持有状态（如用户会话数据）或需\n避免共享可变状态，应使用 prototype 或 request/session。面试中要能结合\"有状态/无状态\n\"说明作用域选型。（来源：Java 面试题_面经_八股文.pdf.txt，约第 56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q290", "number": 290, "title": "singleton 和 prototype 作用域的区别及适用场景？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 132, "page_end": 132, "answer_original": "singleton 与 prototype 是 Spring 最常用的两种作用域，核心区别在于实例数量与生命周期\n管理。singleton 是默认作用域，整个 IoC 容器对同一个 Bean 定义只存在一个共享实例，容\n器负责其完整生命周期（创建到销毁），所有注入点拿到的是同一对象，因此 Bean 必须是无\n状态或线程安全的，否则会出现并发问题。prototype 则每次获取（getBean 或注入）都新\n建一个实例，容器只负责创建、不管理其销毁，需使用者自行释放资源，适合有状态 Bean\n（如一次请求内的上下文对象）。性能上 singleton 省内存、prototype 更隔离。注意：\nsingletonBean 中注入 prototypeBean 时，prototype 只会被实例化一次并缓存进\nsingleton，达不到\"每次用都新实例\"的效果，需用 lookup-method 或 ObjectProvider 解\n决。面试常在此处追问\"单例 Bean 依赖多例 Bean\"的陷阱。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q291", "number": 291, "title": "request、session、global-session 作用域分别用于什么场景？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 132, "page_end": 132, "answer_original": "这三种作用域仅在 Web 环境下有效，生命周期绑定 HTTP 请求或会话。request 作用域为每\n个 HTTP 请求创建独立 Bean 实例，请求处理结束即失效并被垃圾回收，适合存放仅在单次请\n求内有效的数据（如表单对象、请求级上下文），能保证并发请求间互不干扰。session 作用\n域为每个用户会话创建一个实例，整个会话期间共享，适合存放用户登录信息、购物车等与\"\n一次会话\"绑定的状态，Session 过期后 Bean 随之失效。global-session 作用域专用于\nPortlet 应用：当应用部署在 Portlet 容器中、由多个 portlet 组成时，若想让所有 portlet 共\n享同一全局存储变量，就放到 global-session 里，其效果等同于普通 Servlet 的 session 作用\n域。在常规 Spring MVC 单体/微服务项目中主要用 request 和 session，global-session 较\n少见。（来源：Java 面试题_面经_八股文.pdf.txt，约第 56 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q292", "number": 292, "title": "基于 XML 配置，Spring 有哪几种注入 Bean 的方式？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 132, "page_end": 133, "answer_original": "基于 XML 配置时，向 Spring 容器注入并声明 Bean 主要有以下几种方式。①Set 方法注入：\n在 Bean 标签内用\u003cproperty>子元素，通过 setter 方法设值，是最常用的 XML 注入方式。\n②构造器注入：用\u003cconstructor-arg>元素，可进一步通过 index 属性设置参数位置、通过\ntype 属性设置参数类型以消除歧义，适合必填依赖。③静态工厂注入：通过工厂类的静态方\n法创建 Bean，在\u003cbean>上配 factory-method 指向静态工厂方法。④实例工厂注入：先声\n明一个工厂 Bean，再用 factory-bean+factory-method 引用其非静态方法创建目标 Bean。\n这四种方式本质是\"由谁、用什么手段产生 Bean 实例\"的差异，如今注解驱动\n（@Component/@Bean/@Autowired）已大幅取代 XML，但理解 XML 注入机制有助于维\n护老项目、读懂遗留配置，也是面试中检验 IoC 底层认知的常考项。（来源：Java 面试题_面\n经_八股文.pdf.txt，约第 56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q293", "number": 293, "title": "Spring 框架中运用了哪些设计模式？请举例说明。", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 133, "page_end": 133, "answer_original": "Spring 大量运用经典设计模式。工厂模式：BeanFactory 就是简单工厂的体现，统一创建对\n象实例；单例模式：Bean 默认单例，由容器维护唯一实例；代理模式：Spring AOP 功能依\n赖 JDK 动态代理与 CGLIB 字节码生成技术实现方法增强；模板方法模式：用模板类消除重复\n代码，如 RestTemplate、JmsTemplate、JpaTemplate；观察者模式：定义一对多依赖，状\n态变化时通知所有依赖者，Spring 的监听器机制（ApplicationListener）即此模式；适配器\n模式：Spring MVC 的 HandlerAdapter 把各类处理器包装成统一适配器执行；策略模式：\nHandlerMapping、ViewResolver 等通过不同策略实现灵活替换；装饰器模式：\nBeanWrapper 等包装对象增强能力。掌握这些模式能说明你不仅会用 Spring，更理解其架\n构思想，是面试加分项，也便于在自研框架时借鉴。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 56 页、第 57 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q294", "number": 294, "title": "简述 Spring MVC 的整体工作流程。", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 133, "page_end": 134, "answer_original": "Spring MVC 的核心流程由前端控制器 DispatcherServlet 统一调度，共 11 步。①用户发请\n求给 DispatcherServlet。②它调用 HandlerMapping 处理器映射器。③映射器根据 xml 或\n注解找到具体处理器，返回处理器对象及拦截器（HandlerExecutionChain）。\n④DispatcherServlet 调用 HandlerAdapter 适配器。⑤适配器按规则执行具体 Handler\n（Controller）。⑥Controller 执行完返回 ModelAndView。⑦适配器把 ModelAndView\n返回给 DispatcherServlet。⑧DispatcherServlet 将 ModelAndView 交给 ViewResolver 视\n图解析器。⑨解析器解析出具体 View。⑩DispatcherServlet 按 View 渲染视图（把模型数据\n填充进视图）。⑪响应用户。整个过程 DispatcherServlet 作为中央处理器只做调度、不写业\n务，降低了各组件耦合。理解该流程是掌握 Spring MVC 乃至排查 Web 请求问题的基础。\n（来源：Java 面试题_面经_八股文.pdf.txt，约第 51 页、第 53 页；互联网大厂面试题库大\n全.pdf.txt，约第 70 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q295", "number": 295, "title": "DispatcherServlet 在 Spring MVC 中的作用是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 134, "page_end": 134, "answer_original": "DispatcherServlet 是 Spring MVC 的前端控制器（Front Controller），是整个流程控制的\n中心，相当于电脑的 CPU。它的职责是接收用户请求、响应最终结果，自身不处理业务逻\n辑，而是统一调度其他组件：把请求委托给 HandlerMapping 找处理器、交给\nHandlerAdapter 执行、拿到 ModelAndView 后交给 ViewResolver 解析、再完成视图渲染\n并响应。有了它，其他组件（映射器、适配器、解析器、处理器、视图）之间不直接互相调\n用，显著降低了组件耦合度并提高扩展性。它本质上对应 MVC 中的 C（控制器），是全局访\n问入口，承担流程编排与异常处理兜底。在 web.xml 中配置 DispatcherServlet（或 Spring\nBoot 自动注册）后，所有匹配的请求都会先到达它，再由它路由到具体 Controller，是理解\nSpring MVC 架构必须首先掌握的核心组件。（来源：Java 面试题_面经_八股文.pdf.txt，约\n第 51 页、第 53 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q296", "number": 296, "title": "HandlerMapping、HandlerAdapter、ViewResolver 各自职责？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 134, "page_end": 134, "answer_original": "这三个是 DispatcherServlet 调度的核心组件。HandlerMapping（处理器映射器，框架提\n供）负责根据用户请求的 URL 查找对应的 Handler，提供配置文件方式、实现接口方式、注\n解方式等多种映射策略，返回 HandlerExecutionChain（含处理器与拦截器），通过策略模\n式易扩展。HandlerAdapter（处理器适配器，框架提供）按特定规则去执行 Handler，把各\n类处理器包装成统一形态——这是适配器模式的应用，使框架能支持多种类型处理器（如注\n解 Controller、实现 Controller 接口的类）。ViewResolver（视图解析器，框架提供）负责\n视图解析，把 ModelAndView 中的逻辑视图名解析成真正的物理 View（如 jsp、\nfreemarker、pdf、excel），先解析出页面地址再生成 View 对象并渲染。三者都不需要工程\n师开发，由框架提供，开发者只需关注 Handler 与 View 两块业务代码。（来源：Java 面试\n题_面经_八股文.pdf.txt，约第 51 页、第 52 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q297", "number": 297, "title": "Spring MVC 中 Handler（Controller）需要开发者自己开发吗？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 134, "page_end": 135, "answer_original": "是的，Handler（即后端控制器 Controller）通常需要工程师自行开发，因为它是具体用户业\n务请求的处理处。DispatcherServlet 收到请求后虽调度各组件，但真正写业务逻辑、调用\nService、组装数据的代码在 Handler 里，开发者要按 HandlerAdapter 的要求编写（如用\n@Controller 注解类、用@RequestMapping 标注方法），这样适配器才能正确执行。与之\n相对，DispatcherServlet、HandlerMapping、HandlerAdapter、ViewResolver 都由框架\n提供、无需开发；View（jsp/前端页面）也通常由开发者按业务需求制作。编写 Handler 的\n要点是：遵循 HandlerAdapter 约定、保持方法职责单一、通过注解声明路由与参数绑定。这\n也是 Spring MVC\"约定优于配置\"的体现——框架兜底基础设施，业务代码交给开发者，二者\n通过清晰的边界协作。（来源：Java 面试题_面经_八股文.pdf.txt，约第 51 页、第 52 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q298", "number": 298, "title": "如何在 Spring MVC 中实现转发和重定向？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 135, "page_end": 135, "answer_original": "在 Spring MVC 中，转发与重定向通过在返回值前加前缀实现。转发（forward）是在服务器\n内部跳转，浏览器地址栏不变、共享同一请求，写法如 return\n\"forward:user.do?name=method4\"；适合在站内把请求交给另一个处理器继续处理。重定\n向（redirect）是服务器返回 302 让浏览器重新发请求到新地址，地址栏变化、不共享原请求\n属性，写法如 return \"redirect:http://www.baidu.com\"或\"redirect:/xxx\"；适合提交表单后\n防止重复提交（PRG 模式）、或跳转到外部地址。注意：redirect 后的数据需通过\nRedirectAttributes（flash 属性）或 URL 参数传递，因为原 request 已失效；forward 则可\n直接用 Model 共享。理解二者 HTTP 语义差异（是否多一次请求、是否共享 request）是\nWeb 开发基本功，也是面试实操题的常见考点。（来源：Java 面试题_面经_八股文.pdf.txt，\n约第 54 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q299", "number": 299, "title": "Spring MVC 有哪些常用注解？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 135, "page_end": 135, "answer_original": "Spring MVC 常用注解覆盖路由、参数、响应等。@RequestMapping 用于请求 URL 映射，\n可用在类（作为父路径）或方法上；@RequestBody 接收 HTTP 请求的 JSON 数据并反序列\n化为 Java 对象，常用于 REST 接口；@ResponseBody 把 Controller 方法返回对象序列化为\nJSON 响应给客户端，常与@Controller 配合，或直接使用@RestController\n（=@Controller+@ResponseBody）。@PathVariable 绑定 URL 模板变量（如\n/user/{id}）；@RequestParam 绑定请求参数；@RequestHeader 获取请求头；\n@ModelAttribute 预置模型属性；@RestController 专用于 RESTful 服务。在 Spring Boot\n中@GetMapping/@PostMapping 等组合注解是@RequestMapping(method=...)的简\n写，更直观。熟练掌握这些注解能高效开发 Web 接口，也是面试中对 Spring MVC 熟练度的\n基本检验。（来源：Java 面试题_面经_八股文.pdf.txt，约第 54 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q300", "number": 300, "title": "@RequestBody 和@ResponseBody 注解的作用是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 135, "page_end": 136, "answer_original": "这两个注解是实现前后端 JSON 交互的关键。@RequestBody 作用于方法参数，表示把\nHTTP 请求体中的 JSON/XML 数据通过 HttpMessageConverter 反序列化为 Java 对象，常\n用于接收 POST 过来的复杂参数；若前端传 JSON 而方法参数无此注解，Spring 会按表单字\n段逐个绑定而非整体解析 JSON。@ResponseBody 作用于方法，表示把方法返回的 Java 对\n象通过 HttpMessageConverter 序列化为 JSON（或 XML）直接写入响应体返回给客户端，\n而不是走视图解析器找 jsp 页面。二者常成对出现，因此 Spring 提供@RestController 组合\n注解（@Controller+@ResponseBody）简化 REST 接口开发。注意：使用它们需引入\nJackson 等消息转换器依赖，且 Content-Type 要匹配（如 application/json），否则会报\n415/400，这也是联调时的常见故障点。（来源：Java 面试题_面经_八股文.pdf.txt，约第 54\n页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q301", "number": 301, "title": "@RequestMapping 注解可以用在类上和方法上吗？区别是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 136, "page_end": 136, "answer_original": "可以。@RequestMapping 既可用在 Controller 类上，也可用在方法上，二者是父子路径关\n系。用在类上时，表示该类中所有响应请求方法的统一父路径（命名空间），例如类上写\n@RequestMapping(\"/user\")，方法上写@RequestMapping(\"/list\")，则完整访问路径为\n/user/list。仅用在方法上时，路径直接相对于应用根。这种分层写法便于按模块组织路由、\n避免每个方法重复写公共前缀。在 Spring 4.3+还提供了更语义化的组合注解：\n@GetMapping、@PostMapping、@PutMapping、@DeleteMapping、\n@PatchMapping，它们限定了 HTTP 方法，比\n@RequestMapping(method=RequestMethod.GET)更简洁。理解类级与方法级路径拼接\n规则，是开发清晰 RESTful 接口、避免路由冲突的基础，面试中常被用来考察对 MVC 注解的\n掌握程度。（来源：Java 面试题_面经_八股文.pdf.txt，约第 54 页、第 55 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q302", "number": 302, "title": "Spring MVC 和 Struts2 相比有什么优势？Spring MVC 与 Spring 是什么关系？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 136, "page_end": 137, "answer_original": "相比 Struts2，Spring MVC 优势在于：与 Spring 生态无缝集成（IoC/AOP 直接复用，无需\n额外整合）；基于方法级别的映射更灵活，参数绑定更简洁；默认不绑定特定视图，\nViewResolver 支持 jsp/freemarker/pdf 等多种视图；配置更轻、注解驱动开发效率高；围\n绕 DispatcherServlet 的前端控制器模式使结构清晰、组件低耦合。关于 Spring MVC 与\nSpring 的关系：Spring MVC 是 Spring 框架的一个 Web 层模块，并非独立框架——它建立\n在 Core、Context、Beans 之上，可理解为\"Spring 在 Web 上的 MVC 实现\"。网络上常说\n\"Spring MVC 和 Spring 无缝集成\"，实质是 Spring MVC 本就是 Spring 的子模块，因此根\n本不需要像整合 Struts 那样做适配。掌握这层关系，有助于理解为什么 Spring Boot 能零配\n置启用 Web 能力。（来源：Java 面试题_面经_八股文.pdf.txt，约第 53 页、第 64 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q303", "number": 303, "title": "什么是 SpringBoot？为什么要用 SpringBoot？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 137, "page_end": 137, "answer_original": "Spring Boot 是用来简化 Spring 应用初始搭建与开发过程的框架，它用特定方式\n（properties 或 yml）进行配置，可创建独立应用并用 main 方法运行，内嵌 Tomcat 无需部\n署 war，简化 Maven 配置，并通过对应功能的 starter 自动配置 spring。传统\nSpring/Spring MVC 需要配置大量参数，而 Spring Boot 以\"约定大于配置、去繁从简\"的理\n念，让开发者 just run 就能创建独立、产品级的应用。采用它的原因：一是独立运行（内嵌\nTomcat/Jetty，打成可执行 jar 即可跑，依赖全在一个 jar 内）；二是简化配置（starter 自动\n依赖、减少 maven 配置）；三是自动配置（按类路径下的类/jar 自动配置 Bean）；四是无\n代码生成和 XML 配置（靠条件注解完成）；五是提供 actuator 应用监控。这些特性大幅提升\n了开发效率与交付速度。（来源：Java 面试题_面经_八股文.pdf.txt，约第 61 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q304", "number": 304, "title": "SpringBoot 有哪些主要优点？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 137, "page_end": 137, "answer_original": "Spring Boot 优点可归纳为五点。一、独立运行：内嵌 Tomcat、Jetty 等 Servlet 容器，不再\n需要打 war 包部署到外部容器，只需打成可执行 jar、所有依赖都在一个包内即可运行。二、\n简化配置：如 spring-boot-starter-web 启动器自动依赖其他组件，减少 maven 配置。三、\n自动配置：能根据当前类路径下的类/jar 自动配置 Bean，例如加入 spring-boot-starter-\nweb 就拥有 Web 功能，无需额外配置。四、无代码生成和 XML 配置：整个过程无代码生\n成、无需 XML，完全借助条件注解完成，这是 Spring 4.x 核心功能之一。五、应用监控：提\n供 actuator 一系列端点监控服务与应用健康状态。此外它还擅长快速搭建产品就绪应用、与\nSpring Cloud 无缝配合做微服务。这些优点使它成为当前 Java 微服务开发的事实标准脚手\n架。（来源：Java 面试题_面经_八股文.pdf.txt，约第 61 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q305", "number": 305, "title": "@SpringBootApplication 核心注解由哪几个注解组成？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 137, "page_end": 138, "answer_original": "启动类上的@SpringBootApplication 是 Spring Boot 核心注解，它组合了三个关键注解。\n①@SpringBootConfiguration：组合了@Configuration，标注该类为配置类，实现配置文\n件的功能，允许在其中用@Bean 定义组件。②@EnableAutoConfiguration：开启自动配置\n功能，Spring Boot 会据此按类路径自动装配 Bean；若想关闭某个自动配置，可用 exclude\n属性排除，如@SpringBootApplication(exclude = DataSourceAutoConfiguration.class)\n关闭数据源自动配置。③@ComponentScan：开启 Spring 组件扫描，自动发现并注册标注\n了@Component/@Service/@Controller/@Repository 等的 Bean 到容器。正是这三个注\n解的合力，使一个 main 方法启动类既能当配置、又能扫组件、又能自动装配，开发者无需再\n写大量 xml 或显式@Import，是 Spring Boot\"零配置启动\"的入口。（来源：Java 面试题_面\n经_八股文.pdf.txt，约第 61 页、第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q306", "number": 306, "title": "@EnableAutoConfiguration 的作用是什么？如何排除某个自动配置？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 138, "page_end": 138, "answer_original": "@EnableAutoConfiguration 是开启 Spring Boot 自动配置的总开关。启用后，Spring\nBoot 会在 classpath 下扫描所有 META-INF/spring.factories（或\nspring/org.springframework.boot.autoconfigure.AutoConfiguration.imports）中声明的\n自动配置类，结合当前环境（存在的类、配置属性、条件注解）决定是否生效，从而自动把需\n要的 Bean 装配进容器，免去手写 XML。若要关闭某项自动配置，有两种方式：一是在\n@SpringBootApplication 中用 exclude 属性排除，如 exclude =\nDataSourceAutoConfiguration.class，关闭数据源自动配置；二是用\nspring.autoconfigure.exclude 配置项在 properties/yml 中按类名排除。注意排除只是不让\n该自动配置类生效，若你自己用@Bean 定义了相关组件仍会生效。理解它能避免\"引入了某\nstarter 却不想要其默认 Bean\"时的冲突，是实际调优常用手段。（来源：Java 面试题_面经_\n八股文.pdf.txt，约第 61 页、第 62 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q307", "number": 307, "title": "@ComponentScan 的作用是什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 138, "page_end": 138, "answer_original": "@ComponentScan 用于开启 Spring 的组件扫描，是@SpringBootApplication 组合的三个\n注解之一。它的作用是让 Spring 在指定包及其子包下自动发现并注册标注了\n@Component、@Service、@Controller、@Repository、@Configuration 等\nstereotype 注解的类为 Bean，无需逐个 xml 声明。默认扫描范围是启动类所在包及其子\n包，因此约定把主类放在根包（如 com.example.demo）以保证所有组件被扫到；若组件在\n别的包，可用@ComponentScan(basePackages=\"...\")显式指定。它对应传统 XML 中的\n\u003ccontext:component-scan>。结合@SpringBootConfiguration 与\n@EnableAutoConfiguration，三者在启动类上协同：一个负责配置、一个负责自动装配、\n一个负责扫 Bean，共同构成 Spring Boot 零 XML 启动的基石。（来源：Java 面试题_面经_\n八股文.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q308", "number": 308, "title": "什么是 Spring Boot 的自动配置（Auto-configuration）原理？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 138, "page_end": 139, "answer_original": "Spring Boot 自动配置的核心是\"基于条件按需装配\"。启动时@EnableAutoConfiguration\n触发，框架读取所有自动配置类（声明在 META-INF/spring.factories 或 imports 文件），\n每个配置类大量使用@Conditional 系列条件注解（如@ConditionalOnClass：类路径存在\n某类才生效；@ConditionalOnMissingBean：容器无该 Bean 才生效；\n@ConditionalOnProperty：配置项满足条件才生效）。于是框架根据当前 classpath 上的\njar、已定义的 Bean、以及 application 中的配置，智能决定装配哪些 Bean——例如\nclasspath 有 spring-webmvc 就自动配 DispatcherServlet，有 HikariCP 就自动配数据源。\n同时自动配置类通常用@EnableConfigurationProperties 绑定配置属性类，把 yml 值注\n入。这样既\"开箱即用\"又允许开发者用@Bean 覆盖或 exclude 关闭，实现约定与定制的平\n衡。（来源：Java 面试题_面经_八股文.pdf.txt，约第 61 页、第 62 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q309", "number": 309, "title": "Spring Boot 自动配置是如何基于条件注解实现的？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 139, "page_end": 139, "answer_original": "自动配置能\"智能生效\"完全依赖 Spring 的条件注解体系。常见条件注解包括：\n@ConditionalOnClass / @ConditionalOnMissingClass（类路径存在/不存在某类时生\n效），用于判断引入哪些 starter；@ConditionalOnBean / @ConditionalOnMissingBean\n（容器存在/不存在某 Bean 时生效），保证用户自定义 Bean 优先、不重复创建；\n@ConditionalOnProperty（配置属性满足条件时生效），关联 application.yml 开关；\n@ConditionalOnWebApplication（Web 环境时才生效）。框架在构建 Bean 定义阶段按这\n些条件逐个评估，只有全部满足的自动配置类才会注册 Bean。例如\nDataSourceAutoConfiguration 在类路径有 DataSource 且用户没自定义数据源时，才自动\n配内嵌数据源。理解这套机制，就能解释\"为什么加个 starter 就有功能、为什么自己写\n@Bean 能覆盖默认\"，也是排查自动配置不生效的关键思路。（来源：Java 面试题_面经_八\n股文.pdf.txt，约第 61 页、第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q310", "number": 310, "title": "什么是 Spring Boot Starter？它解决了什么问题？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 139, "page_end": 140, "answer_original": "Starter（启动器）是一组可一站式集成到应用的依赖包集合，让开发者无需到处找示例代码\n和依赖坐标，只要引入一个 starter 就能获得某项能力的完整依赖与默认自动配置。它解决的\n问题是：传统 Spring 整合某项技术（如 JPA、Redis）要手动引入多个 jar 并写大量\nxml/Java 配置；而 starter 把这些传递性依赖与自动配置打包，加入依赖即可\"开箱即用\"。例\n如想用 Spring JPA 访问数据库，只需引入 spring-boot-starter-data-jpa，框架自动配置好\nEntityManagerFactory、TransactionManager 等。starter 极大降低了技术集成的门槛与配\n置出错率，体现了\"约定大于配置\"。正因如此，Spring Boot 生态里几乎所有常用技术都有对\n应 starter，它也是 Spring Boot 能快速搭建产品级应用的关键支撑之一。（来源：Java 面试\n题_面经_八股文.pdf.txt，约第 61 页、第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q311", "number": 311, "title": "Starter 的命名规范是什么？官方与第三方有何区别？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 140, "page_end": 140, "answer_original": "Starter 有明确的命名约定，以区分官方与第三方。官方启动器统一以 spring-boot-starter-\n为前缀，后面跟应用类型，如 spring-boot-starter-web、spring-boot-starter-data-jpa、\nspring-boot-starter-data-redis，代表特定功能场景，名称由 Spring Boot 官方保留。第三\n方的启动器不能以 spring-boot-开头（该前缀被官方保留），通常命名为\"技术名-spring-\nboot-starter\"，例如 MyBatis 的 mybatis-spring-boot-starter、Druid 的 druid-spring-\nboot-starter。这样的命名规范让开发者一眼即可判断 starter 归属与可信度，也避免与官方\n命名冲突。Starter 还可按用途分类：应用类启动器、生产类启动器（如 actuator）、技术类\n启动器、以及其他第三方启动器。遵循规范既便于识别，也利于团队统一依赖管理。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 61 页、第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q312", "number": 312, "title": "常用的一些 Spring Boot Starter 有哪些？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 140, "page_end": 140, "answer_original": "常见 starter 可分为官方与第三方两类。官方：spring-boot-starter-web 内嵌 Tomcat 并支\n持 web 开发（servlet 与 jsp）；spring-boot-starter-data-jpa 提供 JPA 数据库访问支持；\nspring-boot-starter-data-redis 提供 Redis 支持；spring-boot-starter-data-solr 提供\nSolr 搜索支持；spring-boot-starter-jdbc 提供 JDBC 与默认数据源；spring-boot-starter-\ntest 提供测试依赖；spring-boot-starter-actuator 提供监控端点；spring-boot-starter-\nsecurity 提供安全认证。第三方：mybatis-spring-boot-starter 是 MyBatis 与 Spring Boot\n的集成 starter；druid-spring-boot-starter 提供阿里 Druid 连接池。实际项目按功能引入对\n应 starter 即可，框架会自动装配好相关 Bean 与默认配置，开发者再按需用 yml 微调，基本\n无需手写集成配置，这正是 starter\"一站式集成\"价值的体现。（来源：Java 面试题_面经_八\n股文.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q313", "number": 313, "title": "举例说明 spring-boot-starter-web 都做了什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 140, "page_end": 141, "answer_original": "spring-boot-starter-web 是最常用的 Web starter，它一站式引入并自动配置好 Web 开发\n所需全部能力。依赖层面：它传递引入 spring-web、spring-webmvc（MVC 核心）、内嵌\nTomcat（tomcat-embed）、Jackson（JSON 序列化）、以及 validation 等，省去开发者\n逐个引入与版本对齐。自动配置层面：由于类路径存在 spring-webmvc，\n@EnableAutoConfiguration 会激活 DispatcherServletAutoConfiguration（注册\nDispatcherServlet）、WebMvcAutoConfiguration（配置视图解析、消息转换、静态资源\n映射等）、HttpMessageConvertersAutoConfiguration（JSON 转换）。结果就是：写一\n个@SpringBootApplication 主类加上@Controller，应用即拥有完整 MVC 能力、内嵌\nTomcat 监听 8080、可处理 REST 请求，全程零 XML。需要改端口、上下文路径等再用\napplication.yml 配置即可，充分体现\"约定大于配置\"。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 62 页、第 64 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q314", "number": 314, "title": "运行 Spring Boot 应用有哪几种方式？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 141, "page_end": 141, "answer_original": "运行 Spring Boot 应用主要有三种方式。①直接执行 main 方法：在 IDE 中运行带\n@SpringBootApplication 的主类的 main 方法，最简单，适合开发调试。②用\nMaven/Gradle 插件运行：通过 spring-boot-maven-plugin 的 run 目标（如 mvn spring-\nboot:run）启动，插件会处理类路径与热加载。③打包部署运行：用 mvn package 打成可执\n行 jar（含内嵌容器与所有依赖），再用 java -jar xxx.jar 在命令行或放到服务器/容器中运\n行；也可打成 war 放到外部 Tomcat（需继承 SpringBootServletInitializer）。三种方式本\n质都是启动 SpringApplication，由它创建并刷新 ApplicationContext。由于内嵌容器，jar\n方式无需外部 Web 服务器，部署极其轻便，这也是 Spring Boot\"独立运行\"优点在生产落地\n的具体形式。（来源：Java 面试题_面经_八股文.pdf.txt，约第 61 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q315", "number": 315, "title": "Spring Boot 需要独立的 Web 容器吗？为什么？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 141, "page_end": 141, "answer_original": "通常不需要。Spring Boot 内嵌了 Tomcat、Jetty 或 Undertow 等 Servlet 容器，应用被打\n成可执行 jar 后，容器随应用一起启动，java -jar 即可独立运行，所有依赖包都在一个 jar\n内，无需再部署 war 到外部容器。这带来显著好处：部署形态简单、环境一致、可随应用一\n起版本化与伸缩。当然 Spring Boot 也支持反向操作——打成 war 包并继承\nSpringBootServletInitializer，部署到外部 Tomcat 等容器，以适应必须使用企业统一外部容\n器的场景。选择建议：微服务/云原生场景优先内嵌 jar，简单高效；传统需要共用外部容器的\n遗留系统才用 war。理解\"内嵌容器\"是 Spring Boot 与传统 Spring MVC（必须外部容器）最\n直观的区别之一，也是其\"独立运行\"优点的技术支撑。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 61 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q316", "number": 316, "title": "如何在 Spring Boot 启动时运行一些特定的代码？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 141, "page_end": 142, "answer_original": "Spring Boot 提供两个接口在应用启动完成后执行自定义代码：ApplicationRunner 和\nCommandLineRunner，二者都只定义一个 run 方法，实现方式相同，且可通过@Order 或\n实现 Ordered 控制执行顺序。区别仅在于参数：ApplicationRunner 的\nrun(ApplicationArguments args)能结构化访问启动参数（支持--key=value 形式的 option\n与 non-option 参数）；CommandLineRunner 的 run(String... args)拿到的是原始命令行参\n数数组。它们会在 Spring 容器刷新完成、所有 Bean 就绪后、应用完全启动前被回调，适合\n做缓存预热、数据库初始化、配置校验、注册到注册中心等一次性启动任务。注意：若任务失\n败抛异常会阻止应用启动，因此要做异常防护。相比用@PostConstruct（Bean 初始化时执\n行），这两个接口更适合\"整个应用启动后\"的全局动作。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q317", "number": 317, "title": "ApplicationRunner 和 CommandLineRunner 有什么区别？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 142, "page_end": 142, "answer_original": "二者都是 Spring Boot 应用启动完成后执行初始化逻辑的钩子，使用方式一致（实现接口、\n重写 run、可用@Order 排序），核心差异在参数形态。ApplicationRunner 接收\nApplicationArguments，它能区分 option 参数（如--env=prod）与 non-option 参数，\n并提供 getOptionNames()、getOptionValues()等方法结构化获取，便于按名读配置；\nCommandLineRunner 接收 String... args，即最原始的命令行参数字符串数组，需要自己解\n析。语义上：若只需拿到原始启动参数、做简单处理，用 CommandLineRunner 更直接；若\n要规范读取带 key 的启动选项，用 ApplicationRunner 更优雅。二者都在容器完全就绪后调\n用，都可用于缓存预热、数据初始化。实际项目中任选其一即可，多个实现类时注意用\n@Order(1)、@Order(2)明确先后，避免顺序依赖混乱。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q318", "number": 318, "title": "什么是 Spring Boot Actuator？它有什么用？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 142, "page_end": 142, "answer_original": "Spring Boot Actuator 是框架提供的生产级监控模块，帮助开发者访问运行中的应用的当前\n状态。它在生产环境中暴露一组可直接作为 HTTP URL 访问的 REST 端点，用于检查和监控关\n键指标，例如/health 查看应用健康状态、/info 查看基本信息、/metrics 查看 JVM 与系统指\n标、/env 查看环境变量与配置、/beans 查看容器中 Bean、/mappings 查看路由映射等。外\n部监控系统可定期拉取这些端点向运维人员触发告警。引入 spring-boot-starter-actuator\n即可启用，端点可通过 management.endpoints.web.exposure.include 显式开放（出于安\n全默认只暴露 health、info）。Actuator 让 Spring Boot 应用具备\"可观测性\"，是微服务生\n产运维必不可少的能力，也常与 Prometheus、Grafana 集成做指标可视化。（来源：Java\n面试题_面经_八股文.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q319", "number": 319, "title": "如何使用 Spring Boot 实现全局异常处理？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 143, "page_end": 143, "answer_original": "Spring Boot 推荐使用@ControllerAdvice（或@RestControllerAdvice）配合\n@ExceptionHandler 实现全局异常处理。做法是写一个被@ControllerAdvice 标注的类，在\n其中用@ExceptionHandler(指定异常类型)标注方法，框架会把所有 Controller 抛出的对应\n异常统一路由到该方法处理，返回统一格式的错误响应（用@ResponseBody 或\n@RestControllerAdvice 直接返回 JSON）。例如\n@ExceptionHandler(NullPointerException.class)处理空指针、\n@ExceptionHandler(MethodArgumentNotValidException.class)处理参数校验失败。还\n可按异常粒度分层处理，并用@ResponseStatus 设置 HTTP 状态码。相比在每个 Controller\n里写 try-catch，全局异常处理实现了异常逻辑的集中化、响应体统一化，是 RESTful 接口的\n最佳实践，也是面试中考察 Web 工程规范性的常见题。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q320", "number": 320, "title": "@ControllerAdvice 和@ExceptionHandler 如何使用？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "mvc", "topic": "Spring MVC 与异常处理", "learning_priority": "核心", "page_start": 143, "page_end": 143, "answer_original": "@ControllerAdvice 是控制器增强注解，本质是一个作用范围为全局的@Component，能拦\n截所有@Controller（或@RestController）抛出的异常；@ExceptionHandler 标注在\nAdvice 类的方法上，声明该方法处理哪一类异常。典型用法：定义类@ControllerAdvice，\n内部写多个方法，如@ExceptionHandler(BusinessException.class)返回业务错误 JSON、\n@ExceptionHandler(Exception.class)兜底返回系统错误、\n@ExceptionHandler(MethodArgumentNotValidException.class)返回参数校验明细，方\n法可带 Exception 参数获取详情并用@ResponseStatus 设状态码。若想直接返回 JSON，用\n@RestControllerAdvice（=@ControllerAdvice+@ResponseBody）更简洁。二者配合实\n现了\"AOP 式的异常统一出口\"，避免重复 try-catch，保证前后端错误格式一致。注意异常匹\n配按\"最具体优先\"，精确异常方法会覆盖 Exception 兜底方法。（来源：Java 面试题_面经_\n八股文.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q321", "number": 321, "title": "Spring Boot 配置文件的加载顺序是怎样的？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 143, "page_end": 144, "answer_original": "Spring Boot 支持多种配置源，且存在明确的优先级（靠后的覆盖靠前的）。常见加载顺序\n（由低到高优先级）：①默认属性（SpringApplication.setDefaultProperties）；\n②@PropertySource 标注的配置；③配置文件 application.properties / application.yml\n（按 profile 区分）；④系统环境变量；⑤命令行参数（--key=value）；此外还有\nbootstrap.yml（在 Spring Cloud 中更早加载，用于连接配置中心）。对于 application.yml\n与 application.properties，yml 与 properties 可共存，同目录下 properties 优先级高于\nyml。高优先级配置会覆盖低优先级的同名项。了解加载顺序对排错很重要——例如命令行参\n数能覆盖配置文件、便于临时改环境，而 bootstrap 用于应用上下文早期就要读取的外部配\n置。这也是 Spring Boot\"外部化配置\"灵活性的体现。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 63 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q322", "number": 322, "title": "application 和 bootstrap 配置文件有什么区别？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 144, "page_end": 144, "answer_original": "Spring Boot 有两个核心配置文件：application 与 bootstrap。application 配置文件最常\n用，主要用于项目自身的自动化配置、各种业务属性（端口、数据源、自定义参数等），由应\n用上下文加载，是开发者最熟悉的配置入口。bootstrap 配置文件主要用于应用启动早期、且\n优先级更高，典型应用场景有三：一、使用 Spring Cloud Config 配置中心时，需在\nbootstrap 中配置连接配置中心的地址、应用名、profile，以便应用上下文启动前先拉取外部\n配置；二、存放一些固定、不能被覆盖的属性；三、用于加密/解密场景（如配置密文在\nbootstrap 阶段解密）。简言之，bootstrap 服务于\"应用启动前置/外部配置\"，application\n服务于\"应用自身运行配置\"。在普通 Spring Boot（非 Cloud）项目中一般只需\napplication，引入 Config 等 Cloud 组件后才需要 bootstrap。（来源：Java 面试题_面经_\n八股文.pdf.txt，约第 63 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q323", "number": 323, "title": "Spring Boot 如何实现热部署？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 144, "page_end": 144, "answer_original": "Spring Boot 实现热部署主要有两种方式。一是 Spring Loaded：一个 JVM 代理，能在应用\n运行时重新加载类的变化（方法体、字节码），无需重启。二是 Spring Boot DevTools\n（spring-boot-devtools）：官方开发工具模块，功能更强——它监听类路径变化，一旦保\n存文件，内嵌 Tomcat 会自动重启（采用\"基础类加载器+重启类加载器\"双加载器策略，只重\n建应用代码，重启更快）；并提供自动属性禁用模板缓存、支持 LiveReload 浏览器自动刷\n新、内置 H2 控制台便于测试。使用方式是在 pom.xml 引入 spring-boot-devtools 依赖并\n设\u003coptional>true\u003c/optional>，注意该模块在生产环境会被自动禁用，不会带来性能负\n担。DevTools 极大消除了\"每次手动部署重启\"的繁琐，是 Java 开发提效的关键工具，也是面\n试中常被问到的开发体验优化点。（来源：Java 面试题_面经_八股文.pdf.txt，约第 63 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q324", "number": 324, "title": "Spring Boot、Spring MVC 和 Spring 三者之间是什么关系？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 144, "page_end": 145, "answer_original": "三者是层次递进关系。Spring 是最底层的框架，核心特征是依赖注入（DI）与控制反转\n（IOC），所有 Spring 模块要么基于 DI 要么基于 IOC，合理使用时能开发松耦合、易单测的\n应用。Spring MVC 是 Spring 提供的 Web 层模块，用 DispatcherServlet、\nModelAndView、ViewResolver 等概念以\"分离式\"方法开发 Web 应用，建立在 Spring\nCore 之上。Spring Boot 则是在 Spring 与 Spring MVC 之上的一层\"加速器\"：传统\nSpring/Spring MVC 需要配置大量参数（web.xml、dispatcherServlet、视图解析等），而\nSpring Boot 通过自动配置和起步依赖解决这一痛点，提供非功能性特征（监控、内嵌容器、\n外部化配置），让开发者更快构建产品就绪应用。一句话：Spring 是内核，Spring MVC 是\nWeb 模块，Spring Boot 是简化整合与启动的脚手架，且 Spring MVC 本就是 Spring 的子\n模块。（来源：Java 面试题_面经_八股文.pdf.txt，约第 64 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q325", "number": 325, "title": "如何理解\"约定大于配置\"在 Spring Boot 中的体现？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "boot", "topic": "Spring Boot 自动配置与运行", "learning_priority": "核心", "page_start": 145, "page_end": 145, "answer_original": "\"约定大于配置\"（Convention over Configuration）是 Spring Boot 的核心理念，指框架预\n先定好合理默认值，开发者只需在偏离默认时才显式配置，从而极大减少样板配置。它在\nSpring Boot 中处处体现：默认内嵌 Tomcat、默认端口 8080、默认\napplication.properties/yml 为配置名、默认扫描主类所在包及其子包的组件、默认按\nclasspath 自动装配 Bean（如引入 web 就自动配 MVC）、默认提供/health 等 actuator 端\n点、starter 按命名约定一站式集成技术。开发者只要遵循这些约定（如把 Bean 放在被扫描\n的包下、用标准文件名），几乎无需写 XML 或 Java 配置即可跑通应用；只有当需要定制（换\n端口、换数据库、排除某自动配置）时才用少量配置覆盖。相比传统 Spring 的大量 xml，这\n正是 Spring Boot\"去繁从简、just run\"的根本原因，也是其提升交付效率的秘诀。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 61 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q326", "number": 326, "title": "Spring 的事件机制（ApplicationEvent）是怎样的？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "events", "topic": "应用事件机制", "learning_priority": "进阶", "page_start": 145, "page_end": 145, "answer_original": "Spring 的事件机制是基于观察者模式实现的轻量级事件总线，用于解耦组件间的消息通知。\n核心角色有三：事件（继承 ApplicationEvent 或其子类的对象，承载消息）、发布者（通过\nApplicationEventPublisher 的 publishEvent()发布）、监听器（实现\nApplicationListener\u003cT>或用@EventListener 注解的方法，监听特定类型事件）。当发布者\n发布事件，容器会把通知派发给所有匹配的监听器，监听器异步或同步处理。它建立在\nApplicationContext 之上——ApplicationContext 本身既是事件源又是广播器。典型用途包\n括：在应用启动完成后做初始化、模块间松耦合通知、审计日志、业务状态变更广播等。相比\n直接方法调用，事件机制让触发方不依赖接收方，降低耦合、提升可扩展性，是 Spring 生态\n中实现\"发布-订阅\"的标准方式。（来源：互联网大厂面试题库大全.pdf.txt，约第 67 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q327", "number": 327, "title": "Spring 提供了哪些内置的 Context 事件？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "events", "topic": "应用事件机制", "learning_priority": "进阶", "page_start": 146, "page_end": 146, "answer_original": "Spring 容器在生命周期关键节点会发布内置的 Context 事件，常见有：\nContextRefreshedEvent——ApplicationContext 被初始化或刷新时触发，此时所有单例\nBean 已加载完成，常用来做启动后校验或缓存预热；ContextStartedEvent——调用\nConfigurableApplicationContext 的 start()方法时触发，表示容器进入运行状态；\nContextStoppedEvent——调用 stop()时触发，表示容器被暂停，已声明的 Bean 还可重\n启；ContextClosedEvent——ApplicationContext 被关闭（调用 close()）时触发，所有单\n例 Bean 被销毁；另有 RequestHandledEvent 等 Web 相关事件。这些事件让开发者能监听\n容器状态变化并执行相应逻辑。注意 ContextRefreshedEvent 在父子容器或 refresh 多次时\n可能被触发多次，监听器里要做幂等防护。掌握内置事件有助于在正确的生命周期节点插入自\n定义行为。（来源：互联网大厂面试题库大全.pdf.txt，约第 67 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q328", "number": 328, "title": "如何自定义并发布一个 Spring 事件？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "events", "topic": "应用事件机制", "learning_priority": "进阶", "page_start": 146, "page_end": 146, "answer_original": "自定义事件分三步。第一，定义事件类：继承 ApplicationEvent（或 Spring 4.2+起直接是任\n意 POJO 对象，无需继承），构造时传入消息载体。第二，发布事件：在需要触发的 Bean 中\n注入 ApplicationEventPublisher（或实现 ApplicationEventPublisherAware 拿到发布\n器），调用 publishEvent(new MyEvent(this, data))发布；Spring Boot 中也可直接注入\nApplicationEventPublisher。第三，监听事件：两种方式——实现\nApplicationListener\u003cMyEvent>并注册为 Bean，方法 onApplicationEvent 中处理；或写\n任意 Bean 方法加@EventListener(MyEvent.class)注解，框架自动适配。若需异步处理，可\n在监听方法所在类或方法上配合@Async（并开启@EnableAsync），但要注意异步下异常不\n会回传给发布者。该机制适合做业务解耦通知、审计、缓存失效广播等场景。（来源：互联网\n大厂面试题库大全.pdf.txt，约第 67 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q329", "number": 329, "title": "ApplicationListener 和@EventListener 如何使用？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "events", "topic": "应用事件机制", "learning_priority": "进阶", "page_start": 146, "page_end": 147, "answer_original": "二者都是监听 Spring 事件的方式。ApplicationListener 是接口方式：写一个实现\nApplicationListener\u003c具体事件类型>的类并注册为 Bean，重写 onApplicationEvent(事件)\n方法，容器在匹配事件发布时回调；优点是类型安全、与旧版本兼容。@EventListener 是注\n解方式（Spring 4.2+）：在任意 Bean 的普通方法上加@EventListener(事件类型.class)，方\n法参数为该事件对象即可，无需实现接口、写法更简洁，还可用\n@EventListener(condition=\"...\")按 SpEL 条件过滤、用@Order 排序多个监听器。二者并存\n时注解方式更流行。若要让监听异步执行，在监听器方法加@Async 并启用@EnableAsync；\n若监听特定事件后还想再发事件，方法可直接 return 一个新事件对象，框架会链式发布。选\n择上优先@EventListener 以获得更低侵入与更高可读性。（来源：互联网大厂面试题库大\n全.pdf.txt，约第 67 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q330", "number": 330, "title": "Spring 中事务的 ACID 特性分别指什么？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 147, "page_end": 147, "answer_original": "事务的 ACID 是数据库一致性的四大基石。A 原子性（Atomicity）：事务内所有操作要么全\n部完成、要么全不做，只要有一个失败整个事务就失败并回滚，如银行转账从 A 扣款与向 B\n入账必须同时成功或同时撤销。C 一致性（Consistency）：事务运行前后数据库始终处于一\n致状态，不会因事务破坏业务约束。I 独立性/隔离性（Isolation）：并发事务互不干扰，一个\n事务访问的数据若正被另一未提交事务修改，则不受其影响。D 持久性（Durability）：事务\n一旦提交，修改就永久保存，即使宕机也不丢失。Spring 的事务管理（@Transactional、\nPlatformTransactionManager）正是围绕这四大特性构建，底层委托给数据库（如 JDBC、\nJPA）实现。理解 ACID 是掌握 Spring 事务传播与隔离的前提，也是面试中事务章节的基础\n问答。（来源：阿里面试.pdf.txt，约第 30 页）", "version_review_recommended": false, "related_question_ids": ["Q331", "Q332", "Q333", "Q367", "Q372", "Q373", "Q374", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q331", "number": 331, "title": "数据库并发事务会带来哪些问题？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 147, "page_end": 147, "answer_original": "多个事务并发执行时若隔离不当，会产生三类经典问题。脏读（Dirty Read）：事务 A 读到\n事务 B 尚未提交的数据，若 B 回滚，A 读到的就是无效的\"脏\"数据。不可重复读\n（Unrepeatable Read）：事务 A 内多次读同一数据，期间事务 B 修改并提交了该数据，导\n致 A 两次读到的值不一致，重点在于\"已有记录的列被修改\"。幻读（Phantom Read）：事务\nA 按条件查询出若干行，事务 B 插入/删除了符合条件的新记录并提交，A 再次查询时发现行\n数变多或变少，像产生幻觉，重点在于\"新增或删除导致记录集变化\"。这三者严重程度递增，\n解决手段是提升隔离级别（读已提交防脏读、可重复读防不可重复读、串行化防幻读）。理解\n这三者的定义与区别，是正确选择 Spring/数据库事务隔离级别、设计并发安全业务的基础。\n（来源：Java 面试题_面经_八股文.pdf.txt，约第 69 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q332", "Q333", "Q367", "Q372", "Q373", "Q374", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q332", "number": 332, "title": "Spring/SQL 定义了哪几种事务隔离级别？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 147, "page_end": 148, "answer_original": "SQL 标准定义四种事务隔离级别，Spring 的 Isolation 枚举与之对应。READ-\nUNCOMMITTED（读未提交）：最低级别，允许读未提交数据，脏读、不可重复读、幻读都\n可能发生。READ-COMMITTED（读已提交）：只读取已提交数据，可阻止脏读，但不可重\n复读与幻读仍可能。REPEATABLE-READ（可重复读）：同一字段多次读取结果一致（除非本\n事务自己改），阻止脏读和不可重复读，幻读仍可能。SERIALIZABLE（串行化）：最高级\n别，事务逐个依次执行，完全防止脏读、不可重复读、幻读，但并发性能最差。Spring 通过\n@Transactional(isolation=...)指定，最终由底层数据库实现；注意并非所有数据库都支持全\n部级别（如 Oracle 不支持 REPEATABLE-READ，默认 READ-COMMITTED）。根据业务对\n一致性与并发的要求权衡选择，是事务设计的关键决策。（来源：Java 面试题_面经_八股\n文.pdf.txt，约第 69 页、第 70 页）", "version_review_recommended": false, "related_question_ids": ["Q330", "Q331", "Q333", "Q367", "Q372", "Q373", "Q374", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q333", "number": 333, "title": "MySQL 的默认事务隔离级别是什么？为何能避免幻读？", "group_id": "data", "group": "数据库与缓存", "topic_id": "db-tx", "topic": "ACID、隔离级别与 MVCC", "learning_priority": "核心", "page_start": 148, "page_end": 148, "answer_original": "MySQL 的 InnoDB 存储引擎默认隔离级别是 REPEATABLE-READ（可重复读），可通过\nSELECT @@tx_isolation 查看。与 SQL 标准不同，InnoDB 在 REPEATABLE-READ 下使用\nNext-Key Lock（间隙锁+记录锁）算法：它不仅锁住命中的记录，还锁住记录之间的间隙，\n从而阻止其他事务在范围内插入新行，因此能避免幻读的产生。这使得 InnoDB 的默认级别其\n实已能达到 SQL 标准 SERIALIZABLE 的隔离效果，但并没有性能损失（其他数据库如 SQL\nServer 在同级别下仍需额外手段防幻读）。在分布式事务场景下 InnoDB 一般会用\nSERIALIZABLE。由于隔离级别越低请求锁越少，多数数据库默认 READ-COMMITTED，而\nInnoDB 选 REPEATABLE-READ 兼顾一致性与性能，是面试中常考的\"MySQL 特性\"知识点。\n（来源：Java 面试题_面经_八股文.pdf.txt，约第 69 页、第 70 页）", "version_review_recommended": true, "related_question_ids": ["Q330", "Q331", "Q332", "Q367", "Q372", "Q373", "Q374", "Q375", "Q376", "Q377", "Q409"]}, {"id": "Q334", "number": 334, "title": "什么是分布式事务？为什么微服务中需要它？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-tx", "topic": "分布式事务：XA、3PC 与 TCC", "learning_priority": "进阶", "page_start": 148, "page_end": 148, "answer_original": "分布式事务用于在分布式系统中保证不同节点之间的数据一致性，即跨多个独立服务/数据库\n的操作要么全部成功、要么全部回滚。微服务架构下，一次业务（如电商下单）往往跨越订\n单、库存、账户等多个服务，各自持有独立数据库。若没有分布式事务，可能出现\"订单创建\n成功但库存扣减失败\"这类部分成功、部分失败的不一致状态，破坏业务完整性。经典实现如\nXA 协议（两阶段提交）：事务协调者先向所有参与者发 Prepare，参与者各自执行写\nUndo/Redo Log 但不提交，全部就绪后协调者发 Commit，参与者才本地提交并释放锁；任\n一参与者失败则统一 Abort 回滚。由于地理分布与高性能要求，大型系统很少用强一致 XA，\n而倾向 TCC、消息队列（MQ 事务）、Saga 等最终一致性方案。理解分布式事务是微服务面\n试的进阶考点。（来源：阿里面试.pdf.txt，约第 5 页、第 83 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q335", "number": 335, "title": "XA 协议两阶段提交的过程是怎样的？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "dist-tx", "topic": "分布式事务：XA、3PC 与 TCC", "learning_priority": "进阶", "page_start": 148, "page_end": 149, "answer_original": "XA 是 Oracle Tuxedo 提出的分布式事务协议，用两阶段提交（2PC）保证跨节点一致性。第\n一阶段（Prepare）：事务协调者向所有参与者发送 Prepare 请求，每个参与者在本地执行与\n事务相关的数据更新并写 Undo Log 与 Redo Log，但不提交，仅返回\"完成\"给协调者。第二\n阶段（Commit/Rollback）：若协调者收到所有参与者正向返回，则发 Commit，参与者各\n自本地提交并释放锁，再回报完成；若第一阶段有任一参与者失败，协调者向所有参与者发\nAbort，参与者依据 Undo Log 做本地回滚。两阶段提交优点是强一致，缺点明显：协调者单\n点、全程持锁导致性能差与阻塞，网络分区时可能长时间挂起。因此互联网大厂在极致性能场\n景下多改用 TCC、可靠消息最终一致等弱一致方案。理解 2PC 流程与缺陷，是评估分布式事\n务方案取舍的基础。（来源：阿里面试.pdf.txt，约第 83 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q336", "number": 336, "title": "什么是 Spring 中的循环依赖？它是如何产生的？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 149, "page_end": 149, "answer_original": "循环依赖指两个或多个 Bean 互相持有对方的引用，形成闭环，例如 Bean A 依赖 Bean B，\n而 Bean B 又依赖 Bean A（甚至 A→B→C→A 更长链）。在 Spring 中它通常在属性注入\n（setter/字段）阶段产生：容器实例化 A 后准备注入 B，发现 B 未创建便去创建 B，创建 B\n时又需要注入 A，而 A 尚未初始化完成，于是形成\"你等我、我等你\"的僵局。构造器注入最容\n易暴露此问题——因为构造 A 必须先把 B 构造好、构造 B 又必须先构造 A，启动即报错\n（BeanCurrentlyInCreationException）。Spring 通过\"三级缓存\"机制解决了单例作用域\n下、基于 setter/字段注入的循环依赖，使 A 在半成品状态下先被提前暴露引用给 B，B 完成\n后再回头完成 A，从而打破死锁。理解循环依赖的成因是排查启动异常的第一步。（来源：\nJava 面试题_面经_八股文.pdf.txt，约第 47 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q337", "number": 337, "title": "Spring 是如何通过三级缓存解决循环依赖的？", "group_id": "spring", "group": "Spring 与应用开发", "topic_id": "ioc", "topic": "IoC、Bean 生命周期与循环依赖", "learning_priority": "核心", "page_start": 149, "page_end": 149, "answer_original": "Spring 用三个 Map（三级缓存）解决单例 setter/字段注入的循环依赖。一级\nsingletonObjects 存放完全初始化好的单例 Bean；二级 earlySingletonObjects 存放提前暴\n露的半成品（已实例化未填充属性）Bean；三级 singletonFactories 存放 ObjectFactory，\n用于生成早期引用（尤其是 AOP 代理）。流程：创建 A
