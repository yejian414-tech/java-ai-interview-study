y": "选读", "page_start": 295, "page_end": 295, "answer_original": "标准自注意力对长度为 n、维度 d 的序列，计算每对 token 相似度，时间复杂度 O(n²·d)、\n空间复杂度 O(n²)（存注意力矩阵）或 O(n·d)（KV Cache 外的激活）。长序列下 O(n²) 成瓶\n颈。优化思路：一、稀疏/局部注意力（Longformer、BigBird）只算局部+全局窗口；二、\n线性注意力用核技巧近似，复杂度降至 O(n·d²)；三、FlashAttention 通过 IO 感知分块计算\n减少显存与加速，不改变结果；四、KV Cache 与 PagedAttention 优化显存；五、长上下文\n模型用稀疏+局部窗口（如 Mistral 滑动窗口）。工程选型和任务长度、硬件强相关。（外部\n补充：FlashAttention 论文；Longformer/BigBird 论文；Attention Is All You Need）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q781", "number": 781, "title": "Transformer 中的残差连接与 Layer Normalization 起什么作用？Pre-LN 与 Post- LN 有何差异？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "transformer", "topic": "Transformer 与模型结构", "learning_priority": "选读", "page_start": 295, "page_end": 295, "answer_original": "残差连接把子层输入直接加到输出（x + Sublayer(x)），缓解深层网络梯度消失、便于信息\n流动；LayerNorm 对单样本特征维度归一化，稳定训练分布。原始 Transformer 用 Post-\nLN（归一化在残差之后），但深层易训练不稳定；现代大模型普遍采用 Pre-LN（归一化在子\n层之前），训练更平稳、对学习率更鲁棒，虽理论收敛略慢但工程上更稳。此外有\nRMSNorm（仅去均值方差的均方根归一，省去均值中心化）被广泛采用（LLaMA、\nQwen）。这些归一化选择直接影响大规模训练的稳定性与最终效果。（外部补充：LLaMA\n技术报告（RMSNorm）；Transformer 论文；Pre-LN 相关研究）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q782", "number": 782, "title": "解码阶段的温度（Temperature）、Top-k、Top-p 采样分别控制什么？如何调？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "inference", "topic": "推理、量化与部署加速", "learning_priority": "选读", "page_start": 295, "page_end": 296, "answer_original": "它们控制生成随机性与多样性。Temperature 缩放 softmax 前 logits：值越低分布越尖、输\n出更确定保守（接近 greedy），越高越随机多样；Top-k 仅在概率最高的 k 个 token 中采\n样，过滤长尾噪声；Top-p（核采样）按累计概率截取最小集合，动态控制候选数，比固定 k\n更自适应。调参：代码/事实类任务用低温（0.1~0.3）或贪心，保证准确；创意/发散任务用\n较高温（0.7~1.0）+ Top-p 0.9；一般对话默认 temp 0.7、top_p 0.9。注意过高温度会加\n剧幻觉与不连贯，需结合任务与评测调优。（外部补充：Holtzman et al. 核采样（The\nCurious Case of Neural Text Degeneration）；OpenAI 采样参数文档）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q783", "number": 783, "title": "大模型分布式训练的三种并行策略（数据/张量/流水线）分别是什么？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "training", "topic": "预训练、微调与偏好对齐", "learning_priority": "选读", "page_start": 296, "page_end": 296, "answer_original": "一、数据并行（DP）：每卡持有完整模型副本，按 batch 切分数据，梯度同步\n（AllReduce），实现简单、通信量在梯度；二、张量并行（TP）：把单层权重矩阵纵向/横\n向切到多卡，每层需频繁 AllReduce，适合单卡放不下的大层，通信密集；三、流水线并行\n（PP）：按层把模型切到不同卡，微批次流动，减少单卡显存但存在气泡。实际大模型用 3D\n混合并行（如 Megatron-LM、DeepSpeed ZeRO）兼顾显存与通信。ZeRO 通过分片优化\n器/梯度/参数进一步省显存。选型取决于模型规模、集群拓扑与互联带宽。（外部补充：\nMegatron-LM、DeepSpeed ZeRO 论文；PyTorch 分布式文档）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q784", "number": 784, "title": "请介绍 FlashAttention 的原理与它对训练/推理性能的提升。", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "inference", "topic": "推理、量化与部署加速", "learning_priority": "选读", "page_start": 296, "page_end": 296, "answer_original": "FlashAttention 是一种 IO 感知的精确注意力算法，核心是用分块（tiling）将 Q/K/V 分块载\n入高速 SRAM，在片上完成 softmax 与加权求和，避免将巨大的 n×n 注意力矩阵写入慢速\nHBM，从而大幅减少显存占用与内存访问。它不改变数学结果（精确而非近似），因此数值\n一致。收益：训练/推理速度显著提升（可达数倍），显存随序列长度近似线性而非平方增\n长，使长上下文训练可行；已成为主流框架（vLLM、Hugging Face、Megatron）默认组\n件。限制是需要特定 GPU 架构支持（如 Ampere+）。它是近年长上下文与高效训练的关键\n引擎。（外部补充：FlashAttention (Dao et al., 2022) 与 FlashAttention-2 论文）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q785", "number": 785, "title": "什么是 MoE（混合专家）架构？它为什么能降低大模型推理成本？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "transformer", "topic": "Transformer 与模型结构", "learning_priority": "选读", "page_start": 296, "page_end": 297, "answer_original": "MoE（Mixture of Experts）在 Transformer 的前馈层用多个“专家”子网络替代单一\nFFN，并加一个门控（router）为每个 token 动态选择 Top-k 个专家计算，其余专家不激\n活。原理：模型总参数量可做得很大（容量高），但每个 token 仅激活少量参数，从而在保\n持/提升能力的同时大幅降低单次推理的计算量（FLOPs）。代表有 Mixtral、GPT-4（据\n传）、Qwen-MoE。优势：相同算力预算下容量更大、训练与推理更高效；挑战：显存需容\n纳全部专家（参数量大）、路由不均（负载均衡损失）、部署复杂。它是“以参数量换能力、\n以稀疏激活换效率”的范式。（外部补充：Mixtral 技术报告；Switch Transformer 论文；\nGShard 论文）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q786", "number": 786, "title": "什么是 DPO（直接偏好优化）？相比传统 RLHF 它简化了什么？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "training", "topic": "预训练、微调与偏好对齐", "learning_priority": "选读", "page_start": 297, "page_end": 297, "answer_original": "DPO（Direct Preference Optimization）用一种巧妙的重参数化，将“训练奖励模型+PPO\n强化学习”两步合并为一步直接基于偏好数据（同一提示的选中/拒绝回答对）做监督式损失\n优化，无需显式奖励模型，也无需 RL 采样循环。它简化了 RLHF 的复杂 pipeline，避免了\nPPO 的训练不稳定、奖励 hacking 与高工程成本，训练更稳定、易实现。代价是对偏好数据\n质量与覆盖度更敏感，且理论 guarantees 略弱于完整 RLHF。实践中 DPO 已成为众多开源\n模型对齐的首选（如 Zephyr、Qwen 对齐变体），常与 SFT 配合。（外部补充：DPO 论文\n（Rafailov et al., 2023）；InstructGPT/PPO 对照）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q787", "number": 787, "title": "主流 LLM 评测基准 MMLU、GSM8K、HumanEval 分别考察什么能力？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "ai-evals", "topic": "Agent 与模型效果评估", "learning_priority": "核心", "page_start": 297, "page_end": 297, "answer_original": "MMLU（Massive Multitask Language Understanding）覆盖 57 个学科、约万道多选题，\n考察模型广泛知识与零样本/少样本下的学科推理；GSM8K 是小学数学应用题数据集，考察\n多步算术与链式推理能力，是检验 CoT 效果的常用基准；HumanEval 用编程题考察代码生\n成能力，以“能否通过单元测试（pass@k）”衡量，关注功能正确性而非表面相似。三者分\n别映射“知识广度、数学推理、代码能力”，是模型能力画像的核心指标。使用时需注意数据\n污染与语言/领域偏差，并结合中文/业务场景补充自有评测。（外部补充：MMLU\n(Hendrycks et al.)、GSM8K (Cobbe et al.)、HumanEval (Chen et al.) 论文）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q788", "number": 788, "title": "企业落地 RAG 时，向量数据库选型应关注哪些维度？请对比几类方案。", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "embeddings", "topic": "Embedding、向量库与索引", "learning_priority": "核心", "page_start": 297, "page_end": 297, "answer_original": "选型维度：数据规模、查询 QPS 与延迟、是否需向量+标量混合过滤、部署形态（托管/自托\n管）、成本、生态与易用性。方案对比：一、FAISS 是高性能库，需自行封装服务，适合嵌入\n应用；二、Milvus 功能全、支持十亿级、分布式，适合大规模生产；三、Qdrant 轻量易部\n署、Rust 实现、过滤友好；四、pgvector 复用 Postgres，事务与关系数据一体，中小规模\n便利；五、Pinecone/腾讯云向量等托管服务免运维。经验：百万级以内 Qdrant/pgvector\n足够，超大规模选 Milvus；务必配合重排与监控召回率。（外部补充：Milvus、Qdrant、\npgvector、FAISS、Pinecone 官方文档）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q789", "number": 789, "title": "模型如何扩展上下文窗口（Context Extension）？位置插值（PI）与 NTK 是什 么？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "transformer", "topic": "Transformer 与模型结构", "learning_priority": "选读", "page_start": 297, "page_end": 298, "answer_original": "扩展上下文窗口常见方法：一、位置插值（Position Interpolation, PI），将训练好的位置编\n码线性压缩到更长范围，使新位置仍在模型见过区间，再少量微调适应；二、NTK-aware 缩\n放，对 RoPE 的 base 做非线性调整，更平滑地外推而无需大量微调；三、YaRN 等方法结合\n维度加权与 NTK，效果更好；四、长上下文继续预训练（用长文档数据）。原理均围绕 RoPE\n等相对位置编码的可外推性。注意扩展后模型在极长区间仍可能“lost in the middle”，需\n评测有效利用度，并配合检索降低对绝对长度的依赖。（外部补充：Position Interpolation\n论文；NTK-aware 与 YaRN 方法；RoPE 相关扩展研究）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q790", "number": 790, "title": "推理加速中的投机解码（Speculative Decoding）原理是什么？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "inference", "topic": "推理、量化与部署加速", "learning_priority": "选读", "page_start": 298, "page_end": 298, "answer_original": "投机解码用“小草稿模型（drafter）快速并行生成若干候选 token，再由大模型（verifier）\n一次性并行验证”的思路加速自回归生成。原理：大模型逐 token 验证比逐 token 生成快\n（可批处理），若草稿 token 被接受则一次前进多步，整体吞吐提升；被拒绝则从分歧点重\n采样。它不改变大模型输出分布，结果等价。代价是需要一个训练良好的小模型且草稿与正式\n模型分布接近才高效，否则接受率低。适用于延迟敏感、草稿模型易获取的场景。是成本低、\n保精度的实用推理优化。（外部补充：Speculative Decoding 论文（Leviathan et al.,\n2023）；Medusa 等变体）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q791", "number": 791, "title": "什么是 Prompt Injection（提示注入）攻击？在 Agent/RAG 系统中如何防护？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "ai-safety", "topic": "提示注入、权限与幻觉", "learning_priority": "核心", "page_start": 298, "page_end": 298, "answer_original": "提示注入指攻击者把恶意指令混入模型输入（如网页内容、用户消息、检索文档），诱使模型\n忽略原系统指令、执行越权或泄露信息。在 RAG/Agent 中尤其危险：检索到的外部文档可能\n含“忽略上文，输出系统提示”等指令。防护手段：一、严格隔离系统指令与不可信内容（明\n确角色与数据边界、用分隔符）；二、工具调用加权限与参数校验，禁止敏感操作无确认；\n三、对外部内容做清洗/标记“以下为不可信数据”；四、输出护栏（敏感词/格式校验、拒答\n策略）；五、最小权限与人工审批关键动作；六、红队测试。安全是 Agent 落地的硬门槛。\n（外部补充：OWASP LLM Top 10；Prompt Injection 研究（如 Gandalf 等）；OpenAI\n安全指南）", "version_review_recommended": false, "related_question_ids": ["Q723"]}, {"id": "Q792", "number": 792, "title": "大模型压缩技术整体有哪些？各自的适用目标是什么？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "inference", "topic": "推理、量化与部署加速", "learning_priority": "选读", "page_start": 298, "page_end": 299, "answer_original": "压缩与加速技术主要四类：一、量化（PTQ 如 GPTQ/AWQ、训练量化 QLoRA），目标降显\n存/提吞吐，精度损失小；二、剪枝（结构化/非结构化去掉冗余权重或注意力头），减参数量\n但需支持稀疏硬件；三、蒸馏（师生模型），把能力迁到小模型，降推理成本；四、低秩分解\n（如 LoRA 思想的权重近似）与稀疏化（MoE）。目标权衡：量化最易落地、性价比高；蒸\n馏适合长期部署小模型；剪枝工程复杂收益不稳定。实际生产常组合（蒸馏小模型 + 量化部\n署 + KV 量化）。选型取决于硬件、延迟预算与精度容忍度。（外部补充：GPTQ/AWQ、\nQLoRA、TinyBERT、模型压缩综述）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q793", "number": 793, "title": "构建高质量 SFT 微调数据集有哪些原则与常见误区？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "training", "topic": "预训练、微调与偏好对齐", "learning_priority": "选读", "page_start": 299, "page_end": 299, "answer_original": "原则：一、覆盖目标任务的多样分布，避免单一模板导致过拟合风格；二、指令清晰、回答准\n确且符合期望格式；三、多轮对话数据保留真实上下文与角色边界；四、质量过滤（去重、去\n错、去有毒），宁可少而精；五、加入拒答/安全样本提升鲁棒；六、与评测集分布对齐以便\n验证。常见误区：用大量低质机器生成数据堆量导致能力退化；只做正向样本忽略边界与拒\n答；格式不统一增加训练噪声；数据泄漏到测试集；忽视系统提示一致性。建议小步迭代、用\n消融实验验证数据贡献。数据质量决定微调上限。（外部补充：LIMA（“Less Is More”对\n齐研究）；InstructGPT 数据构建；各开源 SFT 数据集说明）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q794", "number": 794, "title": "请对比主流推理/部署框架 vLLM、TGI、llama.cpp 的适用场景。", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "inference", "topic": "推理、量化与部署加速", "learning_priority": "选读", "page_start": 299, "page_end": 299, "answer_original": "vLLM：高吞吐、PagedAttention、连续批处理，支持张量并行与多种量化，适合服务端高并\n发生产；TGI（Text Generation Inference，Hugging Face）：集成度高、支持流式与量\n化、易部署开源模型，适合 HF 生态快速上线；llama.cpp：基于 GGML/GGUF 的 CPU/GPU\n边缘推理，量化极致、可在笔记本/手机跑，适合本地、离线、低资源场景。对比：云端高\nQPS 选 vLLM；HF 生态快速服务选 TGI；端侧/隐私本地选 llama.cpp。均需关注模型格式转\n换、量化精度与批处理配置。工程常按“云端 vLLM + 端侧 llama.cpp”组合。实际选型还应\n结合团队运维能力、模型格式兼容性与授权条款综合判断，避免只看基准而忽视落地成本。\n（外部补充：vLLM、TGI、llama.cpp 官方文档与仓库）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q795", "number": 795, "title": "请描述一个 AI 应用从 0 到 1 落地的典型流程与风险点。", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "ai-engineering", "topic": "模型接入、可观测性与成本", "learning_priority": "核心", "page_start": 299, "page_end": 299, "answer_original": "典型流程：明确业务问题与验收指标 → 选型（API/开源、是否 RAG/微调/Agent）→ 原型\n（最小链路，验证可行性）→ 数据与知识建设（语料、向量库、评测集）→ 工程化服务（网\n关、缓存、限流、可观测）→ 安全对齐与红队 → 灰度上线与监控（质量/时延/成本/投诉）\n→ 迭代。风险点：一、需求模糊导致无验收标准；二、盲目微调忽视 RAG 更优；三、评测缺\n失靠主观；四、成本/延迟失控；五、幻觉与安全事件；六、数据合规与隐私；七、模型版本\n漂移。落地成功关键在“小步快跑+量化评测+护栏”，而非一次性追求模型能力最大化。\n（外部补充：LLMOps 实践指南；各厂商落地白皮书；MLOps 原则）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q796", "number": 796, "title": "什么是编码器输出的句向量？如何用 BERT 类模型得到高质量句子表征？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "embeddings", "topic": "Embedding、向量库与索引", "learning_priority": "核心", "page_start": 299, "page_end": 300, "answer_original": "句向量是把整句编码为固定维度向量，用于语义相似、聚类、检索。BERT 原生用 [CLS] 向量\n或各 token 平均池化，但未经对比训练的句向量在语义空间分布不均、表现差。提升质量方\n法：一、用 Sentence-BERT（SBERT）在句对相似任务上微调，使余弦相似度有意义；二、\n采用专门嵌入模型（BGE、M3E、E5），经大规模对比学习训练，支持长文本与多语言；\n三、正确池化（mean-pooling + 归一化）并统一编码模型；四、领域适配可用领域内数据继\n续微调。注意务必 L2 归一化后用 cosine，且查询与文档同模型同维度。句向量质量是检索系\n统地基。（外部补充：Sentence-BERT 论文；BGE/M3E/E5 模型文档）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q797", "number": 797, "title": "大模型训练中的 Loss Spike（损失尖峰）是什么？如何排查与缓解？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "training", "topic": "预训练、微调与偏好对齐", "learning_priority": "选读", "page_start": 300, "page_end": 300, "answer_original": "Loss Spike 指训练 loss 突然出现大幅上跳后再回落，常见于大规模预训练，可能拖慢收敛甚\n至不稳定。可能原因：一、学习率过高或 warmup 不足；二、数据批次含异常/噪声样本或长\n度突变；三、数值不稳定（注意力/softmax 溢出、混合精度 underflow/overflow）；四、\n注意力掩码或位置编码错误；五、硬件/通信异常。排查与缓解：做梯度裁剪与合理\nwarmup；用 AMP/bf16（bf16 更稳定）；检查数据管道与异常 batch；监控注意力/激活数\n值范围；记录 spike 对应 step 的数据；必要时回滚到 spike 前 checkpoint 重训。bf16 + 稳\n定优化器（AdamW）是主流稳训组合。（外部补充：LLaMA/PaLM 训练稳定性经验；\nAMP/bf16 文档；大规模训练实践）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q798", "number": 798, "title": "什么是灾难性遗忘（Catastrophic Forgetting）？微调时如何缓解？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "training", "topic": "预训练、微调与偏好对齐", "learning_priority": "选读", "page_start": 300, "page_end": 300, "answer_original": "灾难性遗忘指模型在学习新任务后显著丢失原有能力（如微调领域数据后通用对话能力骤\n降）。成因：新数据分布单一、学习率过大、训练步数过多导致权重偏离预训练最优。缓解：\n一、使用参数高效方法（LoRA/Adapter）只动少量参数，保留基座；二、控制学习率与\nepoch，早停；三、在微调数据中混入一定比例通用/原分布数据（replay）；四、采用持续\n学习策略（正则如 EWC）；五、先做 SFT 再轻量对齐，避免全量长训。实践中 LoRA + 小学\n习率 + 数据多样性是性价比最高的防遗忘组合。需以评测验证通用能力未退化。（外部补\n充：Catastrophic Forgetting 研究；LoRA/Adapter 缓解遗忘；持续学习综述）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q799", "number": 799, "title": "请说明 Function Calling 与 ReAct 两种 Agent 实现路线的关系与差异。", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "tool-use", "topic": "工具调用与结构化参数", "learning_priority": "核心", "page_start": 300, "page_end": 301, "answer_original": "Function Calling（原生工具调用）是模型经对齐训练，能直接输出结构化 tool_calls（函数\n名+JSON 参数），由框架解析执行，规范、可靠、适合确定性强的工作流；ReAct 则把推理\n（Thought）与行动（Action/Observation）以自然语言+工具调用交织在提示中，更灵\n活、可解释、能处理开放式探索。二者关系：现代 Agent 常以 Function Calling 为底层执行\n机制（保证参数准确），而用 ReAct 风格的提示/规划来组织多步推理与决策，即“ReAct 思\n路 + Function Calling 执行”。差异在于前者重规范执行、后者重过程推理。落地常结合，\n兼顾可靠性与智能性。（外部补充：OpenAI Function Calling；ReAct 论文；LangChain\nAgent 文档）", "version_review_recommended": false, "related_question_ids": ["Q682", "Q686", "Q708", "Q709", "Q766", "Q767", "Q768", "Q769"]}, {"id": "Q800", "number": 800, "title": "在 RAG 系统中，检索召回质量不佳时应从哪些环节排查与优化？", "group_id": "ai", "group": "AI 应用、Agent 与模型", "topic_id": "rag", "topic": "RAG 全链路与质量优化", "learning_priority": "核心", "page_start": 301, "page_end": 301, "answer_original": "排查链路：一、嵌入模型是否适配领域/语言，通用模型对垂直术语差，可换专用或微调嵌\n入；二、切片策略是否合理，过大/过小或割裂语义都降召回，调 chunk 大小与重叠；三、检\n索参数（Top-K、相似度阈值）是否合适，K 太小漏召回、太大引入噪声；四、相似度度量与\n归一化是否一致；五、是否需元数据过滤（时间/来源）缩小范围；六、加入重排\n（reranker，如 Cross-Encoder）提升精度；七、混合检索（向量+关键词 BM25）弥补语义\n鸿沟；八、查询改写（Query Rewriting/HyDE）提升问题表征。建议建立召回率评测集逐步\n迭代，而非凭感觉。（外部补充：LlamaIndex 检索优化；RAG 评估（RAGAS）；混合检索\n实践）", "version_review_recommended": false, "related_question_ids": ["Q698", "Q699", "Q763", "Q765"]}], "units": [{"id": 1, "day": 1, "title": "对象相等与哈希约定", "question_id": "Q017", "extra_ids": ["Q014", "Q016"], "check": "为什么只改 equals 会给哈希容器带来问题？"}, {"id": 2, "day": 1, "title": "List 容器选型", "question_id": "Q086", "extra_ids": ["Q074", "Q087"], "check": "能否根据访问方式与修改位置解释选择？"}, {"id": 3, "day": 1, "title": "HashMap 的访问路径", "question_id": "Q103", "extra_ids": ["Q107", "Q119"], "check": "画出一次 put 的主要路径，并解释扩容的作用。"}, {"id": 4, "day": 2, "title": "并发 Map", "question_id": "Q123", "extra_ids": ["Q125", "Q127"], "check": "说清所讨论的 JDK 版本与并发控制方式。"}, {"id": 5, "day": 2, "title": "volatile 与原子操作", "question_id": "Q166", "extra_ids": ["Q165", "Q169"], "check": "为什么可见性和复合操作原子性要分开讨论？"}, {"id": 6, "day": 2, "title": "锁与排队同步", "question_id": "Q179", "extra_ids": ["Q173", "Q183"], "check": "用一个场景说明 synchronized 与 ReentrantLock 如何选择。"}, {"id": 7, "day": 3, "title": "线程池", "question_id": "Q187", "extra_ids": ["Q190", "Q191", "Q192"], "check": "按照参数和提交情况画出任务的执行、排队与拒绝路径。"}, {"id": 8, "day": 3, "title": "ThreadLocal", "question_id": "Q197", "extra_ids": ["Q195", "Q196"], "check": "线程复用时，为什么需要明确清理责任？"}, {"id": 9, "day": 3, "title": "JVM 内存与对象存活", "question_id": "Q215", "extra_ids": ["Q237", "Q235"], "check": "画出运行时内存区域，并解释对象存活判定与 OOM 排查的关系。"}, {"id": 10, "day": 4, "title": "IoC 与 Bean 生命周期", "question_id": "Q268", "extra_ids": ["Q284", "Q286"], "check": "说明谁负责创建、注入、初始化和销毁对象。"}, {"id": 11, "day": 4, "title": "AOP 与代理边界", "question_id": "Q278", "extra_ids": ["Q282", "Q283"], "check": "举一个适合用切面解决的问题，并指出代理边界。"}, {"id": 12, "day": 4, "title": "Boot 自动配置", "question_id": "Q308", "extra_ids": ["Q305", "Q309", "Q310"], "check": "解释自动配置从哪里来、在什么条件下生效。"}, {"id": 13, "day": 5, "title": "Spring 事务", "question_id": "Q344", "extra_ids": ["Q341", "Q342", "Q345"], "check": "解释一个事务失效场景，以及它和代理调用的关系。"}, {"id": 14, "day": 5, "title": "MySQL 索引", "question_id": "Q353", "extra_ids": ["Q358", "Q360"], "check": "给一个查询条件，说明索引的设计与验证方式。"}, {"id": 15, "day": 5, "title": "MVCC 与锁", "question_id": "Q376", "extra_ids": ["Q377", "Q382", "Q409"], "check": "区分快照读、锁定读与隔离级别的前提。"}, {"id": 16, "day": 6, "title": "慢 SQL 排查", "question_id": "Q407", "extra_ids": ["Q394", "Q396"], "check": "从慢 SQL 现象开始，列出需要什么证据再做优化。"}, {"id": 17, "day": 6, "title": "Redis 数据与持久化", "question_id": "Q420", "extra_ids": ["Q412", "Q418", "Q419"], "check": "针对一个业务说明数据类型，以及恢复与丢失窗口的取舍。"}, {"id": 18, "day": 6, "title": "缓存一致性", "question_id": "Q437", "extra_ids": ["Q438", "Q439", "Q440", "Q431", "Q432", "Q433"], "check": "画出一个读写并发时序，并解释方案的边界。"}, {"id": 19, "day": 7, "title": "分布式锁", "question_id": "Q442", "extra_ids": ["Q444", "Q446", "Q659"], "check": "讨论过期、所有权和失败情形，指出锁能保证什么。"}, {"id": 20, "day": 7, "title": "MQ 可靠性与幂等", "question_id": "Q477", "extra_ids": ["Q484", "Q485", "Q486"], "check": "分生产、存储、消费三个环节说明如何应对失败。"}, {"id": 21, "day": 7, "title": "消息顺序与积压", "question_id": "Q490", "extra_ids": ["Q487", "Q491", "Q514"], "check": "解释为什么增加消费者未必解决积压。"}, {"id": 22, "day": 8, "title": "最终一致性与消息表", "question_id": "Q502", "extra_ids": ["Q630"], "check": "画出本地事务和消息投递之间的失败恢复路径。"}, {"id": 23, "day": 8, "title": "TCP 与 HTTP", "question_id": "Q532", "extra_ids": ["Q536", "Q541", "Q544"], "check": "区分连接建立、可靠传输与 HTTP 请求的职责。"}, {"id": 24, "day": 8, "title": "HTTPS", "question_id": "Q552", "extra_ids": ["Q553", "Q554", "Q574"], "check": "解释证书验证与安全通信的关系，并注明协议版本。"}, {"id": 25, "day": 9, "title": "系统过载与故障隔离", "question_id": "Q636", "extra_ids": ["Q639", "Q640", "Q641"], "check": "面对下游变慢，解释熔断、降级和限流各解决什么问题。"}, {"id": 26, "day": 9, "title": "Java AI 接入与记忆", "question_id": "Q667", "extra_ids": ["Q677", "Q680"], "check": "区分模型调用、会话历史与外部知识库。"}, {"id": 27, "day": 9, "title": "工具调用与 MCP", "question_id": "Q682", "extra_ids": ["Q686", "Q687"], "check": "解释模型提出调用后，程序还必须做哪些校验和执行工作。"}, {"id": 28, "day": 10, "title": "RAG 全流程", "question_id": "Q698", "extra_ids": ["Q699", "Q700", "Q730"], "check": "画出入库和查询两条流程，并说明每步的作用。"}, {"id": 29, "day": 10, "title": "Agent 执行循环", "question_id": "Q708", "extra_ids": ["Q709", "Q766"], "check": "画出执行与观察循环，并明确停止和失败条件。"}, {"id": 30, "day": 10, "title": "AI 效果与可靠性", "question_id": "Q722", "extra_ids": ["Q723", "Q738", "Q800"], "check": "说明怎样区分检索失败、生成错误和证据不足。"}], "sourceUrl": "assets/source.pdf", "documentKey": "java-ai-a46081802917-v2"}</script>
<script>(()=>{
'use strict';
const data=JSON.parse(document.getElementById('study-data').textContent);
const $=id=>document.getElementById(id), byId=new Map(data.questions.map(q=>[q.id,q]));
const groups=new Map(data.groups.map(g=>[g.id,g])), topics=new Map(data.groups.flatMap(g=>g.topics.map(t=>[t.id,{...t,group_id:g.id}])));
const units=new Map(data.units.map(u=>[u.question_id,u])), STORAGE='codex-study:'+data.documentKey, PAGE_SIZE=20;
const defaultRoute={view:'random',group:'',topic:'',query:'',filter:'all',qid:'',page:1};
let noticeTimer,saveTimer,searchTimer,storageFailed=false,storageNotice=false,mobileView='list',revealedFor='';
function el(tag,text,cls){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node}
function button(text,handler,cls){const b=el('button',text,cls);b.type='button';b.onclick=handler;return b}
function link(text,href){const a=el('a',text);a.href=href;return a}
function notify(text){clearTimeout(noticeTimer);$('notice').textContent=text;$('notice').hidden=false;noticeTimer=setTimeout(()=>$('notice').hidden=true,3500)}
function validRoute(input={}){
 const r={...defaultRoute};
 if(['random','library','important','bookmarks'].includes(input.view))r.view=input.view;
 if(input.view==='route')r.view='random';
 if(input.view==='review')r.view='important';
 if(groups.has(input.group))r.group=input.group;
 if(topics.has(input.topic)&&(!r.group||topics.get(input.topic).group_id===r.group)){r.topic=input.topic;r.group=topics.get(input.topic).group_id}
 r.query=typeof input.query==='string'?input.query.slice(0,200):'';
 if(['all','new','important'].includes(input.filter))r.filter=input.filter;
 if(input.filter==='review')r.filter='important';
 if(byId.has(input.qid))r.qid=input.qid;
 r.page=Math.max(1,Math.min(40,Math.floor(Number(input.page)||1)));
 return r;
}
function sanitizeProgress(input){
 const p={bookmarks:{},important:{},status:{},notes:{},drafts:{},expandedGroups:{},randomOrder:[],sidebarCollapsed:false,sidebarWidth:280,questionPaneWidth:320,lastRead:'',lastRoute:{...defaultRoute},font:18,mode:'quiz',theme:'system'};
 if(!input||typeof input!=='object')return p;
 for(const id of byId.keys()){
  if(input.bookmarks&&input.bookmarks[id])p.bookmarks[id]=true;
  if(input.status&&['review','understood'].includes(input.status[id]))p.status[id]=input.status[id];
  if(input.important&&input.important[id])p.important[id]=true;
  if(!Object.prototype.hasOwnProperty.call(input,'important')&&input.status?.[id]==='review')p.important[id]=true;
  for(const key of ['notes','drafts'])if(input[key]&&typeof input[key][id]==='string')p[key][id]=input[key][id].slice(0,20000);
 }
 if(byId.has(input.lastRead))p.lastRead=input.lastRead;
 p.lastRoute=validRoute(input.lastRoute||{});
 if([16,18,20].includes(input.font))p.font=input.font;
 if(['quiz','read'].includes(input.mode))p.mode=input.mode;
 if(['system','light','dark'].includes(input.theme))p.theme=input.theme;
 if(Array.isArray(input.randomOrder))p.randomOrder=[...new Set(input.randomOrder.filter(id=>byId.has(id)))];
 p.sidebarCollapsed=input.sidebarCollapsed===true;
 if(Number.isFinite(input.sidebarWidth))p.sidebarWidth=Math.max(190,Math.min(360,input.sidebarWidth));
 if(Number.isFinite(input.questionPaneWidth))p.questionPaneWidth=Math.max(240,Math.min(440,input.questionPaneWidth));
 for(const id of groups.keys())if(typeof input.expandedGroups?.[id]==='boolean')p.expandedGroups[id]=input.expandedGroups[id];
 return p;
}
function load(){try{return sanitizeProgress(JSON.parse(localStorage.getItem(STORAGE)||'null'))}catch{return sanitizeProgress(null)}}
let progress=load();
const systemTheme=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
 const dark=progress.theme==='dark'||progress.theme==='system'&&systemTheme.matches;
 document.documentElement.dataset.theme=dark?'dark':'light';
 $('theme-mode').value=progress.theme;
 const toggle=$('theme-toggle'),label=dark?'切换到浅色模式':'切换到深色模式';
 toggle.setAttribute('aria-pressed',String(dark));toggle.setAttribute('aria-label',label);toggle.title=label;
}
function save(){
 clearTimeout(saveTimer);
 try{localStorage.setItem(STORAGE,JSON.stringify(progress))}
 catch{
  storageFailed=true;
  $('storage-label').textContent='当前浏览器未允许保存，请导出学习记录。';
  if(!storageNotice){storageNotice=true;notify('本浏览器暂时无法保存记录，可在“设置与资料”中导出备份。')}
 }
}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,200)}
function fromHash(){const p=new URLSearchParams(location.hash.slice(1));if(!p.has('view'))return null;return validRoute(Object.fromEntries(p))}
let route=fromHash()||validRoute(progress.lastRoute);
if(progress.sidebarCollapsed)mobileView='reader';
function shuffleQuestions(){
 const ids=[...byId.keys()];
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 return ids;
}
if(progress.randomOrder.length!==byId.size){progress.randomOrder=shuffleQuestions();if(route.view==='random')progress.mode='quiz'}
let depth=history.state?.studyReader===data.documentKey?history.state.depth||0:0;
let searchOrigin=history.state?.studyReader===data.documentKey&&history.state.searchOrigin?validRoute(history.state.searchOrigin):null;
function url(){const p=new URLSearchParams();for(const [key,value] of Object.entries(route))if(value!==''&&value!==defaultRoute[key]||key==='view'||key==='qid')p.set(key,String(value));return '#'+p.toString()}
function syncUrl(){history.replaceState({studyReader:data.documentKey,depth,searchOrigin},'',url())}
const searchIndex=new Map(data.questions.map(q=>[q.id,[q.title,q.topic,q.group,q.answer_original].join(' ').toLowerCase()]));
function queryTokens(){return route.query.trim().toLowerCase().split(/\s+/).filter(Boolean)}
function getQuestions(){
 let list;
 const query=route.query.trim().toLowerCase();
 if(query){
  const idMatch=/^q?0*(\d{1,3})$/i.exec(query);
  if(idMatch){const q=byId.get('Q'+String(Number(idMatch[1])).padStart(3,'0'));list=q?[q]:[]}
  else{
   const tokens=queryTokens();
   list=data.questions.filter(q=>tokens.every(t=>searchIndex.get(q.id).includes(t)));
   const score=q=>tokens.reduce((s,t)=>s+(q.title.toLowerCase().includes(t)?30:0)+(q.topic.toLowerCase().includes(t)?10:0),0);
   list.sort((a,b)=>score(b)-score(a)||a.number-b.number);
  }
 }else if(route.view==='random'){list=progress.randomOrder.map(id=>byId.get(id));if(route.group)list=list.filter(q=>q.group_id===route.group);}
 else if(route.view==='bookmarks')list=data.questions.filter(q=>progress.bookmarks[q.id]);
 else if(route.view==='important')list=data.questions.filter(q=>progress.important[q.id]);
 else if(route.topic)list=topics.get(route.topic).ids.map(n=>byId.get('Q'+String(n).padStart(3,'0')));

setupPaneResize('question-resize','questionPaneWidth',240,440,document.querySelector('.question-pane'));
function exportProgress(){
 save();const payload={schemaVersion:2,documentKey:data.documentKey,exportedAt:new Date().toISOString(),progress};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=link('',URL.createObjectURL(blob));a.download='学习记录-'+new Date().toLocaleDateString('sv-SE')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('settings').open=false;notify('学习记录已导出，包含重点、收藏、笔记和布局偏好。');
}
$('export-progress').onclick=exportProgress;$('backup-hint').onclick=exportProgress;
$('import-progress').onclick=()=>$('import-file').click();
$('import-file').onchange=async()=>{
 const file=$('import-file').files[0];if(!file)return;
 try{
  if(file.size>5*1024*1024)throw new Error('文件过大，请选择本阅读页导出的学习记录。');
  const payload=JSON.parse(await file.text());
  if(payload.schemaVersion!==2||payload.documentKey!==data.documentKey||!payload.progress||typeof payload.progress!=='object'||Array.isArray(payload.progress))throw new Error('这不是当前题库的学习记录，请检查导入文件。');
  const incoming=sanitizeProgress(payload.progress);
  for(const key of ['bookmarks','important','status','notes','drafts','expandedGroups'])progress[key]={...progress[key],...incoming[key]};
  if(incoming.lastRead)progress.lastRead=incoming.lastRead;
  progress.font=incoming.font;progress.mode=incoming.mode;
  if(['system','light','dark'].includes(payload.progress.theme))progress.theme=incoming.theme;
  progress.sidebarCollapsed=incoming.sidebarCollapsed;progress.sidebarWidth=incoming.sidebarWidth;progress.questionPaneWidth=incoming.questionPaneWidth;
  if(incoming.randomOrder.length===byId.size)progress.randomOrder=incoming.randomOrder;
  save();render();$('settings').open=false;notify('学习记录已合并，重点标记和布局偏好已恢复。');
 }catch(error){notify(error instanceof SyntaxError?'无法读取 JSON，请选择导出的学习记录文件。':error.message)}
 finally{$('import-file').value=''}
};
document.querySelector('.skip-link').onclick=event=>{event.preventDefault();$('reading-title')?.focus()};
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('search').focus();$('search').select()}});
document.addEventListener('click',event=>{if(!$('settings').contains(event.target))$('settings').open=false});
window.addEventListener('popstate',()=>{clearTimeout(searchTimer);depth=history.state?.studyReader===data.documentKey?history.state.depth||0:0;searchOrigin=history.state?.searchOrigin?validRoute(history.state.searchOrigin):null;route=fromHash()||{...defaultRoute};revealedFor='';mobileView='reader';render();save()});
window.addEventListener('pagehide',save);
window.addEventListener('resize',applyLayout);
const appHeader=document.querySelector('.app-header');
new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',appHeader.getBoundingClientRect().height+'px')).observe(appHeader);
render();save();
})();
</script>
</body>
</html>
