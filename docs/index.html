ic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 78, "page_end": 78, "answer_original": "put 流程：一、对 key 计算 hashCode 并经扰动函数 hash()得到最终 hash；二、若数组为空\n先扩容到默认 16；三、用(n-1)&hash 计算桶下标；四、若桶为空，直接新建 Node 放入；\n五、若桶非空，遍历链表/红黑树：遇到 key 相等（hash 相同且 equals 为 true）则覆盖旧\nvalue 并返回旧值；否则在链表尾部追加节点（JDK1.8 尾插法）；六、若追加后链表长度≥8\n且容量≥64，链表转红黑树；七、size 自增，若超过 threshold 触发 resize 扩容。整个过程\n体现了“先定位桶、再解决冲突、必要时树化、超阈值扩容”的设计。注意多线程下此流程会\n破坏一致性，必须用并发容器替代。（来源：JAVA 面试知识点总结.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q120", "number": 120, "title": "ConcurrentHashMap 在 JDK1.7 中是如何保证线程安全的？什么是 Segment 段？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 78, "page_end": 78, "answer_original": "JDK1.7 的 ConcurrentHashMap 由 Segment 数组和 HashEntry 数组组成，整体称为“分段\n锁”。Segment 本身是一个可重入锁（继承 ReentrantLock），每个 Segment 内部结构类\n似一个 HashMap（数组+链表），守护其中一部分 HashEntry。写入时只需锁住对应的那一\n个 Segment，不同 Segment 之间的操作可以并行，从而把锁的粒度从“整个表”细化到\n“一段”，并发度大幅提升。默认并发级别 concurrencyLevel 为 16，即最多支持 16 个\nSegment 同时写（前提是操作分布在不同段）。Segment 一旦初始化后不可扩容，但段内部\n的 HashEntry 数组可扩容。这就是“分段锁”思想的核心。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 51 页）", "version_review_recommended": true, "related_question_ids": ["Q121", "Q204"]}, {"id": "Q121", "number": 121, "title": "为什么说 Segment“继承 ReentrantLock”来实现加锁？这样设计有什么好处？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 78, "page_end": 79, "answer_original": "ConcurrentHashMap 把每个 Segment 设计成 ReentrantLock 的子类，于是 Segment 既是\n“数据容器”又是“锁对象”。每次需要对某个 Segment 做 put/remove 等修改时，先调用\nsegment.lock()获取该段锁，操作完成再 unlock()，保证单段内的线程安全；而不同\nSegment 互不影响，可并行操作。好处是锁粒度细化到段级别，避免了 Hashtable“一把全\n局锁串行所有操作”的低吞吐问题，同时复用 ReentrantLock 的可重入、公平/非公平、等待\n队列等成熟能力，无需自己实现锁。这样既实现了全局线程安全（每段安全则整体安全），又\n获得了细粒度并发，是并发容器设计的经典范例。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 51 页）", "version_review_recommended": true, "related_question_ids": ["Q120", "Q204"]}, {"id": "Q122", "number": 122, "title": "ConcurrentHashMap 的并行度默认是多少？能否动态扩容？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 79, "page_end": 79, "answer_original": "并行度由 concurrencyLevel（并发级别、Segment 数）决定，默认是 16，意味着\nConcurrentHashMap 默认有 16 个 Segment，理论上最多可同时支持 16 个线程并发写，只\n要它们的 key 散列到不同 Segment。这个值可以在构造 ConcurrentHashMap 时显式指定，\n但一旦初始化完成，Segment 的数量就不可再扩容——这是 JDK1.7 的设计限制。不过每个\nSegment 内部的 HashEntry 数组是可以各自扩容的，以容纳更多元素。因此并发度在创建时\n就要根据业务预估合理设置：设太小则段间竞争加剧，设太大则内存与初始化开销上升。这也\n是 1.8 弃用固定 Segment、改用更灵活的桶级锁的原因之一。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 52 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q123", "number": 123, "title": "JDK1.7 和 JDK1.8 的 ConcurrentHashMap 实现有什么区别？为什么 1.8 要改？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 79, "page_end": 79, "answer_original": "JDK1.7 用 Segment 分段锁：结构为 Segment 数组+HashEntry 数组，锁粒度是“段”，默\n认 16 段。JDK1.8 做了重构：取消了 Segment，直接用“Node 数组+链表+红黑树”的结\n构，与 HashMap 一致；并发控制改为对单个桶（数组某个下标）使用 CAS+synchronized\n细粒度加锁，锁粒度从“段”细化到“桶”，并发度更高、内存更紧凑；并引入红黑树，在哈\n希冲突严重时把查找从 O(n)降到 O(log n)。1.8 改动的原因：Segment 结构固定、并发度不\n可动态扩展、内存浪费，且无法随 CPU 核数灵活提升并行度；桶级锁+CAS+红黑树在性能和\n可扩展性上都更优。（来源：JAVA 面试知识点总结.pdf.txt，约第 52 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q124", "number": 124, "title": "JDK1.8 的 ConcurrentHashMap 引入了红黑树，它和 HashMap 的树化有何异 同？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 79, "page_end": 79, "answer_original": "相同点：二者在 JDK1.8 都基于“数组+链表+红黑树”，当某桶链表长度超过 8 且数组容量\n≥64 时树化，把查找从 O(n)降为 O(log n)，并在节点减少时退树化为链表（阈值 6）。不同\n点：HashMap 树化是为了单线程下的查找性能；ConcurrentHashMap 树化同样为了性能，\n但树化过程与节点操作都必须保证线程安全——它用 synchronized 锁定桶的头节点配合\nCAS 完成节点插入、迁移与树化，避免并发下的结构破坏。此外 ConcurrentHashMap 的\nsize 统计、扩容迁移都需考虑并发，采用分段计数（baseCount+CounterCell）等机制。理\n解“结构相同、并发控制不同”是区分二者的关键。（来源：JAVA 面试知识点总结.pdf.txt，\n约第 52 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q125", "number": 125, "title": "ConcurrentHashMap 是如何在并发写入时保证线程安全的？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 80, "page_end": 80, "answer_original": "JDK1.7 靠 Segment 分段锁：写操作锁住对应 Segment（ReentrantLock），段间并行。\nJDK1.8 更进一步：结构同 HashMap，对哈希桶的操作通过“CAS 尝试 + synchronized 锁\n定桶头节点”实现细粒度互斥。具体来说，初始化、空桶首次插入多用 CAS 无锁完成；桶已\n有元素时锁定该桶的头节点（synchronized），只阻塞同桶的竞争者，其他桶完全不受影\n响，并发度接近数组长度。读取操作基本无锁（volatile 保证可见性），因此读性能极高。\nsize()等统计用分段的 baseCount 与 CounterCell 累加，避免全局锁。整体上，\nConcurrentHashMap 以“无锁读+细粒度锁写”实现了高并发下的线程安全。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 93 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q126", "number": 126, "title": "ConcurrentHashMap 与 Hashtable 在性能和使用上应如何对比？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 80, "page_end": 80, "answer_original": "二者都线程安全，但实现与性能天差地别。Hashtable 用全局 synchronized 锁住整张表，所\n有读写串行，并发吞吐极低，且不允许 null 键值，属遗留类。ConcurrentHashMap 在 1.7\n用分段锁、1.8 用桶级 CAS+synchronized，读写可高度并行，读几乎无锁，并发度远高于\nHashtable；同时它也不允许 null 键（为避免歧义）。内存与迭代器方面，\nConcurrentHashMap 迭代器是弱一致（fail-safe），不会抛\nConcurrentModificationException，而 Hashtable 迭代器不够严格。结论：任何需要线程\n安全的 Map 场景，都应优先用 ConcurrentHashMap，Hashtable 已被官方标记为不推荐。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 53 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q127", "number": 127, "title": "ConcurrentHashMap 的 size()方法为什么不好实现？它是怎么统计的？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 80, "page_end": 80, "answer_original": "因为 ConcurrentHashMap 并发写入，任何时刻各段/各桶都在变化，若用全局锁统计 size 会\n严重拖慢并发。JDK1.7 做法：先不加锁累加各 Segment 的 count，若期间无修改直接返\n回；若有并发修改则重试若干次，仍不一致则对全部 Segment 加锁再统计。JDK1.8 改为分\n段计数：维护一个 baseCount，并用 Cell 数组（CounterCell，类似 LongAdder 的分段计\n数）分散并发自增的竞争；size()先取 baseCount 与各 Cell 之和，再判断是否溢出。\nmappingCount()返回 long 类型避免 Integer 溢出。这种“先乐观求和、必要时精确加锁”\n的设计，在无锁前提下给出了弱一致但足够准确的 size，是高并发统计的经典优化。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 93 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q128", "number": 128, "title": "什么是红黑树？它有哪些必须满足的特性？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 80, "page_end": 81, "answer_original": "红黑树（Red-Black Tree）是一种特殊的自平衡二叉查找树，每个节点有红/黑颜色位。它必\n须满足五条特性：一、每个节点非红即黑；二、根节点是黑色；三、每个叶子节点（NIL 空节\n点）是黑色；四、若一个节点是红色，则它的两个子节点必须都是黑色（即不存在连续的红节\n点）；五、从任一节点到其所有后代叶子节点的路径上，包含相同数目的黑色节点（黑高一\n致）。这些特性保证红黑树近似平衡，最长路径不超过最短路径的 2 倍，从而把查找、插入、\n删除都稳定在 O(log n)。HashMap、TreeMap、TreeSet 底层都依赖红黑树来平衡性能。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 248 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q129", "number": 129, "title": "红黑树为什么要左旋和右旋？请简要说明旋转的作用。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 81, "page_end": 81, "answer_original": "插入或删除节点后，红黑树可能破坏“黑高一致”或“无连续红节点”等特性，需要通过旋转\n和重新着色来修复。左旋是把某节点 x 的右孩子提为父节点、x 降为其左孩子，相当于“向左\n下沉”；右旋相反，把 x 的左孩子提为父节点、x 降为其右孩子，即“向右下沉”。旋转的本\n质是在不改变中序遍历（二叉查找树有序性）的前提下，调整树的高度与父子颜色关系，使结\n构重新满足五条特性。例如插入红色节点后若父、叔均为红则变色；若形成“红-红”且叔为\n黑则需按形态做单旋或双旋。理解旋转是理解 HashMap 树化后如何保持 O(log n)的基础。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 248 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q130", "number": 130, "title": "红黑树在 HashMap 中具体起到什么作用？为什么不用普通的二叉查找树或平衡二 叉树（AVL）？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "map", "topic": "Map、扩容与红黑树", "learning_priority": "核心", "page_start": 81, "page_end": 81, "answer_original": "在 HashMap 中，红黑树用于替代过长的冲突链表：当某桶链表长度≥8 且容量≥64 时转为红\n黑树，把该桶内查找从 O(n)降为 O(log n)，抵御哈希冲突或恶意哈希攻击导致的性能恶化。\n之所以选红黑树而非普通 BST——普通 BST 可能退化为链表（O(n)）；也不选 AVL 树——\nAVL 要求严格平衡，插入删除旋转次数多、维护成本高。红黑树只要求“近似平衡”（最长路\n径≤2 倍最短），插入删除时旋转和变色次数更少、写性能更好，且查询仍为 O(log n)，在读\n多写多的哈希场景中综合最优。因此它成为 HashMap、TreeMap 等容器的标准选择。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 51 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q131", "number": 131, "title": "什么是集合的 fail-fast（快速失败）机制？它如何工作？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 81, "page_end": 82, "answer_original": "fail-fast 是 java.util 下多数集合（如 ArrayList、HashMap、HashSet）迭代器的一种错误检\n测机制：迭代器在创建时会记录集合当前的修改次数 modCount；每次调用 next()/remove()\n前，都会检查集合的 modCount 是否等于自己记录的 expectedModCount，若不等说明集\n合在迭代期间被结构性修改（增删），于是立即抛出 ConcurrentModificationException，\n而不是继续产生不确定结果。这就是“快速失败”——尽早暴露并发修改错误。注意它只能\n检测、不能防止并发修改，且是单线程下“迭代中直接调集合 remove/add”也会触发的机\n制。正确做法是用 iterator.remove()或在迭代前用快照。（来源：Java 集合框架常见面试\n题.pdf.txt，约第 3 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q132", "number": 132, "title": "什么是 fail-safe（安全失败）机制？它与 fail-fast 有何区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 82, "page_end": 82, "answer_original": "fail-safe 指迭代时基于集合的“副本/快照”进行遍历，因而即使原集合被并发修改，迭代器\n也不会抛异常，而是继续遍历快照内容，表现为“安全失败”。java.util.concurrent 下的容\n器（如 CopyOnWriteArrayList、ConcurrentHashMap 的迭代器）属于 fail-safe：\nCopyOnWriteArrayList 每次修改都复制底层数组，迭代器持有旧数组引用；\nConcurrentHashMap 迭代器是弱一致的，可容忍并发更新。与 fail-fast 的区别：fail-fast 遍\n历原集合、遇并发修改即抛 ConcurrentModificationException；fail-safe 遍历副本、不抛\n异常但有短暂数据不一致（可能读不到最新修改）。面试应强调：fail-safe 不是真“安全”，\n只是不抛异常，且内存/时效上有代价。（来源：互联网大厂面试题库大全.pdf.txt，约第 1\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q133", "number": 133, "title": "Collections 工具类有哪些常用方法？请举例说明。", "group_id": "java", "group": "Java 语言与集合", "topic_id": "list", "topic": "集合体系与 List", "learning_priority": "核心", "page_start": 82, "page_end": 82, "answer_original": "Collections 是操作集合的静态工具类，常用方法有：sort(List)按自然序排序、sort(List,\nComparator)自定义排序；reverse(List)反转；shuffle(List)随机打乱；binarySearch(List,\nkey)二分查找（要求已排序）；max/min 取最大最小；swap 交换元素；fill 填充；\nreplaceAll 替换；frequency 统计出现次数；还有线程安全包装\nsynchronizedList/Map/Set，以及不可变包装 unmodifiableList 等。例如\nCollections.sort(list)升序、Collections.sort(list, (a,b)->b-a)降序、Collections.reverse(list)\n反转。这些方法极大简化了集合运算，但注意 sort/binarySearch 要求 List 元素可比较，否则\n抛 ClassCastException。再如 Collections.frequency(list,obj)统计元素出现次数、\nCollections.disjoint(c1,c2)判断两集合是否无交集、Collections.emptyList()返回只读空集\n合，都是业务开发中的高频用法；需要线程安全时可用 Collections.synchronizedXxx 包装，\n但高并发下更推荐 java.util.concurrent 包下的并发集合。（来源：Java 集合框架常见面试\n题.pdf.txt，约第 6 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q134", "number": 134, "title": "如何让一个 HashMap 变成线程安全的？Collections.synchronizedMap 的原理是 什么？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 82, "page_end": 83, "answer_original": "可以用 Collections.synchronizedMap(map)把任意 Map 包装成线程安全的 Map，其内部返\n回一个 SynchronizedMap 包装对象，对所有方法（get/put/remove/size 等）都加上\nsynchronized 同步块，锁住同一个内部 mutex 对象，从而保证任意时刻只有一个线程能操作\n底层 map。调用者无需自己加锁即可获得线程安全的 Map。但代价是全局锁、读写都串行，\n并发性能较低，且迭代器仍是 fail-fast（迭代时需手动同步）。因此它适合并发度不高的场\n景；若高并发读写，应直接用 ConcurrentHashMap，其桶级锁+CAS 性能远优于\nsynchronizedMap。这是面试中“HashMap 线程安全三方案”之一。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 50 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q135", "number": 135, "title": "Collections 提供了哪些线程安全包装方法？它们和并发容器有何区别？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 83, "page_end": 83, "answer_original": "Collections 提供 synchronizedCollection、synchronizedList、synchronizedSet、\nsynchronizedMap 四个方法，把非线程安全集合包装成同步集合，原理都是对每个方法加\nsynchronized（锁同一个 mutex）。它们与 java.util.concurrent 并发容器的区别在于：一、\n锁粒度，包装类全局锁、并发容器多为分段/桶级无锁+CAS；二、迭代器，包装类迭代器是\nfail-fast，并发容器是 fail-safe/弱一致；三、性能，高并发下包装类吞吐远低于\nConcurrentHashMap/CopyOnWriteArrayList。因此 Collections 的同步包装适合低并发或\n简单场景，真正的并发编程应优先选用 ConcurrentHashMap、CopyOnWriteArrayList、\nConcurrentLinkedQueue 等 JUC 容器。（来源：互联网大厂面试题库大全.pdf.txt，约第 1\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q136", "number": 136, "title": "进程和线程的区别是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 83, "page_end": 83, "answer_original": "进程是操作系统进行资源分配和调度的基本单位，是程序的一次执行实例，拥有独立的地址空\n间、文件句柄等系统资源；线程是进程内的执行单元，是 CPU 调度的基本单位，同一进程内\n的多个线程共享堆、方法区等内存区域，仅各自拥有独立的程序计数器、虚拟机栈和本地方法\n栈。线程的创建、切换和销毁开销远小于进程，因此多线程能更高效地利用多核 CPU 并提升\n并发能力。实际开发中，Web 服务器用多线程处理并发请求即利用了线程轻量、共享内存的\n特点。需要注意的是，由于线程共享内存，必须借助锁、volatile 等手段解决可见性与原子性\n问题，否则会出现数据竞争。（来源：JAVA 面试知识点总结.pdf.txt，约第 54、75 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q137", "number": 137, "title": "Java 中线程与操作系统原生线程是如何映射的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 83, "page_end": 84, "answer_original": "在 HotSpot JVM 中，Java 线程与操作系统原生线程存在直接映射关系。当线程的本地存储、\n缓冲区分配、同步对象、栈、程序计数器等资源准备就绪后，JVM 会创建一个操作系统原生\n线程；原生线程初始化完毕后，会回调 Java 线程的 run()方法。当 Java 线程执行结束，原生\n线程随之被回收，操作系统负责把所有线程调度到可用的 CPU 上执行。JVM 本身只是负责任\n务的封装与生命周期管理，真正的调度由操作系统内核完成。理解这一映射关系有助于明白为\n何线程切换会涉及内核态与用户态转换，进而带来上下文切换开销，也解释了 synchronized\n底层依赖操作系统互斥量时性能损耗的来源。（来源：JAVA 面试知识点总结.pdf.txt，约第\n20、63 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q138", "number": 138, "title": "什么是上下文切换？哪些原因会引发线程上下文切换？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 84, "page_end": 84, "answer_original": "上下文切换是指 CPU 在切换任务时，保存当前任务的状态（寄存器、程序计数器等）并加载\n下一任务状态的过程。由于 CPU 通过时间片轮转服务多个任务，任务状态保存与再加载即构\n成一次上下文切换。引发线程上下文切换的常见原因有：当前线程时间片用完被正常调度；当\n前线程遇到 IO 阻塞被挂起；多线程抢占同一锁资源失败被挂起；用户代码主动让出 CPU（如\n调用 yield）；以及硬件中断。一次上下文切换涉及内核态与用户态转换，开销不小，因此高\n并发场景下应尽量减少无谓的锁竞争和阻塞，以降低切换频率，这是锁优化和线程池设计的重\n要考量。（来源：JAVA 面试知识点总结.pdf.txt，约第 75、76 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q139", "number": 139, "title": "用户线程与守护线程的区别是什么？各自适用什么场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 84, "page_end": 84, "answer_original": "用户线程（User Thread）是普通线程，JVM 会等待所有用户线程执行完毕才退出；守护线程\n（Daemon Thread）是为其他线程提供支撑服务的后台线程，如垃圾回收线程、定时任务线\n程，当 JVM 中只剩守护线程时进程会直接退出，不会等待它们结束。通过 setDaemon(true)\n可将线程设为守护线程，但必须在 start()之前设置。守护线程适合执行日志清理、监控统计、\n定时心跳等不影响业务正确性的后台任务；不能把涉及资源释放、数据落盘等关键逻辑放在守\n护线程中，否则 JVM 退出会导致任务被强制中断，造成数据丢失或不一致。（来源：JAVA\n面试知识点总结.pdf.txt，约第 74 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q140", "number": 140, "title": "为什么 Java 采用抢占式线程调度？协同式调度有什么缺陷？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 84, "page_end": 85, "answer_original": "Java 采用的是抢占式调度，即每条线程的执行时间和切换由系统（JVM 结合操作系统）控\n制，线程按优先级分配 CPU 时间片，高优先级更容易获得执行权但不保证独占。这种机制\n下，某个线程阻塞不会拖垮整个进程，系统能公平而稳健地推进所有任务。相对的协同式调度\n要求线程主动让出 CPU，优点是切换可预期、无抢占开销，但致命缺陷是一旦某线程编写不\n当陷入死循环或长时间阻塞，就会一直霸占 CPU，导致整个系统失去响应甚至崩溃。因此服\n务端程序普遍选择抢占式调度以保证健壮性。（来源：JAVA 面试知识点总结.pdf.txt，约第\n93 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q141", "number": 141, "title": "Java 中创建线程有哪几种方式？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 85, "page_end": 85, "answer_original": "常见方式主要有四种：一是继承 Thread 类，重写 run()方法，调用 start()启动；二是实现\nRunnable 接口，把任务传给 Thread 执行，更利于解耦和资源共享；三是通过\nExecutorService 配合 Callable\u003cT>与 Future，Callable 能返回结果并抛出异常，适合需要\n获取异步计算值的场景；四是直接利用线程池（如 Executors 或 ThreadPoolExecutor）提交\n任务，由池管理线程生命周期，避免频繁创建销毁线程。实际生产环境强烈推荐使用线程池方\n式，因为手动 new Thread 既无法限制并发数，又缺少拒绝策略和统一监控，容易导致资源耗\n尽。（来源：JAVA 面试知识点总结.pdf.txt，约第 54、55、56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q142", "number": 142, "title": "线程的生命周期包含哪些状态？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 85, "page_end": 85, "answer_original": "线程在其生命周期中主要经历：新建（NEW），即创建后尚未 start()；就绪\n（RUNNABLE），调用 start()后等待 CPU 调度；运行（RUNNING），获得 CPU 正在执\n行；阻塞（BLOCKED），分为等待阻塞（调用 wait 进入等待队列）、同步阻塞（争抢\nsynchronized 锁失败进入锁池）和其他阻塞（如 sleep、join）；死亡（DEAD），包括正常\n执行结束、未捕获异常结束或被 stop 终止。其中 BLOCKED、WAITING、TIMED_WAITING\n都属于不占用 CPU 的挂起状态。理解这些状态对排查线程卡死、死锁以及理解锁竞争过程非\n常关键，例如死锁往往表现为多个线程长期停留在 BLOCKED 状态。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 58、59 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q143", "number": 143, "title": "sleep()与 wait()的区别是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 85, "page_end": 85, "answer_original": "二者都能让线程暂停，但本质不同：sleep()是 Thread 类的静态方法，让当前线程休眠指定毫\n秒，进入 TIMED_WAITING 状态，但不会释放已持有的锁；wait()是 Object 类方法，必须在\nsynchronized 同步块或方法中调用，调用后会释放对象锁并进入 WAITING 状态，直到被其\n他线程 notify/notifyAll 唤醒或超时。因此 sleep 适用于“稍等片刻”而不让出锁，wait 适用\n于线程间通信与协作并主动让出锁。此外 sleep 可被 interrupt 打断并抛\nInterruptedException，而 wait 本身也会响应中断。面试中常借此题考察对锁释放与线程通\n信的理解。（来源：JAVA 面试知识点总结.pdf.txt，约第 61、73 页）", "version_review_recommended": false, "related_question_ids": ["Q058"]}, {"id": "Q144", "number": 144, "title": "start()方法与 run()方法有什么区别？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 85, "page_end": 86, "answer_original": "直接调用 run()只是在当前线程中执行一个普通方法，并不会创建新线程，所有代码仍在调用\n者线程顺序执行；而调用 start()才会真正向 JVM 请求创建操作系统原生线程，并由新线程去\n执行 run()中的逻辑。start()只能调用一次，重复调用会抛 IllegalThreadStateException。正\n确启动线程必须调用 start()，这也是多线程并发的前提。很多初学者误用 run()导致“伪多线\n程”，表面上写了多线程代码实际仍是单线程串行执行，既无法并发也得不到性能提升，是面\n试中常见的易错点。（来源：JAVA 面试知识点总结.pdf.txt，约第 62 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q145", "number": 145, "title": "join()方法的作用是什么？什么场景下需要使用它？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 86, "page_end": 86, "answer_original": "join()用于让当前线程等待目标线程执行结束：在当前线程中调用某线程的 join()，当前线程\n会转入阻塞状态，直到目标线程运行完毕才恢复就绪态去竞争 CPU。典型场景是主线程启动\n了若干子线程并依赖它们的计算结果，必须等子线程全部完成后主线程才能继续汇总或退出，\n此时就需要 join()来协调顺序。例如主线程并发计算后做汇总、或者测试用例里等待异步任务\n完成再断言结果。本质上 join()是通过在内部循环判断目标线程 isAlive 并配合 wait 实现，使\n用时要小心目标线程永不结束导致当前线程永久阻塞。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 74 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q146", "number": 146, "title": "yield()方法的作用是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 86, "page_end": 86, "answer_original": "yield()会让当前线程主动让出当前占用的 CPU 时间片，从运行状态回到就绪状态，重新与其\n他线程竞争 CPU，但并不释放锁。它仅是一个“提示”，调度器可以忽略；高优先级线程通\n常更易重新获得时间片，但系统并不保证一定让其他线程先执行。yield()常用于自旋等待、忙\n检测或测试调度行为的场景，生产环境很少依赖它来控制并发正确性，因为它不能替代锁或等\n待机制，滥用反而增加无谓的上下文切换。与 sleep 不同，yield 没有时间参数且只让出当前\n时间片而非休眠。（来源：JAVA 面试知识点总结.pdf.txt，约第 73 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q147", "number": 147, "title": "如何优雅地终止一个线程？interrupt()的工作原理是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 86, "page_end": 86, "answer_original": "早期 stop()会强行终止线程并释放锁，可能导致对象状态不一致，已被废弃。正确做法是用中\n断机制：调用线程的 interrupt()只是设置该线程的中断标志位，并不会立刻终止运行中的线\n程；线程内部应在循环中检查 isInterrupted()或捕获 InterruptedException，自行决定是否\n退出。若线程因 sleep()、wait()等处于 TIMED_WAITING，调用 interrupt()会抛\nInterruptedException 并清除中断标志，因此捕获后通常需重新设置或做退出处理。对于阻\n塞在 IO 或锁上的线程，可结合超时与标志位协作退出。优雅终止保证了资源正确释放与状态\n一致。（来源：JAVA 面试知识点总结.pdf.txt，约第 60、73 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q148", "number": 148, "title": "调用 interrupt()会立即中断正在运行的线程吗？线程在 sleep 中被中断会怎样？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 87, "page_end": 87, "answer_original": "不会。interrupt()的本意是给线程一个通知信号，仅改变其内部的“中断标志位”，处于\nRUNNING 状态的线程既不会自动终止也不会改变运行状态，必须在线程 run()内部主动检查\nisInterrupted()来决定退出。但如果线程因调用 sleep()处于 TIMED_WAITING 状态，此时被\ninterrupt()会立刻抛出 InterruptedException 并提前结束等待，且抛出异常前会清除中断标\n志位，所以捕获后调用 isInterrupted()会返回 false。许多声明抛出 InterruptedException 的\n方法在异常前都会清除该标志，因此若想让上层感知中断，应在 catch 中再次调用\nThread.currentThread().interrupt()恢复标志。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 73 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q149", "number": 149, "title": "终止线程有哪几种方式？为什么 stop()方法不推荐使用？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 87, "page_end": 87, "answer_original": "终止线程主要有四种方式：一是任务正常执行完毕自然结束；二是用 volatile 布尔退出标志，\nrun()循环检测后退出；三是使用 interrupt()中断机制，在循环或异常处理中优雅退出；四是\nstop()强制终止，但极不推荐。stop()会立即释放线程持有的所有锁，导致被保护的对象处于\n不一致的中间状态，且无法执行任何清理逻辑，其他线程读到残缺数据将引发难以排查的并发\nbug。因此现代 Java 开发一律避免 stop()，改用中断或标志位协作退出，确保释放资源与状\n态正确。（来源：JAVA 面试知识点总结.pdf.txt，约第 60、61 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q150", "number": 150, "title": "wait、notify、sleep、yield、interrupt 这些线程基本方法各自的作用是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 87, "page_end": 87, "answer_original": "wait()使线程释放锁并进入等待队列，需被 notify 唤醒；notify()/notifyAll()唤醒在该对象监\n视器上等待的单个或所有线程；sleep()让线程休眠且不释放锁；yield()让出 CPU 时间片但不\n释放锁；interrupt()设置中断标志位用于协作终止或唤醒阻塞线程。wait/notify 属于 Object\n类的线程通信机制，必须配合 synchronized 使用；sleep/yield/interrupt 属于 Thread 类。\nwait 与 sleep 最易被混淆：wait 释放锁、sleep 不释放锁；interrupt 则既能打断\nsleep/wait，也能作为运行中线程的退出信号。掌握这些方法是编写正确并发协作逻辑的基\n础。（来源：JAVA 面试知识点总结.pdf.txt，约第 72、73、74 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q151", "number": 151, "title": "乐观锁与悲观锁的区别是什么？在 Java 中分别是如何体现的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 87, "page_end": 88, "answer_original": "乐观锁认为读多写少、并发冲突概率低，读数据时不上锁，只在更新时校验版本或值是否被他\n人改动（通常通过 CAS），失败则重试；悲观锁认为写冲突频繁，读写前就加锁，阻止其他\n线程访问。Java 中 synchronized 和基于 AQS 的 ReentrantLock 属于悲观锁，线程获取不到\n锁就阻塞；而 java.util.concurrent.atomic 包下的原子类通过 CAS 实现乐观锁，无锁自旋完\n成更新。AQS 框架本身也采用“先 CAS 乐观尝试获取锁，失败再转为悲观阻塞”的混合策\n略。选择时应权衡冲突频率：冲突低用乐观锁提升吞吐，冲突高用悲观锁减少重试开销。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 63、1920-1930 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q152", "number": 152, "title": "synchronized 可以把哪些对象当作锁？它的作用范围有哪些？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 88, "page_end": 88, "answer_original": "synchronized 可把任意非 null 对象当作锁，具体作用范围分三类：修饰实例方法时，锁住的\n是当前对象实例 this；修饰静态方法时，锁住的是 Class 对象，由于 Class 数据在方法区/元\n空间全局共享，相当于该类所有实例的全局锁；作用于代码块时，锁住显式指定的对象实例，\n且对象监视器会将竞争的线程放入不同队列管理。理解锁对象至关重要：非 static 方法锁实\n例、static 方法锁类、代码块锁指定对象，三者锁定范围不同，错误选择容易造成“锁不住”\n的并发问题，例如用不同实例对象做锁无法互斥。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 64、1969-1975 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q153", "number": 153, "title": "synchronized 的底层实现原理是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 88, "page_end": 88, "answer_original": "每个 Java 对象都关联一个 monitor（监视器锁）对象，synchronized 加锁本质就是竞争\nmonitor。代码块加锁在编译后于前后插入 monitorenter 和 monitorexit 指令；方法加锁则\n通过方法表里的 ACC_SYNCHRONIZED 标记位实现，进入方法前自动获取 monitor，退出时\n释放。monitor 底层在 JDK1.6 之前依赖操作系统的互斥量（Mutex Lock）实现，涉及用户\n态到内核态切换，开销大，因此被称为重量级锁。JDK1.6 起引入偏向锁、轻量级锁、适应性\n自旋等优化，这些状态信息记录在对象头的 Mark Word 中，能在很多场景下避免直接调用操\n作系统加锁，显著提升性能。（来源：JAVA 面试知识点总结.pdf.txt，约第 64、2005-2011\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q154", "number": 154, "title": "synchronized 内部的核心组件（WaitSet、ContentionList、EntryList、 OnDeck、Owner）各自的职责是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 88, "page_end": 89, "answer_original": "synchronized 基于 monitor 维护多个线程队列：WaitSet 存放调用 wait()被阻塞的线程；\nContentionList 是竞争队列，所有请求锁的线程先进入这里；EntryList 是从 ContentionList\n中移出的、有资格竞争锁的候选线程集合；OnDeck 任意时刻最多一个，是被选中即将竞争锁\n的线程；Owner 是当前已持有锁的线程；!Owner 表示刚释放锁的线程。JVM 从\nContentionList 尾部取线程作为 OnDeck 候选，Owner 释放锁时把部分线程迁入 EntryList\n并指定 OnDeck，但锁并不直接传递，而是让 OnDeck 重新竞争，这种“竞争切换”牺牲公\n平性换取高吞吐。处于这些队列的线程阻塞由操作系统内核完成。（来源：JAVA 面试知识点\n总结.pdf.txt，约第 64、1976-2003 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q155", "number": 155, "title": "为什么 synchronized 是非公平锁？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 89, "page_end": 89, "answer_original": "synchronized 在设计与实现上都是非公平的。线程在进入 ContentionList 之前会先尝试自旋\n获取锁，获取不到才进入队列；而已经在队列中的线程只能被动等待被唤醒，自旋线程甚至可\n能直接抢占到本应给 OnDeck 的锁资源，这对排队线程明显不公。此外，Owner 释放锁后把\n竞争权利交给 OnDeck 而非直接传递，OnDeck 仍需重新竞争，也加剧了不公平。非公平换\n来的是更高的吞吐量，因为减少了线程挂起与唤醒的上下文切换。如果业务强需公平（按请求\n顺序获锁），应使用 ReentrantLock(true)显式构造公平锁。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 64、2000-2003 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q156", "number": 156, "title": "什么是锁升级？偏向锁、轻量级锁、重量级锁之间是如何演变的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 89, "page_end": 89, "answer_original": "锁升级指 synchronized 随竞争加剧，锁状态从低开销向高开销单向演进的过程：无锁 → 偏\n向锁 → 轻量级锁 → 重量级锁，且不可逆（不会降级）。对象创建时多为无锁；若只有一个\n线程反复进入同步块，升级为偏向锁，仅记录线程 ID 免 CAS；当出现轻度竞争（多线程交替\n执行），偏向锁撤销并膨胀为轻量级锁，通过 CAS 在对象头记录锁指针，失败则自旋；若竞\n争激烈或自旋超时，进一步膨胀为重量级锁，依赖操作系统互斥量，未获锁线程被挂起。锁升\n级机制让 synchronized 在无竞争时近乎无开销，高竞争时才付出重量级代价。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 71、2012 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q157", "number": 157, "title": "偏向锁的原理和作用是什么？为什么引入偏向锁？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 89, "page_end": 89, "answer_original": "偏向锁基于“多数情况下锁不仅无竞争，而且总由同一线程多次获得”的观察而设计。其作用\n是：当某线程首次获取锁后，在对象头 Mark Word 中记录该线程 ID，此后该线程再进入同\n步块无需任何 CAS 操作即可直接获得锁，相当于被“偏护”。引入偏向锁是为了消除单线程\n重复加锁（可重入）的 CAS 开销。一旦出现其他线程竞争，偏向锁就被撤销并升级为轻量级\n锁。由于撤销成本必须小于节省的 CAS 指令成本，偏向锁仅在无多线程竞争时提升性能；高\n并发场景可用-XX:-UseBiasedLocking 关闭。（来源：JAVA 面试知识点总结.pdf.txt，约第\n71、2213-2221 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q158", "number": 158, "title": "轻量级锁的原理是什么？它适用于什么场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 89, "page_end": 90, "answer_original": "轻量级锁并非用来替代重量级锁，而是在“无多线程竞争前提下”减少传统重量级锁（依赖操\n作系统互斥量）带来的性能消耗。其执行过程依赖对象头 Mark Word 与线程栈中锁记录的\nCAS 交换：线程进入同步块时，若对象无锁，则在栈帧创建锁记录并用 CAS 把对象头指向\n它；若 CAS 成功即获得轻量级锁。它适应“线程交替执行同步块”的场景——即同一时刻只\n有一个线程访问锁。若同一时刻有多个线程争夺同一锁，轻量级锁会膨胀为重量级锁。轻量级\n锁避免了用户态到内核态切换，但自旋仍消耗 CPU，故仅适用于低竞争短临界区。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 71、2203-2212 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q159", "number": 159, "title": "重量级锁为什么性能较低？底层依赖什么实现？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 90, "page_end": 90, "answer_original": "重量级锁即传统依赖操作系统互斥量（Mutex Lock）实现的锁。synchronized 的 monitor\n本质依赖底层操作系统的 Mutex Lock，而操作系统实现线程间切换需要从用户态转换到核心\n态，这种状态转换成本高、耗时长，因此早期 synchronized 效率偏低。线程获取不到重量级\n锁时会被挂起、进入内核阻塞，唤醒又需一次上下文切换。JDK1.6 之后的种种优化（偏向\n锁、轻量级锁、自旋、锁消除、锁粗化）核心目的都是减少重量级锁的使用频率。只有在真正\n高竞争且临界区较长时，才不得不使用重量级锁以保证正确性。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 71、2195-2202 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q160", "number": 160, "title": "自旋锁的优缺点是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 90, "page_end": 90, "answer_original": "自旋锁指线程获取不到锁时不立即挂起，而是空循环（自旋）等待持有者很快释放锁，从而避\n免内核态切换的开销。优点：在锁竞争激烈程度低、持有锁时间极短时，自旋消耗远小于线程\n阻塞挂起再唤醒的两次上下文切换，能显著提升性能。缺点：自旋空占 CPU 做无用功，若锁\n竞争激烈或持有锁时间长，大量线程长时间自旋会浪费 CPU，反而降低整体吞吐，此时应关\n闭自旋。因此自旋锁只适合“短临界区、低竞争”场景，JDK 通过适应性自旋动态调整其时间\n以扬长避短。（来源：JAVA 面试知识点总结.pdf.txt，约第 63、1939-1946 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q161", "number": 161, "title": "JDK 1.6 引入的适应性自旋锁是如何决定自旋时间的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 90, "page_end": 90, "answer_original": "JDK1.5 的自旋次数是写死的固定值，不够灵活；JDK1.6 引入适应性自旋锁，自旋时间不再固\n定，而是由前一次在同一锁上的自旋时长及锁拥有者状态决定，基本以一次上下文切换时间为\n最佳参考。JVM 还结合 CPU 负载优化：若平均负载小于 CPU 数则一直自旋；若超过 CPUs/2\n个线程正在自旋，后来线程直接阻塞；发现 Owner 变化则延迟自旋或进入阻塞；CPU 处于节\n电模式则停止自旋。最坏自旋时间为 CPU 存储延迟。JDK1.7 后相关参数被移除，由 JVM 自\n适应控制，从而在性能与 CPU 占用间取得平衡。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 63、1954-1965 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q162", "number": 162, "title": "什么是锁优化？请说明减少锁持有时间、减小锁粒度、锁分离、锁粗化、锁消除。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 90, "page_end": 91, "answer_original": "锁优化是为了在保证线程安全的同时降低锁竞争开销：减少锁持有时间，即只在必须同步的代\n码上加锁，缩短临界区；减小锁粒度，把大对象拆成小对象提升并行度，典型如\nConcurrentHashMap 分段；锁分离，按功能拆分锁，如读写锁 ReadWriteLock 把读锁写锁\n分开，读读不互斥，LinkedBlockingQueue 头尾用独立锁；锁粗化，若对同一个锁频繁请求/\n释放，则合并成一次大锁减少开销；锁消除，JIT 编译器发现不可能被共享的对象会自动消除\n其锁操作。这些手段共同减少阻塞与切换，是高并发设计的核心技巧。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 71、2224-2246 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q163", "number": 163, "title": "JDK 1.6 对 synchronized 做了哪些重要优化？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 91, "page_end": 91, "answer_original": "JDK1.6 对 synchronized 做了大量优化，使其效率有了本质提升，主要包括：适应性自旋\n（自旋时间自适应）、锁消除（JIT 消除无共享对象的锁）、锁粗化（合并相邻同锁操作）、\n轻量级锁（用 CAS 避免内核加锁）和偏向锁（单线程免 CAS）。这些优化以对象头 Mark\nWord 的标记位记录锁状态，多数场景无需经过操作系统加锁。锁还可从偏向锁升级到轻量级\n锁再升级到重量级锁（锁膨胀）。默认开启偏向锁和轻量级锁，可通过-XX:-\nUseBiasedLocking 禁用偏向锁。正是这些优化让 synchronized 在现代 JDK 中与 Lock 性能\n差距大幅缩小。（来源：JAVA 面试知识点总结.pdf.txt，约第 65、2009-2013 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q164", "number": 164, "title": "synchronized 修饰实例方法、静态方法、代码块时，锁住的对象分别是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 91, "page_end": 91, "answer_original": "三种作用范围的锁对象各不相同：修饰普通实例方法时，锁住当前对象实例 this，因此同一实\n例的同步方法互斥，不同实例互不影响；修饰静态方法时，锁住的是该类的 Class 对象，\nClass 在元空间全局共享，相当于整个类的全局锁，会阻塞所有调用该静态同步方法的线程；\n修饰同步代码块时，锁住显式指定的对象，如 synchronized(this)、synchronized(X.class)或\nsynchronized(某成员变量)。常见错误是用不同对象实例做锁却期望互斥，结果并未真正串行\n化。选择锁对象的原则是：要保证互斥的线程必须竞争同一个监视器。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 64、1969-1975 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q165", "number": 165, "title": "volatile 关键字的作用是什么？它具备哪两大特性？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 91, "page_end": 92, "answer_original": "volatile 是轻量级的同步机制，具备两大特性：一是可见性，被 volatile 修饰的变量被某线程\n修改后，新值对其他线程立即可见，因为 JVM 保证每次读都从主内存读取、跳过 CPU 缓存，\n写立即刷新主内存；二是禁止指令重排序，通过内存屏障防止编译器和 CPU 对读写操作重\n排，从而保障一定的有序性。与 synchronized 不同，volatile 访问不执行加锁操作，不会阻\n塞线程，因此更轻量，适合“一个变量被多个线程共享、线程直接赋值”的场景。但它无法替\n代 synchronized，因为单靠 volatile 不能保证复合操作（如 i++）的原子性。（来源：JAVA\n面试知识点总结.pdf.txt，约第 87、2661-2677 页）", "version_review_recommended": false, "related_question_ids": ["Q072", "Q166", "Q167", "Q168"]}, {"id": "Q166", "number": 166, "title": "为什么 volatile 不能保证 i++这类操作的原子性？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 92, "page_end": 92, "answer_original": "volatile 仅保证单次读或写操作的可见性与有序性，并不保证“读-改-写”复合操作的原子\n性。i++在字节码层面被拆成三步：从内存读取值、CPU 中加 1、写回内存。若两个线程同时\n读到相同旧值并各自加 1 写回，就会出现“写覆盖”，最终结果只加 1 而非 2。volatile 无法\n让这三步作为一个不可分割的整体执行，因此 i++在并发下仍然不安全。要解决需使用\nsynchronized、Lock 或原子类（如 AtomicInteger，其 getAndIncrement 通过 CAS 自旋\n保证原子）。理解这一点是区分“可见性”和“原子性”的关键，也是面试高频陷阱。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 87、2678-2681 页）", "version_review_recommended": false, "related_question_ids": ["Q072", "Q165", "Q167", "Q168"]}, {"id": "Q167", "number": 167, "title": "volatile 的适用场景是什么？需要满足哪些条件才能在并发下安全使用？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 92, "page_end": 92, "answer_original": "volatile 适合“变量被多个线程共享、线程直接对其赋值”的场景，如状态标志位（boolean\nrunning=true）、单次赋值等。要安全替代锁必须满足两个条件：一是写操作不依赖当前值\n（如 i++就不符合，boolean flag=true 符合）；二是该变量不与其他变量组成不变式，即多\n个 volatile 变量之间不能互相依赖。只有在状态真正独立于程序其他内容时才能用 volatile，\n否则仍需 synchronized 或原子类兜底。典型用法是用 volatile 修饰的 boolean 开关控制线程\n优雅停止。盲目用 volatile 会制造“看似线程安全实则竞态”的隐患。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 87、2685-2690 页）", "version_review_recommended": false, "related_question_ids": ["Q072", "Q165", "Q166", "Q168"]}, {"id": "Q168", "number": 168, "title": "volatile 与 synchronized 的区别是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 92, "page_end": 92, "answer_original": "二者都保证可见性，但差异明显：volatile 是轻量同步，仅保证可见性与禁止重排序，不保证\n原子性，且不阻塞线程，适合状态标志等简单场景；synchronized 是重量级（经优化后也有\n轻量路径）的互斥锁，保证原子性、可见性与有序性，未获锁线程会阻塞。volatile 不会引起\n线程上下文切换，性能更高；synchronized 可修饰方法/代码块，支持可重入与锁升级。使用\n原则：若涉及“读-改-写”复合操作必须用 synchronized 或原子类，单纯赋值可见性可用\nvolatile。二者互补而非替代，volatile 无法完全取代 synchronized。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 87、2670-2682 页）", "version_review_recommended": false, "related_question_ids": ["Q072", "Q165", "Q166", "Q167"]}, {"id": "Q169", "number": 169, "title": "什么是 CAS（比较并交换）？它的算法过程是怎样的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 92, "page_end": 93, "answer_original": "CAS（Compare And Swap）是一种乐观的无锁原子操作，包含三个参数 CAS(V, E, N)：V\n是内存中待更新的变量值，E 是线程预期的旧值，N 是新值。当且仅当 V 的值等于 E 时，才把\nV 更新为 N；若 V 不等于 E，说明期间被其他线程改动，当前线程不做任何操作并返回 V 的真\n实值。失败的线程不会被挂起，而是被告知失败并允许重试或放弃。基于这种机制，CAS 即\n使无锁也能发现其他线程的干扰并妥善处理。JDK 中 Unsafe 的 compareAndSwapInt 等底\n层方法借助 CPU 原子指令实现，是原子类与 AQS 高性能的基础。（来源：JAVA 面试知识点\n总结.pdf.txt，约第 96、2952-2964 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q170", "number": 170, "title": "CAS 会带来什么 ABA 问题？如何解决？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 93, "page_end": 93, "answer_original": "ABA 问题指：线程 one 从内存读取值 A，此时线程 two 也读 A，把它改成 B 后又改回 A；\none 再做 CAS 时发现值仍是 A 便成功更新，但过程其实发生过变化，可能隐含逻辑错误（如\n节点被移出又加回）。解决方法之一是引入版本号（version）：每次修改都带版本号，且版\n本号只增不减，CAS 时同时校验值与版本号，版本不匹配则失败。Java 中提供了\nAtomicStampedReference，用“值+时间戳/邮戳”封装来解决 ABA。面试中常借此考察对\n乐观锁缺陷的认知：CAS 保证值相同，却不保证“从未被改动过”。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 98、2995-3005 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q171", "number": 171, "title": "Java 原子类（如 AtomicInteger）的实现原理是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 93, "page_end": 93, "answer_original": "原子类位于 java.util.concurrent.atomic 包，底层依赖 CAS 与 volatile 实现无锁线程安全。\n以 AtomicInteger 为例，其 value 用 volatile int 修饰保证可见性，getAndIncrement()采用\n“for(;;)”自旋：循环读取当前值 current，计算 next=current+1，再调用\ncompareAndSet(current,next)进行 CAS；若成功返回，失败则重试直到成功。其他线程在\n逻辑上像自旋锁一样等待，直到该方法执行完 JVM 才选下一线程进入。相比 synchronized\n阻塞算法，CAS 是非阻塞算法，避免了线程切换，通常性能是 ReentrantLock 的数倍。常见\n类还有 AtomicLong、AtomicBoolean、AtomicReference 等。CAS 存在经典的 ABA 问\n题，即值从 A 变成 B 又变回 A 时 CAS 无法察觉，为此 Java 提供了\nAtomicStampedReference 和 AtomicMarkableReference，通过附加版本号或标记来识别\n是否发生过变更，在多线程反复改值的场景中更可靠。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 97、2965-2994 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q172", "number": 172, "title": "CAS 作为无锁算法有什么优缺点？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jmm", "topic": "可见性、volatile 与 CAS", "learning_priority": "核心", "page_start": 93, "page_end": 94, "answer_original": "优点：CAS 是非阻塞算法，线程竞争失败时仅自旋重试而不被挂起，避免了 synchronized 依\n赖操作系统互斥量带来的用户态/内核态切换与上下文切换开销，在冲突低时吞吐量高，是\nJ.U.C 性能提升的关键；且天然避免死锁。缺点：一是高竞争下大量线程自旋空耗 CPU，反而\n比阻塞更慢；二是存在 ABA 问题，需版本号等机制补救；三是只能保证单个变量的原子性，\n无法像锁那样保护一段复合临界区；四是自旋有次数/时间限制，长时间获取不到会膨胀为阻\n塞。因此 CAS 适合细粒度、低竞争的原子更新场景。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 63、2965-2971 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q173", "number": 173, "title": "什么是 AQS（抽象的队列同步器）？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 94, "page_end": 94, "answer_original": "AQS（AbstractQueuedSynchronizer）是 JDK 并发包中一套多线程访问共享资源的同步器\n框架，许多同步类都依赖它实现，如 ReentrantLock、Semaphore、CountDownLatch、\nReentrantReadWriteLock。它内部维护一个 volatile int state 表示共享资源状态，以及一个\nFIFO 线程等待队列（CLH 变体），当线程争用资源失败时被放入该队列阻塞。AQS 只定义顶\n层框架（队列维护、入队出队、唤醒），具体资源的获取与释放交由自定义同步器通过 state\n的 get/set/CAS 实现。这种模板方法设计让开发者只需关注 state 语义即可构建各类同步器，\n是 JUC 的基石。（来源：JAVA 面试知识点总结.pdf.txt，约第 98、3006-3018 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q174", "number": 174, "title": "AQS 定义了哪两种资源共享方式？分别对应哪些同步工具？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 94, "page_end": 94, "answer_original": "AQS 定义两种资源共享方式：独占（Exclusive）与共享（Share）。独占模式下同一时刻只\n有一个线程能持有资源，对应 ReentrantLock；共享模式下多个线程可同时获取资源，对应\nSemaphore、CountDownLatch。Node 内部用 SHARED 与 EXCLUSIVE 常量标识队列中线\n程的等待模式。ReentrantReadWriteLock 则同时实现两种方式：写锁走独占、读锁走共\n享。自定义同步器只需按需实现 tryAcquire/tryRelease（独占）或\ntryAcquireShared/tryReleaseShared（共享）其一即可，AQS 负责其余排队与唤醒逻辑。\n理解独占/共享是读懂 JUC 各类工具底层行为的前提。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 98、3019-3024、3051 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q175", "number": 175, "title": "AQS 的核心数据结构是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 94, "page_end": 95, "answer_original": "AQS 核心有两块：一是 volatile int state，代表共享资源状态，访问通过 getState()、\nsetState()、compareAndSetState()三种方式，compareAndSetState 基于 CAS 保证原子；\n二是 FIFO 的线程等待队列（CLH 队列变体），由内部类 Node 组成，争用资源失败的线程被\n封装成 Node 入队阻塞，Node 区分 SHARED 与 EXCLUSIVE 模式并维护前驱后继指针。此\n外 AQS 还含 ConditionObject 支持条件等待。volatile 保证 state 的可见性，CAS 保证\nstate 更新的原子性，队列则解决多线程争用时的公平排队与唤醒。state 语义由具体同步器定\n义，如 0 表示未锁定、N 表示倒数计数。（来源：JAVA 面试知识点总结.pdf.txt，约第 98、\n3013-3018、3055 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q176", "number": 176, "title": "基于 AQS 自定义同步器需要实现哪些模板方法？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 95, "page_end": 95, "answer_original": "自定义同步器只需实现与 state 获取/释放相关的模板方法，AQS 已封装好队列维护。需实现\n的方法包括：isHeldExclusively()（判断当前线程是否独占，使用 Condition 时才需）；\ntryAcquire(int)与 tryRelease(int)（独占模式的获取与释放）；tryAcquireShared(int)与\ntryReleaseShared(int)（共享模式，返回负数表示失败、0 表示成功无剩余资源、正数表示成\n功且有剩余）。AQS 未把它们全定义为 abstract，是因为独占模式只需实现独占那一组、共\n享模式只需实现共享那一组。开发者通过操作 state 的 get/set/CAS 即可表达锁语义。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 99、3024-3037 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q177", "number": 177, "title": "以 ReentrantLock 和 CountDownLatch 为例，说明 AQS 如何用 state 实现同步？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 95, "page_end": 95, "answer_original": "ReentrantLock 用独占模式：state 初始化为 0 表示未锁定，线程 lock()时 tryAcquire 把\nstate 从 0 CAS 为 1 获得锁；重入时 state 累加，unlock()时 state 递减，回到 0 才真正释\n放，其他线程才有机会获取，这正是可重入的本质。CountDownLatch 用共享模式：state 初\n始化为 N（等于子线程数），每个子线程执行完调用 countDown()使 state CAS 减 1，主线\n程 await()在 state 不为 0 时入队阻塞，直到所有子线程执行完 state=0，AQS 唤醒主线程使\n其从 await 返回继续。二者都只操作 state，排队唤醒由 AQS 统一完成，体现了框架的通用\n性。（来源：JAVA 面试知识点总结.pdf.txt，约第 99、3041-3054 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q178", "number": 178, "title": "ReentrantLock 与 synchronized 有哪些共同点？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 95, "page_end": 95, "answer_original": "二者作为 Java 主流锁机制，共同点有：都是用来协调多线程对共享对象和变量的访问；都是\n可重入锁，同一线程可多次获取同一把锁而不会自锁；都能保证可见性与互斥性，即一个线程\n释放锁前的修改对其他获得锁的线程可见，且同一时刻只有一个线程进入临界区。因此它们都\n能解决原子性与可见性问题，可互换用于大部分互斥场景。不同在于实现层级与使用方式，但\n在“保证线程安全”这一目标上是一致的，选型应基于是否需中断、公平、读写分离等高级特\n性。（来源：JAVA 面试知识点总结.pdf.txt，约第 91、2810-2813 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q179", "number": 179, "title": "ReentrantLock 与 synchronized 有哪些不同点？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 95, "page_end": 96, "answer_original": "不同点很多：ReentrantLock 需显式 lock()/unlock()（必须在 finally 释放），synchronized\n隐式加解锁；ReentrantLock 可响应中断、可定时、可轮询获取锁，synchronized 不可中断\n只能死等；ReentrantLock 是 API 级别（JDK 类），synchronized 是 JVM 级别关键字；\nReentrantLock 可实现公平锁；ReentrantLock 通过 Condition 可绑定多个条件，\nsynchronized 仅单一等待队列；底层 synchronized 偏悲观阻塞、Lock 用 AQS 乐观+CAS。\n异常时 synchronized 自动释放锁不会死锁，而 Lock 若不主动 unlock 易死锁。Lock 还可获\n知是否成功获锁，并提升多读场景效率（读写锁）。从 JDK6 起 synchronized 引入偏向锁、\n轻量级锁等优化后，两者性能差距已大幅缩小，因此无特殊需求时优先选 synchronized 以简\n化代码；只有需要可中断、超时、公平锁、多条件等待时才改用 ReentrantLock。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 92、2817-2835 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q180", "number": 180, "title": "ReentrantLock 中 Lock 接口的主要方法有哪些？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 96, "page_end": 96, "answer_original": "Lock 接口核心方法包括：lock()获取锁，若被占用则一直阻塞等待；tryLock()尝试获取，成\n功返回 true 否则立即返回 false 且不阻塞；tryLock(long,TimeUnit)带超时尝试；unlock()释\n放锁，只能由持有者调用，须在 finally 中执行；lockInterruptibly()可响应中断地获取锁，线\n程被中断时抛 InterruptedException；newCondition()创建绑定当前锁的 Condition 用于等\n待/通知；此外 ReentrantLock 还提供 getHoldCount()、isFair()、\nisHeldByCurrentThread()、getQueueLength()等辅助查询方法。这些方法共同提供了比\nsynchronized 更灵活、可控的并发控制能力。理解各方法的适用场景很关键：lock 用于必须\n获取锁的核心路径，tryLock 用于尝试获取、拿不到就执行别的逻辑以避免死等，\nlockInterruptibly 用于需要响应中断取消的长任务，newCondition 用于实现生产者-消费者\n等多条件协作模型。（来源：JAVA 面试知识点总结.pdf.txt，约第 66、2021-2050 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q181", "number": 181, "title": "公平锁和非公平锁有什么区别？性能差异为何？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 96, "page_end": 96, "answer_original": "公平锁在加锁前检查是否有线程已在排队，优先把锁给排队最久的线程，先来先得；非公平锁\n加锁时不考虑排队，直接尝试获取，失败才到队尾等待。ReentrantLock 构造可指定公平性，\n默认非公平。非公平锁性能通常比公平锁高 5~10 倍，因为公平锁需维护一个有序队列并在多\n核下频繁处理排队与唤醒，带来额外开销；非公平锁允许刚释放锁的线程或新线程直接抢锁，\n减少上下文切换。但非公平可能导致饥饿。synchronized 天生非公平，ReentrantLock 默认\n也非公平，仅特殊业务才用公平锁。（来源：JAVA 面试知识点总结.pdf.txt，约第 70、\n2161-2168 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q182", "number": 182, "title": "tryLock()、lock()、lockInterruptibly()三者有什么区别？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 96, "page_end": 97, "answer_original": "lock()会一直阻塞直到获得锁，期间不可中断；tryLock()仅“试图”获取，成功返回 true，失\n败立即返回 false 且当前线程继续向下执行，不会阻塞，另有带超时的 tryLock(time)版本；\nlockInterruptibly()在获取锁过程中若线程被 interrupt()则抛出 InterruptedException，可响\n应中断退出等待。区别核心在于“是否阻塞、是否可中断、是否会抛异常”：lock 不可中断\n死等；tryLock 不阻塞立即返回；lockInterruptibly 可中断。实际开发为避免死锁，常优先用\ntryLock(time)或 lockInterruptibly()，配合超时与中断实现可恢复的锁获取策略。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 68、2103-2108 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q183", "number": 183, "title": "Condition 接口与 Object 的 wait/notify 方法有什么区别？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 97, "page_end": 97, "answer_original": "Condition 的 await()等价于 Object 的 wait()，signal()等价于 notify()，signalAll()等价于\nnotifyAll()，但 Condition 更强大：一个 ReentrantLock 可通过 newCondition()创建多个\nCondition 对象，实现“按条件”精准唤醒指定线程，而 synchronized 的 wait/notify 只能\n随机唤醒或全唤醒，无法区分条件。Condition 必须与 Lock 绑定，线程须先获锁才能调用\nawait，调用后释放锁进入该条件等待队列。典型应用是用两个 Condition（notEmpty、\nnotFull）实现阻塞队列的有界等待。综上 Condition 提供了比 Object 监视器方法更细粒\n度、可分组的条件等待通知机制。此外 Condition 还提供了 awaitNanos、awaitUntil 等可超\n时、可响应中断的等待变体，比 Object.wait 在长时间等待与需要精细化控制的场景下更灵活\n可靠。（来源：JAVA 面试知识点总结.pdf.txt，约第 68、2098-2102 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q184", "number": 184, "title": "读写锁（ReadWriteLock）的原理是什么？适用于什么场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 97, "page_end": 97, "answer_original": "ReadWriteLock 将锁分为读锁与写锁：读锁是共享锁，多个线程可同时读；写锁是独占锁，\n写时只允许一个线程且禁止并发读。规则是“读读不互斥、读写互斥、写写互斥”，由 JVM\n控制。这样在读多写少、且读操作不影响数据一致性的场景（如配置缓存、白名单）下，读之\n间可完全并发，显著提升吞吐；写时则保证独占以保证正确。Java 提供\nReentrantReadWriteLock 实现，支持可重入与公平选择。读写分离思想是锁分离的经典案\n例，LinkedBlockingQueue 头尾独立锁也体现了类似思想。它牺牲了“读读互斥”的保守性\n换取并发性。（来源：JAVA 面试知识点总结.pdf.txt，约第 70、2168-2178 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q185", "number": 185, "title": "读锁与写锁之间的互斥关系是怎么样的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 97, "page_end": 98, "answer_original": "在 ReentrantReadWriteLock 中，读锁与读锁不互斥（多个线程可同时持有读锁并行读），\n读锁与写锁互斥（有线程写时其他线程不能读，有线程读时其他线程不能写），写锁与写锁互\n斥（只能一个线程写）。换句话说：读读共享、读写排他、写写排他。这种矩阵关系由 JVM\n在内部基于 state 的高低位分别计数读、写线程数来实现。理解该关系是正确使用读写锁的前\n提——若把本应加写锁的修改操作误加读锁，会破坏原子性导致并发写冲突；反之把高频读\n误加写锁则丧失并发优势。读多写少场景应读用读锁、写用写锁。（来源：JAVA 面试知识点\n总结.pdf.txt，约第 70、2169-2176 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q186", "number": 186, "title": "独占锁与共享锁有什么区别？请结合 AQS 说明。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 98, "page_end": 98, "answer_original": "独占锁（如 ReentrantLock）同一时刻只允许一个线程持有，是一种悲观保守策略，即使是只\n读线程获取后其他读线程也得等待，限制了不必要并发；共享锁（如 ReadWriteLock 的读\n锁、Semaphore）允许多个线程同时访问共享资源，是一种乐观策略，放宽加锁条件提升并\n发。在 AQS 中，Node 用 EXCLUSIVE 标识独占等待、SHARED 标识共享等待；独占模式实\n现 tryAcquire/tryRelease，共享模式实现 tryAcquireShared/tryReleaseShared（返回值负\n数失败、0 成功无剩余、正数成功有剩余）。ReentrantReadWriteLock 同时实现两种：写锁\n独占、读锁共享。选型的本质是“是否允许多读者并发”。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 70、2179-2192 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q187", "number": 187, "title": "线程池的原理是什么？为什么要使用线程池？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 98, "page_end": 98, "answer_original": "线程池通过复用线程来控制并发：预先创建若干工作线程，任务提交后放入任务队列，空闲线\n程从队列取任务执行；线程数超过最大值时多余任务排队；执行完任务的线程不销毁而是继续\n取下一个任务。其核心优点有：线程复用，避免频繁创建/销毁线程的系统开销；控制最大并\n发数，防止无节制创建线程压垮系统；提供统一管理（监控、拒绝策略、命名）。Java 线程\n池由 Executor 框架实现，核心类 ThreadPoolExecutor。相比“来一个任务 new 一个\nThread”，线程池显著提升响应速度、资源利用率与稳定性，是服务端高并发的标配。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 76、2354-2363 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q188", "number": 188, "title": "线程池是如何实现线程复用的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 98, "page_end": 98, "answer_original": "线程复用的关键在 ThreadPoolExecutor 启动的线程其 run()方法并非只跑一个任务，而是包\n含一个循环：线程启动时调用 Thread.start()，JVM 执行 run()，而 run()内部不断从任务队列\n（BlockingQueue）中获取 Runnable 来执行；若队列为空则阻塞等待。也就是说，一个工\n作线程在其生命周期内会循环消费多个提交进来的任务，而非每任务一线程。获取下一个\nRunnable 前可以是阻塞的（队列 take()），从而保证无线程空转。正是这种“线程常驻+循\n环取任务”模型，使线程被反复复用，极大降低创建销毁开销。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 76、2358-2363 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q189", "number": 189, "title": "线程池主要由哪几部分组成？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 99, "page_end": 99, "answer_original": "一般线程池分为四部分：线程池管理器，负责创建、管理线程池与参数配置；工作线程，即池\n中实际执行任务的线程；任务接口，每个任务必须实现的接口（如 Runnable/Callable），供\n工作线程调度运行；任务队列，存放已提交但尚未执行的任务，起缓冲作用。Java 中线程池\n通过 Executor 框架实现，涉及 Executor、Executors、ExecutorService、\nThreadPoolExecutor、Callable、Future、FutureTask 等类。理解组成有助于把握\nThreadPoolExecutor 构造参数与执行流程，也便于自定义拒绝策略与线程工厂来满足业务可\n观测性要求。（来源：JAVA 面试知识点总结.pdf.txt，约第 76、2364-2374 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q190", "number": 190, "title": "ThreadPoolExecutor 的构造参数（corePoolSize、maximumPoolSize 等）分别 有什么含义？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 99, "page_end": 99, "answer_original": "ThreadPoolExecutor 核心参数有七个：corePoolSize 核心线程数；maximumPoolSize 最\n大线程数；keepAliveTime 超过核心数的空闲线程存活时间；unit 为 keepAliveTime 单位；\nworkQueue 任务队列（已提交未执行的任务）；threadFactory 线程工厂（一般默认）；\nhandler 拒绝策略（任务过多时的处理方式）。参数需按业务权衡：IO 密集型可把\ncorePoolSize 设大以打满 CPU 等待时间，CPU 密集型则应接近核数避免上下文切换；队列\n选择有界还是无界直接决定背压与 OOM 风险。合理配置是线程池稳定与高效的关键。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 77、2375-2389 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q191", "number": 191, "title": "向线程池提交一个任务时，它的工作流程是怎样的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 99, "page_end": 99, "answer_original": "execute()提交任务时的判断逻辑：若运行线程数小于 corePoolSize，立即创建核心线程执\n行；若≥corePoolSize，把任务放入工作队列；若队列已满且运行线程数\n\u003cmaximumPoolSize，创建非核心线程立即执行该任务；若队列已满且运行线程数\n≥maximumPoolSize，则触发拒绝策略抛出异常。任务完成后线程从队列取下一任务；当线\n程空闲超过 keepAliveTime 且当前线程数>corePoolSize 时，该线程被回收，池最终收缩到\ncorePoolSize。注意：池刚创建时即使队列有任务也不会立即执行，需等提交触发。理解此流\n程有助于排查“任务不执行/被拒”问题。（来源：JAVA 面试知识点总结.pdf.txt，约第 78、\n2405-2419 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q192", "number": 192, "title": "JDK 内置的四种拒绝策略分别是什么？各自如何处理被拒绝的任务？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 99, "page_end": 100, "answer_original": "当线程用完且队列已满，内置四种 RejectedExecutionHandler：AbortPolicy 直接抛出\nRejectedExecutionException 阻止系统运行，是默认策略；CallerRunsPolicy 只要池未关\n闭，就在提交任务的调用者线程中直接运行被丢弃任务，不丢任务但会令提交线程性能骤降；\nDiscardOldestPolicy 丢弃队列中最老（即将执行）的一个任务，再尝试提交当前任务；\nDiscardPolicy 默默丢弃无法处理的任务、不做任何处理，允许丢任务时最省事。四者都实现\nRejectedExecutionHandler，若仍不满足需求可自定义扩展，例如记录日志或持久化任务。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 78、2392-2404 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q193", "number": 193, "title": "Java 通过 Executors 提供了哪四种线程池？各自特点是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 100, "page_end": 100, "answer_original": "Executors 提供四种便捷线程池：newFixedThreadPool 固定大小，核心=最大线程数，用无\n界 LinkedBlockingQueue，适合已知并发量的稳定负载；newCachedThreadPool 可缓存，\n核心为 0、最大为 Integer.MAX_VALUE，用 SynchronousQueue，空闲线程 60 秒回收，适\n合大量短任务但易创建过多线程；newSingleThreadExecutor 单线程，保证任务串行按顺序\n执行，队列缓冲；newScheduledThreadPool 支持定时与周期任务，使用\nDelayedWorkQueue。需提醒：Fixed 与 Single 使用无界队列可能堆积导致 OOM，\nCached 可能无限建线程，生产更推荐手动 ThreadPoolExecutor 设界。正因如此，阿里巴巴\nJava 开发手册明确禁止使用 Executors 创建线程池，要求改用 ThreadPoolExecutor 显式指\n定核心与最大线程数、队列类型与容量、拒绝策略，从而规避 OOM 风险。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 56、123-127 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q194", "number": 194, "title": "线程池中的空闲线程如何被回收（keepAliveTime 机制）？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 100, "page_end": 100, "answer_original": "当线程池中的线程数超过 corePoolSize 时，多余的空闲线程在等待新任务超过\nkeepAliveTime 后会被销毁，使池收缩回 corePoolSize；而核心线程默认一直存活（除非设\nallowCoreThreadTimeOut(true)）。keepAliveTime 单位为 unit 参数指定。这一机制让线\n程池在“低峰省资源、高峰扩并发”间平衡：任务多时临时扩容到 maximumPoolSize，闲时\n回收非核心线程。理解回收条件很重要——只有当前线程数>corePoolSize 的空闲线程才会\n因超时回收，核心线程会常驻以保持即时响应能力。（来源：JAVA 面试知识点总结.pdf.txt，\n约第 77、2383-2384、2416-2418 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q195", "number": 195, "title": "ThreadLocal 的作用是什么？它的实现原理是怎样的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threadlocal", "topic": "ThreadLocal 与资源清理", "learning_priority": "核心", "page_start": 100, "page_end": 101, "answer_original": "ThreadLocal 提供线程内局部变量，同一线程的不同方法/组件可共享该变量而无需作为参数\n层层传递，且各线程互不干扰。原理是：每个 Thread 内部都有一个 ThreadLocalMap 属\n性，key 是 ThreadLocal 静态实例、value 是线程各自的对象引用；线程调用 ThreadLocal\n的 get()/set()时，实际操作的是“当前线程自己的 ThreadLocalMap”，因此实现了线程隔\n离。典型用途是保存每个线程独享的数据库连接、Session 等。其本质是把共享变量从“线程\n间共享”转为“线程内独享”，避免了加锁，是空间换时间的解耦手段。（来源：JAVA 面试\n知识点总结.pdf.txt，约第 90、2779-2791 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q196", "number": 196, "title": "ThreadLocalMap 在 Thread 中是如何存在的？ThreadLocal 的使用场景有哪些？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threadlocal", "topic": "ThreadLocal 与资源清理", "learning_priority": "核心", "page_start": 101, "page_end": 101, "answer_original": "ThreadLocalMap 是 Thread 类的一个属性（threadLocals），每个线程各持有一个自己的\nMap，key 为共用的 ThreadLocal 静态实例、value 为各线程保存的对象。使用时把共享的\nThreadLocal 定义为 private static final，各线程通过同一实例的 get()取到自己线程私有的\n值，避免作为方法参数传递的繁琐。常见场景：管理数据库连接（每个线程一个\nConnection）、Session 管理、用户上下文透传、SimpleDateFormat 线程不安全对象的线\n程私有化。注意线程池复用线程时，ThreadLocal 值会跨任务残留，必须在 finally 中\nremove()清理，否则造成数据串号或内存泄漏。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 90、2783-2796 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q197", "number": 197, "title": "在线程池环境下使用 ThreadLocal 可能带来什么问题？应如何避免？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threadlocal", "topic": "ThreadLocal 与资源清理", "learning_priority": "核心", "page_start": 101, "page_end": 101, "answer_original": "线程池会复用固定数量的工作线程，而 ThreadLocal 的值绑定在“线程”而非“任务”上，\n因此上一个任务通过 ThreadLocal 设置的变量会被下一个复用该线程的任务读到，造成数据\n串号、脏数据；同时若任务结束不清理，ThreadLocalMap 中的 Entry（key 弱引用、value\n强引用）会随线程长期存活而累积，引发内存泄漏。规避方法：务必在任务结束的 finally 块\n中调用 ThreadLocal.remove()清除当前线程的值；对必须透传的上下文，改用框架提供的干\n净包装或在任务入口显式 set、出口 remove。这是 ThreadLocal 最典型的故障排查点。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 90 页结合线程池复用原理）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q198", "number": 198, "title": "什么是死锁？它通常在什么情况下发生？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 101, "page_end": 101, "answer_original": "死锁指多个线程同时被阻塞，其中部分或全部线程都在等待某个被其他线程持有且永不释放的\n资源，导致彼此无限等待、程序卡死。典型成因是两个线程以相反顺序分别持有一把锁并去申\n请对方那把锁（交叉加锁）。在 Java 中 synchronized 或 ReentrantLock 使用不当都可能引\n发。死锁产生的四个必要条件是互斥、占有并等待、不可剥夺、循环等待；只要破坏其一即可\n避免，如统一加锁顺序、使用 tryLock 超时、缩小锁范围。排查时可用 jstack 打印线程栈，\n定位 BLOCKED 且互相等待的线程及持有的锁，是生产故障排查的常用手段。（来源：JAVA\n面试知识点总结.pdf.txt，约第 76、2352-2353、2817-2835 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q199", "number": 199, "title": "如何排查和预防死锁？synchronized 与 ReentrantLock 在异常时处理锁的方式有 何不同？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "locks", "topic": "锁、AQS 与死锁", "learning_priority": "核心", "page_start": 102, "page_end": 102, "answer_original": "预防死锁的常用手段：固定加锁顺序避免交叉依赖、用 tryLock(time)超时放弃、尽量缩小临\n界区、使用开放调用。排查可用 jstack 或 Arthas 查看线程栈，找出处于 BLOCKED 且互相等\n待锁的线程及其持有链。需要特别注意的是：synchronized 在发生异常时会自动释放线程持\n有的锁，因此不易因异常导致死锁；而 ReentrantLock 若在 finally 中未手动 unlock()，异常\n时锁不会释放，极可能死锁。因此使用 Lock 必须放在 try/finally 中释放。这一差异也常作为\nsynchronized 与 Lock 对比的考点。（来源：JAVA 面试知识点总结.pdf.txt，约第 76、\n2352-2353、2828-2830 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q200", "number": 200, "title": "阻塞队列的原理是什么？它如何支撑生产者-消费者模型？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 102, "page_end": 102, "answer_original": "阻塞队列在普通队列基础上增加了阻塞语义：当队列为空时，消费者端线程自动阻塞挂起，直\n到有数据入队被唤醒；当队列已满时，生产者端线程自动阻塞挂起，直到有空位。它内部用条\n件变量（notEmpty/notFull）配合 ReentrantLock 实现等待通知，使生产者与消费者无需手\n动加锁协调。阻塞队列天然解耦了生产速度与消费速度，提供流量削峰与缓冲，是线程池任务\n队列、消息中间件的基础组件。Java 的 BlockingQueue 接口定义了 add/offer/put 与\npoll/take/drainTo 等插入与获取方法，分别对应抛异常、返特殊值、阻塞、超时四种处理方\n式。（来源：JAVA 面试知识点总结.pdf.txt，约第 79、2422-2435、2462-2471 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q201", "number": 201, "title": "Java 中常见的阻塞队列有哪些？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 102, "page_end": 102, "answer_original": "Java 主要阻塞队列有七种：ArrayBlockingQueue（数组有界、FIFO、可公平）、\nLinkedBlockingQueue（链表有界、默认容量极大、双锁高并发）、\nPriorityBlockingQueue（支持优先级的无界队列）、DelayQueue（基于优先级队列的延时\n无界队列）、SynchronousQueue（不存储元素、直接传递）、LinkedTransferQueue（链\n表无界 TransferQueue，多了 transfer/tryTransfer）、LinkedBlockingDeque（链表双向\n阻塞队列，支持工作窃取）。它们覆盖了有界/无界、公平/非公平、优先级、延时、零缓冲传\n递等不同需求，是线程池、定时任务、缓存失效等场景的底层支撑。理解它们的关键在于把握\n几组对偶属性：有界无界决定是否会因生产过快而撑爆内存，公平非公平影响吞吐与等待公平\n性，是否存储元素则决定是缓冲型还是直传型，选型时需结合背压与吞吐需求综合权衡。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 81、2472-2479 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q202", "number": 202, "title": "ArrayBlockingQueue 与 LinkedBlockingQueue 有什么区别？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 102, "page_end": 103, "answer_original": "二者均为 FIFO 有界阻塞队列，但差异明显：ArrayBlockingQueue 底层是数组，构造须指定\n容量，生产者与消费者共用同一把锁；LinkedBlockingQueue 底层是链表，默认容量\nInteger.MAX_VALUE（近乎无界），且对生产者端与消费者端分别使用独立的锁，因此高并\n发下生产与消费可并行，吞吐更高。ArrayBlockingQueue 可通过构造参数 true 设为公平访\n问（按阻塞顺序），公平会降低吞吐。由于 LinkedBlockingQueue 默认几乎无界，用作线程\n池队列时若任务暴增可能堆积导致 OOM，而 ArrayBlockingQueue 有界可提供更明确的背\n压。选型取决于是否需要高并发与有界保护。（来源：JAVA 面试知识点总结.pdf.txt，约第\n82、2483-2495 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q203", "number": 203, "title": "SynchronousQueue 与 DelayQueue 的特点及应用场景是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "pool", "topic": "线程池与阻塞队列", "learning_priority": "核心", "page_start": 103, "page_end": 103, "answer_original": "SynchronousQueue 是不存储元素的阻塞队列，每个 put 必须等一个 take，反之亦然，像\n“传球手”直接把数据交给消费者，因此吞吐量高于 Array/LinkedBlockingQueue，适合直\n接传递场景（如 CachedThreadPool 用其传递任务）。DelayQueue 是基于 PriorityQueue\n的延时无界队列，元素须实现 Delayed 接口并指定到期时间，只有延迟期满才能取出，常用\n于缓存失效（存有效期、线程轮询取出即过期）和定时任务调度（如 TimerQueue）。二者\n都服务于特殊并发模型：前者强调“零缓冲即时传递”，后者强调“延迟到时消费”。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 82、2500-2516 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q204", "number": 204, "title": "ConcurrentHashMap 的分段锁（Segment）原理是什么？它是如何减小锁粒度 的？", "group_id": "java", "group": "Java 语言与集合", "topic_id": "concurrent-map", "topic": "并发容器与遍历安全", "learning_priority": "核心", "page_start": 103, "page_end": 103, "answer_original": "ConcurrentHashMap 通过“减小锁粒度”提升并发：它把内部数据划分为若干个段\n（Segment），默认 16 个，即并发度为 16，每个 Segment 本质是继承自 ReentrantLock\n的可重入锁，守护一段 HashEntry 数组。put 时先根据 hash 定位到所属 Segment，只锁该\n段而非整表，不同段可真正并行写入；get 不加锁（靠 volatile 保证可见）。这种“分段锁”\n思想把大对象拆成小对象，极大降低锁冲突概率。JDK1.8 后改为 CAS+synchronized 对链表\n头/红黑树节点加锁，粒度更细，但“分段减小锁粒度”的设计思想仍是高并发容器经典范\n例。（来源：JAVA 面试知识点总结.pdf.txt，约第 92、2835-2858 页）", "version_review_recommended": false, "related_question_ids": ["Q120", "Q121"]}, {"id": "Q205", "number": 205, "title": "CountDownLatch 的原理是什么？适用于什么场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "sync-tools", "topic": "JUC 协作工具", "learning_priority": "进阶", "page_start": 103, "page_end": 104, "answer_original": "CountDownLatch 位于 java.util.concurrent，实现类似计数器：构造时给定计数 N，主线程\n调用 await()阻塞，各子线程完成任务后调用 countDown()使计数减 1，当计数归零时 await\n返回，主线程继续执行。它适用于“主线程等待若干子任务全部完成后再继续”的场景，如并\n发初始化多个服务、批量导入后汇总。底层基于 AQS 共享模式，state 初始化为 N，\ncountDown 用 CAS 减 1，await 在 state≠0 时入队，归零后 unpark 主线程。注意\nCountDownLatch 是一次性的，计数归零后不能重置复用。与之相对的 CyclicBarrier 则是一\n组线程相互等待、到齐后再一起放行，且可循环复用；二者一个强调等待其他线程完成，一个\n强调线程之间同步对齐，需按具体场景区分选用。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 84、2543-2565、2995-3050 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q206", "number": 206, "title": "CyclicBarrier 的原理是什么？适用于什么场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "sync-tools", "topic": "JUC 协作工具", "learning_priority": "进阶", "page_start": 104, "page_end": 104, "answer_original": "CyclicBarrier（回环栅栏）让一组线程互相等待至某个“栅栏状态（barrier）”后再同时继续\n执行。每个线程执行到 barrier.await()时挂起，当所有线程都到达 barrier 后，它们被同时释\n放继续后续任务。关键特性是可重用：所有线程释放后 CyclicBarrier 可重置再次使用，适合\n多轮迭代计算（如多玩家都加载完再开局）。核心方法 await()与带超时的 await(time)。底层\n用可重置的计数与条件等待实现。与 CountDownLatch 不同，CyclicBarrier 强调“队友互相\n等齐”，且支持回环复用，是并行计算中同步屏障的常用工具。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 84、2566-2604 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q207", "number": 207, "title": "Semaphore（信号量）的原理是什么？适用于什么场景？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "sync-tools", "topic": "JUC 协作工具", "learning_priority": "进阶", "page_start": 104, "page_end": 104, "answer_original": "Semaphore 基于计数信号量控制同时访问某资源的线程个数：构造给定许可数（如 5），线\n程 acquire()获取许可（无许可则阻塞），release()归还许可。它可用于构建对象池、资源池\n（如数据库连接池），或限流——例如 8 个工人、5 台机器，只有拿到许可的工人能使用机\n器。Semaphore.acquire()默认可响应中断，类似 lockInterruptibly，也有 tryAcquire 可轮\n询/定时；既可公平也可非公平构造；释放也必须在 finally 中完成。本质上 Semaphore 类似\n“可多个许可的锁”，控制并发度而非互斥，常用于流量控制与资源配额管理。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 68、85、2109-2144、2605-2660 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q208", "number": 208, "title": "CountDownLatch 和 CyclicBarrier 的区别是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "sync-tools", "topic": "JUC 协作工具", "learning_priority": "进阶", "page_start": 104, "page_end": 105, "answer_original": "二者都能实现线程间等待，但侧重点不同：CountDownLatch 用于“一个（或主）线程等待\n其他若干线程执行完再继续”，是等待者与被等待者的关系，计数只能倒数且不可重用；\nCyclicBarrier 用于“一组线程互相等待到同一状态再同时执行”，是队友相互等待，且可重置\n循环复用。底层上 CountDownLatch 基于 AQS 共享模式（state=N 倒数到 0 唤醒），\nCyclicBarrier 用可重置计数+条件等待。简言之：CountDownLatch 是“等别人干完”，\nCyclicBarrier 是“等大家到齐”，且后者能反复使用而前者一次性。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 86、2653-2660 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q209", "number": 209, "title": "Semaphore 与 ReentrantLock 有什么关系？二者如何区分？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "sync-tools", "topic": "JUC 协作工具", "learning_priority": "进阶", "page_start": 105, "page_end": 105, "answer_original": "Semaphore 基本能完成 ReentrantLock 的各项工作，用法也类似：通过 acquire()/release()\n获取释放临界资源，acquire 默认可响应中断（等同 lockInterruptibly），也支持 tryAcquire\n轮询与定时获取，同样可在构造时指定公平/非公平，且释放也必须在 finally 中。区别在语\n义：ReentrantLock 是互斥锁（许可数为 1 的独占），Semaphore 是“许可数>1”的共享\n信号量，控制同时访问线程个数而非完全互斥。创建计数为 1 的 Semaphore 即二元信号量，\n可当互斥锁用。二者都把锁释放交给手动，都基于 AQS。选型看是否需要“限并发数”还是\n“严格互斥”。（来源：JAVA 面试知识点总结.pdf.txt，约第 68、2135-2144 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q210", "number": 210, "title": "如何在两个线程之间共享数据？有哪些常规实现方法？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "threads", "topic": "线程状态与协作", "learning_priority": "核心", "page_start": 105, "page_end": 105, "answer_original": "Java 多线程通信主要靠共享内存，关注点可见性、有序性、原子性（JMM 解决前两者、锁解\n决原子性）。共享数据的常规实现有两种：一是把数据抽象成类，把操作封装成该类的方法并\n加 synchronized，多个 Runnable 持有同一数据对象，调用其同步方法，易做到互斥；二是\n将 Runnable 作为外部类的内部类，共享数据作为外部类成员变量，各内部类 Runnable 调用\n外部类的同步方法操作数据。两种方式核心都是“把共享变量收敛到单一对象，用同一把锁保\n护其读写”，从而保证线程安全。这也体现了“同步+互斥”的理想并发模型。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 88、2691-2777 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q211", "number": 211, "title": "请简述 JVM 是什么，它的基本组成包含哪些部分？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 105, "page_end": 105, "answer_original": "JVM 即 Java 虚拟机，是一台能够运行 Java 代码的\"假想计算机\"，它屏蔽了底层操作系统和\n硬件的差异，使 Java 程序可以\"一次编写、到处运行\"。从逻辑组成上看，JVM 包含一套字节\n码指令集、一组寄存器、一个栈、一个垃圾回收器、一块堆内存以及一个用于存储方法信息的\n方法域。JVM 本身运行在操作系统之上，与硬件没有直接交互，它接收编译器生成的字节码\n文件，再通过解释器或即时编译器把字节码翻译为具体平台上的机器码执行。理解 JVM 的组\n成有助于我们后续分析内存结构、垃圾回收与性能调优，是 Java 进阶面试的基础。需要注意\n的是，每启动一个 Java 程序就会实例化一个虚拟机，多个虚拟机实例之间的数据不能共享。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 19 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q212", "number": 212, "title": "为什么说 Java 是跨平台的？JVM 在其中起到了什么作用？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 106, "page_end": 106, "answer_original": "Java 的跨平台能力本质上来自\"字节码 + JVM\"的设计。Java 源文件（.java）先由编译器编译\n成与平台无关的字节码文件（.class），随后字节码文件交给 JVM 执行，JVM 中的解释器再\n把字节码翻译为特定机器上的机器码。关键在于：不同操作系统上的字节码解释器是不同的，\n但各平台实现的虚拟机规范是相同的，因此同一份 .class 文件可以在 Windows、Linux、\nmacOS 等任意安装了对应 JVM 的平台上运行，而无需重新编译。另外，当一个程序开始运\n行时虚拟机就被实例化，多个程序启动会存在多个虚拟机实例，程序退出或关闭时虚拟机实例\n随之消亡，实例之间数据互不共享。正是这种\"编译一次、到处运行\"的机制，奠定了 Java 良\n好的可移植性。（来源：JAVA 面试知识点总结.pdf.txt，约第 20 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q213", "number": 213, "title": "请说明 HotSpot JVM 中 Java 线程与原生操作系统线程的映射关系。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 106, "page_end": 106, "answer_original": "在 HotSpot JVM 中，Java 线程与操作系统原生线程存在直接的一一映射关系。当线程的本\n地存储、缓冲区分配、同步对象、栈、程序计数器等资源都准备好之后，JVM 就会创建一个\n操作系统原生线程；Java 线程的创建、运行、结束都绑定在原生线程的生命周期上。原生线\n程由操作系统负责调度，并被分配到任意可用的 CPU 上执行；当原生线程初始化完毕，就会\n回调 Java 线程的 run() 方法。当 Java 线程执行结束，原生线程随之被回收，并释放原生线程\n和 Java 线程占用的全部资源。这种映射方式使得 JVM 能够直接利用操作系统的线程调度能\n力，同时也意味着线程的并发度受限于底层操作系统能够提供的原生线程数量与 CPU 核数。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 20 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q214", "number": 214, "title": "HotSpot JVM 后台主要运行哪些系统线程？各自职责是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 106, "page_end": 106, "answer_original": "HotSpot JVM 在后台运行多类系统线程以支撑虚拟机运转，主要包括：第一，虚拟机线程\n（VM thread），它等待 JVM 到达安全点（Safepoint）后执行必须在独立线程里完成的操\n作，例如 stop-the-world 垃圾回收、线程栈 dump、线程暂停、偏向锁解除等；第二，周期\n性任务线程，负责定时器事件（中断），用来调度周期性操作的执行；第三，GC 线程，支持\nJVM 中不同种类的垃圾回收活动；第四，编译器线程，在运行时把字节码动态编译成本地平\n台相关的机器码（即 JIT 编译）；第五，信号分发线程，接收发送到 JVM 的信号并调用适当\n的 JVM 方法处理。这些后台线程与用户线程并发协作，其中涉及安全点的操作会短暂暂停用\n户线程以保证一致性。（来源：JAVA 面试知识点总结.pdf.txt，约第 21 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q215", "number": 215, "title": "请整体说明 JVM 运行时数据区的分类，哪些区域是线程私有的，哪些是线程共享 的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 106, "page_end": 107, "answer_original": "JVM 运行时数据区整体上可分为三大类：线程私有区域、线程共享区域以及直接内存。线程\n私有区域包括程序计数器、虚拟机栈和本地方法栈，它们的生命周期与线程相同，随用户线程\n的启动而创建、随线程结束而销毁；由于 HotSpot 中每个线程都与操作系统本地线程直接映\n射，这部分内存的存否跟随本地线程的生灭。线程共享区域包括 Java 堆和方法区，它们随虚\n拟机的启动而创建、随虚拟机关闭而销毁，被所有线程共同访问。此外还有直接内存，它并不\n是 JVM 运行时数据区规范的一部分，但会被频繁使用，典型如 JDK 1.4 引入的 NIO 通过\nNative 函数直接分配堆外内存，用 DirectByteBuffer 引用操作，从而避免 Java 堆与 Native\n堆之间来回拷贝数据，在特定场景显著提升性能。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 21 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q216", "number": 216, "title": "线程私有区域和线程共享区域在生命周期上有何不同？这种设计有何意义？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 107, "page_end": 107, "answer_original": "线程私有区域（程序计数器、虚拟机栈、本地方法栈）的生命周期与具体线程绑定：线程启动\n时创建，线程结束时销毁，因此不存在线程安全问题，也无需进行垃圾回收。线程共享区域\n（Java 堆、方法区）则随整个虚拟机的启动而创建、随虚拟机退出而销毁，所有线程都能访\n问其中的对象和数据，这也使得堆和方法区需要复杂的并发安全机制与垃圾回收策略。将区域\n按私有/共享划分，本质上对应了\"线程上下文数据\"和\"全局共享数据\"两类不同语义：局部变\n量、方法调用链等天然属于线程自身，而对象实例、类元信息等需要跨线程共享。理解这一点\n有助于解释为什么栈不会 OOM（除递归过深）、而堆和方法区容易成为内存溢出与 GC 的主\n战场。（来源：JAVA 面试知识点总结.pdf.txt，约第 21 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q217", "number": 217, "title": "什么是程序计数器？为什么它是唯一一个不会抛出 OutOfMemoryError 的区域？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 107, "page_end": 107, "answer_original": "程序计数器是一块较小的内存空间，是当前线程所执行字节码的行号指示器，属于线程私有内\n存，每条线程都有各自独立的程序计数器。如果线程正在执行 Java 方法，计数器记录的是虚\n拟机字节码指令的地址（即当前指令的地址）；如果执行的是 Native 方法，则计数器值为空\n（Undefined）。它之所以是唯一一个在虚拟机规范中没有规定任何 OutOfMemoryError 情\n况的区域，是因为它的容量在概念模型里固定为可保存一个返回地址或 native 指针，生命周\n期与线程一一对应、随线程生灭，不存在\"申请不到内存\"的场景。也正因如此，它是 JVM 内\n存区域中最简单、也最不会发生内存异常的区域，通常用于上下文切换后恢复执行位置。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 22 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q218", "number": 218, "title": "程序计数器在执行 Java 方法和 Native 方法时分别记录什么内容？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 107, "page_end": 108, "answer_original": "程序计数器记录的是\"当前线程正在执行的字节码指令地址\"，但会因方法类型不同而取值不\n同：当线程正在执行普通的 Java 方法时，计数器保存的是虚拟机字节码指令的地址，也就是\n当前将要执行的那条指令的位置，这样在线程被切换出去再恢复时，能准确回到断点继续执\n行；当线程正在执行 Native 本地方法时，由于本地方法的执行并不由 JVM 字节码解释器驱\n动，计数器的值为空（Undefined），因为此时没有对应的 Java 字节码指令需要指示。需要\n强调的是，程序计数器是线程私有的，每个线程独立维护，互不干扰。它不记录对象、不分配\n堆内存，仅仅是行号指示，因此既不参与垃圾回收，也不会出现内存溢出。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 22 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q219", "number": 219, "title": "什么是虚拟机栈？请解释栈帧的定义及其生命周期。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 108, "page_end": 108, "answer_original": "虚拟机栈是线程私有的内存区域，用于描述 Java 方法执行的内存模型。每个方法在被调用执\n行的同时都会创建一个栈帧（Stack Frame），用于存储局部变量表、操作数栈、动态链接、\n方法出口等信息；每一个方法从调用到执行完成的过程，就对应一个栈帧在虚拟机栈中从入栈\n到出栈的过程。栈帧是用来存储数据和部分过程结果的数据结构，同时还被用来处理动态链\n接、方法返回值和异常分派。栈帧随着方法调用而创建，随着方法结束而销毁——无论方法\n是正常完成返回，还是因抛出方法内未被捕获的异常而结束，都视为方法结束，对应栈帧都会\n被销毁。因此虚拟机栈深度直接受方法递归调用链影响，过深会抛出 StackOverflowError。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 22 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q220", "number": 220, "title": "栈帧内部包含哪些关键信息？各自的作用是什么？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 108, "page_end": 108, "answer_original": "栈帧内部主要包含四部分关键信息：其一，局部变量表，用于存放方法参数和方法内定义的局\n部变量，编译期即可确定大小；其二，操作数栈，是一个后进先出的栈结构，作为字节码指令\n执行过程中的临时计算工作区，例如算术运算、方法调用传参都依赖它；其三，动态链接，指\n向运行时常量池中被调用方法的符号引用，支持在运行期把符号引用解析为直接引用，从而实\n现多态分派；其四，方法出口，记录方法正常返回或异常退出后应恢复的执行位置（包括程序\n计数器值和栈帧上下文）。这四部分共同支撑了方法的调用、计算与返回。理解栈帧结构对分\n析递归溢出、局部变量生命周期以及方法调用性能都十分关键。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q221", "number": 221, "title": "什么是本地方法栈？它与虚拟机栈有什么区别，HotSpot 又是如何处理的？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 108, "page_end": 109, "answer_original": "本地方法栈与虚拟机栈作用类似，区别在于服务对象不同：虚拟机栈为执行 Java 方法服务，\n而本地方法栈为执行 Native 方法（本地方法）服务。在虚拟机规范中，本地方法栈的具体实\n现并无强制规定；如果某个虚拟机实现使用 C-linkage 模型来支持 Native 调用，那么该栈通\n常会是一个 C 栈。不过在 HotSpot 虚拟机中，设计者直接把本地方法栈和虚拟机栈合二为\n一，不再单独区分，二者共用同一套栈结构。这意味着 HotSpot 中线程的栈既承载 Java 方\n法的栈帧，也承载 Native 方法的调用信息。由于它同样是线程私有的，生命周期随线程生\n灭，且深度受限，当 Native 方法递归或调用链过深时同样可能抛出栈溢出错误。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q222", "number": 222, "title": "请说明 Java 堆在 JVM 中的地位，以及为什么它是垃圾收集的重点区域。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 109, "page_end": 109, "answer_original": "Java 堆是被所有线程共享的一块内存区域，几乎所有的对象实例和数组都在这里分配内存，\n因此它是 JVM 中最大、也最核心的一块运行时数据区。正因为它存放着几乎所有存活对象，\n而对象不断地被创建、不再被引用、最终需要回收，堆自然成为垃圾收集器进行垃圾收集的最\n重要的内存区域。现代虚拟机普遍采用分代收集算法，因此从 GC 角度看，Java 堆还可以进\n一步细分为新生代（包含 Eden 区、From Survivor 区和 To Survivor 区）和老年代。由于堆\n是线程共享且对象分配极其频繁，它的空间大小、分代比例、回收策略直接决定了应用的吞吐\n量和停顿时间，所以堆相关的参数（如 -Xms、-Xmx、-Xmn）和收集器选型是 JVM 调优的\n核心。（来源：JAVA 面试知识点总结.pdf.txt，约第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q223", "number": 223, "title": "从垃圾回收角度，Java 堆可以细分为哪些区域？各区域承担什么角色？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 109, "page_end": 109, "answer_original": "从 GC 角度看，Java 堆被划分为新生代和老年代。新生代用于存放新生的对象，一般占据堆\n的 1/3 空间，由于对象创建频繁，新生代会频繁触发 Minor GC；新生代又细分为 Eden 区、\nServivorFrom（From Survivor）和 ServivorTo（To Survivor）三个区。其中 Eden 是新对\n象的出生地，当 Eden 内存不足时触发 Minor GC，把存活对象复制到 Servivor 区并年龄加\n一；ServivorFrom 是上一次 GC 的幸存者、作为本次被扫描者，ServivorTo 保存本次\nMinor GC 过程后的幸存者。老年代则存放生命周期较长的对象，对象在 Survivor 区熬过若\n干次 GC、年龄达到阈值（默认 15）后晋升老年代，老年代相对稳定，触发 Major GC/Full\nGC 的频率较低但耗时更长。这种划分让我们能针对不同存活特征采用不同回收算法。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 23 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q224", "number": 224, "title": "什么是方法区？它存储哪些数据？HotSpot 如何用永久代来实现方法区？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 109, "page_end": 110, "answer_original": "方法区是线程共享的内存区域，用于存储被 JVM 加载的类信息、常量、静态变量、即时编译\n器（JIT）编译后的代码等数据，常被称作永久代（Permanent Generation）。HotSpot VM\n把 GC 分代收集的思想扩展到了方法区，即使用 Java 堆的永久代来实现方法区，这样\nHotSpot 的垃圾收集器就可以像管理 Java 堆一样管理这部分内存，而不必为方法区单独开发\n专用的内存管理器。方法区中永久代的回收目标主要是常量池的回收和类型的卸载，但通常收\n益很小。方法区还包含运行时常量池，用于存放 Class 文件常量池加载后的内容。理解方法区\n有助于解释类元信息、静态变量以及字符串常量在内存中的归属，也是排查永久代/元空间溢\n出的基础。（来源：JAVA 面试知识点总结.pdf.txt，约第 23 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q225", "number": 225, "title": "什么是运行时常量池？它和 Class 文件常量池有什么关系？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 110, "page_end": 110, "answer_original": "运行时常量池（Runtime Constant Pool）是方法区的一部分。在 Class 文件中，除了类的版\n本、字段、方法、接口等描述信息外，还有一项信息是常量池表（Constant Pool Table），\n用于存放编译期生成的各种字面量和符号引用。这部分内容在类加载后会被存放到方法区的运\n行时常量池中。也就是说，Class 文件常量池是\"静态的字节码中的常量描述\"，而运行时常量\n池是\"类加载后进入内存、可被虚拟机直接使用的动态形态\"。Java 虚拟机对 Class 文件每一\n部分的格式都有严格规定，每个字节存什么数据都必须符合规范，这样才会被虚拟机认可、装\n载和执行。运行时常量池具备动态性，运行期间也可能把新的常量放入池中（如\nString.intern）。（来源：JAVA 面试知识点总结.pdf.txt，约第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q226", "number": 226, "title": "永久代和元空间有什么区别？为什么 Java 8 用元空间替代永久代？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 110, "page_end": 110, "answer_original": "在 Java 8 之前，方法区的实现是永久代（PermGen），用于存储 Class 和元数据信息，且永\n久代位于 JVM 堆内，受 -XX:MaxPermSize 限制，随着加载类的增多容易被撑满并抛出\nOOM。Java 8 移除了永久代，改用\"元空间\"（Metaspace）实现方法区。二者本质类似，最\n大区别在于：元空间并不在虚拟机中，而是使用本地内存（native memory），因此默认情\n况下元空间大小仅受本地内存限制，类的元数据放入 native memory，而字符串常量池和类\n的静态变量被移入 Java 堆中。这样能加载多少类的元数据不再由 MaxPermSize 控制，而由\n系统实际可用空间控制，极大降低了因类加载过多导致永久代溢出的风险。这也是 Java 8 内\n存模型的重要变化点。（来源：JAVA 面试知识点总结.pdf.txt，约第 24 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q227", "number": 227, "title": "元空间的本质是什么？使用本地内存会带来哪些实际影响？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 110, "page_end": 111, "answer_original": "元空间的本质是方法区在 Java 8 及之后版本的实现，它并不占用 JVM 堆内存，而是直接使用\n本地内存（native memory）来存放类的元数据（如类结构、方法、字段等）。这一变化带\n来几方面实际影响：第一，类的元数据容量不再受 -XX:MaxPermSize 约束，默认仅受宿主机\n物理内存和操作系统可用空间限制，降低了\"PermGen space\" OOM 的发生概率；第二，字\n符串常量池和静态变量被移入 Java 堆，使堆与方法区的职责更清晰；第三，虽然元空间减少\n了溢出风险，但若类加载器泄漏（如 Web 容器热部署时旧类加载器未释放），元空间仍可能\n因本地内存无限增长而触发本地内存耗尽，因此生产环境通常仍需通过 -\nXX:MaxMetaspaceSize 等参数加以约束，避免无上限增长影响稳定性。（来源：JAVA 面试\n知识点总结.pdf.txt，约第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q228", "number": 228, "title": "什么是直接内存？它在 JVM 中处于什么位置，NIO 中如何使用它？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "jvm-memory", "topic": "JVM 架构与运行时内存", "learning_priority": "核心", "page_start": 111, "page_end": 111, "answer_original": "直接内存并不是 JVM 运行时数据区规范的一部分，但它会被频繁使用。JDK 1.4 引入的 NIO\n提供了基于 Channel 与 Buffer 的 I/O 方式，它可以使用 Native 函数库直接分配堆外内存，\n然后通过一个存储在 Java 堆里的 DirectByteBuffer 对象作为这块内存的引用进行操作。这样\n做的好处是避免了在 Java 堆和 Native 堆之间来回复制数据，因此在网络传输、文件拷贝等\n需要频繁 I/O 的场景中可以显著提高性能。需要注意的是，直接内存不受 -Xmx 限制，其大\n小受本机总内存制约，若分配过多仍可能导致 OOM；同时它的回收依赖 DirectByteBuffer\n对象被 GC 后由 Cleaner 触发释放，因此也可能出现堆外内存迟迟不回收的问题，是性能与\n故障排查中需要关注的点。（来源：JAVA 面试知识点总结.pdf.txt，约第 22 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q229", "number": 229, "title": "请描述新生代的组成，以及 Eden 区在其中的作用。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 111, "page_end": 111, "answer_original": "新生代用于存放新生的对象，一般占据堆的 1/3 空间，由于对象创建非常频繁，新生代会频\n繁触发 Minor GC。新生代进一步划分为三个区：Eden 区、ServivorFrom（From\nSurvivor）和 ServivorTo（To Survivor）。其中 Eden 区是新对象的主要出生地——绝大多\n数新创建的对象（尤其是占用内存不大的对象）都会优先分配到 Eden 区；如果新创建的对象\n占用内存很大，则会直接分配到老年代而不是 Eden。当 Eden 区内存不够时，就会触发一次\nMinor GC，对新生代进行垃圾回收，把 Eden 和 ServivorFrom 中仍然存活的对象复制到\nServivorTo（或老年代），然后清空 Eden 和 ServivorFrom。理解 Eden 的角色是掌握\nMinor GC 与对象晋升机制的前提。（来源：JAVA 面试知识点总结.pdf.txt，约第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q230", "number": 230, "title": "SurvivorFrom 和 SurvivorTo 在 Minor GC 中分别承担什么角色？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 111, "page_end": 112, "answer_original": "Survivor 区由两个大小相等的空间组成，在任一时刻只有一个用于存放对象，二者角色在每\n次 Minor GC 后互换。ServivorFrom（From Survivor）存放的是上一次 GC 的幸存者，作\n为本次 Minor GC 被扫描的对象来源之一；ServivorTo（To Survivor）则用于保留本次\nMinor GC 过程中的幸存者。Minor GC 执行时，会把 Eden 和 ServivorFrom 中存活的对象\n复制到 ServivorTo，同时把这些对象的年龄加 1（若年龄达到老年代标准或 ServivorTo 放不\n下，则直接进入老年代），随后清空 Eden 和 ServivorFrom，最后把 ServivorTo 与\nServivorFrom 互换，原 ServivorTo 成为下一次 GC 时的 ServivorFrom。这种\"复制+互换\"\n机制保证了对象在 Survivor 间滚动并逐步晋升。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q231", "number": 231, "title": "请详细说明 Minor GC 的执行过程（复制—清空—互换）。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 112, "page_end": 112, "answer_original": "Minor GC 采用复制算法，其过程可概括为三步：第一步\"复制\"，把 Eden 区和\nServivorFrom 区域中存活的对象复制到 ServivorTo 区域；如果某些对象年龄已达到老年代\n标准，则直接复制到老年代区，同时把这些存活对象的年龄加 1，若 ServivorTo 空间不够也\n会放入老年代。第二步\"清空\"，清空 Eden 和 ServivorFrom 中的全部对象，这些空间被回收\n以便下次分配。第三步\"互换\"，把 ServivorTo 和 ServivorFrom 互换角色，原 ServivorTo 成\n为下一次 GC 时的 ServivorFrom，原 ServivorFrom 变为下一次的 ServivorTo。通过这种复\n制—清空—互换的循环，新生代中大量短命对象被高效回收，只有少数熬过多次 GC 的对象\n才会逐步晋升到老年代，从而兼顾了回收效率与内存碎片控制。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q232", "number": 232, "title": "对象在新生代的年龄是如何增长的？什么情况下会直接进入老年代？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 112, "page_end": 112, "answer_original": "对象在 Survivor 区每躲过一次 Minor GC，其年龄就加 1。默认情况下，当对象年龄达到 15\n（可通过参数调整）时，会被移到老年代中。除此之外，还有几种直接进入老年代的情况：一\n是大对象直接分配，如果新创建的对象占用内存很大，会绕过 Eden 直接分配到老年代，避免\n在 Eden 与 Survivor 间频繁复制；二是在 Minor GC 复制过程中，若 ServivorTo 空间不足\n以容纳某个存活对象，该对象会被直接放入老年代；三是动态年龄判定，若 Survivor 中相同\n年龄对象大小总和超过 Survivor 空间的一半，年龄大于等于该值的对象也会提前晋升。老年\n代用于存放生命周期长的对象，晋升机制使分代收集能针对不同存活特征采用不同算法。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q233", "number": 233, "title": "请说明老年代的特点，以及 Major GC / Full GC 通常在什么条件下被触发。", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 112, "page_end": 113, "answer_original": "老年代主要存放应用程序中生命周期较长的内存对象，对象比较稳定，因此 Major GC 不会频\n繁执行。一般在触发 Major GC 前会先进行一次 Minor GC，让部分新生代对象晋升入老年\n代，当老年代空间不够用时才触发；另外，当无法找到足够大的连续空间来分配新创建的较大\n对象时，也会提前触发一次 Major GC 来腾出空间。Full GC 通常指对整个堆（含方法区/元\n空间）的回收，触发条件更广，除老年代不足外，还包括方法区/元空间不足、显式调用\nSystem.gc()（仅建议，不保证立即执行）、以及 CMS 并发模式失败等。由于老年代使用标\n记-整理或标记-清除，Full GC 通常停顿长、影响大，是线上调优重点规避的对象。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 25 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q234", "number": 234, "title": "Major GC 采用什么算法？它会产生哪些问题？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 113, "page_end": 113, "answer_original": "老年代的对象存活率高、没有额外空间作分配担保，因此 Major GC 采用标记-清除算法或标\n记-整理算法（教材中表述为标记清除：首先扫描一次所有老年代，标记出存活的对象，然后\n回收未被标记的对象）。其主要问题有：第一，耗时较长，因为要先全量扫描再回收，且老年\n代对象多、存活率高；第二，标记-清除会产生内存碎片，导致后续大对象可能因找不到连续\n空间而提前触发下一次 GC；第三，回收过程通常需要 STW（停止用户线程），造成明显停\n顿。为减少内存损耗，实践中常进行整理或标记以便下次直接分配。也正因老年代回收代价\n高，分代收集才把\"复制算法\"留给新生代、把\"标记-整理\"留给老年代，以扬长避短。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 26 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q235", "number": 235, "title": "当出现内存溢出（OOM）时，常见的溢出场景有哪些？应如何排查定位？", "group_id": "runtime", "group": "并发与 JVM", "topic_id": "gc", "topic": "对象回收、引用与 OOM", "learning_priority": "核心", "page_start": 113, "page_end": 113, "answer_original": "根据 JVM 内存结构，常见 OOM 场景有四类：一是 Java 堆溢出，当老年代也满了、装不下\n新对象时抛出 OutOfMemoryError: Java heap space，通常源于内存泄漏或堆过小；二是方\n法区/永久代溢出（Java 8 前），永久代随加载的 Class 增多而胀满，抛出 PermGen\nspace，多见于频繁动态生成类（如 CGLIB、JSP）；三是元空间溢出（Java 8 后），类元数\n据使用本地内存，类加载器泄漏时抛出 Metaspace；四是虚拟机栈/本地方法栈溢出，递归过\n深或线程数过多会抛 StackOverflowError 或 unable to create new native thread。排查时\n应先依据异常信息判断是哪块区域溢出，再结合代码分析对象生命周期、类加载数量、递归深\n度，并配合堆转储与线程快照分析，同时合理调整 -Xmx、-Xms、元空间上限等参数。（来\n源：
