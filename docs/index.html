缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 185, "page_end": 185, "answer_original": "设置 key 过期时间用 EXPIRE 命令（单位秒），例如 EXPIRE key 3600 表示 1 小时后过期；\n也可用 PEXPIRE（毫秒）、EXPIREAT（到指定 Unix 时间戳过期）、SETEX（设值同时设过\n期）。若想让一个已经带过期时间的 key 变为永久有效，则用 PERSIST 命令移除其过期时\n间，之后该 key 永不过期，直到被显式删除或内存淘汰。还有 TTL 命令可查看剩余生存时间\n（返回 -1 表示永不过期，-2 表示 key 不存在）。注意：对 key 执行 SET、GETSET 等覆盖\n写操作会清除原有过期时间；RENAME Renamed key 会保留过期时间（取决于版本实\n现）。合理运用过期时间是缓存自动失效、控制内存的基础手段，也是解决缓存雪崩时“加随\n机值打散过期”的落地点。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q461", "number": 461, "title": "如何对 Redis 做内存优化，降低内存占用？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 185, "page_end": 186, "answer_original": "Redis 内存优化常用手段：第一，尽量用散列表（hash）聚合小对象——把同一对象的多个\n属性放进一个 hash，而不是为每个属性单独建 key，小 hash 在 ziplist/listpack 编码下内存\n极紧凑，例如用户对象不要拆成 user:1:name、user:1:email，而是存成一条 hash；第二，\n善用集合类型（hash/list/zset/set）把很多小 KV 紧凑存放；第三，32 位 Redis 实例内存受\n限但编码更省，可结合使用；第四，为所有 key 设置合理的过期时间，借助淘汰策略自动清\n理；第五，避免大 key，必要时拆分；第六，根据数据特征选合适编码（如小数据用\nziplist）；第七，控制 key 和 value 的命名与长度。监控上关注 used_memory、内存碎片\n率，及时优化。内存优化的本质是“用对数据结构 + 避免冗余 + 合理过期”。（来源：\nRedis_快看看这 40 道面试题.pdf.txt，约第 9-10 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q462", "number": 462, "title": "一个 Redis 实例最多能存放多少 key，集合能存多少元素？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-memory", "topic": "过期、淘汰与内存管理", "learning_priority": "核心", "page_start": 186, "page_end": 186, "answer_original": "理论上 Redis 每个实例可以处理多达 2^32（约 42 亿）个 keys，官方也在实际测试中每个实\n例至少存放过 2.5 亿个 keys。任何 list、set、sorted set 都可以存放 2^32 个元素。换句话\n说，Redis 的存储极限主要取决于系统可用内存大小，而非硬编码的上限——只要内存够，就\n能继续放。但理论极限不等于生产建议：key 或集合过多会带来大 key、慢命令、迁移困难、\n内存碎片等问题。String 单个值上限是 512M。因此设计时应结合 maxmemory 限制和淘汰\n策略，避免无节制增长，并对超大规模数据做分片（Cluster）或拆分，否则单实例过大在持\n久化、主从同步、故障恢复时都会非常痛苦。（来源：Redis_快看看这 40 道面试题.pdf.txt，\n约第 4 页、第 10-11 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q463", "number": 463, "title": "Redis 最适合哪些应用场景？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 186, "page_end": 186, "answer_original": "Redis 典型适用场景有五类：①会话缓存（Session Cache），用 Redis 持久化特性缓存用户\n会话，比 Memcached 更可靠，重启也不丢会话；②全页缓存（FPC），把渲染好的页面或\n片段缓存，结合磁盘持久化即使重启用户也察觉不到加载变慢（如 Magento、WordPress 的\nRedis 插件）；③队列，利用 list 的 push/pop 或阻塞的 blpop 做轻量消息队列，或\npub/sub 实现发布订阅（如 Celery 用 Redis 作 broker）；④排行榜/计数器，利用原子自增\n和 Sorted Set 轻松实现实时排名与计数；⑤发布/订阅，用于聊天系统、脚本触发器等。此外\n还常用于分布式锁、限流器、延时任务、Geo 地理位置等。选型要点：适合“读多写少、可\n丢失或可接受最终一致、需要低延迟”的场景，不宜替代关系型数据库做复杂事务。（来源：\nRedis_快看看这 40 道面试题.pdf.txt，约第 11-12 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q464", "number": 464, "title": "如何用 Redis 实现异步队列，有哪些方式？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 186, "page_end": 187, "answer_original": "常见做法是用 list 结构做队列：rpush 生产消息、lpop 消费消息，当 lpop 没有消息时适当\nsleep 一会再重试。若不想 sleep 空轮询，可用 blpop 阻塞等待直到消息到来，节省 CPU。\n如果需要“一次生产、多次消费”，则用 pub/sub 主题订阅模式实现 1:N 的消息队列。但\npub/sub 有缺点：消费者下线期间生产的消息会直接丢失，因此它不适合要求可靠投递的业\n务，这类场景应改用 RabbitMQ、Kafka 等专业消息中间件。此外还可用 Sorted Set 实现延\n时队列：以时间戳为 score、消息内容为 value 用 zadd 生产，消费者用 zrangebyscore 取\n“N 秒之前”的数据轮询处理。总之 Redis 队列轻量、低延迟，但可靠性弱于专业 MQ，按\n业务对可靠性的要求选型。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 13 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q465", "number": 465, "title": "如果 Redis 中有 1 亿个 key，如何找出以某固定前缀开头的 10 万个 key？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 187, "page_end": 187, "answer_original": "直观做法是用 KEYS prefix* 指令扫出匹配模式的 key 列表。但 KEYS 是阻塞命令，会遍历全\n库，在 1 亿 key 的规模下会造成单线程长时间阻塞，线上服务会卡顿甚至停顿直到执行完，\n严重影响可用性，因此生产环境严禁在线上用 KEYS。正确做法是用 SCAN 命令（如 SCAN 0\nMATCH prefix* COUNT 1000）增量、游标式地遍历，它不会阻塞 Redis，可以无阻塞地提\n取指定模式的 key 列表；代价是 SCAN 可能有重复（同 key 多次返回）且结果不保证严格完\n整（遍历期间有增删会略有偏差），客户端做一次去重即可，整体耗时虽比 KEYS 长，但换来\n不阻塞服务的巨大收益。类似地，集合内元素遍历应使用 SSCAN/HSCAN/ZSCAN，避免\nSMEMBERS/HGETALL 在大对象上阻塞。（来源：Redis_快看看这 40 道面试题.pdf.txt，约\n第 12 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q466", "number": 466, "title": "Redis 为什么这么快，核心原因有哪些？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 187, "page_end": 187, "answer_original": "Redis 高性能的核心原因主要有三点：第一，纯内存操作，数据都在内存中，读写无需磁盘\nIO，查找和操作时间复杂度接近 O(1)，速度极快；第二，单线程模型，避免了多线程频繁的\n上下文切换和锁竞争开销，命令执行天然串行、原子；第三，采用非阻塞 I/O 多路复用机制\n（如 epoll、kqueue、evport、select），单个线程通过事件分发器跟踪多个 socket 的状\n态，高效管理海量并发连接，而不是每来一个请求就开一个线程。可类比“一个快递员依次取\n件送货”比“每单雇一个快递员抢车”更高效。三者叠加使 Redis 能达到读 11 万/秒、写 8.1\n万/秒的吞吐。理解 I/O 多路复用是面试官考察网络模型深度的关键点。（来源：阿里面\n试.pdf.txt，约第 23 页；Redis_快看看这 40 道面试题.pdf.txt，约第 3 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q467", "number": 467, "title": "什么是渐进式 ReHash，为什么 Redis 要这么做？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 187, "page_end": 188, "answer_original": "Redis 的 hash 底层由字典实现，字典内部有两个哈希表 ht[0] 和 ht[1]。当哈希表元素过多需\n要扩容/缩容时，若一次性把 ht[0] 的所有键值对 rehash 到 ht[1]，在元素巨量时会占用大量\nCPU、导致服务长时间阻塞甚至宕机。因此 Redis 采用渐进式 rehash：不是一步完成，而是\n分多次、分而治之。具体步骤：①为 ht[1] 分配空间，字典同时持有 ht[0] 和 ht[1]；②维护\n索引计数器 rehashidx 并置 0，表示 rehash 开始；③之后每次对字典执行增删改查时，顺带\n把 ht[0] 上 rehashidx 索引处的所有键值对迁移到 ht[1]，并把 rehashidx 加 1；④当 ht[0]\n全部迁移完，将 rehashidx 置 -1 表示完成，最后用 ht[1] 替换 ht[0]。渐进式 rehash 把计算\n成本摊薄到每次操作，避免了集中式 rehash 的卡顿。（来源：阿里面试.pdf.txt，约第 25\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q468", "number": 468, "title": "Redis 相比 Memcached 有哪些优势？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-types", "topic": "Redis 数据类型与用途", "learning_priority": "核心", "page_start": 188, "page_end": 188, "answer_original": "相比 Memcached，Redis 的优势主要有：第一，数据类型更丰富，Memcached 的值都是\n简单字符串，而 Redis 支持 string、hash、list、set、zset 等复杂结构并支持原子操作；第\n二，速度更快，Redis 在多数场景下读写性能优于 Memcached；第三，Redis 支持持久化\n（RDB/AOF），数据可保存到磁盘并在重启后恢复，而 Memcached 数据全在内存、断电即\n丢且不能超过内存大小；第四，Redis 支持主从复制、高可用（哨兵）和集群分片，生态更完\n整；第五，Redis 还提供发布订阅、事务、键过期、Lua 脚本等丰富特性。因此 Memcached\n更适合纯简单 KV 且极致内存缓存，而 Redis 在需要复杂结构、持久化、高可用的场景更胜一\n筹。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 4 页；阿里面试.pdf.txt，约第 23\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q469", "number": 469, "title": "如何给 Redis 设置密码并验证？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 188, "page_end": 188, "answer_original": "Redis 可通过命令动态设置密码：config set requirepass 123456（将密码设为 123456），\n该方式重启后失效，若需永久生效应写入 redis.conf 的 requirepass 配置项。客户端连接\n后，在执行其他命令前需用 auth 123456 进行密码校验，校验通过才能正常读写；若未 auth\n直接操作会报 NOAUTH 错误。除了密码，生产还应结合 bind 限制监听网卡、protected-\nmode 开启、以及更完善的 ACL（Redis 6+ 支持按用户授权命令与 key 模式）来加固安全。\n注意密码只是访问层防护，不能替代网络隔离（如只对内网开放）。在客户端\n（Jedis/Lettuce）配置中也要对应填入密码，连接池才能正常工作。安全配置是 Redis 上线\n的必检项。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q470", "number": 470, "title": "如何测试 Redis 服务的连通性？", "group_id": "data", "group": "数据库与缓存", "topic_id": "redis-ops", "topic": "Redis 性能与运维", "learning_priority": "进阶", "page_start": 188, "page_end": 189, "answer_original": "测试 Redis 连通性最直接的是使用 PING 命令：客户端连上 Redis 后发送 PING，服务端正\n常时返回 PONG，说明网络与实例均正常。在命令行可用 redis-cli -h host -p port -a\npassword PING，返回 PONG 即连通。此外可结合：①INFO 命令查看服务器状态、内存、\n连接数等指标，确认实例健康；②redis-cli 的 --latency 检测网络延迟；③监控\nconnected_clients、used_memory 等关键指标判断是否过载；④在 Java 客户端可用 Jedis\n的 ping() 方法做健康检查，或配置连接池的 testOnBorrow。若 PING 不通，需排查网络防\n火墙、bind/protected-mode、密码、端口监听等。PING 是运维和探活（如哨兵、负载均\n衡健康检查）中最轻量的探测手段。（来源：Redis_快看看这 40 道面试题.pdf.txt，约第 9\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q471", "number": 471, "title": "什么是消息队列？它在分布式系统中扮演什么角色？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 189, "page_end": 189, "answer_original": "消息队列本质上是一个使用队列来通信的软件工程组件，常用于进程间或同一进程内线程间的\n通信。在当下语境中，它通常指代消息中间件，不仅是通信工具，更是解耦服务、缓冲流量、\n异步处理的核心基础设施。它让上下游系统通过“发消息—存消息—消费消息”的方式交\n互，避免了服务间强耦合调用。引入消息队列后，系统的稳定性、可扩展性和吞吐能力都能得\n到显著提升，是大厂分布式架构中不可或缺的组件。（来源：消息队列常见面试题.pdf.txt，\n约第 1-2 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q472", "number": 472, "title": "为什么要引入消息队列，它主要解决了哪些架构痛点？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 189, "page_end": 189, "answer_original": "随着业务扩张和系统从单体向微服务演进，成百上千的服务相互依赖，直接同步调用会导致响\n应慢、耦合重、流量洪峰顶不住。消息队列主要针对三类痛点：一是异步处理，把非核心链路\n（如积分、短信）异步化，缩短主链路响应时间；二是服务解耦，订单系统只需把消息投递到\n队列，下游订阅即可，不再因下游接口变更而频繁改动；三是流量控制（削峰填谷），用队列\n缓冲突发流量，保护后端脆弱服务。当然引入中间件也会降低系统稳定性、增加运维难度，需\n要权衡。（来源：消息队列常见面试题.pdf.txt，约第 2-4 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q473", "number": 473, "title": "消息队列常见的使用场景有哪些？请结合实际举例。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 189, "page_end": 189, "answer_original": "常见场景包括：异步处理，如用户注册后写库即返回，发邮件和短信异步消费，吞吐量可从串\n行每秒 7 次提升到 20 次；应用解耦，如下单后订单系统写消息队列即可，库存系统挂了也不\n影响下单，实现订单与库存解耦；流量削锋，秒杀活动把请求先写入队列，超过最大长度直接\n抛弃或跳错误页，保护后端；日志处理，如 Kafka 承接海量日志采集转发给 ELK 做实时分\n析；消息通讯，基于点对点或发布订阅实现聊天室等。这些场景本质都用到了异步、解耦与削\n峰能力。（来源：阿里面试.pdf.txt，约第 26-28 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q474", "number": 474, "title": "消息队列的队列模型和发布/订阅模型有什么区别？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 190, "page_end": 190, "answer_original": "队列模型中生产者往某个队列发消息，一个队列可有多个消费者但彼此竞争，每条消息只能被\n一个消费者消费，类似一对一聊天。发布/订阅模型把消息发往 Topic，所有订阅者都能消费\n这条消息，类似群聊。为解决一条消息被多人消费，RabbitMQ 采用队列模型并通过\nExchange 将消息发往多个队列；RocketMQ 和 Kafka 则采用发布/订阅模型。发布/订阅模型\n兼容队列模型（只有一个消费者时二者一致），而队列模型也可通过多队列全量冗余实现一对\n多，但会有数据冗余。（来源：消息队列常见面试题.pdf.txt，约第 4-5 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q475", "number": 475, "title": "请解释 Producer、Consumer、Broker、Topic、队列/分区、Consumer Group、 offset 这些核心术语。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 190, "page_end": 190, "answer_original": "发送消息方称为生产者 Producer，接收消费消息方为消费者 Consumer，消息队列服务端为\nBroker。消息从 Producer 发往 Broker，Broker 存储后由 Consumer 拉取或推送消费。为提\n升并发度，发布/订阅模型引入队列（RocketMQ）或分区（Kafka，本质相同）概念，一个\nTopic 下有 N 个队列/分区，并发度即提高到 N，可并行消费。消费者一般有组的概念\nConsumer Group，一条消息会发往多个订阅该 Topic 的消费组；每个消费组维护自己订阅\nTopic 下每个队列的 offset（消费点位），offset 是队列级别的，标记已消费位置，消费点位\n之前的消息视为已处理。（来源：消息队列常见面试题.pdf.txt，约第 5-6 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q476", "number": 476, "title": "JMS 中的 P2P 和 Pub/Sub 消息模型各有什么特点？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 190, "page_end": 190, "answer_original": "JMS 定义了两种消息模型。P2P（点对点）包含 Queue、Sender、Receiver，每个消息只发\n给特定队列，只有一个消费者，一旦被消费就离开队列；发送者和接收者时间上无依赖，接收\n者成功接收后需应答，适合要求每条消息都被成功处理的场景。Pub/Sub（发布订阅）包含\nTopic、Publisher、Subscriber，多个发布者发往 Topic，系统传递给多个订阅者，每个消息\n可有多个消费者；但发布者和订阅者存在时间依赖，订阅者须先创建订阅并保持运行才能消\n费，JMS 允许创建持久化订阅来缓解。希望消息被多消费者处理时采用 Pub/Sub。（来源：\n阿里面试.pdf.txt，约第 29-31 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q477", "number": 477, "title": "如何保证消息不丢失？请从生产、存储、消费三个阶段说明。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 190, "page_end": 191, "answer_original": "保证消息可靠需要三方配合。生产阶段：生产者发送消息至 Broker 需处理响应，同步和异步\n发送都要做好 try-catch，Broker 返回失败时重试发送，多次失败需报警和记录日志。存储阶\n段：Broker 应在消息刷盘后再返回响应；集群部署时还需多副本机制，配置成至少写入两个\n副本再响应生产者，单机断电或单台挂掉都不丢。消费阶段：消费者不能在拿到消息写入内存\n队列后就立即返回成功，而应在真正执行业务逻辑完成后再给 Broker 响应，否则消费者宕机\n会丢消息。注意可靠性增强会以性能下降为代价，日志等弱可靠场景可不强制刷盘。（来源：\n消息队列常见面试题.pdf.txt，约第 6-8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q478", "number": 478, "title": "生产者发送消息时如何配合 Broker 响应来保证消息可靠投递？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 191, "page_end": 191, "answer_original": "生产者无论同步还是异步发送，都必须正确处理 Broker 的响应。同步发送要捕获异常并重\n试；异步发送要在回调中判断结果，出错时重试。核心是不能“只管发不管响应”，因为网络\n抖动可能导致 Broker 已写入但响应丢失，生产者需根据响应决定是否重发。同时建议配置重\n试次数与退避，多次发送失败应触发报警与日志记录，便于人工介入。此外不能把可靠性完全\n交给 TCP，TCP 只保证传输层可靠，无法反馈应用层是否真正处理成功，必须在应用层做差\n错处理。（来源：消息队列常见面试题.pdf.txt，约第 6-7 页；阿里面试.pdf.txt，约第 31-32\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q479", "number": 479, "title": "存储阶段如何保证消息不丢失？单机与集群多副本机制分别怎么做？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 191, "page_end": 191, "answer_original": "单机情况下，Broker 必须等消息真正刷盘（写入磁盘）后才给生产者返回成功响应，避免机\n器断电导致缓存中消息丢失。集群多副本情况下，消息不仅要写入当前 Broker，还要写入副\n本机，配置成至少写入两台及以上再返回响应；一台挂了还有另一台兜底。极端情况如机房地\n震需依赖异地多活。要注意可靠性等级与性能的平衡：同步双写最稳但性能差，异步副本可能\n丢少量消息，应结合业务重要程度选择刷盘与副本策略。（来源：消息队列常见面试\n题.pdf.txt，约第 7-8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q480", "number": 480, "title": "消费阶段有哪些容易出错的地方会导致消息丢失？如何正确返回消费确认？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 191, "page_end": 191, "answer_original": "常见错误是消费者拿到消息后直接存入内存队列就返回 Broker 消费成功，此时若消费者宕\n机，内存中未处理的消息就丢失了。正确做法是：把消息真正执行业务逻辑（并落库/完成状\n态变更）之后，再向 Broker 发送消费成功响应。本质上消费确认应代表“业务已处理完”，\n而非“已收到消息”。另外若使用多线程消费内存队列，要防止线程还没消费消费者就崩溃导\n致丢消息，需在确认业务完成后才推进 offset，避免提前提交造成消息丢失。（来源：消息队\n列常见面试题.pdf.txt，约第 7-8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q481", "number": 481, "title": "为什么消息可靠性增强往往会带来性能下降？如何权衡？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 191, "page_end": 192, "answer_original": "可靠性增强主要靠等待刷盘和多副本同步后才返回响应，这两步都会增加写路径的延迟：同步\n刷盘涉及磁盘 I/O，多副本同步需要跨网络写多台机器，吞吐自然下降。权衡原则是按业务重\n要性分级：交易、订单等核心链路要求不丢，采用同步刷盘+同步双写；日志、埋点、指标等\n允许少量丢失的场景，用异步刷盘甚至不强制刷盘即可，换取高吞吐。因此不能一刀切，应结\n合数据价值、延迟要求和成本综合决策，做到“该可靠的可靠，该快的快”。（来源：消息队\n列常见面试题.pdf.txt，约第 8 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q482", "number": 482, "title": "请对比 Kafka 与 RabbitMQ，从消息模型、路由、投递模式、适用场景等维度说明 二者差异。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 192, "page_end": 192, "answer_original": "从消息模型看，RabbitMQ 采用队列模型，通过 Exchange 模块将消息路由到多个队列，解\n决一条消息被多消费者消费的问题；Kafka 采用发布/订阅模型，消息发往 Topic 下的分区。\n从投递模式看，RabbitMQ 偏推模式（Broker 主动推），而 Kafka 与 RocketMQ 均采用拉\n模式+长轮询。从适用场景看，RabbitMQ 常用于企业级异步解耦、需要灵活路由（多种\nExchange 类型）和较低延迟的业务；Kafka 更擅长高吞吐、海量日志流处理与削峰场景，如\nELK 日志管道。整体而言 RabbitMQ 胜在路由灵活、易用，Kafka 胜在吞吐与水平扩展。\n（来源：消息队列常见面试题.pdf.txt，约第 4-5 页、第 14-21 页；阿里面试.pdf.txt，约第\n26-28 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q483", "number": 483, "title": "为什么消息重复不可避免？请从生产和消费两端分析。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 192, "page_end": 192, "answer_original": "重复根源于“至少一次”投递与网络不确定性。生产端：为保证消息至少到达 Broker，必须\n等待 Broker 响应；若 Broker 已写入但响应因网络丢失，生产者会重发，消息就重复了。消\n费端：消费者拿到消息、业务已执行、事务已提交，但在更新 offset 前宕机，另一个消费者\n顶上后从该 offset 重新拉取，消息被再消费一次。因此正常业务下重复难以杜绝，我们不应\n试图消除重复，而应在业务层做幂等处理，使重复消息不影响最终结果。（来源：消息队列常\n见面试题.pdf.txt，约第 8-9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q484", "number": 484, "title": "什么是幂等？如何在业务上处理重复消息？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 192, "page_end": 192, "answer_original": "幂等是数学概念，指相同参数多次调用同一接口与调用一次结果一致。既然无法避免重复消\n息，就要在业务上消除其影响。关键是改造业务逻辑，使重复消息下最终结果不变。常见做法\n包括：带前置条件的更新（如 update t1 set money=150 where id=1 and\nmoney=100）；版本号控制，对比消息版本号与数据库版本号；利用数据库唯一约束（如\ninsert ... on duplicate key update）；记录关键业务 key（如订单 ID），处理前先判断该 ID\n是否已处理。最终目标是“重复消费无害”。（来源：消息队列常见面试题.pdf.txt，约第 8-\n9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q485", "number": 485, "title": "请列举几种保证消费幂等的常用技术方案（如唯一索引、乐观锁、token 等）。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 192, "page_end": 193, "answer_original": "常用方案有：查询与删除天然幂等，可放心重试；唯一索引防止新增脏数据，并发冲突再查询\n一次即可；token 机制防页面重复提交，提交前申请一次性 token，提交后校验并删除（用删\n除判断而非 select+delete 防并发）；悲观锁 select ... for update 锁定记录，但锁定时间\n长；乐观锁通过 version 或条件限制（如 update ... where avai_amount-#sub#>=0）更新\n时校验；分布式锁引入 redis/zk 保证长流程不并发执行；select+insert 适合低并发后台任\n务。核心高并发场景应避免 select+insert 这类弱方案。（来源：阿里面试.pdf.txt，约第 32-\n33 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q486", "number": 486, "title": "如何用数据库唯一约束或版本号机制实现消息幂等？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 193, "page_end": 193, "answer_original": "唯一约束法：在业务表上对幂等 key（如用户资金账户的用户 ID）建唯一索引，重复插入会\n报错，捕获后再次查询确认数据已存在即返回成功，避免脏数据。版本号法：表增加 version\n字段，更新时 update table_xxx set name=#name#, version=version+1 where id=#id#\nand version=#version#，只有版本匹配才更新，重复消息因版本已变而失效；也可用条件限\n制，如扣库存 update ... where avai_amount-#sub#>=0，保证不会超扣。两者都把“是否\n已处理”编码进数据约束，使重复消费安全。在电商、金融等核心链路中，这种基于数据约束\n的幂等方案既简单又可靠，是防止重复下单、重复扣款的首选实践。（来源：阿里面\n试.pdf.txt，约第 32-33 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q487", "number": 487, "title": "如何保证消息的有序性？全局有序和部分有序分别如何实现？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-order", "topic": "消息顺序性", "learning_priority": "核心", "page_start": 193, "page_end": 193, "answer_original": "有序性分全局有序和部分有序。全局有序要求只能有一个生产者往 Topic 发消息，Topic 内只\n有一个队列（分区），且消费者单线程消费该队列，代价是完全牺牲并发。绝大多数场景只需\n部分有序：将 Topic 划分成所需队列数，把同类消息通过特定策略（如按业务 key hash）发\n往固定队列，每个队列对应一个单线程消费者。这样在单队列内保证顺序，又通过多队列并发\n提升处理效率。例如同步 MySQL Binlog 只需保证单表消息有序即可，不必全局有序。（来\n源：消息队列常见面试题.pdf.txt，约第 9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q488", "number": 488, "title": "为什么 RocketMQ 和 Kafka 默认都不保证严格的全局有序消费？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-order", "topic": "消息顺序性", "learning_priority": "核心", "page_start": 193, "page_end": 194, "answer_original": "严格全局有序要求整个 Topic 只有一个队列且单线程消费，并要保证机器故障切换时顺序不\n乱，这几乎牺牲了所有并发与高可用能力。实际中绝大多数业务并不要求全局有序（如\nBinlog 只需单表有序）。因此 RocketMQ、Kafka 默认采用多队列/多分区+多消费者并发模\n型，只提供“部分有序”（单队列内有序）。若在多队列中，同类消息分散到不同分区就无法\n保证顺序。要让它们严格有序需业务自己约束发送策略并承担性能与可用性代价，所以默认不\n保证。（来源：阿里面试.pdf.txt，约第 33-34 页；消息队列常见面试题.pdf.txt，约第 9 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q489", "number": 489, "title": "保证消息严格有序在发送端、存储端、接收端分别面临哪些困难？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-order", "topic": "消息顺序性", "learning_priority": "核心", "page_start": 194, "page_end": 194, "answer_original": "发送端：不能异步发送，否则 1、2、3 中若 1 失败重发，顺序就乱；必须同步且保证成功顺\n序。存储端：消息不能分区，一个 Topic 只能有一个队列；且机器挂掉后切换到其他机器会乱\n序，要保证顺序就得同步复制且切换前旧机器消息全部消费完，这极难。接收端：不能并行消\n费，不能开多线程或多客户端消费同一队列。综上，发送与接收端限制相对好解，但存储端故\n障切换时“切了乱序、不切暂不可用”的两难很难调和，因此实践中多用部分有序替代严格有\n序。（来源：阿里面试.pdf.txt，约第 33-34 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q490", "number": 490, "title": "如何处理消息堆积（积压）问题？请从定位原因到扩容一步步说明。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 194, "page_end": 194, "answer_original": "堆积源于生产者速度与消费者速度不匹配，或因消费失败反复重试。第一步先定位慢的原因：\n若是 bug 则修复；若消费能力弱，可优化逻辑，如把单条处理改为批量处理（数据库插入批\n量比单条快很多）。第二步若逻辑已最优仍慢，考虑水平扩容：增加 Topic 的队列数和消费者\n数量，注意队列数必须增加，否则新消费者无队列可消费（一个队列只分配给一个消费者）。\n第三步消费者内部也可由单线程改多线程，但要警惕先把消息写内存队列就返回导致丢消息的\n问题。总之先治本再扩容。（来源：消息队列常见面试题.pdf.txt，约第 9-10 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q491", "number": 491, "title": "消息堆积时如果盲目增加消费者为什么可能无效？队列数与消费者数的关系是什 么？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 194, "page_end": 194, "answer_original": "在一个 Topic 中，一个队列（分区）同一时刻只会分配给一个消费者，即队列数决定了最大并\n行消费数。若只增加消费者而不增加队列数，多出来的消费者会分配不到队列，处于空闲状\n态，堆积依旧。正确做法是同步增加队列数和消费者数，让新消费者能绑定到新队列。例如队\n列 9 个、消费者 3 个，采用类似分页排序分配，消费者 1 消费队列 0-2，消费者 2 消费 3-5，\n消费者 3 消费 6-8；扩容时队列加到 12、消费者加到 4 即可均匀负载。因此扩容务必“队列+\n消费者”双增。（来源：消息队列常见面试题.pdf.txt，约第 9-10 页、第 77 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q492", "number": 492, "title": "什么是推模式？它有什么优缺点？适用于什么场景？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 194, "page_end": 195, "answer_original": "推模式指消息从 Broker 主动推送给 Consumer，消费者被动接收。优点是消息实时性高，\nBroker 收到即推，消费者使用简单，等着收即可；缺点明显：推送速率难以匹配消费速率，\n当生产者发得快于消费者消费时，消费者会被“爆仓”像遭受 DDoS；且不同消费者速率不\n同，Broker 难以自适应，若要自制推送速率需维护每个消费者状态，增加 Broker 复杂度。因\n此推模式适用于消息量不大、消费能力强、要求实时性高的场景。ActiveMQ 等即基于推模\n式。（来源：消息队列常见面试题.pdf.txt，约第 14-15 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q493", "number": 493, "title": "什么是拉模式？它有什么优缺点？适用于什么场景？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 195, "page_end": 195, "answer_original": "拉模式指 Consumer 主动向 Broker 请求拉取消息，Broker 被动响应。优点是主动权在消费\n者，可根据自身情况决定拉取频率和批量大小，消费不过来就暂停或拉长间隔；Broker 更轻\n量，只管存消息，来一个请求给一个，不依赖消费者状态。缺点是消息延迟，因为消费者不知\n道消息何时到，只能定时轮询，频率太高像攻击 Broker、太低则延迟大；还会出现忙请求，\n消息几小时才到时期间请求都无效。RocketMQ 和 Kafka 都选拉模式，并通过长轮询缓解这\n些缺点。（来源：消息队列常见面试题.pdf.txt，约第 15-16 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q494", "number": 494, "title": "RocketMQ 和 Kafka 为什么都选择了拉模式？它们如何克服拉模式的缺点？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 195, "page_end": 195, "answer_original": "二者选拉模式，因为现代消息队列都有持久化需求，Broker 使命是接收并保存好消息，消费\n者各异，Broker 不应有倾向性，已存好消息“你要就来拿”最合适，且 Broker 作为中心点应\n尽量轻量。为克服拉模式延迟与忙请求缺点，它们都用“长轮询”：消费者拉取时若暂无消\n息，Broker 把请求 hold 住（RocketMQ 挂起约 30 秒，Kafka 阻塞等待超时），待有新消息\n写入时主动唤醒并返回。这样既保留了消费者主动权，又接近推模式的实时性，避免了频繁空\n轮询。（来源：消息队列常见面试题.pdf.txt，约第 15-16 页、第 21 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q495", "number": 495, "title": "请解释 RocketMQ 中的长轮询机制是如何实现准实时拉取消息的。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 195, "page_end": 195, "answer_original": "RocketMQ 的 PushConsumer 本质仍是拉模式。后台 RebalanceService 线程按队列数与消\n费者数做负载均衡，把每个队列的 pullRequest 放入阻塞队列；PullMessageService 线程不\n断取出 pullRequest 向 Broker 发请求。Broker 的 PullMessageProcessor 收到请求，有消\n息直接返回，无消息则 suspendPullRequest 挂起。PullRequestHoldService 每 5 秒检查挂\n起请求的目标 offset 是否小于队列最大 offset，是则说明有新消息，调用\nnotifyMessageArriving 重新处理；ReputMessageService 在消息写入时也会唤醒请求。整\n轮询默认 30 秒，配合写入唤醒实现准实时。可见 PushConsumer 只是 SDK 把“拉”封装得\n更像“推”，底层依然是消费者主动拉取，这也是面试常考的细节。（来源：消息队列常见面\n试题.pdf.txt，约第 16-18 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q496", "number": 496, "title": "请解释 Kafka 中的长轮询（延迟拉取）机制是如何实现的。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 195, "page_end": 196, "answer_original": "Kafka 消费者 poll 时定义一个超时时间，有消息立即返回，无消息则阻塞等待直到超时再发\n起下一次拉取。Broker 侧配合实现延迟操作：用时间轮（delayedFetchPurgatory）管理延\n迟拉取，构建 DelayedFetch 类，包含 isCompleted（检查条件是否满足）、tryComplete\n（满足后执行）、onComplete（执行完调用）、onExpiration（超时处理）方法。判断是否\n过期由时间轮推动，同时消息写入时（ReplicaManager#appendRecords 内）会提醒这些延\n迟请求“消息来了”，立即触发返回。这样避免了频繁空轮询，又保证消息到达及时返回。\n（来源：消息队列常见面试题.pdf.txt，约第 18-21 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q497", "number": 497, "title": "事务消息要解决什么问题？它适用于什么业务场景？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-tx", "topic": "事务消息与本地消息表", "learning_priority": "核心", "page_start": 196, "page_end": 196, "answer_original": "事务消息解决的是“消息生产者与消息消费者的数据一致性”问题，即本地业务操作与发消息\n这两个动作要么都成功要么都失败，不能出现本地事务提交但消息没发、或消息发了但本地回\n滚。它适用于异步更新且对实时性要求不高的场景，例如外卖下单成功后异步删除购物车菜\n品——下单与发消息必须同生共死，但购物车删不删对用户即时体验影响小，只要最终删除\n即可。它不是强一致 ACID，而是最终一致性方案，常与 2PC、TCC 并列作为分布式事务的一\n种实现。（来源：消息队列常见面试题.pdf.txt，约第 22-24 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q498", "number": 498, "title": "请描述 RocketMQ 事务消息（半消息）的实现原理与全流程。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-tx", "topic": "事务消息与本地消息表", "learning_priority": "核心", "page_start": 196, "page_end": 196, "answer_original": "RocketMQ 事务消息是种两阶段提交。流程：①生产者发“半消息”给 Broker，半消息对\nConsumer 不可见，存在特殊队列（topic 重置为 RMQ_SYS_TRANS_HALF_TOPIC，队列\n0）。②Broker 存半消息后返回。③生产者执行本地事务。④根据本地事务结果向 Broker 发\n提交或回滚。若是提交，Broker 把半消息“换回”真实 topic 所属队列，消费者可消费；若\n是回滚，记录到 half_op 主题表示已处理，消息被丢弃。整个过程半消息在第四步要么成为正\n常消息要么被抛弃，生命周期结束。使用时需实现 TransactionListener，在 listener 内写本\n地事务并暴露反查方法。（来源：消息队列常见面试题.pdf.txt，约第 24-28 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q499", "number": 499, "title": "RocketMQ 事务消息中，如果提交或回滚消息发送失败怎么办？Broker 如何反查？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-tx", "topic": "事务消息与本地消息表", "learning_priority": "核心", "page_start": 196, "page_end": 197, "answer_original": "若提交/回滚请求丢失，Broker 会定时反查。具体由 TransactionalMessageCheckService\n后台服务扫描半消息队列（RMQ_SYS_TRANS_HALF_TOPIC 队列 0），并对照 half_op 主题\n（RMQ_SYS_TRANS_OP_HALF_TOPIC）去重，对未处理的半消息调用\nputBackHalfMsgQueue 重新入 commitlog，然后向生产者发 oneWay 反查请求。生产者端\nClientRemotingProcessor 收到后在线程池执行 checkLocalTransactionState（即用户实现\n的反查方法）获知事务结果再发送给 Broker。若结果为 UNKNOW 则不记录 half_op，可继\n续反查并更新次数，超过阈值判定回滚。设计上因 RocketMQ 顺序追加写，反查需重入盘并\n推进 offset。（来源：消息队列常见面试题.pdf.txt，约第 27-29 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q500", "number": 500, "title": "请对比 RocketMQ 事务消息与 Kafka 事务消息的本质区别。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-tx", "topic": "事务消息与本地消息表", "learning_priority": "核心", "page_start": 197, "page_end": 197, "answer_original": "二者解决的是不同问题。RocketMQ 事务消息保证“本地事务执行”与“发这条消息”满足\n事务约束——本地事务成功才让消息可见，这才是我们想要的分布式事务消息。Kafka 事务消\n息则是保证“一次事务中发送多条消息”的原子性，即多条消息要么都成功要么都失败，配合\n其幂等机制实现 Exactly Once，且主要针对“从 Kafka 读再写回 Kafka”的流式计算场景。\nKafka 会把事务消息当普通消息处理、由消费端过滤，并非解决本地事务与发消息的一致性问\n题。因此 Kafka 的事务不是通常意义的业务事务消息。（来源：消息队列常见面试\n题.pdf.txt，约第 29-31 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q501", "number": 501, "title": "为什么说 QMQ（本地消息表）的事务消息实现比 RocketMQ 更优？它与 RocketMQ 写入顺序有何不同？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-tx", "topic": "事务消息与本地消息表", "learning_priority": "核心", "page_start": 197, "page_end": 197, "answer_original": "核心差异在写入顺序。RocketMQ 先发半消息成功才能执行本地事务，意味着 MQ 集群挂了\n事务就无法进行，整个应用不可用。QMQ 采用本地消息表思想：业务写入与消息表插入放在\n同一个数据库事务中，事务提交后立刻异步发消息，发成功则删本地消息；若 MQ 挂了，消\n息安静躺在消息库，后台补偿任务捞出发送直至成功，不影响业务。且 QMQ 支持一个事务内\n发多条消息，RocketMQ 仅支持单事务消息；QMQ 还无需 RocketMQ 那样的反查机制与额\n外存储，API 贴合 Spring 事务、对业务改造小、迁移方便。（来源：消息队列常见面试\n题.pdf.txt，约第 31-36 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q502", "number": 502, "title": "本地消息表这种分布式事务实现方式是怎么工作的？有什么优缺点？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-tx", "topic": "事务消息与本地消息表", "learning_priority": "核心", "page_start": 197, "page_end": 197, "answer_original": "本地消息表利用关系型数据库事务能力：在业务库中建一张消息表，业务执行与消息表插入放\n在同一事务提交，本地事务成功则消息必插入成功。之后调用其他服务，成功则改消息状态；\n失败则有后台线程扫描未确认消息，按重试次数不断调用对应服务，超限则特殊记录待人工介\n入，属于最大努力通知思想。优点是简单、可靠，业务与消息同库同事务，不依赖 MQ 可用\n性；缺点是需建表、消息库可能成为瓶颈，且只保证最终一致，补偿任务有延迟，不适合强实\n时。（来源：消息队列常见面试题.pdf.txt，约第 32-33 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q503", "number": 503, "title": "什么是死信队列？RocketMQ 中消息重试失败后会如何处理？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 197, "page_end": 198, "answer_original": "死信队列用于存放“实在消费不了”的消息。RocketMQ 为每个消费组设重试队列\n（%RETRY%+consumerGroup），消费失败时利用延时队列（SCHEDULE_TOPIC_XXXX）\n按重试级别延迟后回到重试队列再消费。若超过最大重试次数仍失败，消息会被移入死信队\n列，topic 为%DLQ%+ConsumerGroup，进入死信即视为消费成功（因为没辙了），不影\n响主流程。死信消息可由人工介入排查处理。这样避免了单条毒消息无限重试拖垮消费进度，\n也保留了问题消息供后续分析。（来源：消息队列常见面试题.pdf.txt，约第 77 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q504", "number": 504, "title": "请说明 RocketMQ 消费失败的重试机制与延迟队列的关系。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-reliability", "topic": "可靠投递、幂等与重试", "learning_priority": "核心", "page_start": 198, "page_end": 198, "answer_original": "RocketMQ 消费失败不会立即无限重试，而是借助延迟队列实现分级延迟重试。消费组有专\n属重试队列%RETRY%+consumerGroup，同时消息会先存入延时队列\nSCHEDULE_TOPIC_XXXX，在扩展字段记录原所属 Topic。Broker 按设置的多重重试级别\n（不同延迟时间）延时后再把消息恢复到重试队列，消费者从重试队列重新拉取。若达到最大\n重试次数依旧失败，则转入死信队列%DLQ%+ConsumerGroup 交给人工。该机制既给了消\n息“过会儿再试”的机会，又避免同步立即重试加剧失败，还防止毒消息阻塞正常消费。（来\n源：消息队列常见面试题.pdf.txt，约第 77 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q505", "number": 505, "title": "RocketMQ 的 Broker 存储涉及哪三类核心文件？各自作用是什么？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 198, "page_end": 198, "answer_original": "三类核心文件：①CommitLog，所有 Topic 的消息都混合存储于此，单个默认 1G，文件名\n以起始偏移量命名，所有消息顺序追加写入，超过大小开新文件。②ConsumeQueue，消息\n消费队列，是 CommitLog 的索引，固定 20 字节条目（8 字节 commitlog 物理偏移量+4 字\n节消息长度+8 字节 Tag 哈希值），对应某 Topic 下某 Queue，消费者先从中拿物理地址。\n③IndexFile，额外索引，按 Key 或时间区间查消息，文件名用创建时间戳，单个约 400M 存\n2000W 索引，不影响主流程。三者配合实现高效存储与查找。（来源：消息队列常见面试\n题.pdf.txt，约第 74-75 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q506", "number": 506, "title": "什么是 CommitLog、ConsumeQueue 和 IndexFile？消费者是如何通过它们查到 消息的？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 198, "page_end": 199, "answer_original": "CommitLog 是 RocketMQ 所有消息的混合存储文件，顺序写、按偏移量命名；\nConsumeQueue 是 CommitLog 的索引，存“物理偏移量+消息长度+Tag 哈希”，按\nTopic 下的 Queue 组织；IndexFile 是按 Key/时间查消息的辅助索引。消息写入时先落\nCommitLog，再由后台 ReputMessageService 线程近实时转发生成 ConsumeQueue 和\nIndexFile。消费时，消费者先从 ConsumeQueue 按队列顺序取到消息的真实物理偏移量，\n再凭偏移量去 CommitLog 读取完整消息体；如需按 Key 查则用 IndexFile 定位。这种“索引\n+数据分离”设计兼顾了混合存储的高写吞吐与高效查找。（来源：消息队列常见面试\n题.pdf.txt，约第 74-75 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q507", "number": 507, "title": "请解释 RocketMQ 的消息刷盘机制，同步刷盘与异步刷盘如何取舍？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 199, "page_end": 199, "answer_original": "RocketMQ 提供同步刷盘和异步刷盘。刷盘影响可靠性：Broker 被 kill -9、宕机、OS 挂、\n断电（1-4 类）时同步刷盘安全，异步可能丢部分；磁盘坏、机器坏（5-6 类）需靠副本机\n制，同步双写稳但性能差。选型看场景：核心交易用同步刷盘+同步双写保不丢；日志、指标\n等允许少量丢失用异步刷盘换高性能。此外结合多副本（主从）提升可用。原则是不盲目追求\n强可靠，按数据价值与延迟要求分级，避免为不必丢的数据付出过高性能代价。（来源：消息\n队列常见面试题.pdf.txt，约第 75 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q508", "number": 508, "title": "什么是页缓存与内存映射（mmap）？RocketMQ 如何利用它们提升性能？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 199, "page_end": 199, "answer_original": "页缓存是操作系统对文件的缓存，写入先入页缓存（脏页后由 OS 刷盘），读取命中即返回，\n并依局部性原理预读相邻块。但页缓存属内核空间，用户态访问需再拷贝一次。mmap（内存\n映射）把程序虚拟页面直接映射到页缓存，免去了内核态到用户态的拷贝，也避免重复数据，\n可通过映射地址+偏移直接操作文件。RocketMQ 的 CommitLog 和 ConsumeQueue 都用\nmmap，使“顺序写文件”近乎“写内存”的速度；配合顺序追加写，大幅提升吞吐，同时用\n文件预分配与预热缓解缺页抖动。（来源：消息队列常见面试题.pdf.txt，约第 75-76 页、第\n80-82 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q509", "number": 509, "title": "什么是文件预分配和文件预热？RocketMQ 为什么要做这两个优化？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 199, "page_end": 199, "answer_original": "文件预分配：CommitLog 默认 1G，写满需新文件，RocketMQ 起后台线程\nAllocateMappedFileService 不断处理预分配请求，提前准备好下一个文件，避免写入时分配\n文件造成性能抖动。文件预热：warmMappedFile 方法遍历映射文件的每一页写入一个 0 字\n节，再调用 mlock（锁定物理内存防 swap）和 madvise(MADV_WILLNEED)（建议 OS 提前\n读）。原因是 mmap 只是映射，真正读取页面才产生缺页中断加载数据，运行时缺页会造成\n监控毛刺；预分配+预热让文件在运行时已就绪，消除抖动、保证低延迟稳定。（来源：消息\n队列常见面试题.pdf.txt，约第 76 页、第 85-87 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q510", "number": 510, "title": "RocketMQ 的整体架构由哪些角色组成？NameServer 有什么特点？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 199, "page_end": 200, "answer_original": "整体四角色：Producer（生产者，集群部署，先从 NameServer 得知 Topic 所在 Broker\nMaster 再建连发送）、Consumer（消费者，支持集群/广播消费，从 NameServer 得知\nBroker 后建连）、Broker（存储查询，主从部署，Master 读写、Slave 只读，向所有\nNameServer 注册路由）、NameServer（轻量 Topic 路由注册中心，管理 Broker 动态注册\n发现）。NameServer 特点是无状态，各节点间不通信，都持有完整路由信息；Broker 每 30\n秒发心跳（IP、Port、TopicInfo），NameServer 超 120 秒无心跳则移除该 Broker。因无\n状态、互不通信，部署简单且易扩展，也避免了类似 ZK 那样的中心节点脑裂风险，是\nRocketMQ 轻量路由设计的精髓。（来源：消息队列常见面试题.pdf.txt，约第 70-71 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q511", "number": 511, "title": "请说明 RocketMQ 中 Producer 的路由发现、心跳与负载均衡重试机制。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 200, "page_end": 200, "answer_original": "Producer 启动后每 30 秒从某台 NameServer 拉取 Topic 与 Broker 映射存本地，发现新\nBroker 即建长连接，并每 30 秒向 Broker 发心跳维持。发送时轮询可发送的 Broker 做负载\n均衡；同步发送失败默认重投 2 次（retryTimesWhenSendFailed=2）且不选上次失败的\nBroker，异步失败也重试 2 次（retryTimesWhenSendAsyncFailed=2）但仅同 Broker 内。\n此外有故障延迟机制：开启 sendLatencyFaultEnable 后，对发送超时的 Broker 退避一段时\n间（如超 15000ms 则 600000ms 内不可发），让其缓一缓，是实现发送高可用的关键。多\n个 Producer/Consumer 共用一个 MQClientInstance。这套机制既保证了发送方及时感知路\n由变化，又通过重试与避让提升了消息发送端的高可用性。（来源：消息队列常见面试\n题.pdf.txt，约第 71-73 页、第 75 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q512", "number": 512, "title": "为什么不建议在生产环境开启 RocketMQ 的自动创建主题 （autoCreateTopicEnable）？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 200, "page_end": 200, "answer_original": "自动创建主题会导致负载不均。新 Topic 请求到达 Broker 后创建路由，但心跳每 30 秒才发\n一次，NameServer 最长需 30 秒才知新路由。若发送方连续快速发消息，其他允许自动创建\n的 Broker 可能来不及注册，导致该 Topic 消息都只发往最初那台 Broker，起不到负载均衡；\n若发送方发完 30 秒内停发，那台 Broker 借心跳把路由更新到 NameServer，之后所有\nProducer 都只知道这一台，负载极高。因此生产环境应关闭 autoCreateTopicEnable，提前\n规划好 Topic 与队列分布，保证均衡与稳定。（来源：消息队列常见面试题.pdf.txt，约第 73\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q513", "number": 513, "title": "什么是 RocketMQ 的发送消息故障延迟机制（sendLatencyFaultEnable）？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "rocketmq", "topic": "RocketMQ 存储与路由", "learning_priority": "进阶", "page_start": 200, "page_end": 201, "answer_original": "sendLatencyFaultEnable 默认关闭，开启后用于发送高可用。其作用是：记录每次发送消息\n耗时，若超过阈值（如超过 15000ms），则在接下来一段时间（如 600000ms）内禁止向该\nBroker 发送消息，实现“避让”。原理是发送超时大概率说明该 Broker 负载高，先退避让其\n缓一缓，避免持续往病 broker 打量。这配合 Producer 每 30 秒心跳与重试（同步重试避开\n上次失败 broker、异步同 broker 内重试），共同构成发送端容错体系，是 RocketMQ 保证\n消息发送高可用的关键设计之一。（来源：消息队列常见面试题.pdf.txt，约第 75 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q514", "number": 514, "title": "Consumer 端的负载均衡（重平衡）是如何工作的？队列数和消费者数如何协调？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-backlog", "topic": "积压、拉取与重平衡", "learning_priority": "进阶", "page_start": 201, "page_end": 201, "answer_original": "Consumer 定期获取 Topic 下的队列数，并查找同消费组所有消费者，默认用类似分页排序\n分配：队列、消费者分别排序，按序划分。例如 9 队列 3 消费者，消费者 1 消费 0-2、消费者\n2 消费 3-5、消费者 3 消费 6-8。新增队列或消费者会触发重平衡均匀再分配。注意：一个队\n列同一时刻只分配给一个消费者，所以想提升消费能力必须同时增加队列数和消费者数，否则\n多余消费者无队列可消费。集群模式下一个分组内消费者瓜分消息，广播模式则每个消费者消\n费完整 Topic。（来源：消息队列常见面试题.pdf.txt，约第 77 页、第 1485 行附近）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q515", "number": 515, "title": "Kafka 的分布式存储结构是怎样的？一个 Topic、分区、日志段之间是什么关系？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 201, "page_end": 201, "answer_original": "Kafka 中 Topic 可有多个分区（partition），分区是最小读写与存储结构，Producer 发往某\n分区、Consumer 从某分区取消息。映射到磁盘：每个分区对应一个 Log 对象，即一个子目\n录；子目录下有多组日志段（Log Segment），每组包含消息日志文件（.log）、位移索引\n（.index）、时间戳索引（.timeindex，还有.txnindex 等）。日志段按大小\n（log.segment.bytes 默认 1G）或时间（log.segment.ms）切分。所以逻辑上的“Topic—\n分区—日志段”对应物理上“目录—子目录—一组文件”，分区内消息顺序追加，分段便于\n管理与清理。（来源：消息队列常见面试题.pdf.txt，约第 42-43 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q516", "number": 516, "title": "Kafka 的索引设计有什么亮点？请说明稀疏索引、相对位移和冷热分区二分查找。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 201, "page_end": 201, "answer_original": "Kafka 索引有三大亮点。①稀疏索引：并非每条消息建索引，而是每 log.index.interval.bytes\n（默认 4KB）建一条，省内存可在内存存更多索引，文件有.index/.timeindex/.txnindex 三\n类。②相对位移：OffsetIndex 每条索引项 8 字节（4 字节相对位移+4 字节物理位置），存\n的是真实位移减 baseOffset 的差值，省空间且让内存容纳更多项，命中率更高（类似\nInnoDB 主键不宜过长）。③冷热分区二分查找：索引追加写、热点在尾部，标准二分跳访问\n会引发缺页中断，Kafka 把尾部 8192 字节划为热区，保证热数据查询遍历的页固定，避免缺\n页，是算法结合场景的巧妙变形。（来源：消息队列常见面试题.pdf.txt，约第 37-41 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q517", "number": 517, "title": "请解释 Kafka 日志段的写入与读取流程。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 201, "page_end": 202, "answer_original": "写入流程：①判断当前日志段是否为空，空则记录时间作为后续切分依据；②确保位移合法\n（offset 非负、不超 int 最大值）；③通过 FileChannel 将消息写入（先入页缓存，是否刷盘\n看配置）；④更新日志段最大时间戳及对应位移（用于定期删日志）；⑤若自上次建索引以来\n写入字节超 indexIntervalBytes 则更新索引项。读取流程：①根据首条 offset 经\nOffsetIndex 找到物理位置和大小；②取 LogOffsetMetadata；③若 minOneMessage 为\ntrue 则至少返回一条防消费者饿死；④计算最大 fetchSize；⑤用 FileRecords.slice 从指定位\n置读指定大小构造 FetchDataInfo 返回。整体体现稀疏索引+顺序读的高效。（来源：消息队\n列常见面试题.pdf.txt，约第 43-46 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q518", "number": 518, "title": "什么是 Kafka 的 Controller？它依赖 ZooKeeper 做了哪些事？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 202, "page_end": 202, "answer_original": "Controller 是 Kafka 核心组件，负责管理和协调整个集群：主题创建删除、分区管理（增/重\n分配）、分区 Leader 选举、监听 Broker 增减、向其他 Broker 提供元数据。它强依赖\nZooKeeper：每个 Broker 启动时尝试在 ZK 创建/controller 临时节点竞选 Controller，第一\n个创建者当选；该节点是临时节点，宕机会话结束被移除，其他 Broker 监听后重新竞选\n（Failover）。Controller 初始化从 ZK 拉取集群元数据缓存，再同步给其他 Broker；并通过\nZK 的 Watcher 监听主题、分区等变更。只有一个 Controller 在 ZK 注册监听，避免了早期各\nBroker 都监听导致的羊群效应与 ZK 过载。（来源：消息队列常见面试题.pdf.txt，约第 47-\n49 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q519", "number": 519, "title": "Kafka Controller 底层为什么从多线程加锁改为单线程事件队列模型？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 202, "page_end": 202, "answer_original": "早期 Kafka 用大量锁保证多线程访问 Controller 元数据的线程安全，但锁多导致性能下降、\n代码复杂度激增、bug 难修。0.11 版本后改为单线程事件队列：把涉及共享数据竞争的操作\n抽象成事件，塞入阻塞队列，由专属单线程串行处理。其它线程（ZKWatcher 线程、定时任\n务线程等）仍各司其职，只是把“访问/更新元数据”这类的动作封装成事件交给事件线程。\n这样消除了锁竞争，降低复杂度、提升可维护性与性能，也说明“多线程并非总是更好，要看\n场景”。通知其他 Broker 时则为每个 Broker 配独立发送线程防阻塞。（来源：消息队列常\n见面试题.pdf.txt，约第 49-56 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q520", "number": 520, "title": "请说明 Kafka Broker 处理请求的 Reactor 模型，以及数据类与控制类请求的优先级 如何实现。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 202, "page_end": 203, "answer_original": "Kafka Broker 用 Reactor 模型：Acceptor（mainReactor）监听新连接并轮询交给\nProcessor（subReactor，默认 3 个网络线程 num.network.threads）；Processor 读事件\n封装成 Request 放入共享请求队列；IO 线程池（KafkaRequestHandlerPool，默认 8 个\nnum.io.threads）取请求真正处理，响应再放入对应 Processor 响应队列返还客户端。网络\n线程与 IO 线程用生产者-消费者模式解耦。请求分 data-plane 与 control-plane 两类：控制\n类（如删 Topic、Preferred Leader 选举）需优先，Kafka 用两套 Listener 实现优先级——\n控制类单独一个 Processor 线程、队列长度写死 20，因其量小故总先被处理，避免被数据请\n求堵住。（来源：消息队列常见面试题.pdf.txt，约第 56-65 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q521", "number": 521, "title": "Kafka 为什么要抛弃 ZooKeeper？KRaft（Controller Quorum）带来了哪些改 进？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 203, "page_end": 203, "answer_original": "弃 ZK 原因：运维上 Kafka 需依赖另一中间件 ZK，增加复杂度；性能上 ZK 是 CP、强一致，\n写需超半数节点确认，写入慢，且只适合小量元数据存储，分区数多时元数据膨胀致性能下\n降、Watch 延迟；ZK 选举期间不提供服务，单 Controller 在分区巨多时故障转移慢（需重载\n全量元数据再同步）。KRaft 基于 Raft 实现 Controller Quorum：元数据存进自身 Log（类\n似位移主题），Quorum 中各节点已同步全部元数据，Leader 切换无需重载，且其他 Broker\n只需增量更新，支持百万级分区。整体去掉外部依赖、提升扩展性与故障恢复速度。（来源：\n消息队列常见面试题.pdf.txt，约第 66-69 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q522", "number": 522, "title": "为什么说消息存磁盘还能这么快？顺序读写、mmap、sendfile 零拷贝分别解决了 什么问题？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 203, "page_end": 203, "answer_original": "关键在于扬长避短。顺序读写：磁盘顺序 I/O 磁头几乎不换道，速度甚至快过随机写内存；配\n合页缓存（写先入页缓存、读命中即返、预读后写合并），吞吐极高。mmap：文件映射让用\n户态直接访问页缓存，免去内核态到用户态的拷贝。sendfile 零拷贝：发消息时数据从页缓存\n经 DMA 直接到网卡，避免“页缓存→SocketBuffer→网卡”的冗余拷贝。RocketMQ 与\nKafka 都顺序写+近似顺序读，RocketMQ 用 mmap，Kafka 发消息用 sendfile。注意顺序写\n有丢数据风险，一般用多副本而非同步刷盘保可靠。（来源：消息队列常见面试题.pdf.txt，\n约第 80-84 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q523", "number": 523, "title": "请对比 RocketMQ 和 Kafka 在底层存储与零拷贝实现上的异同。", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 203, "page_end": 204, "answer_original": "相同点：都顺序写入、都依赖页缓存、都追求高吞吐。不同点：存储结构，RocketMQ 所有\nTopic 混合存一个 CommitLog 文件，Kafka 一个分区一个日志文件（分区多了全局近似随机\n写，但单分区顺序；单文件方案迁移更灵活）。零拷贝，RocketMQ 的 CommitLog 和\nConsumeQueue 用 mmap，发消息默认拷贝到堆内 Buffer 再发\n（transferMsgByHeap=true），并非真正零拷贝，仍有页缓存到 SocketBuffer 一步拷贝；\nKafka 日志文件未用 mmap 而用 sendfile（FileChannel.transferTo），少了一次拷贝，发消\n息效率更高。RocketMQ 用文件预热(mmap+mlock)补惰性加载缺陷，Kafka 靠\nvm.swappiness 调节 swap。（来源：消息队列常见面试题.pdf.txt，约第 84-89 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q524", "number": 524, "title": "什么是零拷贝？在 Java 中如何通过 sendfile（FileChannel.transferTo）实现？ Kafka 和 RocketMQ 分别用到了什么？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "kafka", "topic": "Kafka 日志与控制面", "learning_priority": "进阶", "page_start": 204, "page_end": 204, "answer_original": "零拷贝指数据在文件传输时避免在内核缓冲与用户缓冲间多次冗余拷贝，减少 CPU 与上下文\n切换。传统 read+write 需“磁盘→页缓存→用户缓冲→Socket 缓冲→网卡”多次拷贝；\nLinux 2.4 的 sendfile+分散收集 DMA 实现真正无冗余，Java 中 FileChannel.transferTo()底\n层即 sendfile。Kafka 发消息最终调用 FileChannel.transferTo 走 sendfile，是真正零拷贝。\nRocketMQ 则对 CommitLog/ConsumeQueue 用 mmap（内存映射，省一次内核→用户拷\n贝，但发消息默认仍拷到堆内 Buffer 再发，并非真正零拷贝，只到“页缓存\n→SocketBuffer”这一步，另有参数可绕过堆）。二者优化取向不同。（来源：消息队列常见\n面试题.pdf.txt，约第 82-84 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q525", "number": 525, "title": "如果让你从零设计一个消息中间件，你会如何规划整体架构与核心模块？", "group_id": "distributed", "group": "消息与分布式系统", "topic_id": "mq-basics", "topic": "消息模型与中间件选型", "learning_priority": "核心", "page_start": 204, "page_end": 204, "answer_original": "先明确核心角色：Producer、Consumer、Broker、注册中心（如\nNameServer/ZK/Nacos，负责服务发现与高可用）。数据流转：Producer 发消息到\nBroker，Broker 暂存，Consumer 再拉取。实现要点：通信基于 Netty 自定义协议；分布式\n按 Kafka 思路分区提升并发与扩容；多副本 Leader/Follower+选举算法（Raft/Bully）保证\n高可用；本地文件系统顺序写+mmap/零拷贝提升性能；批量处理提高吞吐。回答要 BFS 式\n先讲大局再等面试官深挖，主动引出擅长点（如 Netty、选举、零拷贝），不留白于不熟细\n节。架构清晰、特性把握到位即可，细节后续展开。（来源：消息队列常见面试题.pdf.txt，\n约第 10-14 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q526", "number": 526, "title": "请简述 OSI 七层网络模型，并说明每一层的主要作用。", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-model", "topic": "分层模型与 TCP/UDP", "learning_priority": "核心", "page_start": 204, "page_end": 205, "answer_original": "OSI 七层模型自底向上为物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。\n物理层负责比特流的传输与模数/数模转换；数据链路层基于 MAC 地址对数据进行封装与解\n封装，设备是交换机；网络层基于 IP 地址封装与解封装，设备是路由器；传输层定义\nTCP/UDP 等协议与端口号，进行分段与重组；会话层负责建立、管理数据传输通路；表示层\n完成数据解释、加密解密、压缩解压缩；应用层承载 FTP、WEB、QQ 等终端应用。理解七层\n模型有助于在排查网络问题时逐层定位故障点。（来源：JAVA 面试知识点总结.pdf.txt，约第\n159 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q527", "number": 527, "title": "TCP/IP 四层模型由哪几层组成，与 OSI 七层如何对应？", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-model", "topic": "分层模型与 TCP/UDP", "learning_priority": "核心", "page_start": 205, "page_end": 205, "answer_original": "TCP/IP 协议族从分层模型上由网络接口层、网络层、传输层、应用层四层组成。其中网络接\n口层对应 OSI 的物理层与数据链路层，负责主机与网络的连接；网络层对应 OSI 网络层，核\n心是 IP 协议，使主机能把分组独立发往目标，分组可能经不同网络、到达顺序也可能与发送\n顺序不同；传输层对应 OSI 传输层，定义 TCP 与 UDP 两个端到端协议；应用层对应 OSI 的\n会话层、表示层与应用层，包含 TELNET、FTP、SMTP、DNS、HTTP 等高层协议。TCP/IP\n更贴近工程实现，OSI 偏理论参考。（来源：JAVA 面试知识点总结.pdf.txt，约第 160 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q528", "number": 528, "title": "TCP 和 UDP 的核心区别是什么？分别适用于什么场景？", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-model", "topic": "分层模型与 TCP/UDP", "learning_priority": "核心", "page_start": 205, "page_end": 205, "answer_original": "TCP 是面向连接的协议，提供可靠的报文传输，除基本数据传输外还具有可靠性保证、流量\n控制、多路复用、优先权和安全性控制等功能；UDP 是面向无连接的不可靠传输协议，主要\n用于不需要 TCP 排序和流量控制的应用程序。从特性看，TCP 传输效率低但可靠性强，适合\n传输可靠性要求高、数据量大的数据；UDP 与 TCP 特性相反，适用于可靠性要求不高、数据\n量小的场景，例如 QQ 聊天数据即通过 UDP 传输。实际选型时，文件传输、支付等用 TCP，\n音视频直播、游戏同步等可优先考虑 UDP。（来源：JAVA 面试知识点总结.pdf.txt，约第\n160 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q529", "number": 529, "title": "请说明 TCP 报文段首部有哪些关键字段，各自有什么作用？", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-model", "topic": "分层模型与 TCP/UDP", "learning_priority": "核心", "page_start": 205, "page_end": 205, "answer_original": "TCP 首部关键字段包括：源端口号与目的端口号（各 16 位），配合 IP 地址唯一确定一个\nTCP 连接；顺序号 seq（32 位）标识从源端到目的端发送的数据字节流第一个字节的顺序\n号，用于字节计数；确认号 ack（32 位）表示期望收到的下一个顺序号，仅当 ACK 标志为 1\n时有效；控制位含 URG、ACK、PSH、RST、SYN、FIN 六个标志，分别用于紧急指针、确\n认、推送、复位、同步序号、释放连接；窗口大小（16 位）表示接收窗口，最大 65535 字\n节；校验和对整个 TCP 报文段计算，强制由发送端计算、接收端验证；还有紧急指针、选项\n（如 MSS）等字段。（来源：JAVA 面试知识点总结.pdf.txt，约第 161 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q530", "number": 530, "title": "TCP 是如何保证可靠传输的？请说明其可靠性机制。", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-model", "topic": "分层模型与 TCP/UDP", "learning_priority": "核心", "page_start": 205, "page_end": 206, "answer_original": "TCP 的可靠性建立在多个机制之上。首先通过三次握手建立可靠连接并同步初始序列号 ISN；\n传输过程中使用 32 位顺序号对每一个字节计数，接收端用确认号 ack（期望收到的下一个字\n节序号）进行确认；发送端在未收到确认时会重传，并通过校验和字段检测报文段在传输中是\n否损坏；流量控制通过 16 位窗口大小字段告知对方自己的接收能力，避免发送方压垮接收\n方；此外 TCP 还提供全双工服务、排序重组以及 RST 复位异常连接等能力。正是这些机制让\nTCP 适合文件传输、数据库访问等不容丢数据的场景。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 161 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q531", "number": 531, "title": "既然 TCP 可靠，为什么视频通话、游戏等场景仍常用 UDP？", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-model", "topic": "分层模型与 TCP/UDP", "learning_priority": "核心", "page_start": 206, "page_end": 206, "answer_original": "因为 UDP 面向无连接、不保证可靠送达，没有排序、流量控制和重传，因而传输延迟更低、\n开销更小、效率更高。在视频通话、实时音视频、在线游戏中，少量丢包可通过前向纠错或画\n面插值容忍，但网络抖动和延迟会直接破坏体验，此时低延迟比绝对可靠更重要，所以倾向使\n用 UDP。而 TCP 为保证可靠会重传并按序交付，遇到丢包会产生阻塞和卡顿。因此选型原则\n是：可靠性优先选 TCP，实时性优先选 UDP，例如 QQ 聊天数据走 UDP，文件下载走\nTCP。（来源：JAVA 面试知识点总结.pdf.txt，约第 160 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q532", "number": 532, "title": "什么是 TCP 的三次握手？请描述完整过程。", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 206, "page_end": 206, "answer_original": "三次握手是 TCP 建立连接前的三次沟通。第一次握手：客户端 A 发送 SYN=1 及随机产生的\nseq number（如 1234567）的数据包到服务器，服务器 B 由 SYN=1 知道 A 要求建立连\n接；第二次握手：B 收到后确认联机信息，向 A 发送 ack number=（A 的 seq+1），同时\nSYN=1、ACK=1，并随机产生自己的 seq（如 7654321）；第三次握手：A 收到后检查 ack\nnumber 是否等于第一次发送的 seq+1 且 ACK=1，若正确，A 再发送 ack number=（B 的\nseq+1）、ACK=1，B 收到确认 seq 值与 ACK=1 后连接建立成功。三次握手确保双方收发\n能力正常。之所以要三次而不是两次，是因为两次握手无法防止已失效的连接请求报文突然到\n达服务器造成资源浪费；三次握手恰好能确认双方发送与接收能力都正常。同时它也面临\nSYN 泛洪攻击风险，需配合 SYN Cookie 等机制加以防护。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 162 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q533", "number": 533, "title": "为什么 TCP 建立连接需要三次握手，而不是两次？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 206, "page_end": 206, "answer_original": "两次握手存在严重隐患：若仅两次，当客户端发出的第一个连接请求因网络滞留迟迟到，客户\n端已超时重发并建立连接、释放连接后，那个迟到的旧 SYN 才到达服务器，服务器回 ACK\n即认为连接建立，会一直等待客户端发送数据，造成服务器资源空耗（半连接资源浪费）。三\n次握手让服务器在第三次才真正确认客户端已收到自己的 SYN+ACK，从而把“双方收发能力\n均正常”这一事实双向确认完毕，有效防止已失效连接请求突然又传到服务器而产生误连接，\n同时同步双方的初始序列号。（来源：JAVA 面试知识点总结.pdf.txt，约第 162 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q534", "number": 534, "title": "什么是 TCP 的四次挥手？请描述完整过程。", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 207, "page_end": 207, "answer_original": "四次挥手用于断开 TCP 连接。由于 TCP 全双工，关闭需每个方向单独进行，称为半关闭。第\n一步：客户端 A 发送 FIN（seq=u）关闭客户到服务器的数据传送，并等待服务器确认；第\n二步：服务器 B 收到 FIN，发回 ACK，确认号 ack 为收到序号加 1；第三步：服务器到客户\n端的连接也发送一个 FIN 给客户端；第四步：客户端收到 FIN 后发回 ACK 报文确认，确认序\n号 seq 设为收到序号加 1。先发起关闭的一方执行主动关闭，另一方执行被动关闭。这样确\n保双向数据都传输完毕后再释放。（来源：JAVA 面试知识点总结.pdf.txt，约第 163 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q535", "number": 535, "title": "为什么 TCP 断开连接需要四次挥手，而不是三次？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 207, "page_end": 207, "answer_original": "因为 TCP 是全双工通信，两个方向的数据流相互独立，关闭时必须分别关闭。当一方（如客\n户端）发送 FIN 表示“我没有数据要发了”，对方回 ACK 确认，但此时对方可能仍有数据要\n发送给这一方，所以不能把 ACK 和自己的 FIN 合并发送（否则对方就不敢再发数据了）。必\n须等对方数据也发送完毕，才单独发送自己的 FIN。因此被动关闭方把“确认收到 FIN 的\nACK”和“自己也要关闭的 FIN”分两次发送，形成四步。这正是 TCP 半关闭机制决定的，\n不能压缩成三步。（来源：JAVA 面试知识点总结.pdf.txt，约第 163 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q536", "number": 536, "title": "为什么 TCP 主动关闭方在 TIME-WAIT 状态要等待 2MSL 才进入 CLOSE？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 207, "page_end": 207, "answer_original": "TIME-WAIT 等待 2MSL（报文最大生存时间的两倍）有两个目的。其一，保证最后发送的\nACK 能可靠到达被动关闭方：若 ACK 丢失，对方会重发 FIN，主动方在 2MSL 内还能收到并\n重发 ACK；若不等就关闭，对方可能一直收不到确认而无法正常关闭。其二，防止已失效的\n本次连接的旧报文段出现在新连接中：2MSL 足以让本连接产生的所有报文在网络中消亡，避\n免新连接误收旧数据。这也是为什么高并发短连接服务可能出现大量 TIME-WAIT 占用端口，\n需要调优的原因。（来源：JAVA 面试知识点总结.pdf.txt，约第 164 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q537", "number": 537, "title": "服务器出现大量 CLOSE-WAIT 状态通常意味着什么问题？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 207, "page_end": 207, "answer_original": "CLOSE-WAIT 出现在被动关闭方收到对方 FIN 并回复 ACK 之后，此时连接处于“半关闭”\n状态：主动关闭方不能再发送数据，但被动方仍可向对方发送数据。正常情况被动方处理完剩\n余数据后会很快发送自己的 FIN，从而离开 CLOSE-WAIT。若服务器出现大量 CLOSE-WAIT\n且长期不释放，通常说明应用程序在收到对端关闭后没有正确关闭自己的 Socket（如忘记调\n用 close、业务逻辑阻塞未走到关闭分支），导致连接资源堆积，进而耗尽文件描述符或连接\n数，是高并发服务常见的资源泄漏故障，需要排查代码中的连接关闭逻辑。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 164 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q538", "number": 538, "title": "什么是 TCP 的半关闭（half-close）？它在实际中有什么意义？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 208, "page_end": 208, "answer_original": "TCP 是全双工的，数据可在两个方向上同时传递，而半关闭指仅关闭其中一个方向的数据\n流。主动关闭方发送 FIN 后，该方向连接释放，但另一个方向仍可继续传输数据，直到对方\n也发送 FIN。例如在文件传输场景中，客户端上传完文件后发送 FIN 表示“我发完了”，但\n仍需接收服务器的处理结果，此时半关闭就非常有用。四次挥手正是由半关闭机制决定的：每\n个方向都要单独关闭，因此需要四步而不是两步。理解半关闭有助于理解为什么关闭连接比建\n立连接多了一次交互。（来源：JAVA 面试知识点总结.pdf.txt，约第 163 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q539", "number": 539, "title": "什么是 SYN 洪水攻击？它与 TCP 半连接队列有什么关系？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 208, "page_end": 208, "answer_original": "SYN 洪水攻击利用 TCP 三次握手机制：攻击者伪造大量源 IP 发送 SYN 包给服务器，服务器\n回 SYN+ACK 并进入 SYN_RCVD 状态，等待第三次 ACK。由于源 IP 是伪造的，服务器永远\n收不到 ACK，这些连接会停留在半连接状态中直到超时。大量此类半连接会占满队列，使正\n常用户的 SYN 无法被处理，造成服务不可用。防御手段包括启用 SYN Cookie（不在服务端\n保存半连接状态，而是把信息编码进序列号）、增大队列、设置更短的超时时间，以及在网络\n边界做限速和过滤。（来源：JAVA 面试知识点总结.pdf.txt，约第 161 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q540", "number": 540, "title": "请说明 TCP 首部中六个控制标志位 SYN、ACK、FIN、RST、PSH、URG 各自的含 义。", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 208, "page_end": 208, "answer_original": "TCP 首部有 6 个控制位标志比特，可同时置位：SYN（同步序号），为 1 表示连接请求，用\n于建立连接并使顺序号同步；ACK（确认），为 1 表示确认号有效，为 0 则忽略确认号字\n段；FIN（结束），为 1 表示发送方已无数据发送，用于释放连接；RST（复位），用于复位\n错误连接或拒绝非法报文与连接请求，收到 RST=1 通常意味着出问题；PSH（推送），为 1\n表示带有 PUSH 标志的数据，指示接收方尽快把报文段交给应用层而不必等缓冲区满；URG\n（紧急），为 1 表示紧急指针有效，用于发送端向另一端发送紧急数据。这些标志位协同完\n成了 TCP 连接的建立、数据传输与释放全过程。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 161 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q541", "number": 541, "title": "HTTP 协议的核心特点是什么？如何理解它的“无状态”？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 208, "page_end": 209, "answer_original": "HTTP 是一个无状态的协议。无状态是指客户端（浏览器）和服务器之间不需要建立持久的连\n接，当一个客户端向服务器发出请求、服务器返回响应后，连接就被关闭，服务器端不保留连\n接的有关信息。HTTP 遵循请求/应答模型：客户机发送请求，服务器处理并返回适当的应\n答，所有 HTTP 连接都被构造成一套请求和应答。由于无状态，服务器默认不记得上次请求是\n谁，因此后续需要借助 Cookie、Session、Token 等机制来跟踪用户状态，这也是为什么登\n录状态需要额外手段维持的原因。（来源：JAVA 面试知识点总结.pdf.txt，约第 164 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q542", "number": 542, "title": "请描述浏览器输入一个 URL 到页面返回，HTTP 完整的传输流程是怎样的？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 209, "page_end": 209, "answer_original": "完整流程为：第一步地址解析，从 URL 中分解出协议名、主机名、端口、对象路径；第二步\n域名解析，通过 DNS 把主机名解析成 IP 地址；第三步封装 HTTP 请求数据包，结合本机信\n息封装；第四步封装成 TCP 包，并通过 TCP 三次握手建立连接；第五步客户机发送请求命\n令，格式为 URL、协议版本号加 MIME 信息（含请求修饰符、客户机信息）；第六步服务器\n响应，返回状态行（协议版本、成功或错误代码）加 MIME 信息与实体内容；第七步服务器\n关闭 TCP 连接（若头部含 Connection:keep-alive 则保持）。理解该流程对前端性能优化和\n后端排障都很关键。（来源：JAVA 面试知识点总结.pdf.txt，约第 164 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q543", "number": 543, "title": "HTTP 中的长连接和短连接分别指什么？HTTP/1.0 与 1.1 在连接管理上有何不同？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 209, "page_end": 209, "answer_original": "短连接指每次请求/响应后都关闭 TCP 连接，下次请求需重新三次握手，开销大；长连接指在\n请求/响应后不立即关闭 TCP 连接，后续请求可复用同一连接。在 HTTP 传输流程中，一旦服\n务器发送完数据通常就关闭 TCP 连接；但若浏览器或服务器在头信息中加入\nConnection:keep-alive，TCP 连接在发送后仍保持打开，浏览器可继续通过相同连接发送请\n求，节省了为每次请求建立新连接的时间，也节约了网络带宽。HTTP/1.0 默认短连接，\nHTTP/1.1 默认启用 keep-alive 长连接，这是两者重要差异之一，也是长连接短连接概念的\n核心来源。（来源：JAVA 面试知识点总结.pdf.txt，约第 165 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q544", "number": 544, "title": "HTTP/1.1、HTTP/2.0、HTTP/3.0 各自在性能上做了哪些关键演进？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 209, "page_end": 209, "answer_original": "HTTP/1.1 在 1.0 基础上默认启用 keep-alive 长连接，减少了连接建立开销，但仍存在队头\n阻塞、文本协议冗余等问题。HTTP/2.0 采用二进制分帧，引入多路复用，在单个 TCP 连接上\n并行交错传输多个请求/响应，消除了应用层队头阻塞，并支持头部压缩与服务器推送，显著\n降低延迟。HTTP/3.0 底层改用基于 UDP 的 QUIC 协议，将可靠传输、拥塞控制、加密内置\n在 QUIC 中，避免了 TCP 队头阻塞，连接迁移更平滑（如切换网络不断连）。演进核心目标\n是更低的延迟与更高的并发效率，是面试中常考的协议发展脉络。（来源：JAVA 面试知识点\n总结.pdf.txt，约第 165 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q545", "number": 545, "title": "HTTP 常见的请求方法有哪些？GET 和 POST 的主要区别是什么？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 209, "page_end": 210, "answer_original": "HTTP 常见请求方法有 GET、POST、PUT、DELETE、HEAD、OPTIONS、PATCH 等，分别\n对应查询、新增、更新、删除等资源操作语义。GET 与 POST 是最常用的两种：GET 通常用\n于获取资源，参数附着在 URL 中，有长度限制且参数可见，可被缓存、收藏和幂等重试；\nPOST 通常用于提交数据（如表单、上传），数据放在请求体 body 中，无长度限制、相对不\n可见，且一般不是幂等的。从语义和安全性看，GET 不应产生副作用，POST 会改变服务端状\n态。面试中还常问 PUT 与 POST 区别（PUT 幂等、用于整体替换）。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 165 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q546", "number": 546, "title": "请按类别说明 HTTP 状态码的含义。", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 210, "page_end": 210, "answer_original": "HTTP 状态码用于标识服务器对请求的处理结果，分为五大类：1xx 消息响应，如 100\nContinue 表示继续、101 Switching Protocol 切换协议；2xx 成功响应，如 200 OK、201\nCreated、204 No Content；3xx 重定向，如 301 永久移动、302 临时移动、304 未修改；\n4xx 客户端错误，如 400 错误请求、401 未授权、403 禁止访问、404 未找到；5xx 服务器\n端错误，如 500 内部服务器错误、502 网关错误、503 服务不可用、504 网关超时。看到状\n态码首先要判断属于哪一类，再结合具体数字定位是客户端问题、网络/网关问题还是服务端\n问题，是排障的第一步。（来源：JAVA 面试知识点总结.pdf.txt，约第 165 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q547", "number": 547, "title": "200、201、204 这几个 2xx 状态码分别在什么场景下使用？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 210, "page_end": 210, "answer_original": "2xx 代表成功响应。200 OK 表示请求成功、服务器已正常返回内容，是最常见状态。201\nCreated 表示请求成功且服务器创建了新资源，通常在 POST 新增资源（如新建订单、注册\n用户）成功时返回，响应中常带 Location 指向新资源地址。202 Accepted 表示请求已接受\n但尚未处理完成（常用于异步任务）。204 No Content 表示请求成功但响应体无内容，常用\n于 PUT 更新成功、DELETE 删除成功或不需返回数据的场景。区分它们有助于客户端正确判\n断操作结果，例如创建类接口应返回 201 而非 200，符合 RESTful 规范。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 165 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q548", "number": 548, "title": "301 和 302 重定向有什么区别？分别适用于什么场景？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 210, "page_end": 211, "answer_original": "301 Moved Permanently 表示资源已永久移动到新地址，浏览器和搜索引擎会把旧地址的权\n重、缓存、书签都转向新地址，后续访问会直接请求新 URL；302 Found 表示临时移动，资\n源只是暂时在别处，客户端本次按新地址访问，但不应记住该重定向，下次仍访问原地址。应\n用场景上，网站域名更换、页面永久下线用 301；临时维护跳转、A/B 测试或登录后临时跳转\n用 302。二者若使用不当会影响 SEO：本该 301 却用 302 会导致权重无法转移；本该临时却\n用 301 会让旧地址被永久废弃。（来源：JAVA 面试知识点总结.pdf.txt，约第 166 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q549", "number": 549, "title": "304 Not Modified 是如何配合缓存机制工作的？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 211, "page_end": 211, "answer_original": "304 Not Modified 属于 3xx 重定向类，表示客户端请求的资源未修改。其工作机制是：客户\n端首次请求资源时，服务器返回内容并在响应头携带 Last-Modified（最后修改时间）或\nETag（实体标签）；客户端再次请求时通过 If-Modified-Since 或 If-None-Match 把之前的\n值带上。服务器比对后发现资源未变化，就不返回 body，而是直接返回 304，告知客户端可\n直接使用本地缓存副本。这样既减轻了服务器带宽与计算压力，又保证了数据时效性。合理设\n置缓存头能显著提升 Web 性能，是高并发静态资源服务的关键手段。（来源：JAVA 面试知\n识点总结.pdf.txt，约第 166 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q550", "number": 550, "title": "400、401、403、404 这几个客户端错误状态码如何区分？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 211, "page_end": 211, "answer_original": "它们都属于 4xx 客户端错误，但含义不同。400 Bad Request 表示服务器无法理解该请求，\n通常是参数格式、报文语法错误；401 Unauthorized 表示请求未授权，需要身份认证（如未\n带 Token 或登录过期），常配合 WWW-Authenticate 头；403 Forbidden 表示服务器理解\n请求但拒绝执行，通常是权限不足（已登录但无访问该资源的权限）；404 Not Found 表示\n请求的资源不存在，可能是路径写错或资源已删除。排查时，401/403 多关注鉴权与权限配\n置，404 关注路由与资源是否存在，400 关注请求参数与报文格式。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 166 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q551", "number": 551, "title": "500、502、503、504 这几个服务端错误状态码有什么区别？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 211, "page_end": 211, "answer_original": "它们都属于 5xx 服务端错误。500 Internal Server Error 是服务器内部代码异常，如空指针、\n未捕获异常；502 Bad Gateway 通常是网关或反向代理（如 Nginx）收到上游无效响应，多\n因后端服务崩溃或返回非法报文；503 Service Unavailable 表示服务暂时不可用，常因过载\n或正在维护，可带 Retry-After 头；504 Gateway Timeout 表示网关在等待上游响应超时，\n说明后端处理太慢或网络不通。排障时，500 看应用日志，502/504 重点查后端健康与超时\n配置，503 关注限流与容量。正确区分能快速定位是代码、后端还是网关问题。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 166 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q552", "number": 552, "title": "HTTP 和 HTTPS 有什么区别？HTTPS 的安全基础是什么？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 211, "page_end": 212, "answer_original": "HTTP 是超文本传输协议，数据以明文传输，默认端口 80，不具备安全保证；HTTPS 全称\nHypertext Transfer Protocol over Secure Socket Layer，是以安全为目标的 HTTP 通道，\n简单讲是 HTTP 的安全版，即在 HTTP 下加入 SSL/TLS 层，安全基础是 SSL，默认端口\n443。区别在于：HTTPS 对传输内容加密，防止窃听与篡改；通过数字证书验证服务器身\n份，防止中间人冒充；而 HTTP 全程明文，易被劫持、抓包、注入广告。对于涉及登录、支\n付、隐私的网站必须启用 HTTPS，现在各大浏览器也对非 HTTPS 站点标记“不安全”。（来\n源：JAVA 面试知识点总结.pdf.txt，约第 166 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q553", "number": 553, "title": "请说明 HTTPS 的完整工作原理与通信过程。", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 212, "page_end": 212, "answer_original": "HTTPS 是在 HTTP 之下加入 SSL/TLS 层来实现安全的，默认使用 443 端口，过程大致分三\n步。第一，建立连接获取证书：SSL 客户端通过 TCP 与服务器在 443 端口建立连接后，在握\n手过程中请求证书，客户端发出包含自身可实现算法列表的消息，服务器回应并确定通信算\n法，再向客户端返回证书（证书含服务器域名、申请公司、公钥）。第二，证书验证：客户端\n判断签发机构，用该机构公钥确认签名有效，并确保证书中域名与正在连接的域名一致。第\n三，数据加密传输：确认证书有效后生成对称密钥，用服务器公钥加密发给服务器，服务器用\n私钥解密，之后双方用对称加密通信。（来源：JAVA 面试知识点总结.pdf.txt，约第 166\n页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q554", "number": 554, "title": "请详细描述 HTTPS 的握手（TLS 握手）过程中证书验证与密钥交换步骤。", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 212, "page_end": 212, "answer_original": "在 HTTPS 握手中，SSL 客户端先通过 TCP（443 端口）与服务器建立连接，并在握手过程中\n发送自己可实现的算法列表；服务器回应确定通信算法，并返回证书，证书包含服务器域名、\n申请公司和公钥。客户端收到证书后，首先判断签发该证书的公共签发机构（CA），使用该\nCA 的公钥确认证书签名是否有效，同时校验证书中列出的域名是否正是自己正在连接的域\n名，以防中间人冒充。确认证书有效后，客户端生成对称密钥，用服务器的公钥加密后发送给\n服务器；服务器用私钥解密得到对称密钥。此后双方即使用这个对称密钥进行对称加密通信，\n兼顾了安全与性能。（来源：JAVA 面试知识点总结.pdf.txt，约第 167 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q555", "number": 555, "title": "对称加密和非对称加密各有什么特点？二者如何结合使用？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 212, "page_end": 213, "answer_original": "对称加密指加密和解密使用相同密钥，如 AES（高级加密标准）是最常见的对称加密算法，优\n点是运算速度快、效率高，适合加密大量业务数据，缺点是密钥分发困难——如何安全把密\n钥交给对方是个问题。非对称加密通过两个密钥（公钥和私钥）实现，如 RSA，公钥用于加\n密、私钥用于解密，解决了密钥分发问题，但运算成本高、速度慢。实际中二者结合：在\nHTTPS 里，先用非对称加密（服务器公钥）把临时生成的对称密钥安全地送给对方，之后双\n方再用对称加密传输业务数据。这样既解决了密钥配送，又保证了传输性能。（来源：JAVA\n面试知识点总结.pdf.txt，约第 255 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q556", "number": 556, "title": "什么是 AES 加密？它在工程实践中有哪些典型应用？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 213, "page_end": 213, "answer_original": "AES（Advanced Encryption Standard，高级加密标准）是最常见的对称加密算法，即加密\n和解密使用相同的密钥。其具体加密流程包括：把明文按固定长度分组，经过多轮字节代换、\n行移位、列混淆、轮密钥加等变换，结合密钥生成密文。AES 因效率高、安全性强，被广泛应\n用于对性能敏感的场景。例如微信小程序的加密传输就使用 AES。在实际后端开发中，AES\n常用于敏感字段（如身份证号、手机号）的落库加密、接口报文加密、配置文件密钥加密等。\n使用对称加密时务必通过安全通道分发密钥，并做好密钥的定期轮换与存储保护。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 255 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q557", "number": 557, "title": "什么是 RSA 加密？它基于什么数学难题？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 213, "page_end": 213, "answer_original": "RSA 是一种典型的非对称加密算法，也是应用最广泛的非对称加密算法，它基于大数因式分\n解的数学难题——即把一个由两个大素数相乘得到的大数分解回原来的素数是计算上极其困\n难的。RSA 通过一对密钥（公钥和私钥）实现加解密：公钥用于加密、私钥用于解密，也可\n以反过来用私钥签名、公钥验证。因为非对称特性，RSA 不需要提前共享密钥，非常适合密\n钥交换、数字签名和身份认证。不过 RSA 运算开销大、速度慢，不适合直接加密大量数据，\n所以实践中通常只用来加密对称密钥或做签名，真正的数据传输仍交给 AES 等对称算法。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 255 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q558", "number": 558, "title": "为什么 HTTPS 不全程使用非对称加密，而要采用“非对称加密交换密钥 + 对称加 密传输数据”？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 213, "page_end": 213, "answer_original": "因为两种加密各有优劣：非对称加密（如 RSA）用公钥加密、私钥解密，解决了密钥配送难\n题，但算法复杂、运算开销大、速度慢，若用它加密全部业务数据会严重拖慢性能；对称加密\n（如 AES）加解密速度快、适合大数据量，但难点在于如何把密钥安全地交给对方。HTTPS\n巧妙地结合了二者优势：握手阶段用服务器的非对称公钥把临时生成的对称会话密钥加密传给\n服务器（只有服务器私钥能解密），之后就用这个对称密钥加密所有业务数据。这样既保证了\n密钥配送的安全，又获得了对称加密的高性能，是安全与效率的最优折中。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 167 页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q559", "number": 559, "title": "数字证书和 CA 在 HTTPS 中起到什么作用？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 213, "page_end": 214, "answer_original": "在 HTTPS 中，服务器会向客户端返回数字证书，证书中包含服务器域名、申请证书的公司信\n息以及服务器的公钥。客户端收到证书后，需要判断签发该证书的公共签发机构（CA），并\n使用该 CA 的公钥来确认证书签名是否有效，同时还会确保证书中列出的域名正是自己正在连\n接的域名，从而防止被中间人冒充。CA（证书颁发机构）作为可信第三方，用自己的私钥为\n服务器公钥签名，客户端预置了受信任 CA 的根证书，借此验证链条。若证书过期、域名不符\n或 CA 不被信任，浏览器会给出安全警告，阻止用户继续访问。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 167 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q560", "number": 560, "title": "MD5 算法的常见用途有哪些？现在还适合用于密码存储吗？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 214, "page_end": 214, "answer_original": "MD5 常作为文件签名出现：下载文件时页面常附带 .MD5 文本，是把整个文件作为原数据经\nMD5 计算后的值，下载后再算一次对比即可确保文件未被篡改。另一常见用途是网站敏感信\n息加密，如用户名密码、支付签名等。但随着 HTTPS 普及，现在网站多采用前台明文传输、\n后台用 MD5（配合加盐偏移量）的方式保护敏感数据。需要注意的是，MD5 已被证明存在\n碰撞漏洞、不再安全，已不适合单独用于密码存储，推荐改用 bcrypt、scrypt、PBKDF2 等\n慢哈希算法并加盐。MD5 目前更适合做完整性校验而非安全加密。（来源：JAVA 面试知识\n点总结.pdf.txt，约第 256 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q561", "number": 561, "title": "什么是 CRC 校验？它在网络与文件传输中有什么作用？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 214, "page_end": 214, "answer_original": "CRC（Cyclic Redundancy Check，循环冗余校验）是一种根据网络数据包或电脑文件等数\n据产生简短固定位数校验码的散列函数，主要用来检测或校验数据传输或保存后可能出现的错\n误。它利用除法及余数的原理来作错误侦测：发送方对数据按约定多项式计算 CRC 校验码并\n附加在报文后，接收方用同样算法重新计算并比对，若不一致则说明数据在传输中发生了比特\n翻转或破坏。CRC 不是加密算法，而是检错机制，广泛用于网络帧（如以太网）、磁盘存\n储、压缩包、通信协议等场景，能在不增加太多开销的前提下有效发现传输错误。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 256 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q562", "number": 562, "title": "Cookie 和 Session 有什么区别？在 HTTP 无状态前提下它们各自解决什么问题？", "group_id": "network", "group": "网络与流量入口", "topic_id": "session", "topic": "Cookie、Session 与共享状态", "learning_priority": "核心", "page_start": 214, "page_end": 215, "answer_original": "由于 HTTP 本身是无状态协议，服务器默认不保留连接的用户信息，因此需要机制来跟踪状\n态。Cookie 是服务器通过响应头 Set-Cookie 下发给客户端、由浏览器保存并在后续请求自\n动携带的小型文本数据，存储在客户端，常用于记住登录态、购物车等；Session 是服务器端\n保存的用户会话状态，通常以 SessionID 为键存储在服务端内存或外部存储中，客户端只保\n存这个 SessionID（一般放在 Cookie 里）。区别在于：Cookie 存客户端、可被篡改需签名\n校验、有大小与数量限制；Session 存服务端、更安全但占用服务器资源。二者通常配合：\nSessionID 借 Cookie 传递，实现有状态的会话。（来源：JAVA 面试知识点总结.pdf.txt，约\n第 164 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q563", "number": 563, "title": "在分布式/集群环境下，Session 共享会遇到什么问题？有哪些解决方案？", "group_id": "network", "group": "网络与流量入口", "topic_id": "session", "topic": "Cookie、Session 与共享状态", "learning_priority": "核心", "page_start": 215, "page_end": 215, "answer_original": "在单机时代 Session 存在本机内存即可，但在负载均衡的多节点集群中，用户第一次请求落\n到节点 A 并建立了 Session，后续请求被调度到节点 B 时，B 没有该 Session，就会出现\n“反复要求登录”的问题。解决方案有：一、Session 粘滞（IP 哈希/一致性哈希），让同一\n用户固定访问同一节点，但节点宕机则会话丢失；二、Session 复制，各节点间同步\nSession，扩展性差；三、集中式存储，把 Session 存到 Redis 等共享缓存，所有节点统一读\n写，这是最常用方案；四、彻底无状态化，改用 JWT 等 Token 把状态放在客户端。选型应结\n合业务规模与可用性要求。（来源：JAVA 面试知识点总结.pdf.txt，约第 205 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q564", "number": 564, "title": "DNS 的作用是什么？请描述一次完整的域名解析过程。", "group_id": "network", "group": "网络与流量入口", "topic_id": "dns-cdn", "topic": "DNS、CDN 与负载均衡层次", "learning_priority": "进阶", "page_start": 215, "page_end": 215, "answer_original": "DNS（Domain Name Service，域名服务）的作用是把人类易记的域名解析成机器使用的 IP\n地址。在 HTTP 传输流程的地址解析步骤中，需要从 URL 分解出主机名，再通过 DNS 把主\n机名解析成主机的 IP 地址。完整解析过程一般为：浏览器先查自身缓存，未命中查本地\nhosts 与系统缓存，再向本地 DNS 服务器（递归解析器）发起查询；本地 DNS 服务器依次\n向根域名服务器、顶级域服务器、权威域名服务器查询，拿到域名对应的 IP 后返回给客户端\n并缓存。实际网络访问中，DNS 解析是首跳，解析慢或失败会直接导致网站打不开，是排障\n重点关注环节。（来源：JAVA 面试知识点总结.pdf.txt，约第 160 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q565", "number": 565, "title": "什么是 DNS 负载均衡（Flash DNS）？它适用于什么场景？", "group_id": "network", "group": "网络与流量入口", "topic_id": "dns-cdn", "topic": "DNS、CDN 与负载均衡层次", "learning_priority": "进阶", "page_start": 215, "page_end": 215, "answer_original": "DNS 负载均衡是一种基于域名解析的全局调度策略。在 Flash DNS 算法下，分处不同地理位\n置的负载均衡设备收到同一个客户端的域名解析请求，会在同一时间内把此域名解析成各自相\n对应服务器的 IP 地址并返回给客户端，客户端将以最先收到的域名解析 IP 地址来继续请求服\n务，而忽略其他 IP 响应。这种方式适合应用在全局负载均衡（GSLB）场景下，让用户就近访\n问不同地域的节点，提升访问速度；但对本地负载均衡没有意义，因为同一区域内返回的 IP\n差别不大。其局限是 DNS 缓存会导致调度不够实时，通常需配合 TTL 与健康检查。（来源：\nJAVA 面试知识点总结.pdf.txt，约第 205 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q566", "number": 566, "title": "什么是 RESTful？设计 RESTful 风格的接口应遵循哪些原则？", "group_id": "network", "group": "网络与流量入口", "topic_id": "http", "topic": "HTTP、状态码与 REST", "learning_priority": "核心", "page_start": 215, "page_end": 216, "answer_original": "RESTful 是一种基于 HTTP 的软件架构风格，强调以资源为中心、用统一接口操作资源。设计\n原则包括：一、每个资源用唯一 URL 标识，如 /users/1；二、使用标准 HTTP 方法表达操作\n语义，GET 查询、POST 新增、PUT 整体更新、DELETE 删除、PATCH 局部更新；三、接口\n应无状态，每次请求自带完整上下文，不依赖服务端会话；四、合理利用状态码表达结果（如\n200/201/404）；五、可通过对资源表述（JSON/XML）进行增删改查。相比 SOAP 等方\n案，RESTful 更轻量、易于前后端分离与跨语言调用，是当下 Web 服务与微服务间通信的主\n流风格之一。（来源：JAVA 面试知识点总结.pdf.txt，约第 157 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q567", "number": 567, "title": "请说明 CDN 的基本原理与核心组成系统。", "group_id": "network", "group": "网络与流量入口", "topic_id": "dns-cdn", "topic": "DNS、CDN 与负载均衡层次", "learning_priority": "进阶", "page_start": 216, "page_end": 216, "answer_original": "CDN（内容分发网络）通过将内容缓存到离用户更近的节点来加速访问，一般包含分发服务\n系统、负载均衡系统和管理系统三大组成部分。分发服务系统的基本工作单元是各 Cache 服\n务器，直接响应用户请求并快速分发内容，同时负责与源站同步更新；它又按内容类型分为网\n页加速、流媒体加速、应用加速等子服务集群。负载均衡系统是 CDN 中枢，通过全局负载均\n衡（GSLB，按就近性原则经 DNS 或 HTTP 重定向调度）与本地负载均衡（SLB，节点内调\n度）确定最终访问地址。管理系统分运营管理与网络管理，负责设备管理、拓扑、链路监控和\n故障管理。CDN 能显著降低源站压力与用户访问延迟。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 167 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q568", "number": 568, "title": "CDN 中的 GSLB 和 SLB 分别负责什么？二者如何配合？", "group_id": "network", "group": "网络与流量入口", "topic_id": "dns-cdn", "topic": "DNS、CDN 与负载均衡层次", "learning_priority": "进阶", "page_start": 216, "page_end": 216, "answer_original": "在 CDN 负载均衡系统中，GSLB（全局负载均衡）和 SLB（本地负载均衡）分级实现。GSLB\n根据用户地址和请求内容，主要依据就近性原则，通过 DNS 解析或应用层 3XX 重定向确定\n向用户服务的节点（通常是离用户最近的边缘节点）。当请求被调度到某个节点后，SLB 负责\n节点内部的负载均衡，根据节点内各 Cache 设备的工作状况和内容分布情况进行重定向。\nGSLB 解决“用户该访问哪个区域的节点”，SLB 解决“节点内该由哪台 Cache 响应”，二\n者配合实现从全局到本地的高效调度，保障高可用与低延迟。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 168 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q569", "number": 569, "title": "四层负载均衡和七层负载均衡有什么区别？各自有哪些典型实现？", "group_id": "network", "group": "网络与流量入口", "topic_id": "dns-cdn", "topic": "DNS、CDN 与负载均衡层次", "learning_priority": "进阶", "page_start": 216, "page_end": 217, "answer_original": "四层负载均衡基于传输层（IP+端口）做目标地址和端口交换，不解析应用内容，性能高、对\n协议无感知，典型实现有 LVS、F5（硬件）、Nginx（四层模式）、HAProxy 等；七层负载\n均衡基于应用层内容交换，能解析 HTTP 的 URL、Cookie、Header 等做更精细的路由与会\n话保持，典型实现有 Nginx（HTTP/mail）、HAProxy（全面支持七层）、Apache 等。四层\n适合对性能要求极高、协议多样的场景；七层适合需要按业务内容、路径、域名分流以及做灰\n度、A/B 测试的 Web 场景。实际架构常二者结合：外层四层扛流量，内层七层做业务路由。\n（来源：JAVA 面试知识点总结.pdf.txt，约第 203 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q570", "number": 570, "title": "常见的负载均衡算法/策略有哪些？各自适用什么场景？", "group_id": "network", "group": "网络与流量入口", "topic_id": "dns-cdn", "topic": "DNS、CDN 与负载均衡层次", "learning_priority": "进阶", "page_start": 217, "page_end": 217, "answer_original": "常见负载均衡算法包括：轮询（Round Robin）依次分发，适合节点性能相近；加权轮询\n（Weighted Round Robin）按权重分配，适合异构机器；随机与加权随机；响应速度均衡\n（按探测响应时间选最快节点），适合七层且关注处理能力；最少连接数（Least\nConnection）把请求给连接最少的节点，适合长连接；处理能力均衡（按 CPU/内存）；\nDNS 响应均衡（Flash DNS）做全局调度；哈希算法（一致性哈希）使相同参数请求总到同\n一提供者，节点挂掉时基于虚拟节点平摊；IP 地址散列保证同一客户端稳定落到同一服务\n器；URL 散列把相同 URL 请求转同一服务器。选型要结合会话保持、节点异构和是否全局等\n因素。（来源：JAVA 面试知识点总结.pdf.txt，约第 204 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q571", "number": 571, "title": "当用户反馈“网站打不开”时，作为后端/运维你会按怎样的思路做网络故障排查？", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-diagnostics", "topic": "网络故障排查", "learning_priority": "核心", "page_start": 217, "page_end": 217, "answer_original": "排查应遵循自底向上、逐层定位的原则。第一步确认本地网络是否通：用 ping 检查到目标主\n机的基础连通性，用 traceroute 看在哪一段丢包；第二步检查 DNS：确认域名能否正确解析\n出 IP，可对比本机 hosts 与公共 DNS，排查 DNS 污染或解析失败；第三步检查 TCP 连接与\n端口：用 telnet/nc 验证目标端口（如 80/443）是否可达，排查防火墙、安全组；第四步检\n查服务与网关：服务器进程是否存活、是否有大量 TIME-WAIT/CLOSE-WAIT、Nginx 是否\n返回 502/504；第五步看应用日志与监控。整个过程结合前面掌握的 OSI 分层、TCP 握手、\nDNS、状态码等知识逐步缩小范围。（来源：JAVA 面试知识点总结.pdf.txt，约第 164 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q572", "number": 572, "title": "什么是 TCP 的流量控制？它和拥塞控制有什么区别？", "group_id": "network", "group": "网络与流量入口", "topic_id": "tcp", "topic": "TCP 连接、状态与流控", "learning_priority": "核心", "page_start": 217, "page_end": 217, "answer_original": "流量控制是为防止发送方把数据发得太快、淹没接收方而设计的，TCP 通过首部 16 位窗口大\n小字段实现：接收方在 ACK 中通告自己当前还能接收的字节数（接收窗口），发送方据此限\n制未确认数据量，窗口最大 65535 字节。拥塞控制则是为了防止过多数据注入网络、避免网\n络路由器过载，通过慢启动、拥塞避免、快重传、快恢复等算法动态调整拥塞窗口。二者区\n别：流量控制着眼于“端到端接收方能力”，拥塞控制着眼于“整个网络的承载能力”。面试\n中常把两者混淆，记住前者保护接收方、后者保护网络即可。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 161 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q573", "number": 573, "title": "Session 在 Web 容器中（如 Spring）通常有哪几种作用域？global Session 是什 么？", "group_id": "network", "group": "网络与流量入口", "topic_id": "session", "topic": "Cookie、Session 与共享状态", "learning_priority": "核心", "page_start": 218, "page_end": 218, "answer_original": "在 Spring 等 Web 容器中，Bean 的作用域常见有 request、session、global session 等。\n其中 session 作用域指：在一次 Http Session 中，容器会返回该 Bean 的同一实例，而对不\n同的 Session 请求则会创建新的实例，该 Bean 实例仅在当前 Session 内有效。global\nSession 则用于 Portlet 应用环境，在一个全局的 Http Session 中容器返回同一个实例，仅\n在全局 Session 作用范围内有效。这类作用域与 HTTP 会话生命周期绑定，常用于保存用户\n级别的会话状态数据。理解它们有助于在 Web 开发中正确管理对象生命周期，避免把有状态\n对象错误声明为单例而引发并发问题。（来源：JAVA 面试知识点总结.pdf.txt，约第 124\n页）", "version_review_recommended": true, "related_question_ids": []}, {"id": "Q574", "number": 574, "title": "客户端如何验证服务器返回的 HTTPS 证书是合法可信的？请展开说明。", "group_id": "network", "group": "网络与流量入口", "topic_id": "tls", "topic": "HTTPS、TLS 与安全基础", "learning_priority": "核心", "page_start": 218, "page_end": 218, "answer_original": "客户端验证证书分几个环节：首先读取证书中的签发者（CA）信息，到本机预置的受信任根\n证书库中查找对应 CA 的公钥；然后用该公钥验证证书上的签名，确认证书确实由该 CA 签发\n且内容未被篡改；接着校验证书有效期（未过期）、证书吊销状态（通过 CRL 或 OCSP 检查\n是否已被吊销）；最关键的是比对证书中列出的域名是否正是当前正在连接的域名，防止攻击\n者用一张合法但属于别站的证书冒充。任何一项不通过，浏览器都会弹出安全警告并阻断连\n接。这套“信任链 + 域名绑定”机制是 HTTPS 防中间人攻击的核心保障。（来源：JAVA 面\n试知识点总结.pdf.txt，约第 167 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q575", "number": 575, "title": "为什么网络层（IP）不保证可靠，而传输层 TCP 却能做到可靠？", "group_id": "network", "group": "网络与流量入口", "topic_id": "network-model", "topic": "分层模型与 TCP/UDP", "learning_priority": "核心", "page_start": 218, "page_end": 218, "answer_original": "网络层的核心协议 IP 只负责“尽力而为”地把分组从源发往目标，不保证送达、不保证顺\n序、不保证不重复，也不建立连接——这样设计是为了让网络层简单高效、可路由、能适应\n复杂异构网络。可靠性如果放在网络层会拖慢所有流量且难以扩展。于是 TCP 在传输层基于\n不可靠的 IP 之上，通过序列号、确认重传、校验和、流量控制、拥塞控制等机制，在端到端\n把不可靠的 IP 封装成可靠字节流。这种“网络层简单、端系统负责可靠”的分层思想，使互\n联网既灵活又可扩展，也是 OSI/TCP-IP 分层设计的关键智慧。（来源：JAVA 面试知识点总\n结.pdf.txt，约第 160 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q576", "number": 576, "title": "请简述 Nginx 的核心功能与主要应用场景。", "group_id": "network", "group": "网络与流量入口", "topic_id": "nginx-model", "topic": "Nginx 架构与事件模型", "learning_priority": "进阶", "page_start": 218, "page_end": 219, "answer_original": "Nginx 是一款高性能的 HTTP 服务器与反向代理软件，同时具备邮件代理和通用 TCP/UDP 代\n理能力。它的核心功能包括：作为 Web 服务器直接托管静态资源、作为反向代理将请求转发\n到后端应用集群、提供 L4/L7 层负载均衡、支持基于 PCRE 正则的 URL 重写、gzip 压缩、\nSSL/TLS 终止以及缓存加速等。由于其采用事件驱动、异步非阻塞架构，单机即可支撑极高并\n发连接，因此广泛应用于高流量互联网站点、API 网关、静态资源服务、入口层负载均衡和灰\n度发布等场景。理解这些能力边界，是架构选型和面试回答的出发点。（来源：互联网大厂面\n试题库大全.pdf.txt，约第 92 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q577", "number": 577, "title": "Nginx 采用 Master+Worker 进程模型，请说明各进程职责及该模型优势。", "group_id": "network", "group": "网络与流量入口", "topic_id": "nginx-model", "topic": "Nginx 架构与事件模型", "learning_priority": "进阶", "page_start": 219, "page_end": 219, "answer_original": "Nginx 启动后会产生一个 Master 主进程和多个 Worker 工作进程。Master 进程通常以 root\n权限运行，负责读取并校验配置文件、绑定特权端口（如 80/443）、管理 Worker 进程的生\n命周期（启动、停止、平滑升级与日志重开）。Worker 进程以非特权用户运行，各自通过异\n步非阻塞事件模型（如 epoll）独立处理客户端连接与请求，进程间互不共享状态。该模型的\n优势在于：能够充分利用多核 CPU 做并行处理；进程彼此隔离，使得单个 Worker 崩溃不会\n影响整体服务可用性；支持在不中断连接的情况下平滑重载配置与二进制热升级，从而兼顾高\n性能、高可靠性与可运维性，是 Nginx 能扛住高并发的根本原因之一。（来源：互联网大厂\n面试题库大全.pdf.txt，约第 92 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q578", "number": 578, "title": "请解释什么是 C10K 问题，Nginx 是如何解决高并发连接瓶颈的。", "group_id": "network", "group": "网络与流量入口", "topic_id": "nginx-model", "topic": "Nginx 架构与事件模型", "learning_priority": "进阶", "page_start": 219, "page_end": 219, "answer_original": "C10K 问题指单机服务器如何同时高效处理一万个以上并发连接。传统基于进程或线程的同步\n阻塞模型（如 Apache prefork）在连接数增长时，因上下文切换和内存开销剧增而难以扩\n展。Nginx 采用事件驱动、异步非阻塞架构解决该问题：每个 Worker 进程基于\nepoll/kqueue 等 I/O 多路复用机制单线程管理海量连接，配合非阻塞 socket、阶段化请求处\n理链（phase handlers）和极小内存占用（每个连接仅消耗少量内存），使得单 Worker 即\n可支撑数万并发，且 CPU 消耗与连接数近似线性可控，从根本上突破了 C10K 瓶颈，后续的\nC100K、C1M 也都是同一思路的延伸与演进。（来源：互联网大厂面试题库大全.pdf.txt，约\n第 93 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q579", "number": 579, "title": "请说明 Nginx 处理一个 HTTP 请求的完整生命周期。", "group_id": "network", "group": "网络与流量入口", "topic_id": "nginx-model", "topic": "Nginx 架构与事件模型", "learning_priority": "进阶", "page_start": 219, "page_end": 220, "answer_original": "Nginx 处理 HTTP 请求分为若干清晰阶段：首先由事件模块接收 TCP 连接并初始化请求结\n构；接着解析请求行与请求头，按 server_name 和 listen 匹配虚拟主机；然后根据 URI 与\nlocation 匹配规则选择处理 location；在 rewrite 阶段执行 URL 重写与重定向；access 阶段\n进行访问控制、限流与鉴权；content 阶段根据配置交由静态文件模块、反向代理模块\n（proxy_pass）或 FastCGI 等上游模块生成响应；最后由 filter 链（如 gzip、add_header、\nSSI）处理响应体并写入客户端。各阶段通过钩子串联，日志阶段记录 access_log，整个流程\n由异步事件循环驱动，保证高并发下的低延迟与稳定的资源占用，便于排障与扩展。（外部补\n充：Nginx 官方文档）\n【反向代理与负载均衡】", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q580", "number": 580, "title": "什么是反向代理？Nginx 作为反向代理相比其他方案有何优势？", "group_id": "network", "group": "网络与流量入口", "topic_id": "nginx-proxy", "topic": "Nginx 代理与 upstream", "learning_priority": "核心", "page_start": 220, "page_end": 220, "answer_original": "反向代理指位于客户端与后端服务器之间、代替后端接收客户端请求并将请求转发给内部服务\n器集群、再把响应返回给客户端的代理服务器。客户端感知不到真实后端，反向代理对外暴露\n统一入口。其价值在于：隐藏后端拓扑与端口、集中实现 SSL 终止与压缩、缓存加速、统一\n鉴权与限流、负载均衡与故障隔离。Nginx 作为反向代理的优势是高并发、低内存、配置灵活\n（支持 HTTP/SCGI/WSGI/FastCGI/uWSGI/Memcached 等多种协议上游），并能透传真实\n客户端 IP（proxy_set_header X-Forwarded-For）。在中心机房作为入口层可显著减轻后端\n负载压力，是大型站点加速与解耦的标准做法，也便于统一安全策略。（来源：互联网大厂面\n试题库大全.pdf.txt，约第 92 页；阿里面试.pdf.txt，约第 13 页）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q581", "number": 581, "title": "什么是正向代理？它与反向代理的核心区别是什么？", "group_id": "network", "group": "网络与流量入口", "topic_id": "nginx-proxy", "topic": "Nginx 代理与 upstream", "learning_priority": "核心", "page_start": 220, "page_end": 220, "answer_original": "正向代理是代表客户端去访问外部服务器的代理，典型场景是内网用户通过代理访问公网、或\n用于审计与缓存外网资源，客户端明确知道自己配置了代理且需主动指定。反向代理则代表后\n端服务器接收外界请求，客户端以为自己直连的是源站。核心区别有三点：一是位置与代表对\n象不同，正向代理代表客户端、反向代理代表服务端；二是隐藏目标不同，正向代理隐藏真实\n客户端、反向代理隐藏真实后端；三是配置方不同，正向代理由客户端配置、反向代理由服务\n端运维配置。Nginx 主要用作反向代理，也可通过 proxy 模块实现简单的正向代理，但生产\n上反向代理才是其主战场，正向代理多作为辅助能力。（外部补充：Nginx 官方文档）", "version_review_recommended": false, "related_question_ids": []}, {"id": "Q582", "number": 582, "title": "Nginx 负载均衡支持哪些调度策略？请分别说明轮询、加权轮询、ip_hash、 least_conn。", "group_id": "network", "group": "网络与流量入口", "topic_id": "nginx-proxy", "topic": "Nginx 代理与 upstream", "learning_priority": "核心", "page_start": 220, "page_end": 221, "answer_original": "Nginx upstream 模块内置多种调度算法。轮询（默认 round-robin）将请求依次均匀分发到\n各后端；加权轮询（weight）在轮询基础上按权重分配，性能强的节点设更高 weight 以承载\n更多流量；ip_hash 通过对客户端 IP 做哈希固定落到同一后端，解决会话保持问题（但后端\n扩缩容会导致哈希重分布）；least_conn（最小连接）优先把请求发给当前活跃连接数最少的\n节点，更适合长连接或请求耗时不均的场景。此外还支持 hash、random 等，并可结合第三\n方模块实现一致性哈希。实际选型需结合是否有状态会话、节点异构程度与请求耗时分布综合\n判断，必要时叠加健康检查与重试策略提升鲁棒性。（来源：互联网大
